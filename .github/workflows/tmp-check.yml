name: Temporary Royal Canin ledger apply
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: Apply validated Royal Canin ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          url = 'https://api.github.com/repos/Adisabeba33/ingredient-scanner/git/blobs/ea15c3d15fff5b3ff869f2d3f6dbffe037a3bf6f'
          req = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(req) as response:
              blob = json.load(response)

          encoded_target = base64.b64decode(blob['content'])
          target = base64.b64decode(encoded_target)
          parsed = json.loads(target)

          assert parsed['brand_scope'] == ['Royal Canin']
          assert len(parsed['records']) == 34
          assert len({record['upc'] for record in parsed['records']}) == 34
          assert len({record['canonical_gtin14'] for record in parsed['records']}) == 34
          assert all(record['research_status'] == 'source_verified' for record in parsed['records'])
          assert all(record.get('ingredients_ordered_normalized') for record in parsed['records'])

          with open('research/deep-research-royal-canin.json', 'wb') as handle:
              handle.write(target)
          PY
          if git diff --quiet -- research/deep-research-royal-canin.json; then
            echo "Royal Canin ledger is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/deep-research-royal-canin.json
          git commit -m "research: add 10 Royal Canin cat SKUs and restore normalized ingredients"
          git push origin HEAD:agent/deep-research-barcode-ledger
