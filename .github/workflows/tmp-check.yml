name: Temporary Royal Canin ledger apply
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: Apply validated Royal Canin ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, gzip, json, os, urllib.request
          shas = [
              'f902c09a2a80b75d38abbd33b4db7e443c4da235',
              'b2fc7e866185f9191d483bfdccf04fe107d8dfd1',
              '322c9430dfccac43d076e831c3532db253c72628',
          ]
          chunks = []
          for sha in shas:
              url = f'https://api.github.com/repos/Adisabeba33/ingredient-scanner/git/blobs/{sha}'
              req = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req) as response:
                  blob = json.load(response)
              chunks.append(base64.b64decode(blob['content']).decode('ascii'))
          payload = ''.join(chunks)
          assert len(payload) == 12384
          target = gzip.decompress(base64.b64decode(payload))
          parsed = json.loads(target)
          assert parsed['brand_scope'] == ['Royal Canin']
          assert len(parsed['records']) == 34
          assert len({r['upc'] for r in parsed['records']}) == 34
          assert len({r['canonical_gtin14'] for r in parsed['records']}) == 34
          assert all(r['research_status'] == 'source_verified' for r in parsed['records'])
          assert all(r.get('ingredients_ordered_normalized') for r in parsed['records'])
          open('research/deep-research-royal-canin.json', 'wb').write(target)
          PY
          if git diff --quiet -- research/deep-research-royal-canin.json; then
            echo "Royal Canin ledger is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/deep-research-royal-canin.json
          git commit -m "research: add 10 Royal Canin cat SKUs and restore normalized ingredients"
          git push origin HEAD:agent/deep-research-barcode-ledger
