name: Temporary Royal Canin dogs batch 04 apply

on:
  push:
    branches:
      - agent/deep-research-barcode-ledger

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Adisabeba33/ingredient-scanner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0

      - name: Append verified Royal Canin dog records
        env:
          BATCH_B64:  
        run: |
          python - <<'PY'
          import base64, glob, json, os, pathlib
          target = pathlib.Path("research/deep-research-royal-canin-dogs.json")
          batch = json.loads(base64.b64decode(os.environ["BATCH_B64"]).decode("utf-8"))
          data = json.loads(target.read_text(encoding="utf-8"))
          old_records = list(data["records"])
          if len(old_records) != 30:
              raise SystemExit(f"Expected 30 existing dog records, found {len(old_records)}")

          paths = [pathlib.Path("data/known-products.ts"), pathlib.Path("data/known-formulas.ts"), pathlib.Path("data/wrong-barcodes.ts"), pathlib.Path("docs/CATALOG-CONFLICTS.md")]
          paths += [pathlib.Path(p) for p in glob.glob("research/deep-research-*.json")]
          corpus = "\n".join(p.read_text(encoding="utf-8") for p in paths if p.exists())
          for rec in batch:
              if rec["upc"] in corpus or rec["canonical_gtin14"] in corpus:
                  raise SystemExit(f"Collision before append: {rec['upc']}")

          def valid_upc(u):
              digits = [int(x) for x in u]
              total = sum((3 if i % 2 == 0 else 1) * digits[i] for i in range(11))
              return (10 - total % 10) % 10 == digits[11]

          for rec in batch:
              if len(rec["upc"]) != 12 or not valid_upc(rec["upc"]):
                  raise SystemExit(f"Invalid UPC: {rec['upc']}")
              if rec["canonical_gtin14"] != "00" + rec["upc"]:
                  raise SystemExit(f"Invalid GTIN-14: {rec['upc']}")
              if rec["brand"] != "Royal Canin" or rec["species"] != "dog":
                  raise SystemExit(f"Wrong scope: {rec['upc']}")
              if rec["research_status"] != "source_verified":
                  raise SystemExit(f"Wrong status: {rec['upc']}")

          data["records"].extend(batch)
          data["updated_at"] = "2026-08-25"
          if data["records"][:30] != old_records:
              raise SystemExit("Existing records changed unexpectedly")
          upcs = [r["upc"] for r in data["records"]]
          gtins = [r["canonical_gtin14"] for r in data["records"]]
          if len(data["records"]) != 40 or len(set(upcs)) != 40 or len(set(gtins)) != 40:
              raise SystemExit("Final count/uniqueness validation failed")
          target.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          json.loads(target.read_text(encoding="utf-8"))
          print("validated", len(data["records"]), "records")
          PY

          rm .github/workflows/tmp-royal-canin-dogs-batch-04.yml
          git config user.name "Adisabeba33"
          git config user.email "lezzgo2@gmail.com"
          git add research/deep-research-royal-canin-dogs.json .github/workflows/tmp-royal-canin-dogs-batch-04.yml
          git commit -m "research: add 10 verified Royal Canin dog records (batch 04)"
          git push origin HEAD:agent/deep-research-barcode-ledger
