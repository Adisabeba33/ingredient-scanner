name: Generate Merrick batch 2
on:
  push:
    branches: [agent/deep-research-merrick]
    paths: [.github/workflows/tmp-merrick-batch2-map.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-merrick
      - name: Append 20 current dog wet records
        run: |
          python - <<'PY'
          import urllib.request,re,json,html
          from pathlib import Path
          DATE='2026-08-28'
          H={'User-Agent':'Mozilla/5.0'}
          target=Path('research/deep-research-merrick.json')
          def get(u):
            req=urllib.request.Request(u,headers=H)
            with urllib.request.urlopen(req,timeout=30) as r: return r.read().decode('utf-8','replace')
          def clean(s):
            s=re.sub(r'<script\b[^>]*>.*?</script>',' ',s,flags=re.I|re.S)
            s=re.sub(r'<style\b[^>]*>.*?</style>',' ',s,flags=re.I|re.S)
            s=re.sub(r'<[^>]+>',' ',s)
            return re.sub(r'\s+',' ',html.unescape(s)).strip()
          def split_top(s):
            out=[]; start=0; sq=0; par=0
            for i,ch in enumerate(s):
              if ch=='[': sq+=1
              elif ch==']': sq=max(0,sq-1)
              elif ch=='(': par+=1
              elif ch==')': par=max(0,par-1)
              elif ch==',' and sq==0 and par==0:
                out.append(s[start:i].strip()); start=i+1
            tail=s[start:].strip().rstrip('.')
            if tail: out.append(tail)
            return out
          def pct(chunk,label):
            m=re.search(label+r'\s*\([^)]*\)\s*(?:\.{2,}|…+|:)?\s*([0-9.]+)\s*%',chunk,re.I)
            if not m:
              m=re.search(label+r'.{0,35}?([0-9.]+)\s*%',chunk,re.I)
            if not m: raise AssertionError((label,chunk))
            return float(m.group(1))
          def valid(s):
            total=sum(int(s[i])*(3 if i%2==0 else 1) for i in range(11))
            return len(s)==12 and s.isdigit() and (10-total%10)%10==int(s[-1])
          def texture_and_presentation(title,desc):
            s=(title+' '+desc).lower().replace('â€™',"'")
            if 'pâté' in s or 'pate' in s: texture='pate'
            elif 'meatloaf' in s: texture='loaf'
            elif 'stew' in s: texture='stew'
            elif 'chunky' in s or ' chunks' in s or 'chunk ' in s: texture='chunks'
            elif 'medley' in s: texture='medley'
            else: texture='unknown'
            if 'gravy' in s: presentation='in_gravy'
            elif 'sauce' in s: presentation='in_sauce'
            elif 'broth' in title.lower(): presentation='in_broth'
            else: presentation='plain'
            return texture,presentation

          meta=[
            ('022808001997','https://www.merrickpetcare.com/shop/grain-free-cowboy-cookout-wet-dog-food','Grain Free','Cowboy Cookout In Gravy',['beef']),
            ('022808283010','https://www.merrickpetcare.com/shop/chunky-grain-free-big-texas-steak-tips-dinner-in-gravy-wet-dog-food','Chunky Grain Free','Big Texas Steak Tips Dinner in Gravy',['beef']),
            ('022808284000','https://www.merrickpetcare.com/shop/slow-cooked-bbq-texas-style-braised-beef-wet-dog-food','Slow-Cooked BBQ','Texas Style with Braised Beef',['beef']),
            ('022808280040','https://www.merrickpetcare.com/shop/kitchen-comforts-lamb-shepherds-pie-wet-dog-food','Kitchen Comforts',"Lamb Shepherd's Pie",['lamb']),
            ('022808390046','https://www.merrickpetcare.com/shop/grain-free-limited-ingredient-diet-lamb-wet-dog-food','Limited Ingredient Diet Grain Free','Real Lamb Recipe',['lamb']),
            ('022808370024','https://www.merrickpetcare.com/shop/backcountry-grain-free-beef-dinner-wet-dog-food','Backcountry Grain Free','Real Beef Dinner',['beef']),
            ('022808470144','https://www.merrickpetcare.com/shop/backcountry-grain-free-heros-banquet-stew-wet-dog-food','Backcountry Grain Free',"Hero's Banquet Stew",['beef','lamb']),
            ('022808390916','https://www.merrickpetcare.com/shop/limited-ingredient-diet-healthy-grains-chicken-wet-dog-food','Limited Ingredient Diet Healthy Grains','Real Chicken & Brown Rice Recipe',['chicken']),
            ('022808280064','https://www.merrickpetcare.com/shop/kitchen-comforts-turkey-meatloaf-wet-dog-food','Kitchen Comforts','Turkey Meatloaf',['turkey']),
            ('022808280002','https://www.merrickpetcare.com/shop/kitchen-comforts-chicken-casserole-wet-dog-food','Kitchen Comforts','Chicken Casserole',['chicken']),
            ('022808280026','https://www.merrickpetcare.com/shop/kitchen-comforts-beef-tips-rice-stew-wet-dog-food','Kitchen Comforts','Beef Tips & Rice Stew',['beef']),
            ('022808284093','https://www.merrickpetcare.com/shop/slow-cooked-bbq-kentucky-style-chopped-lamb-wet-dog-food','Slow-Cooked BBQ','Kentucky Style with Chopped Lamb',['lamb']),
            ('022808390930','https://www.merrickpetcare.com/shop/limited-ingredient-diet-healthy-grains-turkey-wet-dog-food','Limited Ingredient Diet Healthy Grains','Real Turkey & Brown Rice Recipe',['turkey']),
            ('022808284031','https://www.merrickpetcare.com/shop/slow-cooked-bbq-memphis-style-glazed-chicken-wet-dog-food','Slow-Cooked BBQ','Memphis Style with Glazed Chicken',['chicken']),
            ('022808284017','https://www.merrickpetcare.com/shop/slow-cooked-bbq-kansas-city-style-chopped-pork-wet-dog-food','Slow-Cooked BBQ','Kansas City Style with Chopped Pork',['pork']),
            ('022808003342','https://www.merrickpetcare.com/shop/grain-free-beef-lamb-buffalo-wet-dog-food','Grain Free','Real Beef, Lamb + Bison Dinner',['beef','lamb','bison']),
            ('022808282976','https://www.merrickpetcare.com/shop/chunky-grain-free-carvers-delight-dinner-in-gravy-wet-dog-food','Chunky Grain Free',"Carver's Delight Dinner in Gravy",['chicken','turkey']),
            ('022808282938','https://www.merrickpetcare.com/shop/chunky-grain-free-colossal-chicken-dinner-in-gravy-wet-dog-food','Chunky Grain Free','Colossal Chicken Dinner in Gravy',['chicken']),
            ('022808282877','https://www.merrickpetcare.com/shop/chunky-grain-free-pappys-pot-roast-dinner-in-gravy-wet-dog-food','Chunky Grain Free',"Pappy's Pot Roast Dinner in Gravy",['beef']),
            ('022808002864','https://www.merrickpetcare.com/shop/grain-free-wilderness-blend-wet-dog-food','Grain Free','Wilderness Blend in Gravy',['duck','bison','venison']),
          ]
          data=json.loads(target.read_text(encoding='utf-8'))
          assert len(data['records'])==20, len(data['records'])
          # Repair batch-1 controlled vocabulary only; evidence/formulas/barcodes are unchanged.
          repairs={
            '022808000839':('chunks','in_sauce'), '022808000754':('chunks','in_gravy'),
            '022808000891':('chunks','in_sauce'), '022808000778':('chunks','in_gravy'),
            '022808000853':('chunks','in_sauce'), '022808000792':('chunks','in_gravy')
          }
          repair_note='Controlled-vocabulary repair on 2026-08-28: texture/presentation were normalized to lib/presentation.ts; barcode and formula evidence are unchanged.'
          for r in data['records']:
            if r['upc'] in repairs:
              r['texture'],r['presentation']=repairs[r['upc']]
              if repair_note not in r['verification_notes']: r['verification_notes'].append(repair_note)
            elif r['food_form']=='wet' and r['texture']=='pate':
              r['presentation']='plain'
              if repair_note not in r['verification_notes']: r['verification_notes'].append(repair_note)
            elif r['food_form']=='dry':
              r['texture']='kibble'; r['presentation']='plain'
              if repair_note not in r['verification_notes']: r['verification_notes'].append(repair_note)
          new=[]
          for upc,url,line,variant,recipe in meta:
            assert valid(upc)
            raw=get(url); txt=clean(raw)
            h1=re.search(r'<h1\b[^>]*>(.*?)</h1>',raw,re.I|re.S)
            title=clean(h1.group(1)) if h1 else variant
            skus=re.findall(r'<div class="ps-widget" ps-sku="(\d+)"',raw,re.I)
            assert skus and skus[0]==upc,(upc,skus[:3],url)
            a=txt.find('Available Sizes'); p=txt.find('Product Description',a)
            size=txt[a+len('Available Sizes'):p].strip()
            assert size=='12.7 oz. Can',(upc,size)
            n=txt.find('Nutrition'); i=txt.find('Ingredients',n); g=txt.find('Guaranteed Analysis',i); f=txt.find('Feeding',g)
            assert n>=0 and i>n and g>i and f>g,(upc,n,i,g,f)
            ingredients=txt[i+len('Ingredients'):g].strip()
            label=None
            lm=re.search(r'\s+([A-Z]\d{6}(?:-\d+)?)$',ingredients)
            if lm:
              label=lm.group(1); ingredients=ingredients[:lm.start()].strip()
            assert len(ingredients)>100,(upc,ingredients)
            ga_chunk=txt[g:f]
            protein=pct(ga_chunk,'Crude Protein'); fat=pct(ga_chunk,'Crude Fat'); fiber=pct(ga_chunk,'Crude Fiber'); moisture=pct(ga_chunk,'Moisture')
            c=txt.find('Calorie Content',g); assert c>=0
            cal_chunk=txt[c:c+260]
            nums=[int(x.replace(',','')) for x in re.findall(r'([0-9][0-9,]*)\s*kcal',cal_chunk,re.I)]
            assert len(nums)>=2,(upc,cal_chunk,nums)
            kcal_kg,kcal_can=nums[0],nums[1]
            nominal_kg=12.7*0.028349523125; calc=kcal_kg*nominal_kg; delta=abs(calc-kcal_can)
            assert delta<=2.0,(upc,calc,kcal_can,delta)
            desc=txt[p+len('Product Description'):n].strip() if p>=0 and n>p else ''
            assert 'adult' in (desc+' '+txt[f:f+1200]).lower(),(upc,'adult marker missing')
            texture,presentation=texture_and_presentation(title,desc)
            record={
              'catalog_number':None,'upc':upc,'canonical_gtin14':upc.zfill(14),'barcode_scope':'individual_unit',
              'brand':'Merrick','manufacturer':'Merrick Pet Care','species':'dog','product_line':line,
              'product_name':('Merrick '+title) if not title.lower().startswith('merrick') else title,
              'variant':variant,'recipe':recipe,'life_stage':'adult','food_form':'wet','texture':texture,'presentation':presentation,
              'package_type':'can','size':'12.7 oz','ingredients_verbatim':ingredients,'ingredients_ordered_normalized':split_top(ingredients),
              'guaranteed_analysis':{'crude_protein_min_percent':protein,'crude_fat_min_percent':fat,'crude_fiber_max_percent':fiber,'moisture_max_percent':moisture,'ash_max_percent':None,'taurine_min_percent':None,'other_printed_guarantees':[]},
              'calorie_content':{'kcal_per_kg':kcal_kg,'kcal_per_unit':kcal_can,'unit_name':'can'},
              'label_deck_code':label,'formula_source':f'Merrick current official US product page'+(f', current formula deck {label}' if label else '')+'.',
              'source_urls':[url,'https://www.merrickpetcare.com/dog-food/wet'],'source_accessed_at':DATE,
              'barcode_notes':f'Merrick current official PDP exposes UPC {upc} as the first PriceSpider ps-sku for this exact product; the same PDP lists a single 12.7 oz can size.',
              'conflicts':[],
              'verification_notes':[
                f'UPC-A check digit validated for {upc}; canonical GTIN-14 is {upc.zfill(14)}.',
                'Current official Merrick PDP supplies the complete ingredient order, printed guaranteed analysis, calorie statement, adult feeding/life-stage context, and single-can package size.',
                f'Calorie cross-check: {kcal_kg} kcal/kg × 0.3600 kg nominal 12.7 oz can = {calc:.1f} kcal versus {kcal_can} kcal/can printed (rounding difference {delta:.1f} kcal).',
                f'Controlled texture/presentation were mapped from the current official product name/description using repository vocabulary: texture={texture}, presentation={presentation}.',
                'Active-market gate: the product is present in Merrick current US wet-dog catalog and the manufacturer PDP exposes its Where-to-Buy PriceSpider identity.'
              ],
              'research_status':'source_verified'
            }
            new.append(record)
          assert len(new)==20 and len({r['upc'] for r in new})==20
          old={r['upc'] for r in data['records']}; assert not old.intersection({r['upc'] for r in new})
          data['records'].extend(new); data['updated_at']=DATE
          assert len(data['records'])==40
          target.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('APPENDED',len(new),'TOTAL',len(data['records']))
          for r in new: print('NEW',r['upc'],r['texture'],r['presentation'],r['label_deck_code'],r['product_name'])
          PY
          git config user.name "OpenAI Research Agent"
          git config user.email "noreply@openai.com"
          git add research/deep-research-merrick.json
          git commit -m "research: add second 20 active Merrick barcodes"
          git push origin HEAD:agent/deep-research-merrick
