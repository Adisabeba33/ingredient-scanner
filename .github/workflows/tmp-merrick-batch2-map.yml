name: Validate Merrick batch 2
on:
  push:
    branches: [agent/deep-research-merrick]
    paths: [.github/workflows/tmp-merrick-batch2-map.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate selected active Merrick dog wet UPCs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          batch=[
            '022808001997','022808283010','022808284000','022808280040','022808390046',
            '022808370024','022808470144','022808390916','022808280064','022808280002',
            '022808280026','022808284093','022808390930','022808284031','022808284017',
            '022808003342','022808282976','022808282938','022808282877','022808002864'
          ]
          target=Path('research/deep-research-merrick.json')
          paths=[Path('data/known-products.ts'),Path('data/known-formulas.ts'),Path('data/wrong-barcodes.ts'),Path('docs/CATALOG-CONFLICTS.md')]+list(Path('research').glob('deep-research-*.json'))
          collisions=[]
          for p in paths:
            if not p.exists(): continue
            txt=p.read_text(encoding='utf-8',errors='replace')
            for code in batch:
              if re.search(r'(?<!\d)'+re.escape(code)+r'(?!\d)',txt) or re.search(r'(?<!\d)'+re.escape(code.zfill(14))+r'(?!\d)',txt):
                collisions.append((code,str(p)))
          def valid(s):
            assert len(s)==12 and s.isdigit()
            total=sum(int(s[i])*(3 if i%2==0 else 1) for i in range(11))
            return (10-total%10)%10==int(s[-1])
          print('BATCH',len(batch),'UNIQUE',len(set(batch)))
          for x in batch: print(x,'CHECKDIGIT',valid(x),'GTIN14',x.zfill(14))
          print('COLLISIONS',collisions)
          assert len(batch)==20 and len(set(batch))==20
          assert all(valid(x) for x in batch)
          assert not collisions
          print('BATCH2_VALIDATION_OK')
          PY
