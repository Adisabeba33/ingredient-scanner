name: Map Merrick batch 2 exact PDP candidates
on:
  push:
    branches: [agent/deep-research-merrick]
    paths: [.github/workflows/tmp-merrick-batch2-map.yml]
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map current dog wet PDP identities
        run: |
          python - <<'PY'
          import urllib.request,re,json,html,time
          from pathlib import Path
          H={'User-Agent':'Mozilla/5.0'}
          def get(u):
            req=urllib.request.Request(u,headers=H)
            with urllib.request.urlopen(req,timeout=30) as r:
              return r.read().decode('utf-8','replace')
          def clean(s):
            s=re.sub(r'<script\b[^>]*>.*?</script>',' ',s,flags=re.I|re.S)
            s=re.sub(r'<style\b[^>]*>.*?</style>',' ',s,flags=re.I|re.S)
            s=re.sub(r'<[^>]+>',' ',s)
            return re.sub(r'\s+',' ',html.unescape(s)).strip()
          paths=[Path('data/known-products.ts'),Path('data/known-formulas.ts'),Path('data/wrong-barcodes.ts'),Path('docs/CATALOG-CONFLICTS.md')]+list(Path('research').glob('deep-research-*.json'))
          repo='\n'.join(p.read_text(encoding='utf-8',errors='replace') for p in paths if p.exists())
          existing=set(re.findall(r'(?<!\d)(?:\d{8}|\d{12,14})(?!\d)',repo)); canon={x.zfill(14) for x in existing}
          urls=[]
          for page in range(0,6):
            u='https://www.merrickpetcare.com/dog-food/wet'+(f'?page={page}' if page else '')
            t=get(u)
            for href in re.findall(r'href=["\']([^"\']*/shop/[^"\']+)["\']',t,re.I):
              href=html.unescape(href).split('?')[0].split('#')[0]
              if href.startswith('/'): href='https://www.merrickpetcare.com'+href
              if href not in urls: urls.append(href)
          print('PDP_URLS',len(urls))
          rows=[]
          for url in urls:
            if 'variety-pack' in url: continue
            try:t=get(url)
            except Exception as e:
              print('ERR',url,repr(e)); continue
            txt=clean(t)
            h1=re.search(r'<h1\b[^>]*>(.*?)</h1>',t,re.I|re.S)
            title=clean(h1.group(1)) if h1 else url.rsplit('/',1)[-1]
            skus=re.findall(r'<div class="ps-widget" ps-sku="(\d+)"',t,re.I)
            if not skus: continue
            upc=skus[0]
            if upc in existing or upc.zfill(14) in canon: continue
            a=txt.find('Available Sizes')
            p=txt.find('Product Description',a if a>=0 else 0)
            size=txt[a+len('Available Sizes'):p].strip() if a>=0 and p>a else ''
            n=txt.find('Nutrition')
            i=txt.find('Ingredients',n if n>=0 else 0)
            g=txt.find('Guaranteed Analysis',i if i>=0 else 0)
            ingr=txt[i+len('Ingredients'):g].strip() if i>=0 and g>i else ''
            f=txt.find('Feeding',g if g>=0 else 0)
            ga_chunk=txt[g:f].strip() if g>=0 and f>g else ''
            c=txt.find('Calorie Content',g if g>=0 else 0)
            cal=txt[c:c+220].strip() if c>=0 else ''
            adequacy=''
            for phrase in ['is formulated to meet','is formulated to meet the nutritional levels','provides complete and balanced','complete and balanced']:
              pos=txt.lower().find(phrase.lower())
              if pos>=0:
                adequacy=txt[pos:pos+420]; break
            rows.append({'upc':upc,'title':title,'url':url,'size':size,'ingredients':ingr,'ga':ga_chunk[:1100],'calories':cal,'adequacy':adequacy,'pdp_skus':skus[:6]})
            time.sleep(.03)
          print('NEW_PDP_ROWS',len(rows))
          for r in rows:
            print('PDP',json.dumps(r,ensure_ascii=False))
          PY
