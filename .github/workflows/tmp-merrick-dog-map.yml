name: Map active Merrick dog UPCs
on:
  push:
    branches: [agent/deep-research-merrick]
    paths: [.github/workflows/tmp-merrick-dog-map.yml]
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current Merrick dog catalog
        run: |
          python - <<'PY'
          import urllib.request,re,json,html
          from pathlib import Path
          H={'User-Agent':'Mozilla/5.0'}
          def get(u):
            req=urllib.request.Request(u,headers=H)
            with urllib.request.urlopen(req,timeout=30) as r:
              return r.read().decode('utf-8','replace')
          def clean(s):
            s=re.sub(r'<script\b[^>]*>.*?</script>',' ',s,flags=re.I|re.S)
            s=re.sub(r'<style\b[^>]*>.*?</style>',' ',s,flags=re.I|re.S)
            s=re.sub(r'<[^>]+>',' ',s)
            return re.sub(r'\s+',' ',html.unescape(s)).strip()
          paths=[Path('data/known-products.ts'),Path('data/known-formulas.ts'),Path('data/wrong-barcodes.ts'),Path('docs/CATALOG-CONFLICTS.md')]+list(Path('research').glob('deep-research-*.json'))
          repo='\n'.join(p.read_text(encoding='utf-8',errors='replace') for p in paths if p.exists())
          existing=set(re.findall(r'(?<!\d)(?:\d{8}|\d{12,14})(?!\d)',repo)); canon={x.zfill(14) for x in existing}
          print('EXCLUSION_FILES',len(paths),'CODES',len(existing))
          found=[]
          for page in range(0,6):
            u='https://www.merrickpetcare.com/dog-food/wet'+(f'?page={page}' if page else '')
            try: t=get(u)
            except Exception as e:
              print('PAGE_ERR',page,repr(e)); continue
            for m in re.finditer(r'<div class="ps-widget" ps-sku="(\d+)"[^>]*>',t,re.I):
              sku=m.group(1); w=t[max(0,m.start()-4500):m.end()+500]
              titles=re.findall(r'(?:data-content_name|title)="([^"]+)"',w,re.I)
              hrefs=re.findall(r'href="([^"]*/shop/[^"]+)"',w,re.I)
              title=html.unescape(titles[-1]) if titles else None
              href=html.unescape(hrefs[-1]).split('?')[0] if hrefs else None
              if href and href.startswith('/'): href='https://www.merrickpetcare.com'+href
              found.append({'page':page,'upc':sku,'title':title,'url':href,'known':sku in existing or sku.zfill(14) in canon})
          uniq=[]; seen=set()
          for x in found:
            if x['upc'] in seen: continue
            seen.add(x['upc']); uniq.append(x)
          print('DOG_WET_ACTIVE_UNIQUE',len(uniq))
          for x in uniq: print('CARD',json.dumps(x,ensure_ascii=False,sort_keys=True))
          print('NEW_CARDS',sum(not x['known'] for x in uniq))
          print('\nDETAILS_NEW')
          for x in uniq:
            if x['known'] or not x['url']: continue
            try: t=get(x['url'])
            except Exception as e:
              print('DETAIL_ERR',x['upc'],repr(e)); continue
            text=clean(t)
            pdp_skus=re.findall(r'<div class="ps-widget" ps-sku="(\d+)"',t,re.I)
            def chunk(label,n):
              i=text.find(label)
              return text[i:i+n] if i>=0 else ''
            print('DETAIL',json.dumps({
              'upc':x['upc'],'title':x['title'],'url':x['url'],'pdp_skus':pdp_skus[:10],
              'sizes':chunk('Available Sizes',300),
              'ingredients':chunk('Ingredients',2600),
              'ga':chunk('Guaranteed Analysis',1400),
              'calories':chunk('Calorie Content',650),
              'feeding':chunk('Feeding',800)
            },ensure_ascii=False,sort_keys=True))
          PY
