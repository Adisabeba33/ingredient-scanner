name: Diagnose Royal Canin dog b6 collisions
on:
  push:
    branches: [agent/deep-research-barcode-ledger]
    paths:
      - '.github/workflows/append-royal-canin-dogs-b6.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: List all payload collisions
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('.')
          ledger=json.loads((root/'research/deep-research-royal-canin-dogs.json').read_text())
          batch=json.loads((root/'research/.royal-canin-dogs-append-2026-08-26-b6.json').read_text())['records']
          replacement=json.loads((root/'research/.royal-canin-dogs-b6-replacement.json').read_text())['record']
          old=[r for r in batch if r['upc']!='030111483867']+[replacement]
          scan=[root/'data/known-products.ts',root/'data/known-formulas.ts',root/'data/wrong-barcodes.ts',root/'docs/CATALOG-CONFLICTS.md']+sorted((root/'research').glob('deep-research-*.json'))
          texts={str(p):p.read_text(errors='ignore') for p in scan if p.exists()}
          print('LEDGER_TOTAL',len(ledger['records']))
          print('BATCH_UPCS',','.join(r['upc'] for r in old))
          collisions=[]
          for r in old:
            u=r['upc']; g=r['canonical_gtin14']
            hits=[p for p,t in texts.items() if u in t or g in t]
            if hits: collisions.append((u,hits))
          print('COLLISION_COUNT',len(collisions))
          for u,h in collisions: print('COLLISION',u,'|',','.join(h))
          PY