name: Finalize second ZIWI next 20 batch
on:
  push:
    branches: [agent/deep-research-ziwi-peak]
    paths: [.github/workflows/tmp-ziwi-next20-finalize.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-ziwi-peak
          fetch-depth: 0
      - name: Build, validate, and append audited second batch
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          ACCESSED='2026-08-28'
          BRAND='ZIWI Peak'
          MAKER='ZIWI Ltd.'

          def ga(protein=None,fat=None,fiber=None,moisture=None,ash=None,taurine=None,extras=None):
              return {'crude_protein_min_percent':protein,'crude_fat_min_percent':fat,'crude_fiber_max_percent':fiber,'moisture_max_percent':moisture,'ash_max_percent':ash,'taurine_min_percent':taurine,'other_printed_guarantees':extras or []}
          def kcal(kg=None,unit=None,unit_name=None):
              return {'kcal_per_kg':kg,'kcal_per_unit':unit,'unit_name':unit_name}
          def extra(nutrient,basis,value,unit):
              return {'nutrient':nutrient,'basis':basis,'value':value,'unit':unit}
          def row(upc,scope,species,line,name,variant,recipe,life_stage,food_form,texture,presentation,package_type,size,ingredients,normalized,analysis,calories,formula_source,source_urls,barcode_notes,conflicts,verification,status,label_deck_code=None):
              return {
                  'catalog_number':None,'upc':upc,'canonical_gtin14':upc.zfill(14),'barcode_scope':scope,
                  'brand':BRAND,'manufacturer':MAKER,'species':species,'product_line':line,'product_name':name,
                  'variant':variant,'recipe':recipe,'life_stage':life_stage,'food_form':food_form,'texture':texture,
                  'presentation':presentation,'package_type':package_type,'size':size,'ingredients_verbatim':ingredients,
                  'ingredients_ordered_normalized':normalized,'guaranteed_analysis':analysis,'calorie_content':calories,
                  'label_deck_code':label_deck_code,'formula_source':formula_source,'source_urls':source_urls,
                  'source_accessed_at':ACCESSED,'barcode_notes':barcode_notes,'conflicts':conflicts,
                  'verification_notes':verification,'research_status':status
              }

          rows=[]

          # 1) Provenance Otago Valley dog wet 170 g — exact individual barcode + complete formula/GA/calories.
          otago_ing='Beef, Beef Broth, Venison, Whole Southern Blue Whiting, Lamb Tripe, Beef Kidney, Lamb Lung, New Zealand Green Mussel, Lamb Plasma, Venison Tripe, Hoki, Lecithin, Beef Liver, Venison Lung, Beef Bone, Lamb Liver, Lamb Kidney, Lamb, Venison Kidney, Minerals (Dipotassium Phosphate, Magnesium Sulfate, Zinc Amino Acid Complex, Iron Amino Acid Complex, Copper Amino Acid Complex, Selenium Yeast, Manganese Amino Acid Complex), Venison Bone, Dried Kelp, Lamb Bone, Salt, Vitamins (Vitamin E Supplement, Thiamine Mononitrate, Vitamin B5 Supplement, Pyridoxine Hydrochloride, Vitamin D3 Supplement, Folic Acid).'
          otago_norm=['Beef','Beef Broth','Venison','Whole Southern Blue Whiting','Lamb Tripe','Beef Kidney','Lamb Lung','New Zealand Green Mussel','Lamb Plasma','Venison Tripe','Hoki','Lecithin','Beef Liver','Venison Lung','Beef Bone','Lamb Liver','Lamb Kidney','Lamb','Venison Kidney','Minerals (Dipotassium Phosphate, Magnesium Sulfate, Zinc Amino Acid Complex, Iron Amino Acid Complex, Copper Amino Acid Complex, Selenium Yeast, Manganese Amino Acid Complex)','Venison Bone','Dried Kelp','Lamb Bone','Salt','Vitamins (Vitamin E Supplement, Thiamine Mononitrate, Vitamin B5 Supplement, Pyridoxine Hydrochloride, Vitamin D3 Supplement, Folic Acid)']
          rows.append(row('9421016597024','individual_unit','dog','Provenance Canned Wet','ZIWI Peak Provenance Otago Valley Recipe Wet Dog Food','Otago Valley Recipe',['beef','venison','southern blue whiting','lamb','hoki'],'all','wet',None,'plain','can','6 oz (170 g)',otago_ing,otago_norm,ga(9,7,1.5,78,4),kcal(1250,None,None),'PetZoo proves the exact 170 g individual-unit barcode; Vet Warehouse and League of Pets provide the matching Otago Valley ingredient statement, full guaranteed analysis and 1250 kcal/kg energy statement.',['https://www.petzoo.com.au/ziwi-peak-provenance-wet-dog-food-otago-valley-170g','https://vetwarehouse.co.nz/ziwi-provenance-otago-valley-wet-dog-food/','https://leagueofpets.com.au/products/ziwi-peak-provenance-otago-valley-wet-dog-food-170g'],'EAN-13 9421016597024 is explicitly mapped to one 170 g Otago Valley dog-food can; it is not a tray/case code.',[],['GTIN-13 check digit validated independently.','Exact individual-unit barcode and nominal 170 g size are proven.','Ingredients, GA and energy were taken from matching Otago Valley wet-dog formula sources; no sibling recipe was substituted.'],'source_verified'))

          # 2) Historical/regional Venison cat 85 g — exact old barcode/formula identity, but matching old-generation nutrition panel is missing.
          ven_old_ing='Venison, Venison Broth, Venison Liver, Venison Lung, Venison Heart, Venison Kidney, Venison Tripe, Chick Peas, New Zealand Green Mussel, Venison Bone, Dried Kelp, Minerals (Zinc Amino Acid Complex, Copper Amino Acid Complex, Manganese Amino Acid Complex), Vitamins (Vitamin E Supplement, Vitamin B1 Supplement, Folic Acid, Vitamin D3 Supplement).'
          ven_old_norm=['Venison','Venison Broth','Venison Liver','Venison Lung','Venison Heart','Venison Kidney','Venison Tripe','Chick Peas','New Zealand Green Mussel','Venison Bone','Dried Kelp','Minerals (Zinc Amino Acid Complex, Copper Amino Acid Complex, Manganese Amino Acid Complex)','Vitamins (Vitamin E Supplement, Vitamin B1 Supplement, Folic Acid, Vitamin D3 Supplement)']
          rows.append(row('9421016592678','individual_unit','cat','Historical/Regional Canned Wet','ZIWI Peak Venison Recipe Canned Cat Food','Venison Recipe',['venison'],None,'wet',None,'plain','can','3 oz (85 g)',ven_old_ing,ven_old_norm,ga(),kcal(),'Petzone UAE and Petsky independently bind EAN-13 9421016592678 to the 85 g Venison cat can and preserve the same older ingredient generation. A matching complete nutrition panel for this exact historical generation was not located, so newer replacement-code nutrition is intentionally not copied.',['https://petzone.com/uae/ziwi-peak-venison-recipe-cat-food-85g','https://petskyonline.com/products/ziwi-peak-venison-recipe-cat-food-85g','https://www.petcity.com.au/product/ziwi-peak-cat-can-venison-85g'],'EAN-13 9421016592678 is a historical/regional 85 g Venison cat-can code. Current-market copies also use 9421016594566, and one retailer exposes both identifiers on the same product page.',['The surviving 9421016592678 ingredient statement is materially older than current 9421016594566 formula copies. The exact old-generation guaranteed analysis/calorie panel is unresolved and must not be borrowed from the newer code.','PetCity exposes current SKU 9421016594566 while also listing Barcode # 9421016592678, demonstrating generation/region coexistence rather than proving equivalence of formula panels.'],['GTIN-13 check digit validated independently.','Exact 85 g unit identity is independently corroborated.','Stored ingredients come only from sources carrying the historical barcode generation; nutrition fields remain null pending physical label.'],'needs_physical_label'))

          # 3-4) Historical Hoki cat cans. TorontoPets Shopify data exposes exact variant barcodes.
          hoki_ing='Hoki, Water Sufficient for Processing, Chickpeas, Hoki Liver, New Zealand Green Mussel, Fish Bone, DL-Methionine, Minerals (Dipotassium Phosphate, Magnesium Sulfate, Zinc Amino Acid Complex, Manganese Amino Acid Complex, Copper Amino Acid Complex), Dried Kelp, Vitamins (Choline Chloride, Vitamin E Supplement, Thiamine Mononitrate, Niacin, Pyridoxine Hydrochloride, Riboflavin, Vitamin D3 Supplement, Folic Acid), Salt, Taurine.'
          hoki_norm=['Hoki','Water Sufficient for Processing','Chickpeas','Hoki Liver','New Zealand Green Mussel','Fish Bone','DL-Methionine','Minerals (Dipotassium Phosphate, Magnesium Sulfate, Zinc Amino Acid Complex, Manganese Amino Acid Complex, Copper Amino Acid Complex)','Dried Kelp','Vitamins (Choline Chloride, Vitamin E Supplement, Thiamine Mononitrate, Niacin, Pyridoxine Hydrochloride, Riboflavin, Vitamin D3 Supplement, Folic Acid)','Salt','Taurine']
          hoki_ga=ga(10,3.5,2,78,3.5,None,[extra('Chondroitin Sulfate','min',300,'other')])
          rows.append(row('9421016595877','individual_unit','cat','Historical Canned Wet','ZIWI Peak New Zealand Hoki Recipe Wet Cat Food','New Zealand Hoki Recipe',['hoki'],'all','wet',None,'plain','can','3 oz (85 g)',hoki_ing,hoki_norm,hoki_ga,kcal(1050,89,'can'),'TorontoPets archived product copy supplies the Hoki formula, complete GA, 1050 kcal/kg and 89 kcal/85 g; its Shopify variant data maps the 3 oz/85 g variant directly to EAN-13 9421016595877. Independent Asian inventory copies corroborate 9421016595877 as the discontinued 85 g Hoki cat can.',['https://www.torontopets.ca/products/ziwi-peak-wet-cat-food-new-zealand-hoki-recipe-canned','https://zooart.com.pl/product-pol-48870-ZiwiPeak-Hoki-Cat-Wet-Food.html'],'EAN-13 9421016595877 is the exact historical 3 oz/85 g Hoki cat-can variant barcode.',[],['GTIN-13 check digit validated independently.','Exact retailer Shopify variant data binds 9421016595877 to the 3 oz/85 g individual can.','Visible product copy and label-oriented retailer evidence agree on ingredient order, 10/3.5/2/78/3.5 GA, 1050 kcal/kg and 89 kcal per 85 g can.'],'source_verified'))
          rows.append(row('9421016595839','individual_unit','cat','Historical Canned Wet','ZIWI Peak New Zealand Hoki Recipe Wet Cat Food','New Zealand Hoki Recipe',['hoki'],'all','wet',None,'plain','can','6.5 oz (185 g)',hoki_ing,hoki_norm,hoki_ga,kcal(1050,194,'can'),'TorontoPets visible archived product copy supplies the Hoki formula, GA and 194 kcal/185 g, while its embedded Shopify variant exposes EAN-13 9421016595839 for the larger can. Independent historical inventory copies identify the same EAN as the discontinued 185 g Hoki can.',['https://www.torontopets.ca/products/ziwi-peak-wet-cat-food-new-zealand-hoki-recipe-canned','https://zooart.com.pl/product-pol-48870-ZiwiPeak-Hoki-Cat-Wet-Food.html'],'EAN-13 9421016595839 consistently identifies the larger historical Hoki cat can, but one stale Shopify variant labels it 6 OZ/170 g while visible product/label evidence and independent inventory identify 6.5 oz/185 g.',['TorontoPets embedded Shopify metadata calls the larger variant 6 OZ and reports 170 g, while the visible product copy prints 6.5 oz/185 g and 194 kcal/185 g; multiple independent inventory systems also identify 9421016595839 as 185 g. Physical label is required to settle the exact printed size tied to this historical barcode.'],['GTIN-13 check digit validated independently.','Barcode is not inferred: it is present in embedded retailer variant data and independent historical inventory references.','Formula/GA/calories are stored from the Hoki product page, but status remains needs_physical_label because exact large-can size metadata conflicts.'],'needs_physical_label'))

          # Outer retail packs. These barcodes are useful scan targets but are not individual-can UPCs.
          # Keep formula fields blank rather than copying a contained recipe formula into an outer-pack identity.
          package_rows=[
            # upc, scope, species, name, variant, recipe, size, sources
            ('9421038210833','multipack','cat','ZIWI Peak Wet Cat Food Variety Pack — All Flavors','Beef / Chicken / Lamb / Mackerel & Lamb / Mackerel / Venison',[], '6 x 3 oz (85 g) cans',['https://www.integrativeconnections.com/products/ziwi-peak-wet-cat-food-variety-pack-beef-chicken-lamb-mackerel-lamb-mackerel-venison-6-pack-3oz-each-1']),
            ('9421038210826','multipack','cat','ZIWI Peak Wet Cat Food Variety Pack — Chicken, Lamb & Mackerel + Lamb','Chicken / Lamb / Mackerel & Lamb',['chicken','lamb','mackerel'], '6 x 3 oz (85 g) cans',['https://www.torontopets.ca/products/ziwi-peak-wet-cat-food-variety-pack-chicken-lamb-and-mackerel-lamb']),
            ('9421038210819','multipack','cat','ZIWI Peak Wet Cat Food Variety Pack — Beef, Lamb & Venison','Beef / Lamb / Venison',['beef','lamb','venison'], '6 x 3 oz (85 g) cans',['https://www.torontopets.ca/products/ziwi-peak-wet-cat-food-variety-pack-beef-lamb-venison']),
            ('9421038210802','multipack','cat','ZIWI Peak Wet Cat Food Variety Pack — Chicken, Lamb & Venison','Chicken / Lamb / Venison',['chicken','lamb','venison'], '6 x 3 oz (85 g) cans',['https://www.torontopets.ca/products/ziwi-peak-wet-cat-food-variety-pack-chicken-lamb-venison']),
            ('9421038210840','multipack','dog','ZIWI Peak Wet Dog Food Variety Pack — Beef & Chicken','Beef / Chicken',['beef','chicken'], '6 x 6 oz (170 g) cans',['https://www.pacificpet.net/Home/ProductListing?FoodAccSpec=Food&ItemBrand=ZIWI&ItemGroup=Dog']),
            ('9421038210857','multipack','dog','ZIWI Peak Wet Dog Food Variety Pack — Beef & Lamb','Beef / Lamb',['beef','lamb'], '6 x 6 oz (170 g) cans',['https://www.pacificpet.net/Home/ProductListing?FoodAccSpec=Food&ItemBrand=ZIWI&ItemGroup=Dog']),
            ('9421038210864','multipack','dog','ZIWI Peak Wet Dog Food Variety Pack — All Flavors','Beef / Chicken / Lamb / Mackerel & Lamb / Tripe & Lamb / Venison',[], '6 x 6 oz (170 g) cans',['https://www.integrativeconnections.com/products/ziwi-peak-wet-dog-food-variety-pack-beef-chicken-lamb-mackerel-tripe-venison-6-pack-6oz-each-1','https://www.pacificpet.net/Home/ProductListing?FoodAccSpec=Food&ItemBrand=ZIWI&ItemGroup=Dog']),
            ('9421016594511','case','cat','ZIWI Peak Beef Recipe Wet Cat Food Case','Beef Recipe',['beef'], '24 x 3 oz (85 g) cans',['https://kornapet.com/products/ziwi-cat-beef-85g-cs24']),
            ('9421016594917','case','cat','ZIWI Peak Chicken Recipe Wet Cat Food Case','Chicken Recipe',['chicken'], '24 x 3 oz (85 g) cans',['https://www.petshopdirect.com.au/shop/item/ziwi-peak-cat-can-chicken-85g-x-24-case']),
            ('9421016594450','case','cat','ZIWI Peak Lamb Recipe Wet Cat Food Case','Lamb Recipe',['lamb'], '24 x 3 oz (85 g) cans',['https://www.luckypet.com.au/ziwi-peak-cat-can-85g-lamb']),
            ('9421016594337','case','cat','ZIWI Peak Mackerel & Lamb Recipe Wet Cat Food Case','Mackerel & Lamb Recipe',['mackerel','lamb'], '24 x 3 oz (85 g) cans',['https://www.luckypet.com.au/ziwi-peak-cat-can-85g-mackerel-lamb']),
            ('9421016595969','case','cat','ZIWI Peak Mackerel Recipe Wet Cat Food Case','Mackerel Recipe',['mackerel'], '24 x 3 oz (85 g) cans',['https://www.petshopdirect.com.au/shop/item/ziwi-peak-cat-can-mackerel-85g-x-24-case']),
            ('9421016594634','case','cat','ZIWI Peak Rabbit & Lamb Recipe Wet Cat Food Case','Rabbit & Lamb Recipe',['rabbit','lamb'], '24 x 3 oz (85 g) cans',['https://www.luckypet.com.au/ziwi-peak-cat-can-85g-rabbit-lamb']),
            ('9421016594573','case','cat','ZIWI Peak Venison Recipe Wet Cat Food Case','Venison Recipe',['venison'], '24 x 3 oz (85 g) cans',['https://www.luckypet.com.au/ziwi-peak-cat-can-85g-venison']),
            ('9421016594474','case','dog','ZIWI Peak Beef Recipe Wet Dog Food Case','Beef Recipe',['beef'], '12 x 13.75 oz (390 g) cans',['https://www.habitatpets.com.au/collections/puppy-food/products/zp-can-beef-390gx12','https://peto.com.au/ziwi-peak-wet-dog-food-beef/']),
            ('9421016594870','case','dog','ZIWI Peak Chicken Recipe Wet Dog Food Case','Chicken Recipe',['chicken'], '12 x 13.75 oz (390 g) cans',['https://peto.com.au/ziwi-peak-wet-dog-food-chicken/'])
          ]
          for upc,scope,species,name,variant,recipe,size,sources in package_rows:
              rows.append(row(upc,scope,species,'Original Canned Wet',name,variant,recipe,None,'wet',None,'plain','box',size,'',[],ga(),kcal(),'Retailer/distributor evidence proves the exact outer sellable package barcode and package count/recipe assortment. Formula fields are intentionally blank: this barcode belongs to an outer case or retail multipack, not to one contained can, so copying a contained unit formula into the outer-pack identity would violate the research contract.',sources,f'EAN-13 {upc} identifies the stated outer {scope} package. It must never be substituted for a contained individual-can UPC.',[],['GTIN-13 check digit validated independently.','Exact outer package count/recipe identity is supported by the cited retailer/distributor source.','research_status is candidate because source_verified is reserved for proven individual-unit barcodes; contained can UPCs remain separate records.'],'candidate'))

          assert len(rows)==20,len(rows)
          assert Counter(r['research_status'] for r in rows)==Counter({'candidate':16,'source_verified':2,'needs_physical_label':2})
          assert Counter(r['barcode_scope'] for r in rows)==Counter({'case':9,'multipack':7,'individual_unit':4})

          def valid_gtin(code):
              if len(code) not in (8,12,13,14) or not code.isdigit(): return False
              body=[int(x) for x in code[:-1]]
              total=sum(d*(3 if i%2==0 else 1) for i,d in enumerate(reversed(body)))
              return (10-total%10)%10==int(code[-1])

          allowed_scope={'individual_unit','multipack','case','tray','unknown'}
          allowed_status={'candidate','source_verified','needs_physical_label','rejected','promoted_to_seed'}
          allowed_species={'cat','dog'}
          allowed_form={'wet','dry','treat','supplement','unknown'}
          allowed_pkg={'can','pouch','tub','tray','bag','box','other'}
          required=['upc','canonical_gtin14','barcode_scope','brand','species','product_name','size','ingredients_verbatim','ingredients_ordered_normalized','guaranteed_analysis','calorie_content','source_urls','conflicts','verification_notes','research_status']
          for r in rows:
              assert all(k in r for k in required),r.get('upc')
              assert r['brand']==BRAND and r['species'] in allowed_species and r['food_form'] in allowed_form
              assert r['barcode_scope'] in allowed_scope and r['research_status'] in allowed_status and r['package_type'] in allowed_pkg
              assert valid_gtin(r['upc']),r['upc']
              assert r['canonical_gtin14']==r['upc'].zfill(14),r['upc']
              assert r['source_urls'] and isinstance(r['conflicts'],list) and isinstance(r['verification_notes'],list)
              if r['research_status']=='source_verified':
                  assert r['barcode_scope']=='individual_unit',r['upc']
                  assert r['ingredients_verbatim'].strip() and r['ingredients_ordered_normalized'],r['upc']
                  g=r['guaranteed_analysis']; c=r['calorie_content']
                  assert all(g[k] is not None for k in ('crude_protein_min_percent','crude_fat_min_percent','crude_fiber_max_percent','moisture_max_percent'))
                  assert c['kcal_per_kg'] is not None or c['kcal_per_unit'] is not None
              if r['research_status']=='needs_physical_label':
                  assert r['barcode_scope']=='individual_unit' and r['ingredients_verbatim'].strip(),r['upc']
              if r['barcode_scope'] in {'case','multipack'}:
                  assert r['research_status']=='candidate' and not r['ingredients_verbatim'] and not r['ingredients_ordered_normalized'],r['upc']

          target_path=Path('research/deep-research-ziwi-peak.json')
          target=json.loads(target_path.read_text(encoding='utf-8'))
          existing=target['records']; initial=len(existing)
          assert initial==136,initial
          old=[r['upc'] for r in existing]; new=[r['upc'] for r in rows]
          assert len(old)==len(set(old))
          assert len(new)==len(set(new))
          overlap=sorted(set(old)&set(new)); assert not overlap,overlap

          exclusion_paths=[Path('data/known-products.ts'),Path('data/known-formulas.ts'),Path('data/wrong-barcodes.ts'),Path('docs/CATALOG-CONFLICTS.md')]
          exclusion_paths += [p for p in Path('research').glob('deep-research-*.json') if p!=target_path]
          hits={}
          for p in exclusion_paths:
              if not p.exists(): continue
              text=p.read_text(encoding='utf-8',errors='replace')
              for r in rows:
                  if r['upc'] in text or r['canonical_gtin14'] in text:
                      hits.setdefault(r['upc'],[]).append(str(p))
          assert not hits,hits

          target['records'].extend(rows)
          target['updated_at']=ACCESSED
          final=[r['upc'] for r in target['records']]
          assert len(final)==156 and len(final)==len(set(final))
          target_path.write_text(json.dumps(target,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('VALIDATED exclusion_files=',len(exclusion_paths),'initial=',initial,'final=',len(final))
          print('STATUSES',dict(Counter(r['research_status'] for r in rows)))
          print('SCOPES',dict(Counter(r['barcode_scope'] for r in rows)))
          print('UPCS',','.join(new))
          PY
      - name: Commit ledger only
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/deep-research-ziwi-peak.json
          git commit -m "research: add second 20 ZIWI Peak barcode records"
          git push origin HEAD:agent/deep-research-ziwi-peak
      - name: Re-fetch remote ledger and verify exact committed state
        run: |
          git fetch origin agent/deep-research-ziwi-peak
          git show origin/agent/deep-research-ziwi-peak:research/deep-research-ziwi-peak.json > /tmp/remote-ziwi.json
          python - <<'PY'
          import json
          from collections import Counter
          expected={'9421016597024','9421016592678','9421016595877','9421016595839','9421038210833','9421038210826','9421038210819','9421038210802','9421038210840','9421038210857','9421038210864','9421016594511','9421016594917','9421016594450','9421016594337','9421016595969','9421016594634','9421016594573','9421016594474','9421016594870'}
          doc=json.load(open('/tmp/remote-ziwi.json',encoding='utf-8'))
          rows=doc['records']; assert len(rows)==156,len(rows)
          upcs=[r['upc'] for r in rows]; assert len(upcs)==len(set(upcs))
          batch=[r for r in rows if r['upc'] in expected]
          assert len(batch)==20 and {r['upc'] for r in batch}==expected
          assert Counter(r['research_status'] for r in batch)==Counter({'candidate':16,'source_verified':2,'needs_physical_label':2})
          assert Counter(r['barcode_scope'] for r in batch)==Counter({'case':9,'multipack':7,'individual_unit':4})
          print('REMOTE_REFETCH_OK total=156 batch=20 statuses='+str(dict(Counter(r['research_status'] for r in batch)))+' scopes='+str(dict(Counter(r['barcode_scope'] for r in batch))))
          PY
