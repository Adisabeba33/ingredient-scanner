name: Temporary Royal Canin dogs 101-110
on:
  push:
    branches: [agent/deep-research-barcode-ledger]
    paths: [.github/workflows/tmp-royal-canin-dogs-101-110.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: Build verified records, validate, append
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Adisabeba33"
          git config user.email "lezzgo2@gmail.com"
          git pull --rebase origin agent/deep-research-barcode-ledger
          test "$(git hash-object research/deep-research-royal-canin-dogs.json)" = "239da885af7dbee5254764a7b32f960330f9ffbb"
          python3 - <<'PY'
          import copy, json, pathlib
          TARGET=pathlib.Path('research/deep-research-royal-canin-dogs.json')
          PAN='https://www.pacificpet.net/Home/ProductListing?FoodAccSpec=FOOD&Itembrand=Royal+Canin&Itemgroup=Dog&Itemtype=Dry'
          doc=json.loads(TARGET.read_text(encoding='utf-8'))
          assert len(doc['records'])==100, f"expected 100 records, got {len(doc['records'])}"
          assert len({r['upc'] for r in doc['records']})==100
          assert len({r['canonical_gtin14'] for r in doc['records']})==100
          by_upc={r['upc']:r for r in doc['records']}
          def split_top(s):
              s=s.strip()
              if s.endswith('.'): s=s[:-1]
              out=[]; cur=[]; sq=0; par=0
              for ch in s:
                  if ch=='[': sq+=1
                  elif ch==']': sq-=1
                  elif ch=='(': par+=1
                  elif ch==')': par-=1
                  if ch==',' and sq==0 and par==0:
                      out.append(''.join(cur).strip()); cur=[]
                  else: cur.append(ch)
              if cur: out.append(''.join(cur).strip())
              assert sq==0 and par==0
              return out
          def verify_cd(u):
              assert len(u)==12 and u.isdigit()
              total=sum(int(u[i])*(3 if i%2==0 else 1) for i in range(11)); cd=(10-total%10)%10
              assert cd==int(u[-1]),(u,total,cd)
              return total,cd
          def clone_size(src_upc,new_upc,new_size,extra_urls=None,extra_conflicts=None,verify_text=None):
              r=copy.deepcopy(by_upc[src_upc])
              total,cd=verify_cd(new_upc)
              official=r['source_urls'][0]
              r['catalog_number']=None; r['upc']=new_upc; r['canonical_gtin14']='00'+new_upc; r['size']=new_size
              r['source_urls']=[official,PAN]+(extra_urls or [])
              r['source_accessed_at']='2026-08-26'
              r['formula_source']='Current Royal Canin USA product page is the formula master; Pan Pacific Pet is the exact individual-unit UPC/size source.'
              r['barcode_notes']=f'Pan Pacific Pet maps UPC {new_upc} to {r["variant"]}, {new_size}, as one retail bag.'
              r['conflicts']=(r.get('conflicts') or [])+(extra_conflicts or [])
              r['verification_notes']=[f'UPC-A check digit verified: weighted body sum {total} gives check digit {cd}.',f'Canonical GTIN-14 is zero-left-padded UPC-A 00{new_upc}.','No repository-wide UPC or GTIN match found before append.',f'This size uses the same current Royal Canin USA formula deck as already source-verified UPC {src_upc}; formula fields were cloned without modification.',verify_text or f'Pan Pacific Pet independently maps UPC {new_upc} to the exact {new_size} retail bag; current Royal Canin USA lists this package size.']
              r['research_status']='source_verified'
              return r
          batch=[]
          batch.append(clone_size('030111179302','030111517944','40 lb'))
          batch.append(clone_size('030111517470','030111174550','4 lb'))
          batch.append(clone_size('030111517470','030111517449','40 lb'))
          batch.append(clone_size('030111493880','030111448552','4 lb'))
          batch.append(clone_size('030111449283','030111449177','17 lb'))
          batch.append(clone_size('030111181305','030111418197','6 lb',extra_urls=['https://www.royalcanin.com/us/es-us/dogs/products/retail-products/cocker-spaniel-adult-3969'],extra_conflicts=['The current Royal Canin USA English page displays only the 25 lb option, while the current Spanish-localized Royal Canin USA page displays both 6 lb and 25 lb. Pan Pacific Pet independently maps UPC 030111418197 to the 6 lb individual bag; the formula panel agrees across the current US localizations.'],verify_text='Pan Pacific Pet maps UPC 030111418197 to the 6 lb retail bag, and the current Spanish-localized Royal Canin USA page independently lists 6 lb and 25 lb sizes.'))
          HARD=[
            {
              'upc':'030111512420','line':'Size Health Nutrition','name':'X-Small Aging 12+ Dry Dog Food','variant':'X-Small Aging 12+','recipe':['chicken'],'life':'senior','size':'2.5 lb','url':'https://www.royalcanin.com/us/dogs/products/retail-products/x-small-aging-12%2B-1005',
              'ingredients':'Brewers rice, chicken by-product meal, corn gluten meal, corn, chicken fat, brown rice, wheat gluten, natural flavors, dried chicory root, fish oil, vegetable oil, dried tomato pomace, psyllium seed husk, potassium chloride, calcium sulfate, L-arginine, L-tyrosine, calcium carbonate, fructooligosaccharides, sodium tripolyphosphate, vitamins [DL-alpha tocopherol acetate (source of vitamin E), niacin supplement, L-ascorbyl-2-polyphosphate (source of vitamin C), D-calcium pantothenate, biotin, pyridoxine hydrochloride (vitamin B6), riboflavin supplement, thiamine mononitrate (vitamin B1), vitamin A acetate, folic acid, vitamin B12 supplement, vitamin D3 supplement], L-lysine, taurine, choline chloride, DL-methionine, hydrolyzed yeast, L-tryptophan, magnesium oxide, L-carnitine, trace minerals [zinc proteinate, zinc oxide, ferrous sulfate, manganese proteinate, manganous oxide, copper sulfate, calcium iodate, sodium selenite, copper proteinate], GLA safflower oil, marigold extract (Tagetes erecta L.), green tea extract, rosemary extract, preserved with mixed tocopherols and citric acid.',
              'ga':(22,14,3.6,10,None,[('Eicosapentaenoic Acid (EPA)','min',0.19,'percent'),('Docosahexaenoic Acid (DHA)','min',0.08,'percent')]),'cal':(3768,343),'adequacy':'AAFCO maintenance.','conflicts':[]
            },
            {
              'upc':'030111510457','line':'Breed Health Nutrition','name':'Miniature Schnauzer Puppy Dry Dog Food','variant':'Miniature Schnauzer Puppy','recipe':['chicken'],'life':'puppy','size':'2.5 lb','url':'https://www.royalcanin.com/us/dogs/products/retail-products/schnauzer-puppy-4131',
              'ingredients':'Chicken by-product meal, brewers rice, brown rice, wheat, wheat gluten, chicken fat, corn, dried plain beet pulp, natural flavors, corn protein meal, fish oil, monocalcium phosphate, vegetable oil, sodium aluminosilicate, calcium carbonate, pea fiber, powdered psyllium seed husk, potassium chloride, vitamins [DL-alpha tocopherol acetate (source of vitamin E), L-ascorbyl-2-polyphosphate (source of vitamin C), niacin supplement, D-calcium pantothenate, biotin, pyridoxine hydrochloride (vitamin B6), riboflavin supplement, thiamine mononitrate (vitamin B1), vitamin A acetate, vitamin B12 supplement, folic acid, vitamin D3 supplement], fructooligosaccharides, sodium tripolyphosphate, yeast extract, salt, L-lysine, DL-methionine, rosemary extract, preserved with mixed tocopherols and citric acid, choline chloride, L-tyrosine, taurine, trace minerals [zinc proteinate, manganese proteinate, zinc oxide, ferrous sulfate, manganous oxide, copper sulfate, sodium selenite, calcium iodate, copper proteinate], marigold extract (Tagetes erecta L.), Yucca schidigera extract, L-carnitine, carotene.',
              'ga':(28,12,3.9,10.5,None,[('Crude Fat','max',16,'percent'),('Vitamin E','min',420,'IU/kg'),('Ascorbic acid (mg/kg)','min',320,'other'),('L-carnitine (mg/kg)','min',35,'other')]),'cal':(3553,341),'adequacy':'AAFCO growth, including growth of large-size dogs.','conflicts':[]
            },
            {
              'upc':'030111416872','line':'Breed Health Nutrition','name':'Golden Retriever Adult Dry Dog Food','variant':'Golden Retriever Adult','recipe':['chicken'],'life':'adult','size':'17 lb','url':'https://www.royalcanin.com/us/dogs/products/retail-products/golden-retriever-adult-3970',
              'ingredients':'Corn, chicken by-product meal, wheat, oat groats, brewers rice, corn protein meal, chicken fat, natural flavors (ONLY FOR MEXICO: including poultry, cow milk), pea fiber, dried plain beet pulp, wheat gluten, fish oil, vegetable oil, sodium aluminosilicate, salt, calcium carbonate, potassium chloride, monocalcium phosphate, powdered psyllium seed husk, vitamins [DL-alpha tocopherol acetate (source of vitamin E), L-ascorbyl-2-polyphosphate (source of vitamin C), niacin supplement, D-calcium pantothenate, biotin, pyridoxine hydrochloride (vitamin B6), riboflavin supplement, thiamine mononitrate (vitamin B1), vitamin A acetate, vitamin B12 supplement, folic acid, vitamin D3 supplement], fructooligosaccharides, L-lysine, choline chloride, L-carnitine, rosemary extract, preserved with mixed tocopherols and citric acid, taurine, DL-methionine, glucosamine hydrochloride, trace minerals [zinc proteinate, zinc oxide, manganese proteinate, ferrous sulfate, manganous oxide, copper sulfate, sodium selenite, calcium iodate, copper proteinate], marigold extract (Tagetes erecta L.), magnesium oxide, chondroitin sulfate.',
              'ga':(23,11,4.8,10.5,0.13,[('Eicosapentaenoic + Docosahexaenoic acid (EPA + DHA)','min',0.2,'percent'),('Glucosamine (mg/kg)','min',976,'other'),('Chondroitin sulfate (mg/kg)','min',4,'other')]),'cal':(3513,278),'adequacy':'AAFCO maintenance.','conflicts':['The Spanish-localized Royal Canin USA page exposes a materially different Golden Retriever Adult panel (including 5.7% max fiber, 10.0% max moisture, separate EPA/DHA values, 0.20% taurine, and 3489/276 kcal). The current English Royal Canin USA page is the stored formula master; localization/formula generations were not combined.'],'extra_urls':['https://www.royalcanin.com/us/es-us/dogs/products/retail-products/golden-retriever-adult-3970']
            },
            {
              'upc':'030111177315','line':'Size Health Nutrition','name':'Medium Adult 7+ Dry Dog Food','variant':'Medium Adult 7+','recipe':['chicken'],'life':'senior','size':'30 lb','url':'https://www.royalcanin.com/us/dogs/products/retail-products/medium-adult-7-3005',
              'ingredients':'Brewers rice, chicken by-product meal, wheat, corn protein meal, chicken fat, natural flavors (ONLY FOR MEXICO: including poultry, cow milk, pork), oat groats, dried plain beet pulp, wheat gluten, fish oil, calcium carbonate, potassium chloride, powdered psyllium seed husk, vegetable oil, fructooligosaccharides, sodium tripolyphosphate, monocalcium phosphate, choline chloride, vitamins [DL-alpha tocopherol acetate (source of vitamin E), L-ascorbyl-2-polyphosphate (source of vitamin C), biotin, D-calcium pantothenate, pyridoxine hydrochloride (vitamin B6), vitamin A acetate, riboflavin supplement, niacin supplement, folic acid, vitamin B12 supplement, thiamine mononitrate (vitamin B1), vitamin D3 supplement], L-lysine, salt, rosemary extract, preserved with mixed tocopherols and citric acid, hydrolyzed yeast, taurine, trace minerals [zinc proteinate, zinc oxide, manganese proteinate, ferrous sulfate, manganous oxide, copper sulfate, sodium selenite, calcium iodate, copper proteinate], L-tyrosine, GLA safflower oil, magnesium oxide, L-carnitine, green tea extract, marigold extract (Tagetes erecta L.).',
              'ga':(23,12,3.7,10.5,None,[('Vitamin E','min',350,'IU/kg'),('Ascorbic acid (mg/kg)','min',240,'other')]),'cal':(3658,315),'adequacy':'AAFCO maintenance.','conflicts':[]
            }
          ]
          for f in HARD:
              u=f['upc']; total,cd=verify_cd(u); cp,fat,fiber,moist,taur,others=f['ga']
              ga={'crude_protein_min_percent':cp,'crude_fat_min_percent':fat,'crude_fiber_max_percent':fiber,'moisture_max_percent':moist,'ash_max_percent':None,'taurine_min_percent':taur,'other_printed_guarantees':[{'nutrient':n,'basis':b,'value':v,'unit':unit} for n,b,v,unit in others]}
              urls=[f['url'],PAN]+f.get('extra_urls',[])
              rec={'catalog_number':None,'upc':u,'canonical_gtin14':'00'+u,'barcode_scope':'individual_unit','brand':'Royal Canin','manufacturer':'Royal Canin USA, Inc.','species':'dog','product_line':f['line'],'product_name':f['name'],'variant':f['variant'],'recipe':f['recipe'],'life_stage':f['life'],'food_form':'dry','texture':'kibble','presentation':'plain','package_type':'bag','size':f['size'],'ingredients_verbatim':f['ingredients'],'ingredients_ordered_normalized':split_top(f['ingredients']),'guaranteed_analysis':ga,'calorie_content':{'kcal_per_kg':f['cal'][0],'kcal_per_unit':f['cal'][1],'unit_name':'cup'},'label_deck_code':None,'formula_source':'Current Royal Canin USA English product page is the formula master; Pan Pacific Pet is the exact individual-unit UPC/size source.','source_urls':urls,'source_accessed_at':'2026-08-26','barcode_notes':f'Pan Pacific Pet maps UPC {u} to {f["variant"]}, {f["size"]}, as one retail bag; current Royal Canin USA confirms the package size.','conflicts':f['conflicts'],'verification_notes':[f'UPC-A check digit verified: weighted body sum {total} gives check digit {cd}.',f'Canonical GTIN-14 is zero-left-padded UPC-A 00{u}.','No repository-wide UPC or GTIN match found before append.','Current Royal Canin USA English product page is the formula master for ingredient order, guaranteed analysis, calories, and nutritional adequacy.',f['adequacy']],'research_status':'source_verified'}
              batch.append(rec)
          expected={'030111517944','030111174550','030111517449','030111448552','030111449177','030111512420','030111510457','030111416872','030111418197','030111177315'}
          assert len(batch)==10 and {r['upc'] for r in batch}==expected
          assert not expected & set(by_upc)
          new_gtins={r['canonical_gtin14'] for r in batch}
          paths=[pathlib.Path('data/known-products.ts'),pathlib.Path('data/known-formulas.ts'),pathlib.Path('data/wrong-barcodes.ts'),pathlib.Path('docs/CATALOG-CONFLICTS.md')]
          paths+=sorted(pathlib.Path('research').glob('deep-research-*.json'))
          for p in paths:
              if p==TARGET: continue
              body=p.read_text(encoding='utf-8')
              for code in expected|new_gtins:
                  assert code not in body,f'global collision {code} in {p}'
          for r in batch:
              verify_cd(r['upc']); assert r['canonical_gtin14']=='00'+r['upc']
              assert r['catalog_number'] is None and r['barcode_scope']=='individual_unit'
              assert r['brand']=='Royal Canin' and r['manufacturer']=='Royal Canin USA, Inc.' and r['species']=='dog'
              assert r['life_stage'] in {'adult','puppy','senior'} and r['food_form']=='dry' and r['texture']=='kibble' and r['presentation']=='plain' and r['package_type']=='bag'
              assert r['research_status']=='source_verified'
              assert r['ingredients_verbatim'] and r['ingredients_ordered_normalized']==split_top(r['ingredients_verbatim'])
              assert '�' not in json.dumps(r,ensure_ascii=False)
              ga=r['guaranteed_analysis']; assert all(ga[k] is not None for k in ('crude_protein_min_percent','crude_fat_min_percent','crude_fiber_max_percent','moisture_max_percent'))
              cal=r['calorie_content']; assert cal['kcal_per_kg'] is not None and cal['kcal_per_unit'] is not None and cal['unit_name']=='cup'
              assert len(r['source_urls'])>=2 and all(x.startswith('http') for x in r['source_urls'])
              assert isinstance(r['conflicts'],list) and isinstance(r['verification_notes'],list) and r['verification_notes']
          doc['records'].extend(batch); doc['updated_at']='2026-08-26'
          assert len(doc['records'])==110
          assert len({r['upc'] for r in doc['records']})==110
          assert len({r['canonical_gtin14'] for r in doc['records']})==110
          TARGET.write_text(json.dumps(doc,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          check=json.loads(TARGET.read_text(encoding='utf-8'))
          assert len(check['records'])==110 and all(sum(1 for r in check['records'] if r['upc']==u)==1 for u in expected)
          print('validated 100->110',sorted(expected))
          PY
          git rm .github/workflows/tmp-royal-canin-dogs-101-110.yml
          git add research/deep-research-royal-canin-dogs.json
          git diff --cached --check
          git commit -m "research: add Royal Canin dogs records 101-110"
          git fetch origin agent/deep-research-barcode-ledger
          remote_blob="$(git ls-tree origin/agent/deep-research-barcode-ledger research/deep-research-royal-canin-dogs.json | awk '{print $3}')"
          test "$remote_blob" = "239da885af7dbee5254764a7b32f960330f9ffbb"
          git pull --rebase origin agent/deep-research-barcode-ledger
          git push origin HEAD:agent/deep-research-barcode-ledger
