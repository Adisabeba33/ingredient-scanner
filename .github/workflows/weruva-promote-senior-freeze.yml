name: Promote Weruva Senior and Freeze

on:
  push:
    branches:
      - agent/deep-research-weruva
    paths:
      - .github/workflows/weruva-promote-senior-freeze.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-weruva
          fetch-depth: 0
      - name: Validate and append Senior and Freeze records
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          TARGET=Path('research/deep-research-weruva.json')
          INDEX=Path('research/WERUVA-POST-30-INDEX.md')
          HANDOFF=Path('research/WERUVA-HANDOFF.md')
          RUNNER=Path('.github/workflows/weruva-promote-senior-freeze.yml')
          ACC='2026-08-29'
          ADMC='https://www.admc.us/wp-content/uploads/2022/02/2024-North-Complete-Price-List_5.12.25.pdf'

          senior={
          'hyd':dict(name='Senior Chicken Formula in a Hydrating Purée',variant='Chicken Formula in a Hydrating Purée',recipe=['chicken','pumpkin'],ing='Chicken, Chicken Broth, Pumpkin, Yeast Extract, Calcium Lactate, Locust Bean Gum, Potato Starch, Xanthan Gum, Agar, Fish Oil, Inulin, Tricalcium Phosphate, Choline Chloride, Green-Lipped Mussel Powder, Taurine, Potassium Chloride, Salt, Zinc Amino Acid Complex, Vitamin E Supplement, Niacin, Ferrous Sulfate, Manganese Amino Acid Complex, Thiamine Mononitrate, Calcium Pantothenate, Vitamin A Supplement, Sodium Selenite, Pyridoxine Hydrochloride, Copper Sulfate, Vitamin D3 Supplement, Riboflavin Supplement, Folic Acid, Potassium Iodide, Biotin, Vitamin B12 Supplement.',ga=(9,2.5,1,85,1.5),kg=795,url='https://www.weruva.com/products/senior-cat-chicken-pate-can',presentation='plain'),
          'cg':dict(name='Senior Chicken Formula in Gravy',variant='Chicken Formula in Gravy',recipe=['chicken','pumpkin'],ing='Chicken, Chicken Broth, Pumpkin, Sunflower Seed Oil, Potato Starch, Yeast Extract, Calcium Lactate, Xanthan Gum, Tricalcium Phosphate, Fish Oil, Inulin, Choline Chloride, Green-Lipped Mussel Powder, Taurine, Potassium Chloride, Zinc Amino Acid Complex, Vitamin E Supplement, Magnesium Sulfate, Niacin, Ferrous Sulfate, Manganese Amino Acid Complex, Thiamine Mononitrate, Calcium Pantothenate, Sodium Selenite, Vitamin A Supplement, Pyridoxine Hydrochloride, Copper Sulfate, Vitamin D3 Supplement, Riboflavin Supplement, Folic Acid, Potassium Iodide, Biotin, Vitamin B12 Supplement.',ga=(9,1.5,1,84,1.5),kg=789,url='https://www.weruva.com/collections/find-your-food/products/senior-cat-chicken-gravy-can',presentation='in_gravy'),
          'ct':dict(name='Senior Chicken & Tuna Formula in Gravy',variant='Chicken & Tuna Formula in Gravy',recipe=['chicken','tuna','pumpkin'],ing='Chicken Broth, Chicken, Tuna, Pumpkin, Potato Starch, Yeast Extract, Calcium Lactate, Guar Gum, Fish Oil, Inulin, Tricalcium Phosphate, Choline Chloride, Green-Lipped Mussel Powder, Taurine, Zinc Amino Acid Complex, Potassium Chloride, Vitamin E Supplement, Niacin, Ferrous Sulfate, Manganese Amino Acid Complex, Thiamine Mononitrate, Calcium Pantothenate, Vitamin A Supplement, Pyridoxine Hydrochloride, Copper Sulfate, Vitamin D3 Supplement, Riboflavin Supplement, Folic Acid, Menadione Sodium Bisulfite Complex (Source Of Vitamin K), Potassium Iodide, Biotin, Vitamin B12 Supplement.',ga=(9,2.5,1,83,2),kg=860,url='https://www.weruva.com/products/senior-cat-chicken-tuna-gravy-can',presentation='in_gravy'),
          'ts':dict(name='Senior Tuna & Salmon Formula in Gravy',variant='Tuna & Salmon Formula in Gravy',recipe=['tuna','pumpkin','salmon'],ing='Fish Broth, Tuna, Pumpkin, Salmon, Tapioca Starch, Sunflower Seed Oil, Calcium Lactate, Yeast Extract, Guar Gum, Tricalcium Phosphate, Fish Oil, Inulin, Choline Chloride, Green-Lipped Mussel Powder, Taurine, Zinc Amino Acid Complex, Potassium Chloride, Vitamin E Supplement, Niacin, Manganese Amino Acid Complex, Calcium Pantothenate, Thiamine Mononitrate, Pyridoxine Hydrochloride, Vitamin A Supplement, Riboflavin Supplement, Vitamin D3 Supplement, Folic Acid, Menadione Sodium Bisulfite Complex (Source Of Vitamin K), Potassium Iodide, Biotin, Vitamin B12 Supplement.',ga=(9,2.5,1,83,2),kg=836,url='https://www.weruva.com/products/senior-cat-tuna-salmon-gravy-can',presentation='in_gravy')}
          units=[('810028246317','hyd','3 oz',68),('810028246430','hyd','5.5 oz',124),('810028246324','cg','3 oz',67),('810028246447','cg','5.5 oz',123),('810028246348','ct','3 oz',73),('810028246461','ct','5.5 oz',134),('810028246331','ts','3 oz',71),('810028246454','ts','5.5 oz',130)]

          freeze={
          'plc':dict(name="Weruva Freeze Dried Paw Lickin' Chicken",variant="Paw Lickin' Chicken",recipe=['chicken'],ing='Chicken, Chicken Fat (Preserved With Mixed Tocopherols), Tapioca Starch, Tricalcium Phosphate, Calcium Lactate, Mixed Tocopherols (Preservatives), Salt, Choline Chloride, Fenugreek, Taurine, Zinc Sulfate, Vitamin E Supplement, Ferrous Sulfate, Thiamine Mononitrate (Vitamin B1), Niacin Supplement (Vitamin B3), Calcium Pantothenate, Vitamin A Supplement, Manganese Sulfate, Copper Sulfate, Riboflavin Supplement (Vitamin B2), Pyridoxine Hydrochloride (Vitamin B6), Folic Acid, Vitamin B12 Supplement, Vitamin D3 Supplement, Potassium Iodide.',ga=(66,11,1,8),kg=3902,url='https://www.weruva.com/collections/weruva-freeze-dried/products/paw-lickin-chicken-freeze-dried-cat',life='adult',other=[]),
          'wx':dict(name='Weruva Wx Phos Focused Chicken Breast & Tilapia Formula Freeze Dried',variant='Chicken Breast & Tilapia Formula',recipe=['chicken','tilapia','egg'],ing='Chicken, Tilapia, Egg White, Chicken Fat (Preserved With Mixed Tocopherols), Fish Oil, Natural Flavor, Egg Shell Meal, Mixed Tocopherols (Preservatives), Choline Chloride, Taurine, Zinc Sulfate, Vitamin E Supplement, Ferrous Sulfate, Thiamine Mononitrate (Vitamin B1), Niacin Supplement (Vitamin B3), Calcium Pantothenate, Vitamin A Supplement, Manganese Sulfate, Copper Sulfate, Riboflavin Supplement (Vitamin B2), Pyridoxine Hydrochloride (Vitamin B6), Folic Acid, Vitamin B12 Supplement, Vitamin D3 Supplement, Menadione Sodium Bisulfite Complex (Source Of Vitamin K), Potassium Iodide.',ga=(60,19,1,8),kg=4267,url='https://www.weruva.com/products/chicken-tilapia-freeze-dried-cat',life=None,other=[{'nutrient':'Omega-3 Fatty Acids','basis':'min','value':1,'unit':'percent'},{'nutrient':'Omega-6 Fatty Acids','basis':'min','value':3,'unit':'percent'}])}
          funits=[('810028242944','plc','1 oz',111),('810028242951','plc','7 oz',None),('810028244535','wx','1 oz',121),('810028244559','wx','7 oz',None)]
          multipacks=['810028246782','810028246805','810028246799','810028246874','810028246881','810028246898']
          candidate=[x[0] for x in units+funits]

          def upc_ok(c):
              return len(c)==12 and c.isdigit() and (10-sum(int(c[i])*(3 if i%2==0 else 1) for i in range(11))%10)%10==int(c[-1])
          if len(set(candidate))!=12 or not all(upc_ok(c) for c in candidate): raise SystemExit('candidate UPC validation failure')
          if not all(upc_ok(c) for c in multipacks): raise SystemExit('multipack UPC validation failure')

          excludes=[Path('data/known-products.ts'),Path('data/known-formulas.ts'),Path('data/wrong-barcodes.ts'),Path('docs/CATALOG-CONFLICTS.md')]
          excludes += [p for p in Path('research').glob('deep-research-*.json') if p!=TARGET]
          hits=[]
          for p in excludes:
              t=p.read_text(encoding='utf-8')
              for c in candidate:
                  if c in t:hits.append((c,str(p)))
          if hits:raise SystemExit('fresh exclusion collisions: '+repr(hits))

          ledger=json.loads(TARGET.read_text(encoding='utf-8'))
          recs=ledger['records']
          if len(recs)!=68:raise SystemExit(f'expected 68 canonical records, got {len(recs)}')
          existing={r['upc'] for r in recs}
          if existing.intersection(candidate):raise SystemExit('candidate already in canonical ledger')

          new=[]
          for upc,key,size,kcal in units:
              f=senior[key];p,fa,fi,m,a=f['ga']
              conflicts=[]
              if key=='ts':conflicts=['An older 2025 Weruva/Sunburst Senior sheet carries the prior Tuna & Salmon formula generation and older calories (881 kcal/kg, 76 kcal/3 oz, 137 kcal/5.5 oz). Current Weruva manufacturer evidence carries 836 kcal/kg, 71 kcal/3 oz and 130 kcal/5.5 oz; the current generation is stored without mixing panels.']
              new.append({'catalog_number':None,'upc':upc,'canonical_gtin14':upc.zfill(14),'barcode_scope':'individual_unit','brand':'Weruva','manufacturer':'Weruva','species':'cat','product_line':'Senior','product_name':'Weruva '+f['name'],'variant':f['variant'],'recipe':f['recipe'],'life_stage':'senior','food_form':'wet','texture':'pate' if key=='hyd' else None,'presentation':f['presentation'],'package_type':'can','size':size,'ingredients_verbatim':f['ing'],'ingredients_ordered_normalized':[x.strip() for x in f['ing'].split(',')],'guaranteed_analysis':{'crude_protein_min_percent':p,'crude_fat_min_percent':fa,'crude_fiber_max_percent':fi,'moisture_max_percent':m,'ash_max_percent':a,'taurine_min_percent':None,'other_printed_guarantees':[]},'calorie_content':{'kcal_per_kg':f['kg'],'kcal_per_unit':kcal,'unit_name':'can'},'label_deck_code':None,'formula_source':'Current Weruva Senior manufacturer product page for current ingredient order, displayed guaranteed analysis, printed calories and explicit Senior lifestage; distributor evidence used for exact UPC/size identity.','source_urls':[f['url'],ADMC],'source_accessed_at':ACC,'barcode_notes':f'Exact individual-unit UPC/size mapping corroborated independently; UPC-A {upc} passes its check digit and canonical GTIN-14 is {upc.zfill(14)}.','conflicts':conflicts,'verification_notes':['Fresh repository exclusion scan covered production seed sources, wrong-barcodes, CATALOG-CONFLICTS and every other research ledger; no collision was found.','Current Weruva page explicitly prints Lifestage: Senior.','Current manufacturer formula generation is stored; older formula-generation evidence is not merged into the current panel.'],'research_status':'source_verified'})
          for upc,key,size,kcal in funits:
              f=freeze[key];p,fa,fi,m=f['ga']
              notes=['Fresh repository exclusion scan covered production seed sources, wrong-barcodes, CATALOG-CONFLICTS and every other research ledger; no collision was found.','UPC-A check digit and canonical GTIN-14 verified.','No kcal-per-7-oz value was calculated: when the manufacturer does not print a bag-total calorie value, kcal_per_unit remains null.']
              if key=='wx':notes.append('Manufacturer prints Lifestage: Adult, Senior and Supplemental Feeding. The scalar schema cannot represent both honestly, so life_stage is null and the dual printed claim is preserved here.')
              new.append({'catalog_number':None,'upc':upc,'canonical_gtin14':upc.zfill(14),'barcode_scope':'individual_unit','brand':'Weruva','manufacturer':'Weruva','species':'cat','product_line':'Freeze Dried' if key=='plc' else 'Wx','product_name':f['name'],'variant':f['variant'],'recipe':f['recipe'],'life_stage':f['life'],'food_form':'treat' if key=='wx' else 'wet','texture':None,'presentation':'plain','package_type':'bag','size':size,'ingredients_verbatim':f['ing'],'ingredients_ordered_normalized':[x.strip() for x in f['ing'].split(',')],'guaranteed_analysis':{'crude_protein_min_percent':p,'crude_fat_min_percent':fa,'crude_fiber_max_percent':fi,'moisture_max_percent':m,'ash_max_percent':None,'taurine_min_percent':None,'other_printed_guarantees':f['other']},'calorie_content':{'kcal_per_kg':f['kg'],'kcal_per_unit':kcal,'unit_name':'other' if kcal is not None else None},'label_deck_code':None,'formula_source':'Current Weruva manufacturer Freeze Dried product page for exact current formula, displayed guarantees, printed calorie bases and lifestage/feeding claim; exact UPC/size corroborated independently.','source_urls':[f['url'],ADMC],'source_accessed_at':ACC,'barcode_notes':f'Exact individual-unit UPC/size mapping verified; UPC-A {upc} passes its check digit and canonical GTIN-14 is {upc.zfill(14)}.','conflicts':[],'verification_notes':notes,'research_status':'source_verified'})

          required={'catalog_number','upc','canonical_gtin14','barcode_scope','brand','manufacturer','species','product_line','product_name','variant','recipe','life_stage','food_form','texture','presentation','package_type','size','ingredients_verbatim','ingredients_ordered_normalized','guaranteed_analysis','calorie_content','label_deck_code','formula_source','source_urls','source_accessed_at','barcode_notes','conflicts','verification_notes','research_status'}
          for r in new:
              if set(r)!=required:raise SystemExit(f"{r['upc']}: schema keys mismatch")
          recs.extend(new)
          if len(recs)!=80 or len({r['upc'] for r in recs})!=80 or len({r['canonical_gtin14'] for r in recs})!=80:raise SystemExit('post-append count/uniqueness failure')
          ledger['updated_at']=ACC;ledger['records']=recs
          TARGET.write_text(json.dumps(ledger,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          check=json.loads(TARGET.read_text(encoding='utf-8'))
          if [r['upc'] for r in check['records'][-12:]]!=candidate:raise SystemExit('post-write tail validation failure')

          idx=INDEX.read_text(encoding='utf-8')
          idx=idx.replace('Canonical strict ledger currently contains **68** complete schema-v2 records: the original 30, 20 promoted TruLuxe records, and 18 promoted Cat Stew records.','Canonical strict ledger currently contains **80** complete schema-v2 records: the original 30, 20 promoted TruLuxe, 18 Cat Stew, 8 Senior, and 4 Freeze Dried records.')
          pat=r'## Senior / Freeze Dried / Puddy Pops / Wx treats — awaiting strict promotion\n.*?(?=\n## Kitten / Wx / Freeze Dried / Cat Paté)'
          repl='''## Senior / Freeze Dried / Puddy Pops / Wx treats — consumed\n\nPromoted to strict ledger: **8 Senior individual units + 4 Freeze Dried individual units**.\n\nThe six retail five-pack UPCs below are **non-promotable as individual sticks** because the barcode identifies the outer five-pack and no separate individual-stick barcode is proven:\n\n- `810028246782` — retail UPC identifies five-pack; no proven individual-stick barcode\n- `810028246805` — retail UPC identifies five-pack; no proven individual-stick barcode\n- `810028246799` — retail UPC identifies five-pack; no proven individual-stick barcode\n- `810028246874` — retail UPC identifies five-pack; no proven individual-stick barcode\n- `810028246881` — retail UPC identifies five-pack; no proven individual-stick barcode\n- `810028246898` — retail UPC identifies five-pack; no proven individual-stick barcode\n'''
          idx2,n=re.subn(pat,repl,idx,flags=re.S)
          if n!=1:raise SystemExit(f'index section replacement count {n}')
          INDEX.write_text(idx2,encoding='utf-8')

          h=HANDOFF.read_text(encoding='utf-8')
          h=h.replace('As of 2026-08-29 the strict ledger contains **68 complete schema-v2 records**:','As of 2026-08-29 the strict ledger contains **80 complete schema-v2 records**:')
          h += '\n\n## 2026-08-29 Senior / Freeze Dried strict promotion\n\nPromoted **12** additional individual-unit records: 8 Senior and 4 Freeze Dried. Canonical Weruva strict count: **80**. The six Puddy Pops/Wx lickable UPCs in this block are explicitly consumed as non-promotable individual-stick candidates because each identifies a five-pack and no separate stick barcode is proven.\n'
          HANDOFF.write_text(h,encoding='utf-8')
          RUNNER.unlink()
          print('PROMOTED 12; CANONICAL TOTAL 80; SIX MULTIPACK ROWS DISPOSITIONED')
          PY
      - name: Commit canonical promotion
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/deep-research-weruva.json research/WERUVA-POST-30-INDEX.md research/WERUVA-HANDOFF.md .github/workflows/weruva-promote-senior-freeze.yml
          git commit -m "research: promote 12 Weruva Senior and Freeze records"
          git push origin HEAD:agent/deep-research-weruva
