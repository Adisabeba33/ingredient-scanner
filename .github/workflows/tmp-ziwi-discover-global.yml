name: Inspect global ZIWI variant barcodes

on:
  push:
    branches: [agent/deep-research-ziwi-peak]
    paths: [.github/workflows/tmp-ziwi-discover-global.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-ziwi-peak
          fetch-depth: 0
      - name: Enumerate global Shopify variants and subtract repository exclusions
        run: |
          python - <<'PY'
          import json,re,urllib.request
          from pathlib import Path
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          paths=[Path('data/known-products.ts'),Path('data/known-formulas.ts'),Path('data/wrong-barcodes.ts'),Path('docs/CATALOG-CONFLICTS.md')]+list(Path('research').glob('deep-research-*.json'))
          txt='\n'.join(p.read_text(encoding='utf-8',errors='replace') for p in paths if p.exists())
          existing=set(re.findall(r'(?<!\d)(?:\d{8}|\d{12,14})(?!\d)',txt)); canon={x.zfill(14) for x in existing}
          products=[]
          for page in range(1,11):
            d=get(f'https://ziwipets.com/products.json?limit=250&page={page}')
            ps=d.get('products',[])
            if not ps:break
            products+=ps
            if len(ps)<250:break
          print('GLOBAL_PRODUCTS',len(products))
          out=[]
          for p in products:
            for v in p.get('variants',[]):
              bc=str(v.get('barcode') or '').strip()
              if not bc.isdigit() or bc in existing or bc.zfill(14) in canon:continue
              out.append({'barcode':bc,'product':p.get('title'),'handle':p.get('handle'),'variant':v.get('title'),'sku':v.get('sku'),'grams':v.get('grams'),'available':v.get('available'),'url':'https://ziwipets.com/products/'+p.get('handle'),'js':'https://ziwipets.com/products/'+p.get('handle')+'.js'})
          seen=set(); uniq=[]
          for x in out:
            if x['barcode'] in seen:continue
            seen.add(x['barcode']);uniq.append(x)
          print('NEW_GLOBAL_VARIANTS',len(uniq))
          for x in sorted(uniq,key=lambda z:(z['product'] or '',z['variant'] or '',z['barcode'])):print(json.dumps(x,ensure_ascii=False,sort_keys=True))
          PY
