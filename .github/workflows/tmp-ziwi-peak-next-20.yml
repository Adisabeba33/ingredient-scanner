name: Merge ZIWI Peak next 20 research records

on:
  push:
    branches:
      - agent/deep-research-ziwi-peak
    paths:
      - .github/workflows/tmp-ziwi-peak-next-20.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-ziwi-peak
          fetch-depth: 0

      - name: Build, validate, and append ZIWI batch
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          ACCESSED = "2026-08-28"
          BRAND = "ZIWI Peak"
          MAKER = "ZIWI Ltd."

          def analysis(protein=None, fat=None, fiber=None, moisture=None, ash=None, taurine=None, extras=None):
              return {
                  "crude_protein_min_percent": protein,
                  "crude_fat_min_percent": fat,
                  "crude_fiber_max_percent": fiber,
                  "moisture_max_percent": moisture,
                  "ash_max_percent": ash,
                  "taurine_min_percent": taurine,
                  "other_printed_guarantees": extras or [],
              }

          def calories(kg=None, unit=None, unit_name=None):
              return {"kcal_per_kg": kg, "kcal_per_unit": unit, "unit_name": unit_name}

          def extra(nutrient, basis, value, unit):
              return {"nutrient": nutrient, "basis": basis, "value": value, "unit": unit}

          def row(upc, species, line, name, variant, recipe, life_stage, food_form, texture,
                  presentation, package_type, size, ingredients, normalized, ga, kcal,
                  source_urls, formula_source, status, barcode_notes, conflicts=None,
                  verification_notes=None, label_deck_code=None):
              return {
                  "catalog_number": None,
                  "upc": upc,
                  "canonical_gtin14": upc.zfill(14),
                  "barcode_scope": "individual_unit",
                  "brand": BRAND,
                  "manufacturer": MAKER,
                  "species": species,
                  "product_line": line,
                  "product_name": name,
                  "variant": variant,
                  "recipe": recipe,
                  "life_stage": life_stage,
                  "food_form": food_form,
                  "texture": texture,
                  "presentation": presentation,
                  "package_type": package_type,
                  "size": size,
                  "ingredients_verbatim": ingredients,
                  "ingredients_ordered_normalized": normalized,
                  "guaranteed_analysis": ga,
                  "calorie_content": kcal,
                  "label_deck_code": label_deck_code,
                  "formula_source": formula_source,
                  "source_urls": source_urls,
                  "source_accessed_at": ACCESSED,
                  "barcode_notes": barcode_notes,
                  "conflicts": conflicts or [],
                  "verification_notes": verification_notes or [],
                  "research_status": status,
              }

          rows = []

          # ---- 8 first-party SuperZoo 2026 barcode leads. ----
          # ZIWI itself proves exact SKU/size/barcode identity, but a complete current
          # label deck (ingredients + full GA + calories) has not yet been published.
          launch = [
              ("9421038211250", "dog", "Air-Dried Puppy", "ZIWI Peak Air-Dried Chicken & Lamb Recipe for Puppies", "Chicken & Lamb Recipe", ["chicken", "lamb"], "puppy", "dry", "air_dried", "bag", "14 oz"),
              ("9421038211243", "cat", "Steam & Dried Kitten", "ZIWI Peak Steam & Dried Chicken with Southern Blue Whiting Recipe for Kittens", "Chicken with Southern Blue Whiting Recipe", ["chicken", "southern blue whiting"], "kitten", "dry", "steam_dried", "bag", "1.5 lb"),
              ("9421038211212", "cat", "Canned Pâté Kitten", "ZIWI Peak Canned Pâté Beef with Mackerel Recipe for Kittens", "Beef with Mackerel Recipe", ["beef", "mackerel"], "kitten", "wet", "pate", "can", "3 oz"),
              ("9421038211267", "cat", "Canned Pâté Kitten", "ZIWI Peak Canned Pâté Chicken with Lamb Recipe for Kittens", "Chicken with Lamb Recipe", ["chicken", "lamb"], "kitten", "wet", "pate", "can", "3 oz"),
              ("9421038211564", "cat", "Canned Pâté", "ZIWI Peak Canned Pâté Salmon with Chicken Recipe for Cats", "Salmon with Chicken Recipe", ["salmon", "chicken"], "all", "wet", "pate", "can", "3 oz"),
              ("9421038211571", "cat", "Canned Pâté", "ZIWI Peak Canned Pâté Salmon with Chicken Recipe for Cats", "Salmon with Chicken Recipe", ["salmon", "chicken"], "all", "wet", "pate", "can", "6.5 oz"),
              ("9421038211595", "cat", "Canned Pâté", "ZIWI Peak Canned Pâté Salmon with South Pacific Fish Recipe for Cats", "Salmon with South Pacific Fish Recipe", ["salmon", "south pacific fish"], "all", "wet", "pate", "can", "3 oz"),
              ("9421038211588", "cat", "Canned Pâté", "ZIWI Peak Canned Pâté Salmon with South Pacific Fish Recipe for Cats", "Salmon with South Pacific Fish Recipe", ["salmon", "south pacific fish"], "all", "wet", "pate", "can", "6.5 oz"),
          ]
          for upc, species, line, name, variant, recipe, life_stage, form, texture, package, size in launch:
              rows.append(row(
                  upc, species, line, name, variant, recipe, life_stage, form, texture,
                  "plain", package, size, "", [], analysis(), calories(),
                  ["https://us.ziwipets.com/pages/superzoo-2026", "https://www.fernmark.nzstory.govt.nz/brands/100204"],
                  "ZIWI first-party SuperZoo 2026 launch material proves the exact product, sellable size, and EAN-13; FernMark corroborates the launched range. A complete current formula/GA/calorie label deck was not located, so formula fields remain intentionally unfilled.",
                  "candidate",
                  "ZIWI's own launch table maps this EAN-13 directly to the stated individual retail unit and size; no sequential barcode inference was used.",
                  verification_notes=[
                      "GTIN-13 check digit validated independently.",
                      "Exact first-party barcode-to-product/size identity is established.",
                      "Candidate status is deliberate because the complete current ingredient order, guaranteed analysis, and calorie statement were not located."
                  ]
              ))

          # ---- 5 Raw Superboost records: barcode identity is good, formula generation is not. ----
          skin_ing = "Whole Mackerel, Hoki, Whole Southern Whiting, New Zealand Green Mussel, Blackfoot Abalone, Fish Broth, Marine Microalgae Oil, Mixed Tocopherols (a preservative), Dried Organic Kelp, Dandelion Greens, Rosehips, Green Tea Leaf, Elder Flowers, Dried Chicory Root, Parsley, Rosemary Extract, Dried Bacillus subtilis Fermentation Product."
          skin_norm = ["Whole Mackerel", "Hoki", "Whole Southern Whiting", "New Zealand Green Mussel", "Blackfoot Abalone", "Fish Broth", "Marine Microalgae Oil", "Mixed Tocopherols (a preservative)", "Dried Organic Kelp", "Dandelion Greens", "Rosehips", "Green Tea Leaf", "Elder Flowers", "Dried Chicory Root", "Parsley", "Rosemary Extract", "Dried Bacillus subtilis Fermentation Product"]
          rows.append(row(
              "9421016590193", "dog", "Raw Superboost", "ZIWI Peak Freeze-Dried Skin & Coat Health Recipe Meal Enhancer for Dogs", "Skin & Coat Health", ["mackerel", "hoki", "southern whiting"], None, "supplement", "freeze_dried", "plain", "bag", "4 oz (114 g)",
              skin_ing, skin_norm,
              analysis(50, 22, 3, 6, None, None, [
                  extra("Vitamin A", "min", 100000, "IU/kg"), extra("Vitamin E", "min", 56, "IU/kg"),
                  extra("Biotin", "min", 0.08, "other"), extra("Omega-3 Fatty Acids", "min", 3.5, "percent"),
                  extra("Collagen", "min", 2.8, "percent"), extra("Total Microorganisms (Bacillus subtilis)", "min", 100000000, "other")]),
              calories(4500, 144, "cup"),
              ["https://www.petzoo.com.au/ziwi-peak-booster-dog-meal-topper-skin-coat-health", "https://www.aspenspantry.com.au/product/ziwi-peak-dog-raw-superboost-freeze-dried-skin-coat-health/"],
              "PetZoo proves the exact 114 g EAN; a newer Australian formula panel supplies the stored composition, GA, and calories.",
              "needs_physical_label",
              "PetZoo explicitly lists barcode 9421016590193 for the 114 g Skin & Coat Health unit.",
              ["ZIWI booster copies expose more than one probiotic generation: Bacillus-only versus Bacillus plus Enterococcus. A physical 114 g pack is required to bind the exact generation to this barcode."],
              ["GTIN-13 check digit validated independently.", "Barcode was not inferred from a sibling size."]
          ))

          beef_ing_new = "Beef with Ground Bone (Source of Glucosamine and Chondroitin Sulfate), Beef Tripe, New Zealand Green Mussel, Beef Heart, Mixed Tocopherols (a preservative), Dried Organic Kelp, Rosemary Extract, Dried Bacillus subtilis Fermentation Product."
          beef_norm_new = ["Beef with Ground Bone (Source of Glucosamine and Chondroitin Sulfate)", "Beef Tripe", "New Zealand Green Mussel", "Beef Heart", "Mixed Tocopherols (a preservative)", "Dried Organic Kelp", "Rosemary Extract", "Dried Bacillus subtilis Fermentation Product"]
          beef_ga = analysis(42, 38, 3, 4, None, 0.2, [
              extra("Docosahexaenoic Acid (DHA)", "min", 0.07, "percent"), extra("Eicosapentaenoic Acid (EPA)", "min", 0.12, "percent"),
              extra("Omega-3 Fatty Acids", "min", 0.6, "percent"), extra("Glucosamine", "min", 3000, "other"),
              extra("Chondroitin Sulfate", "min", 5000, "other"), extra("Total Microorganisms (Bacillus subtilis)", "min", 100000000, "other")])
          for upc, size, exact_url in [
              ("9421016590056", "4 oz (114 g)", "https://www.petzoo.com.au/ziwi-peak-booster-dog-meal-topper-raw-superboost-b"),
              ("9421016590087", "11.3 oz (320 g)", "https://www.habitatpets.com.au/products/ziwi-peak-dog-freeze-dried-superboost-beef-320g"),
          ]:
              rows.append(row(
                  upc, "dog", "Raw Superboost", "ZIWI Peak Raw Freeze-Dried Superboost Beef Recipe Meal Enhancer for Dogs", "Beef Recipe", ["beef"], None, "supplement", "freeze_dried", "plain", "bag", size,
                  beef_ing_new, beef_norm_new, beef_ga, calories(5600, 213, "cup"),
                  [exact_url, "https://www.aspenspantry.com.au/product/ziwi-peak-dog-raw-superboost-freeze-dried-beef-recipe/"],
                  "Exact retailer SKU evidence proves barcode/size; newer Australian formula copy supplies the stored Bacillus-only formula, GA, and calories.",
                  "needs_physical_label",
                  f"Exact retailer evidence maps EAN-13 {upc} to the stated individual bag size.",
                  ["Older exact/sibling product copies include Dried Enterococcus faecium Fermentation Product while newer copies list Bacillus subtilis only. A physical pack is required to settle the generation."],
                  ["GTIN-13 check digit validated independently.", "Exact unit mapping, not sequential-EAN inference."]
              ))

          cat_beef_url = "https://www.mishcats.com.au/shop/ziwi-peak-raw-superboost-beef-recipe/"
          rows.append(row(
              "9421016590124", "cat", "Raw Superboost", "ZIWI Peak Raw Freeze-Dried Superboost Beef Recipe Meal Enhancer for Cats", "Beef Recipe", ["beef"], None, "supplement", "freeze_dried", "plain", "bag", "3 oz (85 g)",
              beef_ing_new, beef_norm_new, beef_ga, calories(5600, None, None),
              [cat_beef_url, "https://petdirect.co.nz/p/ziwi-peak-freeze-dried-raw-superboost-beef-cat-food-topper/"],
              "Mishcats proves the exact 85 g cat barcode and current Bacillus-only ingredient line; a detailed current-like panel supplies GA/energy, but older copies expose a conflicting probiotic/formula generation.",
              "needs_physical_label",
              "Mishcats explicitly maps barcode 9421016590124 to the 85 g cat Beef Superboost unit.",
              ["Older/corrupted copies disagree on organ/probiotic wording, including Enterococcus in some generations. A physical 85 g pack is required before source_verified status."],
              ["GTIN-13 check digit validated independently.", "Barcode-to-85 g cat identity is explicit."]
          ))

          cat_ven_ing = "Venison With Ground Bone (Source of Glucosamine and Chondroitin Sulfate), Venison Tripe, New Zealand Green Mussel, Venison Heart, Mixed Tocopherols (a preservative), Dried Organic Kelp, Rosemary Extract, Dried Bacillus subtilis Fermentation Product."
          cat_ven_norm = ["Venison With Ground Bone (Source of Glucosamine and Chondroitin Sulfate)", "Venison Tripe", "New Zealand Green Mussel", "Venison Heart", "Mixed Tocopherols (a preservative)", "Dried Organic Kelp", "Rosemary Extract", "Dried Bacillus subtilis Fermentation Product"]
          rows.append(row(
              "9421016590117", "cat", "Raw Superboost", "ZIWI Peak Raw Freeze-Dried Superboost Venison Recipe Meal Enhancer for Cats", "Venison Recipe", ["venison"], None, "supplement", "freeze_dried", "plain", "bag", "3 oz (85 g)",
              cat_ven_ing, cat_ven_norm, analysis(), calories(),
              ["https://www.mishcats.com.au/shop/ziwi-peak-raw-superboost-venison-recipe/"],
              "Mishcats proves the exact 85 g EAN and current Bacillus-only ingredient statement. A complete exact current GA/calorie panel was not located.",
              "needs_physical_label",
              "Mishcats explicitly maps barcode 9421016590117 to the 85 g cat Venison Superboost unit.",
              ["Exact current complete guaranteed analysis/calorie evidence is missing; physical label is required."],
              ["GTIN-13 check digit validated independently.", "Exact unit barcode is proven; missing nutrition evidence is not filled by inference."]
          ))

          # ---- 2 Good Dog Rewards: exact-unit barcode + complete formula panels. ----
          lamb_gdr_ing = "Lamb, Lamb Heart*, Lamb Liver*, Lamb Tripe*, Lamb Kidney*, Lamb Lung*, Lamb Bone, New Zealand Green Mussel, Inulin from Chicory, Dried Kelp, Sea Salt, Parsley, Minerals (Potassium Bicarbonate, Zinc Amino Acid Complex, Copper Amino Acid Complex, Selenium Yeast, Manganese Amino Acid Complex), Vitamins (Vitamin E Supplement, Vitamin B1 Supplement, Vitamin D3 Supplement, Folic Acid). Naturally preserved with mixed tocopherols. *Depending on seasonal availability will be temporarily substituted with sheep."
          lamb_gdr_norm = ["Lamb", "Lamb Heart*", "Lamb Liver*", "Lamb Tripe*", "Lamb Kidney*", "Lamb Lung*", "Lamb Bone", "New Zealand Green Mussel", "Inulin from Chicory", "Dried Kelp", "Sea Salt", "Parsley", "Minerals (Potassium Bicarbonate, Zinc Amino Acid Complex, Copper Amino Acid Complex, Selenium Yeast, Manganese Amino Acid Complex)", "Vitamins (Vitamin E Supplement, Vitamin B1 Supplement, Vitamin D3 Supplement, Folic Acid)", "Naturally preserved with mixed tocopherols"]
          rows.append(row(
              "9421016594672", "dog", "Good Dog Rewards", "ZIWI Peak Good Dog Rewards Lamb Recipe Dog Treats", "Lamb Recipe", ["lamb"], None, "treat", "air_dried", "plain", "bag", "3 oz (85 g)",
              lamb_gdr_ing, lamb_gdr_norm, analysis(36, 35, 2, 14, 8, None), calories(None, 5.6, "piece"),
              ["https://houstonrawpetfood.com/products/peak-good-dog-rewards-grain-free-new-zealand-lamb-dog-treats"],
              "Exact single-product retailer page prints the 3 oz UPC, complete ingredient statement, guaranteed analysis, and 5.6 kcal/piece statement.",
              "source_verified",
              "Exact product page maps EAN-13 9421016594672 to one 3 oz/85 g Lamb Good Dog Rewards bag.",
              verification_notes=["GTIN-13 check digit validated independently.", "Product is explicitly a treat and not represented as a complete daily diet."]
          ))

          ven_gdr_ing = "Venison, Venison Tripe, Venison Heart, Venison Lung, Venison Liver, Venison Kidney, New Zealand Green Mussel, Venison Bone, Lecithin, Inulin from Chicory, Dried Kelp, Minerals (Dipotassium Phosphate, Magnesium Sulfate, Zinc Amino Acid Complex, Copper Amino Acid Complex, Iron Amino Acid Complex, Manganese Amino Acid Complex, Selenium Yeast), Salt, Parsley, Preservative (Citric Acid, Mixed Tocopherols), Vitamins (Vitamin E Supplement, Thiamine Mononitrate, Vitamin D3 Supplement, Folic Acid)."
          ven_gdr_norm = ["Venison", "Venison Tripe", "Venison Heart", "Venison Lung", "Venison Liver", "Venison Kidney", "New Zealand Green Mussel", "Venison Bone", "Lecithin", "Inulin from Chicory", "Dried Kelp", "Minerals (Dipotassium Phosphate, Magnesium Sulfate, Zinc Amino Acid Complex, Copper Amino Acid Complex, Iron Amino Acid Complex, Manganese Amino Acid Complex, Selenium Yeast)", "Salt", "Parsley", "Preservative (Citric Acid, Mixed Tocopherols)", "Vitamins (Vitamin E Supplement, Thiamine Mononitrate, Vitamin D3 Supplement, Folic Acid)"]
          rows.append(row(
              "9421016594641", "dog", "Good Dog Rewards", "ZIWI Peak Good Dog Rewards Venison Recipe Dog Treats", "Venison Recipe", ["venison"], "all", "treat", "air_dried", "plain", "bag", "3 oz (85 g)",
              ven_gdr_ing, ven_gdr_norm,
              analysis(45, 23, 2, 14, 12, None, [extra("Chondroitin Sulfate", "min", 1300, "other")]),
              calories(4700, None, None),
              ["https://www.petzoo.com.au/ziwi-peak-dog-dog-rewards-treats-venison-85g", "https://www.countrymax.com/ziwi-good-dog-rewards-venison-recipe-dog-treats-3-oz/", "https://store.shopping.yahoo.co.jp/monolith-net/ziwi-gd-veni-09421016594641.html"],
              "PetZoo proves exact 85 g barcode identity; English retailer copy supplies the complete ingredient line; ZIWI-authorized Japanese retail evidence prints the JAN/EAN, complete GA, 470 kcal/100 g (4700 kcal/kg), and all-life-stages statement.",
              "source_verified",
              "Independent exact-unit sources map EAN-13 9421016594641 to the 85 g Venison Good Dog Rewards bag.",
              verification_notes=["GTIN-13 check digit validated independently.", "470 kcal/100 g is stored as 4700 kcal/kg without inventing a per-piece value."]
          ))

          # ---- 2 previously missed Original Air-Dried Venison dog sizes. ----
          ven_ing = "Venison, Venison Tripe, Venison Heart, Venison Lung, Venison Liver, Venison Kidney, New Zealand Green Mussel, Venison Bone, Lecithin, Parsley, Dried Apple Pomace, Inulin (from Chicory Root), Venison Cartilage, Minerals (Dipotassium Phosphate, Magnesium Sulphate, Zinc Amino Acid Complex, Iron Amino Acid Complex, Copper Amino Acid Complex, Manganese Amino Acid Complex, Selenium Yeast), Dried Organic Kelp, Salt, Preservative (Citric Acid, Mixed Tocopherols), Vitamins (Vitamin E Supplement, Thiamine Mononitrate, Riboflavin, Pyridoxine Hydrochloride, Vitamin D3 Supplement, Folic Acid)."
          ven_norm = ["Venison", "Venison Tripe", "Venison Heart", "Venison Lung", "Venison Liver", "Venison Kidney", "New Zealand Green Mussel", "Venison Bone", "Lecithin", "Parsley", "Dried Apple Pomace", "Inulin (from Chicory Root)", "Venison Cartilage", "Minerals (Dipotassium Phosphate, Magnesium Sulphate, Zinc Amino Acid Complex, Iron Amino Acid Complex, Copper Amino Acid Complex, Manganese Amino Acid Complex, Selenium Yeast)", "Dried Organic Kelp", "Salt", "Preservative (Citric Acid, Mixed Tocopherols)", "Vitamins (Vitamin E Supplement, Thiamine Mononitrate, Riboflavin, Pyridoxine Hydrochloride, Vitamin D3 Supplement, Folic Acid)"]
          ven_ga = analysis(44, 24, 3, 14, 12, 0.09, [extra("Chondroitin Sulfate", "min", 1300, "other"), extra("Glucosamine", "min", 1000, "other")])
          for upc, size in [("9421016590612", "2.2 lb (1 kg)"), ("9421016592975", "5.5 lb (2.5 kg)")]:
              rows.append(row(
                  upc, "dog", "Original Air-Dried", "ZIWI Peak Original Air-Dried Venison Recipe for Dogs", "Venison Recipe", ["venison"], "all", "dry", "air_dried", "plain", "bag", size,
                  ven_ing, ven_norm, ven_ga, calories(4650, 441, "cup"),
                  ["https://ziwipets.com/products/air-dried-venison-recipe-for-dogs", "https://www.ormskirkpets.co.uk/products/ziwipeak-daily-dog-air-dried-cuisine-venison-new25"],
                  "Current exact ZIWI product page supplies the current formula, complete GA, calories, and all-life-stages adequacy; live retailer variant data maps the exact EAN to the stated size.",
                  "source_verified",
                  f"Live sellable-variant data maps EAN-13 {upc} directly to the {size} Venison bag.",
                  verification_notes=["GTIN-13 check digit validated independently.", "Barcode/size mapping is explicit and was not generated from sibling codes."]
              ))

          # ---- 3 previously missed Original Air-Dried Tripe & Lamb dog sizes. ----
          tripe_ing = "Lamb Tripe, Lamb Lung, Lamb Heart, Lamb, Lamb Liver, Lamb Bone, New Zealand Green Mussel, Lamb Kidney, Lamb Spleen, Lecithin, Parsley, Dried Apple Pomace, Inulin (from Chicory Root), Minerals (Dipotassium Phosphate, Magnesium Sulfate, Zinc Amino Acid Complex, Iron Amino Acid Complex, Copper Amino Acid Complex, Manganese Amino Acid Complex, Selenium Yeast), Dried Organic Kelp, Salt, Lamb Cartilage, Preservative (Citric Acid, Mixed Tocopherols), Vitamins (Vitamin E Supplement, Thiamine Mononitrate, Riboflavin, Pyridoxine Hydrochloride, Vitamin D3 Supplement, Folic Acid)."
          tripe_norm = ["Lamb Tripe", "Lamb Lung", "Lamb Heart", "Lamb", "Lamb Liver", "Lamb Bone", "New Zealand Green Mussel", "Lamb Kidney", "Lamb Spleen", "Lecithin", "Parsley", "Dried Apple Pomace", "Inulin (from Chicory Root)", "Minerals (Dipotassium Phosphate, Magnesium Sulfate, Zinc Amino Acid Complex, Iron Amino Acid Complex, Copper Amino Acid Complex, Manganese Amino Acid Complex, Selenium Yeast)", "Dried Organic Kelp", "Salt", "Lamb Cartilage", "Preservative (Citric Acid, Mixed Tocopherols)", "Vitamins (Vitamin E Supplement, Thiamine Mononitrate, Riboflavin, Pyridoxine Hydrochloride, Vitamin D3 Supplement, Folic Acid)"]
          tripe_ga = analysis(44, 24, 3, 14, 12, 0.10, [extra("Chondroitin Sulfate", "min", 1300, "other"), extra("Glucosamine", "min", 1000, "other")])
          tripe_sizes = [
              ("9421016594047", "16 oz (454 g)", "https://www.vetnpetdirect.com.au/collections/ziwi-peak-for-dogs"),
              ("9421016594023", "2.2 lb (1 kg)", "https://www.petcity.com.au/product/ziwipeak-dog-air-dried-tripe-lamb-1kg"),
              ("9421016594009", "5.5 lb (2.5 kg)", "https://pet-wagon.com/shop/g/g9421016594009/"),
          ]
          for upc, size, exact_url in tripe_sizes:
              rows.append(row(
                  upc, "dog", "Original Air-Dried", "ZIWI Peak Original Air-Dried Tripe & Lamb Recipe for Dogs", "Tripe & Lamb Recipe", ["lamb tripe", "lamb"], "all", "dry", "air_dried", "plain", "bag", size,
                  tripe_ing, tripe_norm, tripe_ga, calories(4900, 465, "cup"),
                  ["https://us.ziwipets.com/products/air-dried-tripe-and-lamb-for-dogs", exact_url],
                  "Current exact ZIWI US product page supplies the current formula, complete GA, calories, and all-life-stages adequacy; exact retailer evidence supplies the individual-unit EAN/size mapping.",
                  "source_verified",
                  f"Exact retail evidence maps EAN-13 {upc} directly to the {size} Tripe & Lamb bag.",
                  ["Older stable-barcode retailer copies carry a materially older Tripe & Lamb generation (36% protein / 32% fat / 2% fiber / 14% moisture / 12% ash and about 5200 kcal/kg). The current manufacturer formula is stored; the historical disagreement is preserved."],
                  ["GTIN-13 check digit validated independently.", "Manufacturer-current formula takes priority over the older retailer formula; no formula generations were merged."]
              ))

          # ---- Batch validation ----
          assert len(rows) == 20, len(rows)
          assert Counter(r["research_status"] for r in rows) == Counter({"candidate": 8, "needs_physical_label": 5, "source_verified": 7})

          def valid_gtin(code):
              if len(code) not in (8, 12, 13, 14) or not code.isdigit():
                  return False
              body = [int(x) for x in code[:-1]]
              total = sum(d * (3 if i % 2 == 0 else 1) for i, d in enumerate(reversed(body)))
              return (10 - total % 10) % 10 == int(code[-1])

          required = ["upc", "canonical_gtin14", "barcode_scope", "brand", "species", "product_name", "size", "ingredients_verbatim", "ingredients_ordered_normalized", "guaranteed_analysis", "calorie_content", "source_urls", "conflicts", "verification_notes", "research_status"]
          for r in rows:
              assert all(k in r for k in required), r.get("upc")
              assert r["brand"] == BRAND
              assert r["barcode_scope"] == "individual_unit"
              assert valid_gtin(r["upc"]), r["upc"]
              assert r["canonical_gtin14"] == r["upc"].zfill(14), r["upc"]
              assert r["source_urls"] and isinstance(r["conflicts"], list) and isinstance(r["verification_notes"], list)
              if r["research_status"] != "candidate":
                  assert r["ingredients_verbatim"].strip() and r["ingredients_ordered_normalized"], r["upc"]
              if r["research_status"] == "source_verified":
                  g = r["guaranteed_analysis"]
                  c = r["calorie_content"]
                  assert all(g[k] is not None for k in ("crude_protein_min_percent", "crude_fat_min_percent", "crude_fiber_max_percent", "moisture_max_percent")), r["upc"]
                  assert c["kcal_per_kg"] is not None or c["kcal_per_unit"] is not None, r["upc"]

          target_path = Path("research/deep-research-ziwi-peak.json")
          target = json.loads(target_path.read_text(encoding="utf-8"))
          existing = target["records"]
          initial = len(existing)
          old_upcs = [r["upc"] for r in existing]
          new_upcs = [r["upc"] for r in rows]
          assert len(old_upcs) == len(set(old_upcs)), "existing ZIWI ledger contains duplicate UPCs"
          assert len(new_upcs) == len(set(new_upcs)), "new batch contains duplicate UPCs"
          overlap = sorted(set(old_upcs) & set(new_upcs))
          assert not overlap, f"ZIWI ledger overlap: {overlap}"

          exclusion_paths = [Path("data/known-products.ts"), Path("data/known-formulas.ts"), Path("data/wrong-barcodes.ts"), Path("docs/CATALOG-CONFLICTS.md")]
          exclusion_paths += [p for p in Path("research").glob("deep-research-*.json") if p != target_path]
          hits = {}
          for p in exclusion_paths:
              if not p.exists():
                  continue
              text = p.read_text(encoding="utf-8", errors="replace")
              for r in rows:
                  if r["upc"] in text or r["canonical_gtin14"] in text:
                      hits.setdefault(r["upc"], []).append(str(p))
          assert not hits, f"exclusion collisions: {hits}"

          target["records"].extend(rows)
          target["updated_at"] = ACCESSED
          final_upcs = [r["upc"] for r in target["records"]]
          assert len(final_upcs) == len(set(final_upcs))
          assert len(final_upcs) == initial + 20, (initial, len(final_upcs))
          target_path.write_text(json.dumps(target, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          Path("/tmp/ziwi-batch-upcs.txt").write_text("\n".join(new_upcs) + "\n", encoding="utf-8")
          print(f"Validated {len(exclusion_paths)} exclusion files; {initial} + 20 = {len(final_upcs)}")
          print("Status counts:", dict(Counter(r["research_status"] for r in rows)))
          print("UPCs:", ", ".join(new_upcs))
          PY

      - name: Commit merged ledger
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/deep-research-ziwi-peak.json
          git commit -m "research: add 20 more ZIWI Peak records"
          git push origin HEAD:agent/deep-research-ziwi-peak

      - name: Re-fetch remote ledger and parse exact committed state
        run: |
          git fetch origin agent/deep-research-ziwi-peak
          git show origin/agent/deep-research-ziwi-peak:research/deep-research-ziwi-peak.json > /tmp/remote-ziwi.json
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          doc = json.loads(Path('/tmp/remote-ziwi.json').read_text(encoding='utf-8'))
          expected = set(Path('/tmp/ziwi-batch-upcs.txt').read_text().split())
          rows = doc['records']
          present = {r['upc'] for r in rows}
          assert expected <= present, sorted(expected - present)
          assert len(rows) == 136, len(rows)
          assert len(present) == len(rows), 'duplicate UPC after remote re-fetch'
          batch = [r for r in rows if r['upc'] in expected]
          assert len(batch) == 20
          assert Counter(r['research_status'] for r in batch) == Counter({'candidate': 8, 'needs_physical_label': 5, 'source_verified': 7})
          print('REMOTE_REFETCH_OK records=136 batch=20 statuses=' + str(dict(Counter(r['research_status'] for r in batch))))
          PY
