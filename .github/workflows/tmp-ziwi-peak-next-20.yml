name: Merge ZIWI Peak next 20 research records

on:
  push:
    branches:
      - agent/deep-research-ziwi-peak
    paths:
      - .github/workflows/tmp-ziwi-peak-next-20.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-ziwi-peak
          fetch-depth: 0
      - name: Validate exclusions and append ZIWI batch
        run: |
          python - <<'PY'
          import base64, json, zlib
          from collections import Counter
          from pathlib import Path

          DATA = ''''''
          rows = json.loads(zlib.decompress(base64.b64decode(DATA)).decode('utf-8'))['records']
          assert len(rows) == 20, len(rows)
          assert Counter(r['research_status'] for r in rows) == Counter({'candidate': 8, 'needs_physical_label': 5, 'source_verified': 7})

          def valid_gtin(code):
              if len(code) not in (8, 12, 13, 14) or not code.isdigit(): return False
              body = [int(x) for x in code[:-1]]
              total = sum(d * (3 if i % 2 == 0 else 1) for i, d in enumerate(reversed(body)))
              return (10 - total % 10) % 10 == int(code[-1])

          required = ['upc','canonical_gtin14','barcode_scope','brand','species','product_name','size','ingredients_verbatim','ingredients_ordered_normalized','guaranteed_analysis','calorie_content','source_urls','conflicts','verification_notes','research_status']
          allowed = {'candidate','source_verified','needs_physical_label','rejected','promoted_to_seed'}
          for r in rows:
              assert all(k in r for k in required), r.get('upc')
              assert r['brand'] == 'ZIWI Peak'
              assert r['barcode_scope'] == 'individual_unit'
              assert r['research_status'] in allowed
              assert valid_gtin(r['upc']), r['upc']
              assert r['canonical_gtin14'] == r['upc'].zfill(14), r['upc']
              assert r['source_urls'] and isinstance(r['conflicts'], list) and isinstance(r['verification_notes'], list)
              if r['research_status'] != 'candidate':
                  assert r['ingredients_verbatim'].strip(), r['upc']
                  assert r['ingredients_ordered_normalized'], r['upc']
              if r['research_status'] == 'source_verified':
                  g = r['guaranteed_analysis']; c = r['calorie_content']
                  assert g['crude_protein_min_percent'] is not None and g['crude_fat_min_percent'] is not None
                  assert g['crude_fiber_max_percent'] is not None and g['moisture_max_percent'] is not None
                  assert c['kcal_per_kg'] is not None or c['kcal_per_unit'] is not None

          target_path = Path('research/deep-research-ziwi-peak.json')
          target = json.loads(target_path.read_text(encoding='utf-8'))
          existing = target['records']
          initial = len(existing)
          old_upcs = [r['upc'] for r in existing]
          new_upcs = [r['upc'] for r in rows]
          assert len(old_upcs) == len(set(old_upcs)), 'existing ZIWI ledger contains duplicate UPCs'
          assert len(new_upcs) == len(set(new_upcs)), 'new batch contains duplicate UPCs'
          overlap = sorted(set(old_upcs) & set(new_upcs))
          assert not overlap, f'ZIWI ledger overlap: {overlap}'

          exclusion_paths = [Path('data/known-products.ts'), Path('data/known-formulas.ts'), Path('data/wrong-barcodes.ts'), Path('docs/CATALOG-CONFLICTS.md')]
          exclusion_paths += [p for p in Path('research').glob('deep-research-*.json') if p != target_path]
          hits = {}
          for p in exclusion_paths:
              if not p.exists(): continue
              text = p.read_text(encoding='utf-8', errors='replace')
              for r in rows:
                  if r['upc'] in text or r['canonical_gtin14'] in text:
                      hits.setdefault(r['upc'], []).append(str(p))
          assert not hits, f'exclusion collisions: {hits}'

          target['records'].extend(rows)
          target['updated_at'] = '2026-08-28'
          final_upcs = [r['upc'] for r in target['records']]
          assert len(final_upcs) == len(set(final_upcs))
          assert len(final_upcs) == initial + 20, (initial, len(final_upcs))
          target_path.write_text(json.dumps(target, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Validated {len(exclusion_paths)} exclusion files; {initial} + 20 = {len(final_upcs)}')
          print('Status counts:', dict(Counter(r['research_status'] for r in rows)))
          print('UPCs:', ', '.join(new_upcs))
          PY
      - name: Commit merged ledger
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/deep-research-ziwi-peak.json
          git commit -m "research: add 20 more ZIWI Peak records"
          git push origin HEAD:agent/deep-research-ziwi-peak
