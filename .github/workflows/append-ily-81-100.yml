name: Append ILY 81-100
on:
  push:
    branches: [agent/deep-research-i-and-love-and-you]
    paths: [.github/workflows/append-ily-81-100.yml]
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-i-and-love-and-you
          fetch-depth: 0
      - name: Validate and append twenty records
        run: python .github/scripts/append-ily-81-100.py
      - name: Commit canonical ledger
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/deep-research-i-and-love-and-you.json
          git diff --cached --check
          git commit -m "research: add ILY source-verified records 81-100"
          git push origin HEAD:agent/deep-research-i-and-love-and-you
