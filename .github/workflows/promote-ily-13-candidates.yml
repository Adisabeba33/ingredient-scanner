name: Promote ILY 13 candidates
on:
  push:
    branches: [agent/deep-research-i-and-love-and-you]
    paths: [.github/workflows/promote-ily-13-candidates.yml]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-i-and-love-and-you
          fetch-depth: 0
      - run: python .github/scripts/promote-ily-13-candidates.py
      - run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/deep-research-i-and-love-and-you.json
          git diff --cached --check
          git commit -m "research: complete remaining ILY candidate multipacks"
          git push origin HEAD:agent/deep-research-i-and-love-and-you
