name: Fast Weruva current-catalog audit
on: push
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/deep-research-weruva }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          node <<'NODE'
          const fs=require('fs');
          const norm=s=>s.toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim();
          const clean=s=>s.replace(/^(PLAY|OMG|Originals|Classic)\s+/i,'').replace(/\s+—.*$/,'').replace(/!+/g,'').trim();
          async function json(url){const r=await fetch(url,{headers:{'user-agent':'Mozilla/5.0'},signal:AbortSignal.timeout(5000)});if(!r.ok)throw Error(String(r.status));return r.json()}
          async function one(row){
            const q=clean(row.product); let products=[];
            try{const j=await json('https://www.weruva.com/search/suggest.json?q='+encodeURIComponent(q)+'&resources[type]=product&resources[limit]=6');products=j?.resources?.results?.products||[]}catch(e){}
            const nq=norm(q); products.sort((a,b)=>{const sc=x=>{const t=norm(x.title||'');return (t.includes(nq)||nq.includes(t)?20:0)+nq.split(' ').filter(w=>t.includes(w)).length};return sc(b)-sc(a)});
            let best=null;
            for(const s of products.slice(0,3)){
              const h=(s.url||'').match(/\/products\/([^?]+)/)?.[1]; if(!h)continue;
              try{const p=await json(`https://www.weruva.com/products/${h}.js`);const vars=(p.variants||[]).map(v=>({title:v.title,sku:v.sku||null,barcode:v.barcode||null}));const exact=vars.find(v=>v.barcode===row.upc);best={title:p.title,handle:h,url:`https://www.weruva.com/products/${h}`,variants:vars,exact_upc:!!exact};if(exact)break}catch(e){}
            }
            return {...row,current:best,status:best?(best.exact_upc?'exact_current':'product_found_upc_changed'):'unresolved'};
          }
          (async()=>{const md=fs.readFileSync('research/WERUVA-POST-30-INDEX.md','utf8');let active=false,rows=[];for(const line of md.split(/\r?\n/)){if(/^## .*awaiting strict promotion/i.test(line))active=true;else if(/^## /i.test(line)&&!/awaiting strict promotion/i.test(line))active=false;if(!active)continue;const m=line.match(/^\| `([0-9]{12,14})` \| ([^|]+) \| ([^|]+) \|?/);if(m)rows.push({upc:m[1],product:m[2].trim(),size:m[3].trim()})}const unique=[...new Map(rows.map(x=>[x.upc,x])).values()];let out=[];for(let i=0;i<unique.length;i+=10){out.push(...await Promise.all(unique.slice(i,i+10).map(one)));console.log('done',Math.min(i+10,unique.length),'/',unique.length)}const summary={index_rows:rows.length,unique_upcs:unique.length,exact_current:out.filter(x=>x.status==='exact_current').length,product_found_upc_changed:out.filter(x=>x.status==='product_found_upc_changed').length,unresolved:out.filter(x=>x.status==='unresolved').length};fs.writeFileSync('research/WERUVA-CURRENT-CATALOG-AUDIT.json',JSON.stringify({generated_at:new Date().toISOString(),summary,records:out},null,2));console.log(summary)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin agent/deep-research-weruva
          git add research/WERUVA-CURRENT-CATALOG-AUDIT.json
          git commit -m 'research: audit remaining Weruva UPCs against current first-party catalog' || exit 0
          git push
