name: Promote Weruva prepared 20

on:
  push:
    branches:
      - agent/deep-research-weruva
    paths:
      - .github/workflows/weruva-promote-prepared20.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-weruva
          fetch-depth: 0
      - name: Validate and append prepared 20
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          TARGET=Path('research/deep-research-weruva.json'); INDEX=Path('research/WERUVA-POST-30-INDEX.md'); HANDOFF=Path('research/WERUVA-HANDOFF.md'); RUNNER=Path('.github/workflows/weruva-promote-prepared20.yml')
          ACC='2026-08-29'; ADMC='https://www.admc.us/wp-content/uploads/2022/02/2024-North-Complete-Price-List_5.12.25.pdf'
          def upc_ok(c): return len(c)==12 and c.isdigit() and (10-sum(int(c[i])*(3 if i%2==0 else 1) for i in range(11))%10)%10==int(c[-1])
          def split_top(s):
              out=[]; start=0; depth=0
              for i,ch in enumerate(s):
                  if ch=='(': depth+=1
                  elif ch==')': depth=max(0,depth-1)
                  elif ch==',' and depth==0:
                      out.append(s[start:i].strip().rstrip('.')); start=i+1
              out.append(s[start:].strip().rstrip('.')); return out
          def ga(p,f,fi,m,a=None,other=None): return {'crude_protein_min_percent':p,'crude_fat_min_percent':f,'crude_fiber_max_percent':fi,'moisture_max_percent':m,'ash_max_percent':a,'taurine_min_percent':None,'other_printed_guarantees':other or []}
          def rec(upc,line,name,variant,recipe,life,form,texture,pres,ptype,size,ing,g,kg,kcal,url,notes=None,conflicts=None):
              return {'catalog_number':None,'upc':upc,'canonical_gtin14':upc.zfill(14),'barcode_scope':'individual_unit','brand':'Weruva','manufacturer':'Weruva','species':'cat','product_line':line,'product_name':name,'variant':variant,'recipe':recipe,'life_stage':life,'food_form':form,'texture':texture,'presentation':pres,'package_type':ptype,'size':size,'ingredients_verbatim':ing,'ingredients_ordered_normalized':split_top(ing),'guaranteed_analysis':g,'calorie_content':{'kcal_per_kg':kg,'kcal_per_unit':kcal,'unit_name':ptype if kcal is not None else None},'label_deck_code':None,'formula_source':'Current Weruva manufacturer page for the exact current formula, displayed guaranteed analysis, published calorie bases, package sizes and lifestage/feeding claim where printed; exact individual-unit UPC/size corroborated by distributor evidence.','source_urls':[url,ADMC],'source_accessed_at':ACC,'barcode_notes':f'Exact individual-unit UPC/size mapping rechecked. UPC-A {upc} passes its check digit; canonical GTIN-14 is {upc.zfill(14)}.','conflicts':conflicts or [],'verification_notes':['Fresh repository exclusion scan covered known-products, known-formulas, wrong-barcodes, CATALOG-CONFLICTS and every other deep-research ledger; no collision was found.','Current manufacturer generation is stored without calculating or borrowing missing label values.']+(notes or []),'research_status':'source_verified'}

          rows=[]
          # Kitten — current manufacturer panels.
          rows.append(rec('810028242784','Weruva Kitten','Weruva Kitten Chicken Formula Au Jus','Chicken Formula Au Jus',['chicken'],'kitten','wet','shredded','unknown','can','3 oz','Chicken, Chicken Broth, Natural Flavor, Dried Egg, Tricalcium Phosphate, Sunflower Oil, Guar Gum, Xanthan Gum, Locust Bean Gum, Fish Oil, Choline Chloride, Taurine, Zinc Sulfate, Ferrous Sulfate, Vitamin E Supplement, Thiamine Mononitrate (Vitamin B1), Niacin Supplement (Vitamin B3), Calcium Pantothenate, Vitamin A Supplement, Manganese Sulfate, Copper Sulfate, Riboflavin Supplement (Vitamin B2), Pyridoxine Hydrochloride (Vitamin B6), Vitamin D3 Supplement, Folic Acid, Vitamin B12 Supplement, Potassium Iodide.',ga(12,6,1,83,1.5),1170,100,'https://www.weruva.com/products/chicken-formula-au-jus-cat-can'))
          rows.append(rec('810028242791','Weruva Kitten','Weruva Kitten Chicken & Pumpkin Formula in Gravy','Chicken & Pumpkin Formula in Gravy',['chicken','tuna','pumpkin'],'kitten','wet','minced','in_gravy','can','3 oz','Chicken Broth, Chicken, Tuna, Pumpkin, Natural Flavor, Potato Starch, Sunflower Oil, Calcium Lactate, Guar Gum, Dried Egg, Tricalcium Phosphate, Choline Chloride, Taurine, Zinc Sulfate, Vitamin E Supplement, Thiamine Mononitrate (Vitamin B1), Niacin Supplement (Vitamin B3), Calcium Pantothenate, Vitamin A Supplement, Manganese Sulfate, Riboflavin Supplement (Vitamin B2), Pyridoxine Hydrochloride (Vitamin B6), Ferrous Sulfate, Copper Sulfate, Vitamin D3 Supplement, Folic Acid, Vitamin B12 Supplement, Potassium Iodide, Menadione Sodium Bisulfite Complex (Source Of Vitamin K).',ga(11.5,4,1,83,2),1021,87,'https://www.weruva.com/products/chicken-and-pumpkin-formula-in-gravy-cat-can'))
