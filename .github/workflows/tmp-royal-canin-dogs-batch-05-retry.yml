name: Temporary Royal Canin dogs batch 05 retry

on:
  push:
    branches:
      - agent/deep-research-barcode-ledger

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Adisabeba33/ingredient-scanner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: Recover rebuild append and validate 41-50
        run: |
          python - <<'PY'
          import base64, json, pathlib, re
          target = pathlib.Path('research/deep-research-royal-canin-dogs.json')
          source_wf = pathlib.Path('.github/workflows/tmp-royal-canin-dogs-batch-05.yml')
          d = json.loads(target.read_text(encoding='utf-8'))
          if len(d.get('records', [])) != 40:
              raise SystemExit(f"Expected 40 baseline records, found {len(d.get('records', []))}; refusing concurrent overwrite")

          wf = source_wf.read_text(encoding='utf-8')
          lines = [line for line in wf.splitlines() if 'RECORDS_B64:' in line]
          if len(lines) != 1:
              raise SystemExit(f'Expected exactly one RECORDS_B64 line, found {len(lines)}')
          payload = lines[0].split('RECORDS_B64:', 1)[1].strip()
          if payload.startswith('"') and payload.endswith('"'):
              payload = payload[1:-1]
          payload = ''.join(payload.split())
          if not payload or re.search(r'[^A-Za-z0-9+/=]', payload):
              raise SystemExit('Recovered payload still contains non-base64 characters')
          new = json.loads(base64.b64decode(payload, validate=True).decode('utf-8', errors='replace'))

          expected_upcs = ['030111517975','030111179302','030111449283','030111517470','030111517432','030111493880','030111493897','030111512512','030111527035','030111447142']
          if [r['upc'] for r in new] != expected_upcs:
              raise SystemExit('Recovered payload identity/order mismatch')

          formulas = {
            'Large Adult': 'Chicken by-product meal, brewers rice, wheat, brown rice, chicken fat, corn protein meal, natural flavors, dried plain beet pulp, fish oil, calcium carbonate, potassium chloride, salt, monocalcium phosphate, sodium aluminosilicate, choline chloride, vitamins [DL-alpha tocopherol acetate (source of vitamin E), L-ascorbyl-2-polyphosphate (source of vitamin C), biotin, D-calcium pantothenate, vitamin A acetate, riboflavin supplement, niacin supplement, vitamin B12 supplement, pyridoxine hydrochloride (vitamin B6), thiamine mononitrate (vitamin B1), vitamin D3 supplement, folic acid], rosemary extract, preserved with mixed tocopherols and citric acid, trace minerals [zinc proteinate, zinc oxide, manganese proteinate, ferrous sulfate, manganous oxide, copper sulfate, sodium selenite, calcium iodate, copper proteinate], glucosamine hydrochloride, DL-methionine, L-lysine, chondroitin sulfate.',
            'Large Puppy': 'Chicken by-product meal, corn, wheat, chicken fat, wheat gluten, brewers rice, natural flavors, brewers rice flour, dried plain beet pulp, corn gluten meal, monocalcium phosphate, sodium aluminosilicate, vegetable oil, salt, calcium carbonate, potassium chloride, powdered psyllium seed husk, pea fiber, fish oil, taurine, fructooligosaccharides, choline chloride, hydrolyzed yeast, marine microalgae oil, DL-methionine, vitamins [DL-alpha tocopherol acetate (source of vitamin E), L-ascorbyl-2-polyphosphate (source of vitamin C), biotin, D-calcium pantothenate, vitamin A acetate, niacin supplement, folic acid, pyridoxine hydrochloride (vitamin B6), vitamin B12 supplement, thiamine mononitrate (vitamin B1), vitamin D3 supplement, riboflavin supplement], trace minerals [zinc proteinate, zinc oxide, manganese proteinate, ferrous sulfate, manganous oxide, copper sulfate, sodium selenite, calcium iodate, copper proteinate], marigold extract (Tagetes erecta L.), glucosamine hydrochloride, Yucca schidigera extract, chondroitin sulfate, carotene, rosemary extract, preserved with mixed tocopherols and citric acid.',
            'Medium Adult': 'Brewers rice, chicken by-product meal, oat groats, wheat, corn protein meal, chicken fat, natural flavors (ONLY FOR MEXICO: including poultry, cow milk, pork), dried plain beet pulp, fish oil, calcium carbonate, vegetable oil, potassium chloride, monocalcium phosphate, salt, choline chloride, vitamins [DL-alpha tocopherol acetate (source of vitamin E), L-ascorbyl-2-polyphosphate (source of vitamin C), biotin, D-calcium pantothenate, vitamin A acetate, riboflavin supplement, niacin supplement, vitamin B12 supplement, pyridoxine hydrochloride (vitamin B6), thiamine mononitrate (vitamin B1), vitamin D3 supplement, folic acid], rosemary extract, preserved with mixed tocopherols and citric acid, hydrolyzed yeast, trace minerals [zinc proteinate, zinc oxide, manganese proteinate, ferrous sulfate, manganous oxide, copper sulfate, sodium selenite, calcium iodate, copper proteinate], L-lysine, magnesium oxide.',
            'Medium Puppy': 'Chicken by-product meal, chicken fat, brewers rice, corn, wheat, wheat gluten, dried plain beet pulp, natural flavors, brewers rice flour, corn gluten meal, monocalcium phosphate, vegetable oil, sodium aluminosilicate, pea fiber, potassium chloride, salt, fish oil, taurine, calcium carbonate, fructooligosaccharides, hydrolyzed yeast, choline chloride, marine microalgae oil, DL-methionine, vitamins [DL-alpha tocopherol acetate (source of vitamin E), L-ascorbyl-2-polyphosphate (source of vitamin C), biotin, D-calcium pantothenate, vitamin A acetate, niacin supplement, folic acid, pyridoxine hydrochloride (vitamin B6), vitamin B12 supplement, thiamine mononitrate (vitamin B1), vitamin D3 supplement, riboflavin supplement], trace minerals [zinc proteinate, zinc oxide, manganese proteinate, ferrous sulfate, manganous oxide, copper sulfate, sodium selenite, calcium iodate, copper proteinate], marigold extract (Tagetes erecta L.), Yucca schidigera extract, carotene, rosemary extract, preserved with mixed tocopherols and citric acid.',
            'Small Adult': 'Corn, chicken by-product meal, brewers rice, brown rice, corn protein meal, chicken fat, natural flavors (ONLY FOR MEXICO: including poultry, cow milk, pork), dried plain beet pulp, vegetable oil, wheat gluten, fish oil, potassium chloride, calcium carbonate, choline chloride, salt, fructooligosaccharides, sodium tripolyphosphate, vitamins [DL-alpha tocopherol acetate (source of vitamin E), L-ascorbyl-2-polyphosphate (source of vitamin C), biotin, D-calcium pantothenate, pyridoxine hydrochloride (vitamin B6), vitamin A acetate, riboflavin supplement, niacin supplement, folic acid, vitamin B12 supplement, thiamine mononitrate (vitamin B1), vitamin D3 supplement], monocalcium phosphate, DL-methionine, rosemary extract, preserved with mixed tocopherols and citric acid, L-lysine, trace minerals [zinc proteinate, zinc oxide, manganese proteinate, ferrous sulfate, manganous oxide, copper sulfate, sodium selenite, calcium iodate, copper proteinate], magnesium oxide, L-carnitine.',
            'Small Indoor Puppy': 'Brewers rice, chicken by-product meal, corn, chicken fat, dried plain beet pulp, wheat gluten, natural flavors, corn gluten meal, monocalcium phosphate, vegetable oil, sodium aluminosilicate, potassium chloride, pea fiber, calcium carbonate, taurine, fish oil, rice flour, fructooligosaccharides, sodium tripolyphosphate, salt, choline chloride, hydrolyzed yeast, L-lysine, marine microalgae oil, DL-methionine, vitamins [DL-alpha tocopherol acetate (source of vitamin E), L-ascorbyl-2-polyphosphate (source of vitamin C), biotin, D-calcium pantothenate, vitamin A acetate, pyridoxine hydrochloride (vitamin B6), niacin supplement, folic acid, vitamin B12 supplement, thiamine mononitrate (vitamin B1), vitamin D3 supplement, riboflavin supplement], L-threonine, trace minerals [zinc proteinate, zinc oxide, manganese proteinate, ferrous sulfate, manganous oxide, copper sulfate, sodium selenite, calcium iodate, copper proteinate], marigold extract (Tagetes erecta L.), Yucca schidigera extract, L-carnitine, carotene, rosemary extract, preserved with mixed tocopherols and citric acid.',
            'Small Puppy': 'Chicken by-product meal, brewers rice, chicken fat, wheat gluten, corn, dried plain beet pulp, natural flavors, corn gluten meal, monocalcium phosphate, pea fiber, vegetable oil, sodium aluminosilicate, calcium carbonate, potassium chloride, fish oil, taurine, fructooligosaccharides, sodium tripolyphosphate, rice flour, hydrolyzed yeast, salt, choline chloride, marine microalgae oil, DL-methionine, vitamins [DL-alpha tocopherol acetate (source of vitamin E), L-ascorbyl-2-polyphosphate (source of vitamin C), biotin, D-calcium pantothenate, vitamin A acetate, pyridoxine hydrochloride (vitamin B6), folic acid, niacin supplement, vitamin B12 supplement, thiamine mononitrate (vitamin B1), vitamin D3 supplement, riboflavin supplement], trace minerals [zinc proteinate, manganese proteinate, zinc oxide, ferrous sulfate, manganous oxide, copper sulfate, sodium selenite, calcium iodate, copper proteinate], marigold extract (Tagetes erecta L.), L-lysine, Yucca schidigera extract, carotene, rosemary extract, preserved with mixed tocopherols and citric acid.'
          }

          def split_top_level(s):
              s=s.strip()
              if s.endswith('.'): s=s[:-1]
              out=[]; start=0; square=0; paren=0
              for i,ch in enumerate(s):
                  if ch=='[': square+=1
                  elif ch==']': square-=1
                  elif ch=='(': paren+=1
                  elif ch==')': paren-=1
                  elif ch==',' and square==0 and paren==0:
                      out.append(s[start:i].strip()); start=i+1
              out.append(s[start:].strip())
              if square or paren: raise SystemExit('Unbalanced formula grouping')
              return out

          for r in new:
              if r['variant'] not in formulas:
                  raise SystemExit(f'No verified formula map for {r["variant"]}')
              r['ingredients_verbatim']=formulas[r['variant']]
              r['ingredients_ordered_normalized']=split_top_level(r['ingredients_verbatim'])

          # Remaining replacement chars are permitted only in conflict prose, where transport punctuation is normalized.
          replacement=[]
          def walk(v,path=''):
              if isinstance(v,dict):
                  for k,x in v.items(): walk(x,f'{path}.{k}' if path else k)
              elif isinstance(v,list):
                  for i,x in enumerate(v): walk(x,f'{path}[{i}]')
              elif isinstance(v,str) and '\ufffd' in v: replacement.append(path)
          walk(new)
          for p in replacement:
              if '.conflicts[' not in p:
                  raise SystemExit(f'Replacement remains outside conflict prose: {p}; all={replacement}')
          for r in new:
              r['conflicts']=[s.replace('\ufffd','-') for s in r.get('conflicts',[])]
          replacement2=[]
          def walk2(v,path=''):
              if isinstance(v,dict):
                  for k,x in v.items(): walk2(x,f'{path}.{k}' if path else k)
              elif isinstance(v,list):
                  for i,x in enumerate(v): walk2(x,f'{path}[{i}]')
              elif isinstance(v,str) and '\ufffd' in v: replacement2.append(path)
          walk2(new)
          if replacement2: raise SystemExit(f'Replacement chars remain: {replacement2}')

          scan_paths=[pathlib.Path('data/known-products.ts'),pathlib.Path('data/known-formulas.ts'),pathlib.Path('data/wrong-barcodes.ts'),pathlib.Path('docs/CATALOG-CONFLICTS.md')]
          scan_paths += [p for p in pathlib.Path('research').glob('*.json') if p != target]
          collisions=[]
          for p in scan_paths:
              if not p.exists(): continue
              txt=p.read_text(encoding='utf-8',errors='ignore')
              for upc in expected_upcs:
                  if upc in txt: collisions.append((upc,str(p)))
          if collisions: raise SystemExit('Repository collision(s): '+repr(collisions))
          if {r['upc'] for r in d['records']}.intersection(expected_upcs): raise SystemExit('Candidate UPC already exists in dog ledger')

          def check_upc(upc):
              if not re.fullmatch(r'\d{12}',upc): return False
              s=sum((3 if i%2==0 else 1)*int(ch) for i,ch in enumerate(upc[:-1]))
              return ((10-s%10)%10)==int(upc[-1])
          required=['upc','canonical_gtin14','barcode_scope','brand','species','product_name','variant','food_form','package_type','size','ingredients_verbatim','ingredients_ordered_normalized','guaranteed_analysis','calorie_content','formula_source','source_urls','source_accessed_at','verification_notes','research_status']
          for r in new:
              missing=[k for k in required if k not in r]
              if missing: raise SystemExit(f'Missing fields for {r.get("upc")}: {missing}')
              if not check_upc(r['upc']): raise SystemExit(f'Invalid UPC check digit {r["upc"]}')
              if r['canonical_gtin14'] != r['upc'].zfill(14): raise SystemExit(f'Bad GTIN14 {r["upc"]}')
              if r['barcode_scope']!='individual_unit' or r['brand']!='Royal Canin' or r['species']!='dog' or r['research_status']!='source_verified': raise SystemExit(f'Controlled field failure {r["upc"]}')
              ga=r['guaranteed_analysis']
              for k in ['crude_protein_min_percent','crude_fat_min_percent','crude_fiber_max_percent','moisture_max_percent']:
                  if ga.get(k) is None: raise SystemExit(f'Missing GA {k} for {r["upc"]}')
              if len(r['source_urls'])<2: raise SystemExit(f'Need formula + barcode source for {r["upc"]}')

          d['records'].extend(new)
          if len(d['records'])!=50: raise SystemExit(f'Expected 50 final records, found {len(d["records"])}')
          upcs=[r['upc'] for r in d['records']]; gtins=[r['canonical_gtin14'] for r in d['records']]
          if len(set(upcs))!=50 or len(set(gtins))!=50: raise SystemExit('Final ledger uniqueness failed')
          d['updated_at']='2026-08-25'
          target.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          json.loads(target.read_text(encoding='utf-8'))
          print('validated 50 records; appended',expected_upcs)
          PY
          rm .github/workflows/tmp-royal-canin-dogs-batch-05.yml
          rm .github/workflows/tmp-royal-canin-dogs-batch-05-retry.yml
          git config user.name "Adisabeba33"
          git config user.email "lezzgo2@gmail.com"
          git add research/deep-research-royal-canin-dogs.json .github/workflows/tmp-royal-canin-dogs-batch-05.yml .github/workflows/tmp-royal-canin-dogs-batch-05-retry.yml
          git commit -m "research: add Royal Canin dogs batch 05"
          git push origin HEAD:agent/deep-research-barcode-ledger
