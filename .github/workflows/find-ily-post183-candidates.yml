name: Find ILY post183 candidates
on:
  push:
    branches: [agent/deep-research-i-and-love-and-you]
    paths: [.github/workflows/find-ily-post183-candidates.yml]
permissions:
  contents: read
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
