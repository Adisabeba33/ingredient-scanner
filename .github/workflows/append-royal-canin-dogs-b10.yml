          d['records']+=B;d['updated_at']='2026-08-26';ups=[r['upc'] for r in d['records']];gts=[r['canonical_gtin14'] for r in d['records']];assert len(ups)==180 and len(ups)==len(set(ups)) and len(gts)==len(set(gts));p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n');[json.loads(x.read_text()) for x in sorted((root/'research').glob('deep-research-*.json'))];print('APPENDED 10 TOTAL 180');print('UPCS',','.join(r['upc'] for r in B))
