name: Finalize ZIWI Peak next 20 research records

on:
  push:
    branches: [agent/deep-research-ziwi-peak]
    paths: [.github/workflows/tmp-ziwi-finalize-next-20.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-ziwi-peak
          fetch-depth: 0

      - name: Build final batch from audited generator
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-ziwi-peak-next-20.yml').read_text(encoding='utf-8')
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          src = workflow[start:end]
          lines = []
          for line in src.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          src = '\n'.join(lines) + '\n'

          a = src.index('# ---- 3 previously missed Original Air-Dried Tripe & Lamb dog sizes. ----')
          b = src.index('# ---- Batch validation ----', a)
          replacement = r'''# ---- 3 new 3.5 oz trial bags: exact barcode/SKU from official ZIWI Shopify JSON. ----
          beef_trial_ing = "Beef, Beef Tripe, Beef Heart, Beef Lung, Beef Liver, Beef Kidney, Beef Bone, New Zealand Green Mussel, Beef Cartilage, Beef Spleen, Lecithin, Parsley, Dried Apple Pomace, Inulin (from Chicory Root), Minerals (Dipotassium Phosphate, Magnesium Sulfate, Zinc Amino Acid Complex, Iron Amino Acid Complex, Copper Amino Acid Complex, Manganese Amino Acid Complex, Selenium Yeast), Dried Organic Kelp, Salt, Preservative (Citric Acid, Mixed Tocopherols), Vitamins (Vitamin E Supplement, Thiamine Mononitrate, Riboflavin, Pyridoxine Hydrochloride, Vitamin D3 Supplement, Folic Acid)."
          beef_trial_norm = ["Beef", "Beef Tripe", "Beef Heart", "Beef Lung", "Beef Liver", "Beef Kidney", "Beef Bone", "New Zealand Green Mussel", "Beef Cartilage", "Beef Spleen", "Lecithin", "Parsley", "Dried Apple Pomace", "Inulin (from Chicory Root)", "Minerals (Dipotassium Phosphate, Magnesium Sulfate, Zinc Amino Acid Complex, Iron Amino Acid Complex, Copper Amino Acid Complex, Manganese Amino Acid Complex, Selenium Yeast)", "Dried Organic Kelp", "Salt", "Preservative (Citric Acid, Mixed Tocopherols)", "Vitamins (Vitamin E Supplement, Thiamine Mononitrate, Riboflavin, Pyridoxine Hydrochloride, Vitamin D3 Supplement, Folic Acid)"]
          rows.append(row(
              "9421016598014", "dog", "Original Air-Dried", "ZIWI Peak Original Air-Dried Beef Recipe for Dogs", "Beef Recipe", ["beef"], "all", "dry", "air_dried", "plain", "bag", "3.5 oz (100 g) trial size",
              beef_trial_ing, beef_trial_norm,
              analysis(38, 30, 3, 14, 12, 0.05, [extra("Chondroitin Sulfate", "min", 1300, "other"), extra("Glucosamine", "min", 1000, "other")]),
              calories(4900, 465, "cup"),
              ["https://us.ziwipets.com/products/air-dried-beef-dog-food", "https://us.ziwipets.com/products/air-dried-beef-dog-food.js"],
              "Current ZIWI US product page supplies the complete current formula, full printed GA, calories and adequacy; ZIWI's own Shopify variant JSON maps EAN-13 9421016598014 to trial variant 3.5oz, SKU ZPDDB0100P-US, weight 100 g.",
              "source_verified",
              "Official ZIWI Shopify JSON directly maps 9421016598014 to the available 3.5 oz trial Beef bag; no retailer reconstruction or sequential inference was used.",
              verification_notes=["GTIN-13 check digit validated independently.", "Official variant JSON reports SKU ZPDDB0100P-US and weight 100 g.", "The same official product page explicitly lists 3.5 oz trial size and the current formula/GA/calories."],
              label_deck_code=None
          ))

          chicken_trial_ing = "Chicken, Chicken Liver, Chicken Bone, Chicken Necks, New Zealand Green Mussel, Chicken Heart, Chicken Cartilage, Parsley, Dried Apple Pomace, Inulin (from Chicory Root), Minerals (Dipotassium Phosphate, Magnesium Sulfate, Zinc Amino Acid Complex, Iron Amino Acid Complex, Copper Amino Acid Complex, Manganese Amino Acid Complex, Selenium Yeast), Dried Organic Kelp, Salt, Preservative (Citric Acid, Mixed Tocopherols), Vitamins (Vitamin E Supplement, Thiamine Mononitrate, Riboflavin, Pyridoxine Hydrochloride, Vitamin D3 Supplement, Folic Acid)."
          chicken_trial_norm = ["Chicken", "Chicken Liver", "Chicken Bone", "Chicken Necks", "New Zealand Green Mussel", "Chicken Heart", "Chicken Cartilage", "Parsley", "Dried Apple Pomace", "Inulin (from Chicory Root)", "Minerals (Dipotassium Phosphate, Magnesium Sulfate, Zinc Amino Acid Complex, Iron Amino Acid Complex, Copper Amino Acid Complex, Manganese Amino Acid Complex, Selenium Yeast)", "Dried Organic Kelp", "Salt", "Preservative (Citric Acid, Mixed Tocopherols)", "Vitamins (Vitamin E Supplement, Thiamine Mononitrate, Riboflavin, Pyridoxine Hydrochloride, Vitamin D3 Supplement, Folic Acid)"]
          rows.append(row(
              "9421016598076", "dog", "Original Air-Dried", "ZIWI Peak Original Air-Dried Chicken Recipe for Dogs", "Chicken Recipe", ["chicken"], "all", "dry", "air_dried", "plain", "bag", "3.5 oz (100 g) trial size",
              chicken_trial_ing, chicken_trial_norm,
              analysis(38, 30, 3, 14, 12, 0.23, [extra("Chondroitin Sulfate", "min", 3000, "other"), extra("Glucosamine", "min", 1000, "other")]),
              calories(5000, 474, "cup"),
              ["https://us.ziwipets.com/products/air-dried-chicken-recipe-for-dogs", "https://us.ziwipets.com/products/air-dried-chicken-recipe-for-dogs.js"],
              "Current ZIWI US product page supplies the complete current formula, full printed GA, calories and adequacy; ZIWI's own Shopify variant JSON maps EAN-13 9421016598076 to trial variant 3.5oz, SKU ZPDDC0100P-US.",
              "source_verified",
              "Official ZIWI Shopify JSON directly maps 9421016598076 to the available 3.5 oz trial Chicken bag; no retailer reconstruction or sequential inference was used.",
              verification_notes=["GTIN-13 check digit validated independently.", "Official variant JSON reports SKU ZPDDC0100P-US.", "The same official product page explicitly lists 3.5 oz trial size and the current formula/GA/calories."],
              label_deck_code=None
          ))

          lamb_trial_ing = "Lamb, Lamb Tripe, Lamb Lung, Lamb Heart, Lamb Liver, Lamb Bone, New Zealand Green Mussel, Lamb Kidney, Lamb Spleen, Lecithin, Lamb Cartilage, Parsley, Dried Apple Pomace, Inulin (from Chicory Root), Minerals (Dipotassium Phosphate, Magnesium Sulfate, Zinc Amino Acid Complex, Iron Amino Acid Complex, Copper Amino Acid Complex, Manganese Amino Acid Complex, Selenium Yeast), Dried Organic Kelp, Salt, Preservative (Citric Acid, Mixed Tocopherols), Vitamins (Vitamin E Supplement, Thiamine Mononitrate, Riboflavin, Pyridoxine Hydrochloride, Vitamin D3 Supplement, Folic Acid)."
          lamb_trial_norm = ["Lamb", "Lamb Tripe", "Lamb Lung", "Lamb Heart", "Lamb Liver", "Lamb Bone", "New Zealand Green Mussel", "Lamb Kidney", "Lamb Spleen", "Lecithin", "Lamb Cartilage", "Parsley", "Dried Apple Pomace", "Inulin (from Chicory Root)", "Minerals (Dipotassium Phosphate, Magnesium Sulfate, Zinc Amino Acid Complex, Iron Amino Acid Complex, Copper Amino Acid Complex, Manganese Amino Acid Complex, Selenium Yeast)", "Dried Organic Kelp", "Salt", "Preservative (Citric Acid, Mixed Tocopherols)", "Vitamins (Vitamin E Supplement, Thiamine Mononitrate, Riboflavin, Pyridoxine Hydrochloride, Vitamin D3 Supplement, Folic Acid)"]
          rows.append(row(
              "9421016598038", "dog", "Original Air-Dried", "ZIWI Peak Original Air-Dried Lamb Recipe for Dogs", "Lamb Recipe", ["lamb"], "all", "dry", "air_dried", "plain", "bag", "3.5 oz (100 g) trial size",
              lamb_trial_ing, lamb_trial_norm,
              analysis(38, 30, 3, 14, 12, 0.15, [extra("Chondroitin Sulfate", "min", 3000, "other"), extra("Glucosamine", "min", 1000, "other")]),
              calories(4950, 469, "cup"),
              ["https://us.ziwipets.com/products/air-dried-lamb-recipe-for-dogs", "https://us.ziwipets.com/products/air-dried-lamb-recipe-for-dogs.js"],
              "Current ZIWI US product page supplies the complete current formula, full printed GA, calories and adequacy; ZIWI's own Shopify variant JSON maps EAN-13 9421016598038 to trial variant 3.5oz, SKU ZPDDL0100P-US, weight 100 g.",
              "source_verified",
              "Official ZIWI Shopify JSON directly maps 9421016598038 to the available 3.5 oz trial Lamb bag; no retailer reconstruction or sequential inference was used.",
              verification_notes=["GTIN-13 check digit validated independently.", "Official variant JSON reports SKU ZPDDL0100P-US and weight 100 g.", "The same official product page explicitly lists 3.5 oz trial size and the current formula/GA/calories."],
              label_deck_code=None
          ))

          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          final_src = src[:a] + replacement + src[b:]
          Path('/tmp/final_ziwi_merge.py').write_text(final_src, encoding='utf-8')
          print('Prepared final audited generator with official trial replacements')
          PY
          python /tmp/final_ziwi_merge.py

      - name: Commit merged ledger
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/deep-research-ziwi-peak.json
          git commit -m "research: add 20 more ZIWI Peak records"
          git push origin HEAD:agent/deep-research-ziwi-peak

      - name: Re-fetch remote ledger and validate committed batch
        run: |
          git fetch origin agent/deep-research-ziwi-peak
          git show origin/agent/deep-research-ziwi-peak:research/deep-research-ziwi-peak.json > /tmp/remote-ziwi.json
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          expected = {
            '9421038211250','9421038211243','9421038211212','9421038211267',
            '9421038211564','9421038211571','9421038211595','9421038211588',
            '9421016590193','9421016590056','9421016590087','9421016590124','9421016590117',
            '9421016594672','9421016594641','9421016590612','9421016592975',
            '9421016598014','9421016598076','9421016598038'
          }
          doc = json.loads(Path('/tmp/remote-ziwi.json').read_text(encoding='utf-8'))
          rows = doc['records']
          assert len(rows) == 136, len(rows)
          upcs = [r['upc'] for r in rows]
          assert len(upcs) == len(set(upcs)), 'duplicate UPC after remote re-fetch'
          batch = [r for r in rows if r['upc'] in expected]
          assert len(batch) == 20, len(batch)
          counts = Counter(r['research_status'] for r in batch)
          assert counts == Counter({'candidate':8, 'needs_physical_label':5, 'source_verified':7}), counts
          assert expected == {r['upc'] for r in batch}
          print('REMOTE_REFETCH_OK records=136 batch=20 statuses=' + str(dict(counts)))
          print('UPCS=' + ','.join(sorted(expected)))
          PY
