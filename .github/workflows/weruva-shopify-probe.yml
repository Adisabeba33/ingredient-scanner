name: Audit remaining Weruva current catalog
on: push
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-weruva
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit current first-party catalog
        run: |
          node <<'NODE'
          const fs=require('fs');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const norm=s=>s.toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim();
          const stripPrefix=s=>s.replace(/^(PLAY|OMG|Originals|Classic)\s+/i,'').replace(/\s+—.*$/,'').trim();
          async function getJson(url){const r=await fetch(url,{headers:{'user-agent':'Mozilla/5.0'}}); if(!r.ok) throw new Error(`${r.status} ${url}`); return r.json()}
          (async()=>{
            const md=fs.readFileSync('research/WERUVA-POST-30-INDEX.md','utf8');
            const rows=[];
            let active=false;
            for(const line of md.split(/\r?\n/)){
              if(/^## .*awaiting strict promotion/i.test(line)) active=true;
              else if(/^## /i.test(line) && !/awaiting strict promotion/i.test(line)) active=false;
              if(!active) continue;
              const m=line.match(/^\| `([0-9]{12,14})` \| ([^|]+) \| ([^|]+) \|?/);
              if(m) rows.push({upc:m[1],product:m[2].trim(),size:m[3].trim()});
            }
            const unique=[...new Map(rows.map(r=>[r.upc,r])).values()];
            const out=[];
            for(let i=0;i<unique.length;i++){
              const row=unique[i];
              const q=stripPrefix(row.product).replace(/!+/g,'').replace(/\([^)]*\)/g,'').trim();
              let suggestions=[];
              try{
                const u='https://www.weruva.com/search/suggest.json?q='+encodeURIComponent(q)+'&resources[type]=product&resources[limit]=10';
                const j=await getJson(u);
                suggestions=j?.resources?.results?.products||[];
              }catch(e){}
              const nq=norm(q);
              suggestions.sort((a,b)=>{
                const A=norm(a.title||''),B=norm(b.title||'');
                const sa=(A.includes(nq)||nq.includes(A)?10:0)+nq.split(' ').filter(x=>A.includes(x)).length;
                const sb=(B.includes(nq)||nq.includes(B)?10:0)+nq.split(' ').filter(x=>B.includes(x)).length;
                return sb-sa;
              });
              let chosen=null;
              for(const s of suggestions.slice(0,5)){
                const handle=(s.url||'').match(/\/products\/([^?]+)/)?.[1];
                if(!handle) continue;
                try{
                  const p=await getJson(`https://www.weruva.com/products/${handle}.js`);
                  const variants=(p.variants||[]).map(v=>({title:v.title,sku:v.sku||null,barcode:v.barcode||null}));
                  const exact=variants.find(v=>v.barcode===row.upc);
                  const sizeToken=row.size.toLowerCase().replace(/\s+/g,'');
                  const sizeMatches=variants.filter(v=>norm(v.title).replace(/\s+/g,'').includes(sizeToken.replace(/[^a-z0-9.]/g,'')));
                  chosen={title:p.title,handle,url:`https://www.weruva.com/products/${handle}`,variants,exact_upc_on_current_page:!!exact,exact_variant:exact||null,size_candidate_variants:sizeMatches};
                  if(exact) break;
                }catch(e){}
              }
              out.push({...row,query:q,current:chosen,status:chosen?(chosen.exact_upc_on_current_page?'current_upc_exact':'current_product_found_upc_changed_or_unmatched'):'manufacturer_product_not_resolved'});
              if(i%10===0) console.log(i,row.upc,row.product,out[out.length-1].status);
              await sleep(80);
            }
            const summary={index_rows:rows.length,unique_upcs:unique.length,current_upc_exact:out.filter(x=>x.status==='current_upc_exact').length,current_product_found_upc_changed_or_unmatched:out.filter(x=>x.status==='current_product_found_upc_changed_or_unmatched').length,manufacturer_product_not_resolved:out.filter(x=>x.status==='manufacturer_product_not_resolved').length};
            fs.writeFileSync('research/WERUVA-CURRENT-CATALOG-AUDIT.json',JSON.stringify({generated_at:new Date().toISOString(),summary,records:out},null,2));
            console.log(summary);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/WERUVA-CURRENT-CATALOG-AUDIT.json
          git commit -m 'research: audit remaining Weruva UPCs against current catalog' || exit 0
          git push
