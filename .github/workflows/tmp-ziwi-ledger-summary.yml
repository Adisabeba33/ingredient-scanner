name: Summarize ZIWI ledger coverage
on:
  push:
    branches: [agent/deep-research-ziwi-peak]
    paths: [.github/workflows/tmp-ziwi-ledger-summary.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-ziwi-peak
      - name: Print compact ledger coverage
        run: |
          python - <<'PY'
          import json
          from collections import Counter,defaultdict
          p='research/deep-research-ziwi-peak.json'
          rows=json.load(open(p,encoding='utf-8'))['records']
          print('TOTAL',len(rows))
          print('STATUS',dict(Counter(r['research_status'] for r in rows)))
          print('SPECIES',dict(Counter(r['species'] for r in rows)))
          print('LINES')
          for (species,line),count in sorted(Counter((r['species'],r.get('product_line')) for r in rows).items(),key=lambda x:(x[0][0],str(x[0][1]))):
              print(species,'|',line,'|',count)
          print('RECORDS')
          for r in sorted(rows,key=lambda x:(x['species'],str(x.get('product_line')),x['product_name'],x['size'],x['upc'])):
              print(f"{r['species']}|{r.get('product_line')}|{r['product_name']}|{r['size']}|{r['upc']}|{r['research_status']}")
          PY
