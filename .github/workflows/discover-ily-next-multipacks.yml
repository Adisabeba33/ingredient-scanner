name: Discover next ILY multipacks
on:
  push:
    branches: [agent/deep-research-i-and-love-and-you]
    paths: [.github/workflows/discover-ily-next-multipacks.yml]
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-i-and-love-and-you
      - run: python .github/scripts/discover-ily-next-multipacks.py
