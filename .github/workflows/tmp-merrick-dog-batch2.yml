          assert len(ledger['records'])==40, len(ledger['records'])
          M='Merrick Pet Care'
          items=[
            dict(upc='022808260219',path='/shop/lil-plates-grain-free-itsy-bitsy-beef-stew-wet-dog-food',line="Lil' Plates",variant='Itsy Bitsy Beef Stew',recipe=['beef'],life='adult',texture='stew',presentation='in_gravy',size='3.5 oz',pkg='tub'),
            dict(upc='022808260264',path='/shop/lil-plates-teeny-texas-steak-tips-wet-dog-food',line="Lil' Plates",variant='Teeny Texas Steak Tips Dinner in Gravy',recipe=['beef'],life='adult',texture='unknown',presentation='in_gravy',size='3.5 oz',pkg='tub'),
