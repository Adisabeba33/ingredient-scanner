name: Resolve Merrick Petite Pate unit UPCs
on:
  push:
    branches: [agent/deep-research-merrick]
    paths: [.github/workflows/tmp-merrick-dog-batch2.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect size and UPC bindings
        run: |
          python - <<'PY'
          import urllib.request,re,html,json
          H={'User-Agent':'Mozilla/5.0'}
          urls=[
            'https://www.merrickpetcare.com/shop/lil-plates-petite-pates-chicken-wet-dog-food',
            'https://www.merrickpetcare.com/shop/lil-plates-petite-pates-lamb-wet-dog-food',
            'https://www.merrickpetcare.com/shop/lil-plates-petite-pates-turkey-wet-dog-food',
            'https://www.merrickpetcare.com/shop/lil-plates-petite-pates-beef-wet-dog-food',
          ]
          def get(u):
            req=urllib.request.Request(u,headers=H)
            with urllib.request.urlopen(req,timeout=30) as r:return r.read().decode('utf-8','replace')
          def clean(s):
            return re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',s))).strip()
          for u in urls:
            try: raw=get(u)
            except Exception as e:
              print('ERR',u,repr(e)); continue
            h1=re.search(r'<h1[^>]*>(.*?)</h1>',raw,re.I|re.S)
            print('\nPDP',clean(h1.group(1)) if h1 else u)
            print('URL',u)
            skus=list(re.finditer(r'ps-sku="(\d+)"',raw,re.I))
            print('ALL_SKUS',[m.group(1) for m in skus[:12]])
            for i,m in enumerate(skus[:4]):
              print('SKU_CONTEXT',i,m.group(1),clean(raw[max(0,m.start()-1800):m.end()+1200])[:2500])
            # Any structured data containing gtin/upc/sku and package-size strings.
            for pat in [r'.{0,350}(?:3-3 oz|3 oz\.? Can|3 oz|gtin|upc).{0,500}',r'.{0,500}ps-sku="\d+".{0,500}']:
              vals=[]
              for m in re.finditer(pat,raw,re.I|re.S):
                c=clean(m.group(0))
                if c not in vals: vals.append(c)
              for c in vals[:12]: print('STRUCT',c[:1800])
          PY
