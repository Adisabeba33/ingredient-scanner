            dict(upc='022808002888',path='/shop/grain-free-puppy-plate-chicken-in-gravy-wet-dog-food',line='Grain Free',variant='Puppy Plate Chicken Recipe In Gravy',recipe=['chicken'],life='puppy',texture='unknown',presentation='in_gravy',size='12.7 oz',pkg='can'),
            dict(upc='022808002123',path='/shop/grain-free-duck-wet-dog-food',line='Grain Free',variant='Real Duck Dinner',recipe=['duck'],life=None,texture='unknown',presentation='plain',size='12.7 oz',pkg='can'),
            dict(upc='022808004868',path='/shop/grain-free-beef-wet-dog-food',line='Grain Free',variant='Real Texas Beef Dinner',recipe=['beef'],life=None,texture='unknown',presentation='plain',size='12.7 oz',pkg='can'),
            dict(upc='022808002666',path='/shop/grain-free-turducken-in-gravy-wet-dog-food',line='Grain Free',variant='Turducken In Gravy',recipe=['turkey','duck','chicken'],life=None,texture='unknown',presentation='in_gravy',size='12.7 oz',pkg='can'),
            dict(upc='022808004844',path='/shop/grain-free-chicken-wet-dog-food',line='Grain Free',variant='Real Chicken Dinner',recipe=['chicken'],life=None,texture='unknown',presentation='plain',size='12.7 oz',pkg='can'),
            dict(upc='022808001751',path='/shop/grain-free-grammys-pot-pie-wet-dog-food',line='Grain Free',variant="Grammy's Pot Pie In Gravy",recipe=['chicken'],life=None,texture='unknown',presentation='in_gravy',size='12.7 oz',pkg='can'),
            dict(upc='022808260295',path='/shop/lil-plates-small-surfin-turfin-supper-wet-dog-food',line="Lil' Plates",variant="Small Surfin' + Turfin' Supper in Gravy",recipe=['beef','salmon'],life='adult',texture='unknown',presentation='in_gravy',size='3.5 oz',pkg='tub'),
            dict(upc='022808260271',path='/shop/lil-plates-grain-free-pint-sized-puppy-plate-in-gravy-wet-dog-food',line="Lil' Plates",variant='Pint Sized Puppy Plate Recipe in Gravy',recipe=['chicken','turkey'],life='puppy',texture='unknown',presentation='in_gravy',size='3.5 oz',pkg='tub'),
            dict(upc='022808260240',path='/shop/lil-plates-grain-free-dainty-duck-medley-wet-dog-food',line="Lil' Plates",variant='Dainty Duck Medley in Gravy',recipe=['duck'],life='adult',texture='medley',presentation='in_gravy',size='3.5 oz',pkg='tub'),
            dict(upc='022808370017',path='/shop/backcountry-grain-free-chicken-wet-dog-food',line='Backcountry',variant='Real Chicken Dinner',recipe=['chicken'],life='adult',texture='unknown',presentation='plain',size='12.7 oz',pkg='can'),
            dict(upc='022808260202',path='/shop/lil-plates-grain-free-tiny-thanksgiving-dinner-wet-dog-food',line="Lil' Plates",variant='Tiny Thanksgiving Day Dinner',recipe=['turkey','chicken'],life='adult',texture='unknown',presentation='unknown',size='3.5 oz',pkg='tub'),
            dict(upc='022808260233',path='/shop/lil-plates-grain-free-little-lamb-chop-stew-wet-dog-food',line="Lil' Plates",variant='Little Lamb Chop Stew',recipe=['lamb','beef'],life='adult',texture='stew',presentation='unknown',size='3.5 oz',pkg='tub'),
            dict(upc='022808260226',path='/shop/lil-plates-grain-free-petite-pot-pie-wet-dog-food',line="Lil' Plates",variant='Petite Pot Pie',recipe=['chicken'],life='adult',texture='unknown',presentation='unknown',size='3.5 oz',pkg='tub'),
            dict(upc='022808010388',path='/shop/lil-plates-petite-pates-beef-wet-dog-food',line="Lil' Plates",variant='Petite Pate Beef Dinner',recipe=['beef'],life='adult',texture='pate',presentation='plain',size='3 oz',pkg='can',manual='beef'),
            dict(upc='022808010401',path='/shop/lil-plates-petite-pates-chicken-wet-dog-food',line="Lil' Plates",variant='Petite Pates Chicken Dinner',recipe=['chicken'],life='adult',texture='pate',presentation='plain',size='3 oz',pkg='can',manual='chicken'),
            dict(upc='022808010425',path='/shop/lil-plates-petite-pates-lamb-wet-dog-food',line="Lil' Plates",variant='Petite Pate Lamb Dinner',recipe=['lamb'],life='adult',texture='pate',presentation='plain',size='3 oz',pkg='can',manual='lamb'),
          ]
          assert len(items)==20 and len({x['upc'] for x in items})==20
          manual={
            'beef':dict(ingredients='Deboned Beef, Beef Broth, Beef Liver, Carrots, Green Beans, Flaxseed Oil, Dried Egg Product, Natural Flavor, Choline Chloride, Potassium Chloride, Salt, Guar Gum, Vitamins (Vitamin E Supplement, Vitamin B12 Supplement, d-Calcium Pantothenate, Vitamin A Supplement, Niacin, Vitamin D3 Supplement, Riboflavin Supplement, Folic Acid, Pyridoxine Hydrochloride, Biotin, Thiamine Mononitrate), Minerals (Zinc Amino Acid Complex, Iron Amino Acid Complex, Manganese Amino Acid Complex, Copper Amino Acid Complex, Potassium Iodate, Cobalt Glucoheptonate, Sodium Selenite), Cumin, Xanthan Gum, Cinnamon, Taurine.',ga=(8,5,2,78),kg=1201,unit=102,deck='B287023',pdf='https://www.merrickpetcare.com/sites/default/files/2024-04/2870_-_B287023_Merrick_Lil_Plates_Petite_Pate_Beef_Dinner_Dog_Food_3oz.pdf'),
            'chicken':dict(ingredients='Deboned Chicken, Chicken Broth, Chicken Liver, Carrots, Green Beans, Dried Egg Product, Natural Flavor, Flaxseed Oil, Choline Chloride, Potassium Chloride, Salt, Guar Gum, Vitamins (Vitamin E Supplement, Vitamin B12 Supplement, d-Calcium Pantothenate, Vitamin A Supplement, Niacin, Vitamin D3 Supplement, Riboflavin Supplement, Folic Acid, Pyridoxine Hydrochloride, Biotin, Thiamine Mononitrate), Minerals (Zinc Amino Acid Complex, Iron Amino Acid Complex, Manganese Amino Acid Complex, Copper Amino Acid Complex, Potassium Iodate, Cobalt Glucoheptonate, Sodium Selenite), Xanthan Gum, Taurine, Rosemary, Sage, Thyme.',ga=(8,5,2,78),kg=1184,unit=101,deck='B287123',pdf='https://www.merrickpetcare.com/sites/default/files/2024-04/2871-B287123_Merrick_Lil_Plates_Petite_Pate_Chicken_Dinner_Dog_Food_3oz.pdf'),
            'lamb':dict(ingredients='Deboned Lamb, Beef Broth, Beef Liver, Dried Egg Product, Carrots, Green Beans, Natural Flavor, Flaxseed Oil, Choline Chloride, Potassium Chloride, Magnesium Sulfate, Salt, Guar Gum, Vitamins (Vitamin E Supplement, Vitamin B12 Supplement, d-Calcium Pantothenate, Vitamin A Supplement, Niacin, Vitamin D3 Supplement, Riboflavin Supplement, Folic Acid, Pyridoxine Hydrochloride, Biotin, Thiamine Mononitrate), Minerals (Zinc Amino Acid Complex, Iron Amino Acid Complex, Manganese Amino Acid Complex, Copper Amino Acid Complex, Potassium Iodate, Cobalt Glucoheptonate, Sodium Selenite), Cumin, Xanthan Gum, Cinnamon, Taurine.',ga=(8,5,2,78),kg=1320,unit=112,deck='B287223',pdf='https://www.merrickpetcare.com/sites/default/files/2024-04/2872-B287223_Merrick_Lil_Plates_Petite_Pate_Lamb_Dinner_Dog_Food_3oz.pdf'),
          }
          def get(u):
            req=urllib.request.Request(u,headers=H)
            with urllib.request.urlopen(req,timeout=30) as r:return r.read().decode('utf-8','replace')
          def clean(s):
            s=re.sub(r'<script\b[^>]*>.*?</script>',' ',s,flags=re.I|re.S); s=re.sub(r'<style\b[^>]*>.*?</style>',' ',s,flags=re.I|re.S); s=re.sub(r'<[^>]+>',' ',s); return re.sub(r'\s+',' ',html.unescape(s)).strip()
          def split_top(s):
            out=[]; start=0; par=0; sq=0
            for i,ch in enumerate(s):
              if ch=='(': par+=1
              elif ch==')': par=max(0,par-1)
              elif ch=='[': sq+=1
              elif ch==']': sq=max(0,sq-1)
              elif ch==',' and par==0 and sq==0: out.append(s[start:i].strip()); start=i+1
            tail=s[start:].strip().rstrip('.')
            if tail: out.append(tail)
            return out
          def valid(s):
            return len(s)==12 and s.isdigit() and (10-sum(int(s[i])*(3 if i%2==0 else 1) for i in range(11))%10)%10==int(s[-1])
          # live exclusions excluding the target itself, then existing target baseline separately
          paths=[Path('data/known-products.ts'),Path('data/known-formulas.ts'),Path('data/wrong-barcodes.ts'),Path('docs/CATALOG-CONFLICTS.md')]+[p for p in Path('research').glob('deep-research-*.json') if p!=target]
          old={r['upc'] for r in ledger['records']}; collisions=[]
          for x in items:
            assert valid(x['upc']), x['upc']; assert x['upc'] not in old and x['upc'].zfill(14) not in {r['canonical_gtin14'] for r in ledger['records']}
            for p in paths:
              if not p.exists(): continue
              txt=p.read_text(encoding='utf-8',errors='replace')
              if re.search(r'(?<!\d)'+x['upc']+r'(?!\d)',txt) or re.search(r'(?<!\d)'+x['upc'].zfill(14)+r'(?!\d)',txt): collisions.append((x['upc'],str(p)))
          assert not collisions,collisions
          new=[]
          for x in items:
            url=BASE+x['path']; raw=get(url); text=clean(raw); low=text.lower()
            skus=re.findall(r'ps-sku="(\d+)"',raw,re.I); assert skus and skus[0]==x['upc'],(x['upc'],skus[:3],url)
            h1=re.search(r'<h1[^>]*>(.*?)</h1>',raw,re.I|re.S); title=clean(h1.group(1)) if h1 else x['variant']
            msize=re.search(r'available sizes\s+(.{0,220}?)product description',text,re.I); size_chunk=msize.group(1).strip() if msize else ''
            assert x['size'].replace(' ','').lower() in size_chunk.replace(' ','').lower(),(x['upc'],size_chunk)
            conflicts=[]; urls=[url,'https://www.merrickpetcare.com/dog-food/wet']
            if x.get('manual'):
              f=manual[x['manual']]; ingredients=f['ingredients']; protein,fat,fiber,moist=f['ga']; kg=f['kg']; unit=f['unit']; unit_name='can'; deck=f['deck']; urls.insert(1,f['pdf'])
              if x['upc']=='022808010401':
                urls.append('https://www.canpetinc.com/product/5979/merrick-3100')
                barcode_note='Merrick current official PDP exposes UPC 022808010401 as its primary PriceSpider ps-sku. Because the page also mentions a 3-by-3-oz offer, current Canadian distributor Can-Pet independently maps UPC 0 22808 01040 1 to the 85 g individual Chicken Dinner item sold in a 24-unit case; the code is therefore stored as the individual can UPC, not a multipack code.'
              else:
                barcode_note=f"Merrick current official PDP exposes UPC {x['upc']} as the primary PriceSpider ps-sku and lists the sellable size as a single 3 oz can; the matching current Merrick 3 oz formula deck {deck} identifies the same flavor and can size."
            else:
              mg=low.find('guaranteed analysis'); mc=low.find('calorie content',mg+1); assert mg>=0 and mc>mg,(x['upc'],mg,mc)
              mi=low.rfind('ingredients',0,mg); assert mi>=0,(x['upc'],'no ingredients heading')
              ingredients=text[mi+len('ingredients'):mg].strip()
              d=re.search(r'\b([A-Z]\d{6}(?:-\d+)?)\b\s*$',ingredients)
              deck=d.group(1) if d else None
              if d: ingredients=ingredients[:d.start()].strip().rstrip('.')+'.'
              ga=text[mg+len('guaranteed analysis'):mc]
              def gv(label):
                m=re.search(label+r'\s*\((?:min|max)\)[^0-9]{0,30}([0-9.]+)\s*%',ga,re.I); assert m,(x['upc'],label,ga[:300]); return float(m.group(1))
              protein=gv('Crude Protein'); fat=gv('Crude Fat'); fiber=gv('Crude Fiber'); moist=gv('Moisture')
              end=min([v for v in [low.find('download',mc),low.find('feeding',mc)] if v>=0] or [len(text)]); cal=text[mc:end]
              mk=re.search(r'([0-9,]+)\s*kcal(?:\s*ME)?\s*/\s*kg',cal,re.I); mu=re.search(r'([0-9,]+)\s*kcal(?:\s*ME)?\s*/\s*(can|bowl|pouch)',cal,re.I); assert mk and mu,(x['upc'],cal)
              kg=int(mk.group(1).replace(',','')); unit=int(mu.group(1).replace(',','')); unit_name=mu.group(2).lower()
              barcode_note=f"Merrick current official PDP exposes UPC {x['upc']} as the primary PriceSpider ps-sku for this exact product and lists the individual package as {size_chunk}."
              if x['pkg']=='tub' and unit_name=='pouch': conflicts.append('Merrick current PDP lists the package as a 3.5 oz tub but prints the calorie unit as kcal/pouch; the printed calorie wording is preserved rather than silently changed.')
            name='Merrick '+title if not title.lower().startswith('merrick ') else title
            kgw={'12.7 oz':0.3600,'3.5 oz':0.0992,'3 oz':0.0850}[x['size']]; expected=kg*kgw; diff=round(abs(expected-unit),1)
            notes=[f"UPC-A check digit validated for {x['upc']}; canonical GTIN-14 is {x['upc'].zfill(14)}.",f"Current official Merrick PDP identifies the current retail product and package size; complete current ingredients, guaranteed analysis and calories are stored from Merrick first-party formula evidence.",f"Calorie cross-check: {kg} kcal/kg × {kgw:.4f} kg nominal {x['size']} package = {expected:.1f} kcal versus {unit} kcal/{unit_name} printed (difference {diff:.1f} kcal, consistent with nominal-weight/label rounding where applicable).",f"Controlled texture/presentation use repository vocabulary: texture={x['texture']}, presentation={x['presentation']}.","Active-market gate: the product is present in Merrick's current US wet-dog catalog and the manufacturer PDP exposes its Where-to-Buy PriceSpider identity."]
            if x.get('manual'): notes.append(f"Matching Merrick formula deck {deck} explicitly identifies a 3 oz can and adult-maintenance AAFCO adequacy for this recipe.")
            rec={'catalog_number':None,'upc':x['upc'],'canonical_gtin14':x['upc'].zfill(14),'barcode_scope':'individual_unit','brand':'Merrick','manufacturer':M,'species':'dog','product_line':x['line'],'product_name':name,'variant':x['variant'],'recipe':x['recipe'],'life_stage':x['life'],'food_form':'wet','texture':x['texture'],'presentation':x['presentation'],'package_type':x['pkg'],'size':x['size'],'ingredients_verbatim':ingredients,'ingredients_ordered_normalized':split_top(ingredients),'guaranteed_analysis':{'crude_protein_min_percent':protein,'crude_fat_min_percent':fat,'crude_fiber_max_percent':fiber,'moisture_max_percent':moist,'ash_max_percent':None,'taurine_min_percent':None,'other_printed_guarantees':[]},'calorie_content':{'kcal_per_kg':kg,'kcal_per_unit':unit,'unit_name':unit_name},'label_deck_code':deck,'formula_source':('Merrick current official US product page and matching current first-party 3 oz formula deck '+deck+'.' if x.get('manual') else 'Merrick current official US product page'+(f', current formula deck {deck}.' if deck else '.')),'source_urls':urls,'source_accessed_at':DATE,'barcode_notes':barcode_note,'conflicts':conflicts,'verification_notes':notes,'research_status':'source_verified'}
            new.append(rec); print('READY',x['upc'],title,x['size'],protein,fat,fiber,moist,kg,unit,unit_name,deck)
          assert len(new)==20 and len({r['upc'] for r in new})==20
          ledger['records'].extend(new); ledger['updated_at']=DATE
          assert len(ledger['records'])==60 and len({r['upc'] for r in ledger['records']})==60
          target.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('APPEND_OK old=40 added=20 total=60')
          print('UPCS',','.join(r['upc'] for r in new))
          PY
          git config user.name "OpenAI Research Agent"
          git config user.email "noreply@openai.com"
          git add research/deep-research-merrick.json
          git commit -m "research: add third 20 active Merrick barcodes"
          git push origin HEAD:agent/deep-research-merrick
