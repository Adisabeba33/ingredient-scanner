name: Audit Merrick batch 3 normalization
on:
  push:
    branches: [agent/deep-research-merrick]
    paths: [.github/workflows/tmp-merrick-dog-batch2.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-merrick
      - name: Audit premix grouping
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('research/deep-research-merrick.json').read_text())
          batch=set(['022808260219','022808260264','022808006688','022808008125','022808002888','022808002123','022808004868','022808002666','022808004844','022808001751','022808260295','022808260271','022808260240','022808370017','022808260202','022808260233','022808260226','022808010388','022808010401','022808010425'])
          anomalies=[]
          for r in data['records']:
            if r['upc'] not in batch: continue
            a=r['ingredients_ordered_normalized']
            for i,v in enumerate(a):
              if v.strip().upper() in {'VITAMINS','MINERALS'}:
                anomalies.append((r['upc'],i,v,a[i+1] if i+1<len(a) else None))
          print('ANOMALIES',anomalies)
          PY
