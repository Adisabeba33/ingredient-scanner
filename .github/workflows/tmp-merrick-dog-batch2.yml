name: Append Merrick active batch 3
on:
  push:
    branches: [agent/deep-research-merrick]
    paths: [.github/workflows/tmp-merrick-dog-batch2.yml]
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-merrick
      - name: Validate, append, and push 20 active individual units
        run: |
          python - <<'PY'
