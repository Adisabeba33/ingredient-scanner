name: Validate committed Merrick batch 3
on:
  push:
    branches: [agent/deep-research-merrick]
    paths: [.github/workflows/tmp-merrick-dog-batch2.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-merrick
      - name: Validate remote ledger after batch 3
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from collections import Counter
          target=Path('research/deep-research-merrick.json')
          data=json.loads(target.read_text(encoding='utf-8'))
          recs=data['records']
          batch=['022808260219','022808260264','022808006688','022808008125','022808002888','022808002123','022808004868','022808002666','022808004844','022808001751','022808260295','022808260271','022808260240','022808370017','022808260202','022808260233','022808260226','022808010388','022808010401','022808010425']
          assert len(recs)==60
          upcs=[r['upc'] for r in recs]; gtins=[r['canonical_gtin14'] for r in recs]
          assert len(set(upcs))==60 and len(set(gtins))==60
          found=[r for r in recs if r['upc'] in batch]
          assert len(found)==20 and {r['upc'] for r in found}==set(batch)
          def valid(s):
            return len(s)==12 and s.isdigit() and (10-sum(int(s[i])*(3 if i%2==0 else 1) for i in range(11))%10)%10==int(s[-1])
          assert all(valid(x) for x in upcs)
          assert all(r['canonical_gtin14']==r['upc'].zfill(14) for r in recs)
          assert all(r['research_status']=='source_verified' for r in found)
          assert all(r['barcode_scope']=='individual_unit' for r in found)
          assert all(r['species']=='dog' and r['food_form']=='wet' for r in found)
          required=['product_name','variant','size','ingredients_verbatim','ingredients_ordered_normalized','guaranteed_analysis','calorie_content','formula_source','source_urls','source_accessed_at','barcode_notes','verification_notes']
          for r in found:
            for k in required: assert r.get(k), (r['upc'],k)
            ga=r['guaranteed_analysis']; cal=r['calorie_content']
            assert ga['crude_protein_min_percent'] is not None and ga['crude_fat_min_percent'] is not None and ga['crude_fiber_max_percent'] is not None and ga['moisture_max_percent'] is not None
            assert cal['kcal_per_kg'] is not None and cal['kcal_per_unit'] is not None
          # Global exclusion sweep, excluding target itself.
          paths=[Path('data/known-products.ts'),Path('data/known-formulas.ts'),Path('data/wrong-barcodes.ts'),Path('docs/CATALOG-CONFLICTS.md')]+[p for p in Path('research').glob('deep-research-*.json') if p!=target]
          collisions=[]
          for p in paths:
            if not p.exists(): continue
            txt=p.read_text(encoding='utf-8',errors='replace')
            for code in batch:
              if re.search(r'(?<!\d)'+code+r'(?!\d)',txt) or re.search(r'(?<!\d)'+code.zfill(14)+r'(?!\d)',txt): collisions.append((code,str(p)))
          assert not collisions,collisions
          print('REMOTE_BATCH3_OK')
          print('TOTAL',len(recs))
          print('STATUS',dict(Counter(r['research_status'] for r in recs)))
          print('SCOPE',dict(Counter(r['barcode_scope'] for r in recs)))
          print('SPECIES',dict(Counter(r['species'] for r in recs)))
          print('FORM',dict(Counter(r['food_form'] for r in recs)))
          print('SIZE',dict(Counter(r['size'] for r in recs)))
          print('BATCH',','.join(batch))
          print('COLLISIONS',collisions)
          PY
