name: Temporary Royal Canin dogs 61-70 postvalidate
on:
  push:
    paths:
      - '.github/workflows/tmp-royal-canin-dogs-61-70-postvalidate.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: Parse published ledger and cleanup validator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Adisabeba33"
          git config user.email "lezzgo2@gmail.com"
          git pull --rebase origin agent/deep-research-barcode-ledger
          test "$(git hash-object research/deep-research-royal-canin-dogs.json)" = "feea9ef2f1624bd6b6dc6a79eb2de72ffae0dfa7"
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('research/deep-research-royal-canin-dogs.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          expected={'030111418630','030111454539','030111505835','030111464415','030111460356','030111460257','030111453037','030111184306','030111494177','030111513427'}
          assert len(d['records'])==70
          assert len({r['upc'] for r in d['records']})==70
          assert len({r['canonical_gtin14'] for r in d['records']})==70
          assert sum(r['research_status']=='source_verified' for r in d['records'])==70
          got={r['upc'] for r in d['records'][-10:]}
          assert got==expected,(got,expected)
          for u in expected:
              rows=[r for r in d['records'] if r['upc']==u]
              assert len(rows)==1
              r=rows[0]
              assert r['source_accessed_at']=='2026-08-26'
              assert r['brand']=='Royal Canin' and r['species']=='dog' and r['barcode_scope']=='individual_unit'
              assert r['ingredients_verbatim'] and r['ingredients_ordered_normalized']
              assert r['calorie_content']['kcal_per_kg'] is not None and r['calorie_content']['kcal_per_unit'] is not None
          print('post-commit published ledger parsed: 70 records, 70 source_verified; batch 61-70 exact match')
          PY
          git rm .github/workflows/tmp-royal-canin-dogs-61-70-postvalidate.yml
          git commit -m "chore: remove Royal Canin dogs post-validator"
          git pull --rebase origin agent/deep-research-barcode-ledger
          git push origin HEAD:agent/deep-research-barcode-ledger
