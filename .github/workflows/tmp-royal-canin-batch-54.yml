name: Temporary Royal Canin batch 54 apply
on:
  push:
    paths:
      - '.github/workflows/tmp-royal-canin-batch-54.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: Append verified Royal Canin records
        shell: python
        run: |
          import base64, json, pathlib, subprocess, zlib
          encoded = ''''''
          batch = json.loads(zlib.decompress(base64.b64decode(encoded)).decode())
          path = pathlib.Path('research/deep-research-royal-canin.json')
          doc = json.loads(path.read_text())
          assert len(doc['records']) == 44, f"Expected 44 existing records, found {len(doc['records'])}"
          existing_upcs = {r['upc'] for r in doc['records']}
          existing_gtins = {r['canonical_gtin14'] for r in doc['records']}
          def check_digit(upc):
              assert len(upc) == 12 and upc.isdigit()
              total = sum(int(d) * (3 if i % 2 == 0 else 1) for i, d in enumerate(upc[:11]))
              return str((-total) % 10)
          new_upcs = set()
          new_gtins = set()
          for r in batch:
              assert r['brand'] == 'Royal Canin'
              assert r['catalog_number'] is None
              assert r['research_status'] == 'source_verified'
              assert r['barcode_scope'] == 'individual_unit'
              assert r['food_form'] == 'dry'
              assert r['texture'] == 'kibble'
              assert r['presentation'] == 'plain'
              assert r['package_type'] == 'bag'
              assert r['upc'][-1] == check_digit(r['upc'])
              assert r['canonical_gtin14'] == r['upc'].zfill(14)
              assert r['upc'] not in existing_upcs and r['upc'] not in new_upcs
              assert r['canonical_gtin14'] not in existing_gtins and r['canonical_gtin14'] not in new_gtins
              assert r['ingredients_verbatim'] and r['ingredients_ordered_normalized']
              assert isinstance(r['source_urls'], list) and r['source_urls']
              assert isinstance(r['conflicts'], list)
              assert isinstance(r['verification_notes'], list) and r['verification_notes']
              new_upcs.add(r['upc']); new_gtins.add(r['canonical_gtin14'])
          doc['records'].extend(batch)
          doc['updated_at'] = '2026-08-25'
          assert len(doc['records']) == 54
          assert len({r['upc'] for r in doc['records']}) == 54
          assert len({r['canonical_gtin14'] for r in doc['records']}) == 54
          path.write_text(json.dumps(doc, ensure_ascii=False, separators=(',', ':')) + '\n')
          json.loads(path.read_text())
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add',str(path)], check=True)
          subprocess.run(['git','commit','-m','research: add 10 verified Royal Canin cat dry SKUs'], check=True)
          subprocess.run(['git','push','origin','HEAD:agent/deep-research-barcode-ledger'], check=True)
