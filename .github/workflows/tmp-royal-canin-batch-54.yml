name: Temporary Royal Canin batch 54 verify
on:
  push:
    paths:
      - '.github/workflows/tmp-royal-canin-batch-54.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: Verify committed Royal Canin ledger
        shell: python
        run: |
          import hashlib, json, pathlib
          path = pathlib.Path('research/deep-research-royal-canin.json')
          doc = json.loads(path.read_text())
          expected = [
            '030111623034','030111623072','030111623157','030111543578','030111549808',
            '030111431837','030111626035','030111524065','030111201362','030111215062'
          ]
          assert len(doc['records']) == 54, len(doc['records'])
          assert [r['upc'] for r in doc['records'][-10:]] == expected
          assert len({r['upc'] for r in doc['records']}) == 54
          assert len({r['canonical_gtin14'] for r in doc['records']}) == 54
          assert sum(r['research_status'] == 'source_verified' for r in doc['records']) == 54
          assert all(r['brand'] == 'Royal Canin' for r in doc['records'])
          def check_digit(upc):
              total = sum(int(d) * (3 if i % 2 == 0 else 1) for i, d in enumerate(upc[:11]))
              return str((-total) % 10)
          for r in doc['records']:
              assert len(r['upc']) == 12 and r['upc'].isdigit() and r['upc'][-1] == check_digit(r['upc'])
              assert r['canonical_gtin14'] == r['upc'].zfill(14)
          raw_last10 = json.dumps(doc['records'][-10:], ensure_ascii=False, separators=(',', ':'))
          assert hashlib.sha256(raw_last10.encode()).hexdigest() == 'd1867425aab9c2720a926a06606347f660ea1e86e6218759c2679bb061a0b5ca'
          hs = next(r for r in doc['records'] if r['upc'] == '030111626035')
          assert hs['size'] == '3 lb'
          assert hs['conflicts'] and '3.5 lb' in hs['conflicts'][0]
          print('Verified: 54 Royal Canin records; exact batch hash matched; all UPC/GTIN values unique and valid.')
