name: Merge next Royal Canin Cats research batch

on:
  push:
    branches:
      - agent/deep-research-barcode-ledger
    paths:
      - .github/workflows/merge-royal-canin-cats-b2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0

      - name: Validate exclusions and append batch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          target_path = Path('research/deep-research-royal-canin.json')
          payload_path = Path('research/.royal-canin-cats-append-2026-08-26-b2.json')
          target = json.loads(target_path.read_text(encoding='utf-8'))
          payload = json.loads(payload_path.read_text(encoding='utf-8'))
          rows = payload['records']
          assert len(rows) == 10, f'Expected 10 records, got {len(rows)}'

          candidates = [r['upc'] for r in rows]
          assert len(candidates) == len(set(candidates)), 'Duplicate UPC inside batch'

          def valid_upca(code):
              if len(code) != 12 or not code.isdigit():
                  return False
              d = [int(x) for x in code]
              s = sum(x * (3 if i % 2 == 0 else 1) for i, x in enumerate(d[:11]))
              return (10 - s % 10) % 10 == d[-1]

          required = ['upc','canonical_gtin14','barcode_scope','brand','species','product_name','size','ingredients_verbatim','ingredients_ordered_normalized','guaranteed_analysis','calorie_content','source_urls','research_status']
          for i, row in enumerate(rows, 1):
              missing = [k for k in required if k not in row]
              assert not missing, f'Record {i} missing {missing}'
              assert row['brand'] == 'Royal Canin'
              assert row['species'] == 'cat'
              assert row['barcode_scope'] == 'individual_unit'
              assert valid_upca(row['upc']), f'Invalid UPC-A: {row["upc"]}'
              assert row['canonical_gtin14'] == row['upc'].zfill(14), f'GTIN mismatch: {row["upc"]}'
              assert row['ingredients_verbatim'].strip()
              assert isinstance(row['ingredients_ordered_normalized'], list) and row['ingredients_ordered_normalized']
              assert row['source_urls']

          existing = target['records']
          existing_upcs = [r['upc'] for r in existing]
          assert len(existing_upcs) == len(set(existing_upcs)), 'Target already contains duplicate UPCs'
          overlap_target = sorted(set(candidates) & set(existing_upcs))
          assert not overlap_target, f'Batch already overlaps target: {overlap_target}'

          # Mandatory exclusion sources from research/AGENTS.md.
          exclusion_paths = [
              Path('data/known-products.ts'),
              Path('data/known-formulas.ts'),
              Path('data/wrong-barcodes.ts'),
              Path('docs/CATALOG-CONFLICTS.md'),
          ]
          exclusion_paths += [p for p in Path('research').glob('deep-research-*.json') if p != target_path]

          hits = {}
          for path in exclusion_paths:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              for row in rows:
                  forms = {row['upc'], row['canonical_gtin14']}
                  if any(code in text for code in forms):
                      hits.setdefault(row['upc'], []).append(str(path))
          assert not hits, 'Candidate UPC/GTIN found in mandatory exclusion sources: ' + json.dumps(hits, sort_keys=True)

          target['records'].extend(rows)
          target['updated_at'] = '2026-08-26'
          final_upcs = [r['upc'] for r in target['records']]
          assert len(final_upcs) == len(set(final_upcs)), 'Final target contains duplicate UPCs'
          assert len(target['records']) == len(existing) + 10
          target_path.write_text(json.dumps(target, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          print(f'Validated exclusions: {len(exclusion_paths)} files checked')
          print(f'Target before: {len(existing)}')
          print('New UPCs: ' + ', '.join(candidates))
          print(f'Target after: {len(target["records"])}')
          PY

      - name: Commit merged ledger
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/deep-research-royal-canin.json
          git commit -m "research: add 10 more Royal Canin Veterinary Feline records"
          git push origin HEAD:agent/deep-research-barcode-ledger
