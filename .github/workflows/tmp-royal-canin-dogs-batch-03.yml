name: Temporary Royal Canin dogs batch 03 apply
on:
  push:
    paths:
      - '.github/workflows/tmp-royal-canin-dogs-batch-03.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: Append verified Royal Canin dog records
        shell: python
        run: |
          import base64, copy, json, pathlib, subprocess, zlib
          path = pathlib.Path('research/deep-research-royal-canin-dogs.json')
          workflow = pathlib.Path('.github/workflows/tmp-royal-canin-dogs-batch-03.yml')
          payload = ''
          static_records = json.loads(zlib.decompress(base64.b64decode(payload)))
          raw = path.read_text(encoding='utf-8')
          data = json.loads(raw)
          existing = data.get('records', [])
          by_upc = {r['upc']: r for r in existing}

          clone_specs = [
              ('030111416735','030111453778','00030111453778','17 lb','Labrador Retriever Adult',62,8),
              ('030111520449','030111520470','00030111520470','17 lb','Boxer Adult',50,0),
              ('030111520807','030111520876','00030111520876','17 lb','German Shepherd Adult',54,6),
          ]
          cloned = []
          for source_upc,new_upc,new_gtin,size,variant,weighted_sum,check_digit in clone_specs:
              if source_upc not in by_upc:
                  raise SystemExit(f'missing source formula {source_upc}')
              r = copy.deepcopy(by_upc[source_upc])
              r['upc'] = new_upc
              r['canonical_gtin14'] = new_gtin
              r['size'] = size
              r['barcode_notes'] = f'ADMC maps UPC {new_upc} to {variant}, {size} individual unit.'
              r['verification_notes'] = [
                  f'UPC-A check digit verified: weighted sum {weighted_sum} gives check digit {check_digit}.',
                  f'Canonical GTIN-14 is zero-left-padded UPC-A {new_gtin}.',
                  'No repository-wide UPC match found before append.',
                  'Formula is the same current Royal Canin USA product page formula already verified for another listed bag size of this exact variant.'
              ]
              r['research_status'] = 'source_verified'
              r['conflicts'] = []
              cloned.append(r)

          new_records = cloned + static_records
          existing_upcs = {r.get('upc') for r in existing}
          existing_gtins = {r.get('canonical_gtin14') for r in existing}
          new_upcs = [r['upc'] for r in new_records]
          new_gtins = [r['canonical_gtin14'] for r in new_records]
          if len(new_records) != 10:
              raise SystemExit('incoming batch must contain exactly 10 records')
          if len(new_upcs) != len(set(new_upcs)) or len(new_gtins) != len(set(new_gtins)):
              raise SystemExit('duplicate UPC/GTIN inside incoming batch')
          overlap_upc = existing_upcs.intersection(new_upcs)
          overlap_gtin = existing_gtins.intersection(new_gtins)
          if overlap_upc or overlap_gtin:
              if set(new_upcs).issubset(existing_upcs) and set(new_gtins).issubset(existing_gtins):
                  print('Batch already present; removing temporary workflow only.')
              else:
                  raise SystemExit(f'partial/collision state: UPC={sorted(overlap_upc)} GTIN={sorted(overlap_gtin)}')
          else:
              if not raw.endswith(']}'):
                  raise SystemExit('unexpected ledger suffix; refusing unsafe append')
              payload_text = json.dumps(new_records, separators=(',', ':'), ensure_ascii=False)[1:-1]
              updated = raw[:-2] + ',' + payload_text + ']}'
              check = json.loads(updated)
              if len(check['records']) != len(existing) + 10:
                  raise SystemExit('record-count validation failed')
              if check['records'][:len(existing)] != existing:
                  raise SystemExit('pre-existing records changed; refusing write')
              path.write_text(updated, encoding='utf-8')

          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add',str(path)], check=True)
          if workflow.exists():
              subprocess.run(['git','rm',str(workflow)], check=True)
          status = subprocess.run(['git','diff','--cached','--quiet'])
          if status.returncode != 0:
              subprocess.run(['git','commit','-m','research: add Royal Canin dogs batch 03'], check=True)
              subprocess.run(['git','push','origin','HEAD:agent/deep-research-barcode-ledger'], check=True)
