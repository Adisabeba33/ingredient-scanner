name: Guarded Royal Canin dog append b8
on: push
permissions:
  contents: write
jobs:
  append:
    if: github.event.head_commit.message == 'chore: prepare guarded Royal Canin dogs batch 151-160'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: Append verified records
        run: |
          python - <<'PY'
          import json,pathlib,re,copy
          root=pathlib.Path('.'); target=root/'research/deep-research-royal-canin-dogs.json'
          d=json.loads(target.read_text()); assert len(d['records'])==150
          def norm(s):
            out=[]; cur=''; depth=0
            for c in s.rstrip('.').split(','):
              pass
            # explicit top-level splitter preserving bracket blocks
            out=[]; cur=''; depth=0
            for ch in s.rstrip('.'):
              if ch in '[(': depth+=1
              elif ch in '])': depth=max(0,depth-1)
              if ch==',' and depth==0: out.append(cur.strip()); cur=''
              else: cur+=ch
            if cur.strip(): out.append(cur.strip())
            return out
          def ga(p,f,fi,m,other=[]): return {'crude_protein_min_percent':p,'crude_fat_min_percent':f,'crude_fiber_max_percent':fi,'moisture_max_percent':m,'ash_max_percent':None,'taurine_min_percent':None,'other_printed_guarantees':other}
          pd='Potato, duck by-product meal, coconut oil, potato protein, hydrolyzed soy protein, natural flavors, vegetable oil, fish oil, monocalcium phosphate, choline chloride, DL-methionine, calcium carbonate, salt, vitamins [DL-alpha tocopherol acetate (source of vitamin E), L-ascorbyl-2-polyphosphate (source of vitamin C), biotin, D-calcium pantothenate, vitamin A acetate, pyridoxine hydrochloride (vitamin B6), niacin supplement, folic acid, thiamine mononitrate (vitamin B1), vitamin B12 supplement, riboflavin supplement, vitamin D3 supplement], potassium chloride, trace minerals [zinc proteinate, zinc oxide, ferrous sulfate, manganese proteinate, manganous oxide, copper sulfate, sodium selenite, calcium iodate, copper proteinate], taurine, L-lysine, rosemary extract, preserved with mixed tocopherols and citric acid.'
          pr='Potato, rabbit meal, coconut oil, hydrolyzed soy protein, potato protein, natural flavors, vegetable oil, monocalcium phosphate, fish oil, calcium carbonate, choline chloride, DL-methionine, salt, potassium chloride, vitamins [DL-alpha tocopherol acetate (source of vitamin E), L-ascorbyl-2-polyphosphate (source of vitamin C), biotin, D-calcium pantothenate, vitamin A acetate, pyridoxine hydrochloride (vitamin B6), niacin supplement, folic acid, thiamine mononitrate (vitamin B1), vitamin B12 supplement, riboflavin supplement, vitamin D3 supplement], taurine, trace minerals [zinc proteinate, zinc oxide, ferrous sulfate, manganese proteinate, manganous oxide, copper sulfate, sodium selenite, calcium iodate, copper proteinate], rosemary extract, preserved with mixed tocopherols and citric acid.'
          pv='Dried potato, venison meal, coconut oil, potato protein, hydrolyzed soy protein, natural flavors, vegetable oil, fish oil, monocalcium phosphate, DL-methionine, calcium carbonate, salt, choline chloride, taurine, vitamins [DL-alpha tocopherol acetate (source of vitamin E), L-ascorbyl-2-polyphosphate (source of vitamin C), biotin, D-calcium pantothenate, pyridoxine hydrochloride (vitamin B6), vitamin A acetate, niacin supplement, thiamine mononitrate (vitamin B1), vitamin B12 supplement, riboflavin supplement, folic acid, vitamin D3 supplement], trace minerals [zinc proteinate, zinc oxide, ferrous sulfate, manganese proteinate, manganous oxide, copper sulfate, calcium iodate, sodium selenite, copper proteinate], rosemary extract, preserved with mixed tocopherols and citric acid.'
          pw='Potato, fish meal, potato protein, chicken fat, natural flavors, powdered cellulose, calcium carbonate, fish oil, monocalcium phosphate, choline chloride, fructooligosaccharides, sodium tripolyphosphate, vitamins [DL-alpha tocopherol acetate (source of vitamin E), niacin supplement, D-calcium pantothenate, biotin, pyridoxine hydrochloride (vitamin B6), riboflavin supplement, thiamine mononitrate (vitamin B1), vitamin A acetate, folic acid, vitamin B12 supplement, menadione sodium bisulfite complex, vitamin D3 supplement], taurine, DL-methionine, trace minerals [zinc proteinate, zinc oxide, ferrous sulfate, manganese proteinate, manganous oxide, copper sulfate, copper proteinate, calcium iodate], rosemary extract, preserved with mixed tocopherols and citric acid.'
          pwl='Dried potato, fish meal, coconut oil, natural flavors, potato protein, vegetable oil, fish oil, L-tyrosine, calcium carbonate, DL-methionine, monocalcium phosphate, taurine, salt, choline chloride, vitamins [DL-alpha tocopherol acetate (source of vitamin E), inositol, niacin supplement, L-ascorbyl-2-polyphosphate (source of vitamin C), D-calcium pantothenate, biotin, pyridoxine hydrochloride (vitamin B6), riboflavin supplement, thiamine mononitrate (vitamin B1), vitamin A acetate, folic acid, vitamin B12 supplement, vitamin D3 supplement, menadione sodium bisulfite complex], potassium chloride, glucosamine hydrochloride, trace minerals [zinc proteinate, zinc oxide, ferrous sulfate, manganese proteinate, manganous oxide, copper sulfate, copper proteinate, calcium iodate, sodium selenite], chondroitin sulfate, rosemary extract, preserved with mixed tocopherols and citric acid.'
          price='https://savma.vetmed.ucdavis.edu/sites/g/files/dgvnsk5966/files/inline-files/Royal%20Canin%20Price%20List%202023_0.pdf'; guide='https://s7d2.scene7.com/is/content/RoyalCanin/Info/2017%20Vet%20Product%20Guide.pdf'
          rows=[
           ('030111760029','Selected Protein PD Dry Dog Food','Selected Protein PD','25 lb',['potato','duck'],pd,ga(19,10,3.4,10,[{'nutrient':'EPA + DHA','basis':'min','value':0.12,'unit':'percent'}]),3530,304,'https://www.petco.com/product/royal-canin-veterinary-diet-selected-protein-adult-dry-dog-food-25-lbs-2689850'),
           ('030111760272','Selected Protein PR Dry Dog Food','Selected Protein PR','7.7 lb',['potato','rabbit'],pr,ga(19,10,3.4,10,[{'nutrient':'EPA + DHA','basis':'min','value':0.12,'unit':'percent'},{'nutrient':'Omega-3 fatty acids','basis':'min','value':0.3,'unit':'percent'}]),3526,289,'https://www.petcarerx.com/royal-canin-veterinary-diet-canine-selected-protein-adult-pr-dry-dog-food/24956'),
           ('030111760210','Selected Protein PR Dry Dog Food','Selected Protein PR','17.6 lb',['potato','rabbit'],pr,ga(19,10,3.4,10,[{'nutrient':'EPA + DHA','basis':'min','value':0.12,'unit':'percent'},{'nutrient':'Omega-3 fatty acids','basis':'min','value':0.3,'unit':'percent'}]),3526,289,'https://www.petcarerx.com/royal-canin-veterinary-diet-canine-selected-protein-adult-pr-dry-dog-food/24956'),
           ('030111760227','Selected Protein PR Dry Dog Food','Selected Protein PR','25 lb',['potato','rabbit'],pr,ga(19,10,3.4,10,[{'nutrient':'EPA + DHA','basis':'min','value':0.12,'unit':'percent'},{'nutrient':'Omega-3 fatty acids','basis':'min','value':0.3,'unit':'percent'}]),3526,289,'https://www.petcarerx.com/royal-canin-veterinary-diet-canine-selected-protein-adult-pr-dry-dog-food/24956'),
           ('030111760371','Selected Protein PV Dry Dog Food','Selected Protein PV','7.7 lb',['potato','venison'],pv,ga(19,10,3.5,10,[{'nutrient':'Eicosapentaenoic Acid (EPA)','basis':'min','value':0.12,'unit':'percent'},{'nutrient':'Docosahexaenoic Acid (DHA)','basis':'min','value':0.05,'unit':'percent'}]),3484,286,guide),
           ('030111760319','Selected Protein PV Dry Dog Food','Selected Protein PV','17.6 lb',['potato','venison'],pv,ga(19,10,3.5,10,[{'nutrient':'Eicosapentaenoic Acid (EPA)','basis':'min','value':0.12,'unit':'percent'},{'nutrient':'Docosahexaenoic Acid (DHA)','basis':'min','value':0.05,'unit':'percent'}]),3484,286,guide),
           ('030111760326','Selected Protein PV Dry Dog Food','Selected Protein PV','25 lb',['potato','venison'],pv,ga(19,10,3.5,10,[{'nutrient':'Eicosapentaenoic Acid (EPA)','basis':'min','value':0.12,'unit':'percent'},{'nutrient':'Docosahexaenoic Acid (DHA)','basis':'min','value':0.05,'unit':'percent'}]),3484,286,guide),
           ('030111563675','Selected Protein PW Dry Dog Food','Selected Protein PW','7.7 lb',['potato','whitefish'],pw,ga(22,12,5,10,[{'nutrient':'Omega-3 fatty acids','basis':'min','value':0.52,'unit':'percent'}]),3518,313,'https://www.chewy.com/royal-canin-veterinary-diet-adult/dp/136522'),
           ('030111563637','Selected Protein PW Dry Dog Food','Selected Protein PW','30.8 lb',['potato','whitefish'],pw,ga(22,12,5,10,[{'nutrient':'Omega-3 fatty acids','basis':'min','value':0.52,'unit':'percent'}]),3518,313,'https://www.chewy.com/royal-canin-veterinary-diet-adult/dp/136523'),
           ('030111760432','Selected Protein PW Large Dog Dry Dog Food','Selected Protein PW Large Dog','26.4 lb',['potato','whitefish'],pwl,ga(19,10,3.5,10,[{'nutrient':'Omega-3 fatty acids','basis':'min','value':0.65,'unit':'percent'},{'nutrient':'Eicosapentaenoic Acid (EPA)','basis':'min','value':0.18,'unit':'percent'},{'nutrient':'Docosahexaenoic Acid (DHA)','basis':'min','value':0.08,'unit':'percent'},{'nutrient':'Glucosamine (mg/kg)','basis':'min','value':350,'unit':'other'},{'nutrient':'Chondroitin sulfate (mg/kg)','basis':'min','value':25,'unit':'other'}]),3502,336,'https://www.petcarerx.com/royal-canin-veterinary-diet-canine-selected-protein-adult-pw-large-breed-dry-dog-food/24961')]
          batch=[]
          for u,name,var,size,recipe,ing,g,kkg,kcup,ret in rows:
            batch.append({'catalog_number':None,'upc':u,'canonical_gtin14':u.zfill(14),'barcode_scope':'individual_unit','brand':'Royal Canin','manufacturer':'Royal Canin USA, Inc.','species':'dog','product_line':'Veterinary Health Nutrition','product_name':name,'variant':var,'recipe':recipe,'life_stage':'adult','food_form':'dry','texture':'kibble','presentation':'plain','package_type':'bag','size':size,'ingredients_verbatim':ing,'ingredients_ordered_normalized':norm(ing),'guaranteed_analysis':g,'calorie_content':{'kcal_per_kg':kkg,'kcal_per_unit':kcup,'unit_name':'cup'},'label_deck_code':None,'formula_source':'Royal Canin veterinary product guide and/or current retailer label data for formula; Royal Canin 2023 veterinary price list plus exact-unit retailer corroboration for UPC/size mapping.','source_urls':list(dict.fromkeys([guide,price,ret])),'source_accessed_at':'2026-08-26','barcode_notes':f'Royal Canin price list maps UPC {u} to {var}, {size} individual bag.','conflicts':[],'verification_notes':['UPC-A check digit validated.','Canonical GTIN-14 is zero-left-padded UPC-A.','Repository-wide duplicate guard passed immediately before append.'],'research_status':'source_verified'})
          scan=[root/'data/known-products.ts',root/'data/known-formulas.ts',root/'data/wrong-barcodes.ts',root/'docs/CATALOG-CONFLICTS.md']+sorted((root/'research').glob('deep-research-*.json'))
          texts={str(p):p.read_text(errors='ignore') for p in scan if p.exists()}; ids={(r.get('product_name'),r.get('variant'),r.get('size')) for r in d['records']}; su=set();sg=set()
          def valid(u):
            return bool(re.fullmatch(r'\d{12}',u)) and (10-sum((3 if i%2==0 else 1)*int(u[i]) for i in range(11))%10)%10==int(u[-1])
          for r in batch:
            u=r['upc'];g=r['canonical_gtin14']; assert valid(u),(u,'check'); assert u not in su and g not in sg;su.add(u);sg.add(g)
            ident=(r['product_name'],r['variant'],r['size']);assert ident not in ids,ident;ids.add(ident)
            hits=[p for p,t in texts.items() if u in t or g in t];assert not hits,(u,hits)
          d['records'].extend(batch);d['updated_at']='2026-08-26'; assert len(d['records'])==160
          assert len({r['upc'] for r in d['records']})==160 and len({r['canonical_gtin14'] for r in d['records']})==160
          target.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n')
          for p in sorted((root/'research').glob('deep-research-*.json')):json.loads(p.read_text())
          print('APPENDED 10 TOTAL',len(d['records']));print('UPCS',','.join(r['upc'] for r in batch))
          PY
      - name: Commit and cleanup
        run: |
          rm .github/workflows/append-royal-canin-dogs-b8.yml
          git config user.name ingredients-research-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'research: add Royal Canin dogs records 151-160'
          git push origin HEAD:agent/deep-research-barcode-ledger
