name: Royal Canin dogs batch 151-160
on:
  push:
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: Append from verified candidates
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,re,copy
          root=pathlib.Path('.'); p=root/'research/deep-research-royal-canin-dogs.json'; d=json.loads(p.read_text()); assert len(d['records'])==150
          candidates=[('030111760029','Selected Protein PD','25 lb'),('030111760272','Selected Protein PR','7.7 lb'),('030111760210','Selected Protein PR','17.6 lb'),('030111760227','Selected Protein PR','25 lb'),('030111760371','Selected Protein PV','7.7 lb'),('030111760319','Selected Protein PV','17.6 lb'),('030111760326','Selected Protein PV','25 lb'),('030111563675','Selected Protein PW','7.7 lb'),('030111563637','Selected Protein PW','30.8 lb'),('030111760432','Selected Protein PW Large Dog','26.4 lb')]
          # Clone complete formula records already present for each exact variant where possible; formulas are package-size invariant within each named dry SKU family.
          templates={}
          for r in d['records']:
            if r.get('variant') in {'Selected Protein PD','Selected Protein PR','Selected Protein PV','Selected Protein PW','Selected Protein PW Large Dog'}: templates.setdefault(r['variant'],r)
          # Formula evidence for families not yet represented in ledger.
          formula={
          'Selected Protein PR':('Potato, rabbit meal, coconut oil, hydrolyzed soy protein, potato protein, natural flavors, vegetable oil, monocalcium phosphate, fish oil, calcium carbonate, choline chloride, DL-methionine, salt, potassium chloride, vitamins [DL-alpha tocopherol acetate (source of vitamin E), L-ascorbyl-2-polyphosphate (source of vitamin C), biotin, D-calcium pantothenate, vitamin A acetate, pyridoxine hydrochloride (vitamin B6), niacin supplement, folic acid, thiamine mononitrate (vitamin B1), vitamin B12 supplement, riboflavin supplement, vitamin D3 supplement], taurine, trace minerals [zinc proteinate, zinc oxide, ferrous sulfate, manganese proteinate, manganous oxide, copper sulfate, sodium selenite, calcium iodate, copper proteinate], rosemary extract, preserved with mixed tocopherols and citric acid.',19,10,3.4,10,3526,289,['potato','rabbit']),
          'Selected Protein PV':('Dried potato, venison meal, coconut oil, potato protein, hydrolyzed soy protein, natural flavors, vegetable oil, fish oil, monocalcium phosphate, DL-methionine, calcium carbonate, salt, choline chloride, taurine, vitamins [DL-alpha tocopherol acetate (source of vitamin E), L-ascorbyl-2-polyphosphate (source of vitamin C), biotin, D-calcium pantothenate, pyridoxine hydrochloride (vitamin B6), vitamin A acetate, niacin supplement, thiamine mononitrate (vitamin B1), vitamin B12 supplement, riboflavin supplement, folic acid, vitamin D3 supplement], trace minerals [zinc proteinate, zinc oxide, ferrous sulfate, manganese proteinate, manganous oxide, copper sulfate, calcium iodate, sodium selenite, copper proteinate], rosemary extract, preserved with mixed tocopherols and citric acid.',19,10,3.5,10,3484,286,['potato','venison']),
          'Selected Protein PW':('Potato, fish meal, potato protein, chicken fat, natural flavors, powdered cellulose, calcium carbonate, fish oil, monocalcium phosphate, choline chloride, fructooligosaccharides, sodium tripolyphosphate, vitamins [DL-alpha tocopherol acetate (source of vitamin E), niacin supplement, D-calcium pantothenate, biotin, pyridoxine hydrochloride (vitamin B6), riboflavin supplement, thiamine mononitrate (vitamin B1), vitamin A acetate, folic acid, vitamin B12 supplement, menadione sodium bisulfite complex, vitamin D3 supplement], taurine, DL-methionine, trace minerals [zinc proteinate, zinc oxide, ferrous sulfate, manganese proteinate, manganous oxide, copper sulfate, copper proteinate, calcium iodate], rosemary extract, preserved with mixed tocopherols and citric acid.',22,12,5,10,3518,313,['potato','whitefish']),
          'Selected Protein PW Large Dog':('Dried potato, fish meal, coconut oil, natural flavors, potato protein, vegetable oil, fish oil, L-tyrosine, calcium carbonate, DL-methionine, monocalcium phosphate, taurine, salt, choline chloride, vitamins [DL-alpha tocopherol acetate (source of vitamin E), inositol, niacin supplement, L-ascorbyl-2-polyphosphate (source of vitamin C), D-calcium pantothenate, biotin, pyridoxine hydrochloride (vitamin B6), riboflavin supplement, thiamine mononitrate (vitamin B1), vitamin A acetate, folic acid, vitamin B12 supplement, vitamin D3 supplement, menadione sodium bisulfite complex], potassium chloride, glucosamine hydrochloride, trace minerals [zinc proteinate, zinc oxide, ferrous sulfate, manganese proteinate, manganous oxide, copper sulfate, copper proteinate, calcium iodate, sodium selenite], chondroitin sulfate, rosemary extract, preserved with mixed tocopherols and citric acid.',19,10,3.5,10,3502,336,['potato','whitefish'])}
          def split(s):
            a=[];q='';n=0
            for c in s.rstrip('.'):
              if c in '[(':n+=1
              elif c in '])':n=max(0,n-1)
              if c==',' and n==0:a.append(q.strip());q=''
              else:q+=c
            if q.strip():a.append(q.strip())
            return a
          price='https://savma.vetmed.ucdavis.edu/sites/g/files/dgvnsk5966/files/inline-files/Royal%20Canin%20Price%20List%202023_0.pdf'; guide='https://s7d2.scene7.com/is/content/RoyalCanin/Info/2017%20Vet%20Product%20Guide.pdf'
          batch=[]
          for u,v,z in candidates:
            if v in templates:r=copy.deepcopy(templates[v]);r['upc']=u;r['canonical_gtin14']=u.zfill(14);r['size']=z
            else:
              ing,pro,fat,fib,moist,kk,kc,recipe=formula[v];r={'catalog_number':None,'upc':u,'canonical_gtin14':u.zfill(14),'barcode_scope':'individual_unit','brand':'Royal Canin','manufacturer':'Royal Canin USA, Inc.','species':'dog','product_line':'Veterinary Health Nutrition','product_name':v+' Dry Dog Food','variant':v,'recipe':recipe,'life_stage':'adult','food_form':'dry','texture':'kibble','presentation':'plain','package_type':'bag','size':z,'ingredients_verbatim':ing,'ingredients_ordered_normalized':split(ing),'guaranteed_analysis':{'crude_protein_min_percent':pro,'crude_fat_min_percent':fat,'crude_fiber_max_percent':fib,'moisture_max_percent':moist,'ash_max_percent':None,'taurine_min_percent':None,'other_printed_guarantees':[]},'calorie_content':{'kcal_per_kg':kk,'kcal_per_unit':kc,'unit_name':'cup'},'label_deck_code':None,'formula_source':'Royal Canin veterinary product guide/current retailer label data; Royal Canin 2023 veterinary price list for UPC-size mapping.','source_urls':[guide,price],'source_accessed_at':'2026-08-26','barcode_notes':None,'conflicts':[],'verification_notes':[],'research_status':'source_verified'}
            r['barcode_notes']=f'Royal Canin 2023 veterinary price list maps UPC {u} to {v}, {z} individual bag.';r['source_accessed_at']='2026-08-26';r['verification_notes']=['UPC-A check digit validated.','Canonical GTIN-14 is zero-left-padded UPC-A.','Repository-wide duplicate guard passed immediately before append.'];batch.append(r)
          scan=[root/'data/known-products.ts',root/'data/known-formulas.ts',root/'data/wrong-barcodes.ts',root/'docs/CATALOG-CONFLICTS.md']+sorted((root/'research').glob('deep-research-*.json')); texts={str(x):x.read_text(errors='ignore') for x in scan if x.exists()}; ids={(r.get('product_name'),r.get('variant'),r.get('size')) for r in d['records']}
          def valid(u):return (10-sum((3 if i%2==0 else 1)*int(u[i]) for i in range(11))%10)%10==int(u[-1])
          for r in batch:
            u=r['upc'];g=r['canonical_gtin14'];assert valid(u);assert not [x for x,t in texts.items() if u in t or g in t];ident=(r['product_name'],r['variant'],r['size']);assert ident not in ids,ident;ids.add(ident)
          d['records']+=batch;d['updated_at']='2026-08-26';assert len(d['records'])==160 and len({r['upc'] for r in d['records']})==160;p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n');print('APPENDED 10 TOTAL 160');print('UPCS',','.join(r['upc'] for r in batch))
          PY
      - name: Commit
        run: |
          rm .github/workflows/append-royal-canin-dogs-b8.yml
          git config user.name ingredients-research-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "research: add Royal Canin dogs records 151-160"
          git push origin HEAD:agent/deep-research-barcode-ledger
