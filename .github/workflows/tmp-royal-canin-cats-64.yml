name: Temporary Royal Canin cats batch 64 apply
on:
  push:
    paths:
      - '.github/workflows/tmp-royal-canin-cats-64.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: Append verified Royal Canin cat records
        shell: python
        run: |
          import base64, json, pathlib, subprocess, zlib
          encoded = ''''''
          batch = json.loads(zlib.decompress(base64.b64decode(encoded)).decode('utf-8'))
          path = pathlib.Path('research/deep-research-royal-canin.json')
          doc = json.loads(path.read_text())
          assert len(doc['records']) == 54, f"expected 54 current Royal Canin records, found {len(doc['records'])}"
          required_scan = [
              pathlib.Path('data/known-products.ts'), pathlib.Path('data/known-formulas.ts'),
              pathlib.Path('data/wrong-barcodes.ts'), pathlib.Path('docs/CATALOG-CONFLICTS.md'),
              pathlib.Path('research/deep-research-barcodes.json'), pathlib.Path('research/deep-research-hills.json'),
              pathlib.Path('research/deep-research-ziwi-peak.json')
          ]
          external_text = '\n'.join(p.read_text(errors='ignore') for p in required_scan if p.exists())
          existing_upcs = {r['upc'] for r in doc['records']}
          existing_gtins = {r['canonical_gtin14'] for r in doc['records']}
          def valid_upc(u):
              total = sum(int(d) * (3 if i % 2 == 0 else 1) for i,d in enumerate(u[:11]))
              return len(u) == 12 and u.isdigit() and str((-total) % 10) == u[-1]
          new_upcs=set(); new_gtins=set()
          for r in batch:
              assert r['brand'] == 'Royal Canin' and r['species'] == 'cat'
              assert r['catalog_number'] is None
              assert r['barcode_scope'] == 'individual_unit'
              assert r['research_status'] == 'source_verified'
              assert valid_upc(r['upc'])
              assert r['canonical_gtin14'] == r['upc'].zfill(14)
              assert r['upc'] not in existing_upcs and r['upc'] not in new_upcs
              assert r['canonical_gtin14'] not in existing_gtins and r['canonical_gtin14'] not in new_gtins
              assert r['upc'] not in external_text and r['canonical_gtin14'] not in external_text
              assert r['ingredients_verbatim'] and r['ingredients_ordered_normalized']
              assert r['guaranteed_analysis'] and r['calorie_content']
              assert isinstance(r['source_urls'], list) and r['source_urls']
              assert isinstance(r['conflicts'], list)
              assert isinstance(r['verification_notes'], list) and r['verification_notes']
              new_upcs.add(r['upc']); new_gtins.add(r['canonical_gtin14'])
          assert len(new_upcs) == 10 and len(new_gtins) == 10
          doc['records'].extend(batch)
          doc['updated_at'] = '2026-08-25'
          assert len(doc['records']) == 64
          assert len({r['upc'] for r in doc['records']}) == 64
          assert len({r['canonical_gtin14'] for r in doc['records']}) == 64
          path.write_text(json.dumps(doc, ensure_ascii=False, separators=(',', ':')) + '\n')
          json.loads(path.read_text())
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add',str(path)], check=True)
          subprocess.run(['git','commit','-m','research: add 10 more verified Royal Canin cat SKUs'], check=True)
          subprocess.run(['git','push','origin','HEAD:agent/deep-research-barcode-ledger'], check=True)
