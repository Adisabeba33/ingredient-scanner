name: Temporary Royal Canin dogs batch 02 apply
on:
  push:
    paths:
      - '.github/workflows/tmp-royal-canin-dogs-batch-02.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: Append verified Royal Canin dog records
        shell: python
        run: |
          import base64, json, pathlib, subprocess, zlib
          path = pathlib.Path('research/deep-research-royal-canin-dogs.json')
          workflow = pathlib.Path('.github/workflows/tmp-royal-canin-dogs-batch-02.yml')
          encoded = ''
          new_records = json.loads(zlib.decompress(base64.b64decode(encoded)))
          raw = path.read_text(encoding='utf-8')
          data = json.loads(raw)
          existing = data.get('records', [])
          existing_upcs = {r.get('upc') for r in existing}
          existing_gtins = {r.get('canonical_gtin14') for r in existing}
          new_upcs = [r['upc'] for r in new_records]
          new_gtins = [r['canonical_gtin14'] for r in new_records]
          if len(new_upcs) != len(set(new_upcs)) or len(new_gtins) != len(set(new_gtins)):
              raise SystemExit('duplicate UPC/GTIN inside incoming batch')
          overlap_upc = existing_upcs.intersection(new_upcs)
          overlap_gtin = existing_gtins.intersection(new_gtins)
          if overlap_upc or overlap_gtin:
              if set(new_upcs).issubset(existing_upcs) and set(new_gtins).issubset(existing_gtins):
                  print('Batch already present; removing temporary workflow only.')
              else:
                  raise SystemExit(f'partial/collision state: UPC={sorted(overlap_upc)} GTIN={sorted(overlap_gtin)}')
          else:
              if not raw.endswith(']}'):
                  raise SystemExit('unexpected ledger suffix; refusing unsafe append')
              payload = json.dumps(new_records, separators=(',', ':'), ensure_ascii=False)[1:-1]
              updated = raw[:-2] + ',' + payload + ']}'
              check = json.loads(updated)
              if len(check['records']) != len(existing) + len(new_records):
                  raise SystemExit('record-count validation failed')
              if check['records'][:len(existing)] != existing:
                  raise SystemExit('pre-existing records changed; refusing write')
              path.write_text(updated, encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add',str(path)], check=True)
          if workflow.exists():
              subprocess.run(['git','rm',str(workflow)], check=True)
          status = subprocess.run(['git','diff','--cached','--quiet'])
          if status.returncode == 0:
              print('No changes to commit.')
          else:
              subprocess.run(['git','commit','-m','research: add Royal Canin dogs batch 02'], check=True)
              subprocess.run(['git','push','origin','HEAD:agent/deep-research-barcode-ledger'], check=True)
