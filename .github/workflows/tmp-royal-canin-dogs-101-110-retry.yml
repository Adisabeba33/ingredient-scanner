jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: Re-run verified batch with direct Cocker source record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Adisabeba33"
          git config user.email "lezzgo2@gmail.com"
          git pull --rebase origin agent/deep-research-barcode-ledger
          test "$(git hash-object research/deep-research-royal-canin-dogs.json)" = "239da885af7dbee5254764a7b32f960330f9ffbb"
          python3 - <<'PY'
          import pathlib, textwrap
          old=pathlib.Path('.github/workflows/tmp-royal-canin-dogs-101-110.yml').read_text(encoding='utf-8')
          raw=old.split("python3 - <<'PY'\n",1)[1].split("\n          PY\n",1)[0]
          script=textwrap.dedent(raw)
          cocker="Brewers rice, brown rice, oat groats, chicken by-product meal, wheat gluten, chicken fat, corn gluten meal, natural flavors, dried plain beet pulp, fish oil, potassium chloride, calcium sulfate, vegetable oil, psyllium seed husk, salt, fructooligosaccharides, sodium tripolyphosphate, vitamins [DL-alpha tocopherol acetate (source of vitamin E), niacin supplement, L-ascorbyl-2-polyphosphate (source of vitamin C), D-calcium pantothenate, biotin, pyridoxine hydrochloride (vitamin B6), riboflavin supplement, thiamine mononitrate (vitamin B1), vitamin A acetate, folic acid, vitamin B12 supplement, vitamin D3 supplement], taurine, monocalcium phosphate, calcium carbonate, hydrolyzed yeast, L-lysine, choline chloride, magnesium oxide, glucosamine hydrochloride, trace minerals [zinc proteinate, zinc oxide, ferrous sulfate, manganese proteinate, manganous oxide, copper sulfate, calcium iodate, sodium selenite, copper proteinate], marigold extract (Tagetes erecta L.), L-carnitine, GLA safflower oil, green tea extract, L-tyrosine, chondroitin sulfate, rosemary extract, preserved with mixed tocopherols and citric acid."
          inject="""\ncocker_ingredients="""+repr(cocker)+"""\nby_upc['030111181305']={'catalog_number':None,'upc':'030111181305','canonical_gtin14':'00030111181305','barcode_scope':'individual_unit','brand':'Royal Canin','manufacturer':'Royal Canin USA, Inc.','species':'dog','product_line':'Breed Health Nutrition','product_name':'Cocker Spaniel Adult Dry Dog Food','variant':'Cocker Spaniel Adult','recipe':['chicken'],'life_stage':'adult','food_form':'dry','texture':'kibble','presentation':'plain','package_type':'bag','size':'25 lb','ingredients_verbatim':cocker_ingredients,'ingredients_ordered_normalized':split_top(cocker_ingredients),'guaranteed_analysis':{'crude_protein_min_percent':23,'crude_fat_min_percent':12,'crude_fiber_max_percent':3.3,'moisture_max_percent':10,'ash_max_percent':None,'taurine_min_percent':0.25,'other_printed_guarantees':[{'nutrient':'Eicosapentaenoic Acid (EPA)','basis':'min','value':0.17,'unit':'percent'},{'nutrient':'Docosahexaenoic Acid (DHA)','basis':'min','value':0.07,'unit':'percent'},{'nutrient':'Vitamin A','basis':'min','value':18900,'unit':'IU/kg'},{'nutrient':'Glucosamine (mg/kg)','basis':'min','value':371,'unit':'other'},{'nutrient':'Chondroitin sulfate (mg/kg)','basis':'min','value':4,'unit':'other'}]},'calorie_content':{'kcal_per_kg':3661,'kcal_per_unit':304,'unit_name':'cup'},'label_deck_code':None,'formula_source':'Current Royal Canin USA English product page.','source_urls':['https://www.royalcanin.com/us/dogs/products/retail-products/cocker-spaniel-adult-3969'],'source_accessed_at':'2026-08-26','barcode_notes':'Temporary in-memory formula master used only to construct the verified 6 lb size record.','conflicts':[],'verification_notes':['Current Royal Canin USA English formula master.'],'research_status':'source_verified'}\n"""
          needle='def verify_cd(u):\n'
          assert needle in script
          script=script.replace(needle,inject+needle,1)
          exec(compile(script,'batch-101-110-retry','exec'),{})
          PY
          git rm .github/workflows/tmp-royal-canin-dogs-101-110.yml .github/workflows/tmp-royal-canin-dogs-101-110-retry.yml
          git add research/deep-research-royal-canin-dogs.json
          git diff --cached --check
          git commit -m "research: add Royal Canin dogs records 101-110"
          git fetch origin agent/deep-research-barcode-ledger
          remote_blob="$(git ls-tree origin/agent/deep-research-barcode-ledger research/deep-research-royal-canin-dogs.json | awk '{print $3}')"
          test "$remote_blob" = "239da885af7dbee5254764a7b32f960330f9ffbb"
          git pull --rebase origin agent/deep-research-barcode-ledger
          git push origin HEAD:agent/deep-research-barcode-ledger
