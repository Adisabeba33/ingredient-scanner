name: Discover ILY 101-120
on:
  push:
    branches: [agent/deep-research-i-and-love-and-you]
    paths: [.github/workflows/discover-ily-101-120.yml]
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-i-and-love-and-you
          fetch-depth: 0
      - run: python .github/scripts/discover-ily-101-120.py
