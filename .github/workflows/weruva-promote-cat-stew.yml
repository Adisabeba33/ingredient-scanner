name: Promote Weruva Cat Stew

on:
  push:
    branches:
      - agent/deep-research-weruva
    paths:
      - .github/workflows/weruva-promote-cat-stew.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-weruva
          fetch-depth: 0
      - name: Validate and append Cat Stew records
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          TARGET=Path('research/deep-research-weruva.json')
          INDEX=Path('research/WERUVA-POST-30-INDEX.md')
          HANDOFF=Path('research/WERUVA-HANDOFF.md')
          RUNNER=Path('.github/workflows/weruva-promote-cat-stew.yml')
          ACCESSED='2026-08-29'
          ADMC='https://www.admc.us/wp-content/uploads/2022/02/2023-North-Complete-Price-List_12.22.23.pdf'

          formulas={
            'goody': dict(name='Goody Stew Shoes',variant='Chicken & Salmon Dinner in Gravy',recipe=['chicken','salmon'],ingredients='Chicken Broth, Chicken, Salmon, Natural Flavor, Tapioca Starch, Guar Gum, Potassium Chloride, Choline Chloride, Tricalcium Phosphate, Celery Powder, Taurine, Zinc Oxide, Vitamin E Supplement, Reduced Iron, Salt, Niacin Supplement (Vitamin B3), Sodium Selenite, Thiamine Mononitrate (Vitamin B1), Vitamin A Supplement, Manganese Sulfate, Vitamin B12 Supplement, Copper Amino Acid Complex, Pyridoxine Hydrochloride (Vitamin B6), Calcium Pantothenate, Riboflavin Supplement (Vitamin B2), Biotin, Vitamin D3 Supplement, Folic Acid, Potassium Iodide, Menadione Sodium Bisulfite Complex (Source Of Vitamin K)',ga=(7.0,4.0,1.0,85.0),kg=1104,url='https://www.weruva.com/products/goody-stew-shoes-cat-can',secondary='https://www.chewy.com/weruva-classic-cat-goody-stew-shoes/dp/204873'),
            'stewbacca': dict(name='Stewbacca',variant='Chicken, Duck & Salmon Dinner in Gravy',recipe=['chicken','duck','salmon'],ingredients='Chicken Broth, Chicken, Duck, Salmon, Natural Flavor, Tapioca Starch, Guar Gum, Potassium Chloride, Choline Chloride, Celery Powder, Taurine, Vitamin E Supplement, Zinc Oxide, Reduced Iron, Salt, Niacin Supplement (Vitamin B3), Thiamine Mononitrate (Vitamin B1), Sodium Selenite, Vitamin A Supplement, Manganese Sulfate, Vitamin B12 Supplement, Copper Amino Acid Complex, Pyridoxine Hydrochloride (Vitamin B6), Calcium Pantothenate, Riboflavin Supplement (Vitamin B2), Biotin, Vitamin D3 Supplement, Folic Acid, Potassium Iodide, Menadione Sodium Bisulfite Complex (Source Of Vitamin K)',ga=(7.0,4.0,1.0,85.0),kg=1092,url='https://www.weruva.com/collections/find-your-food/products/stewbacca-cat-can',secondary='https://www.chewy.com/weruva-classic-cat-stewbacca-chicken/dp/204876'),
            'stewlander': dict(name='Stewlander',variant='Duck & Salmon Dinner in Gravy',recipe=['duck','salmon'],ingredients='Duck Broth, Duck, Salmon, Natural Flavor, Tapioca Starch, Guar Gum, Potassium Chloride, Choline Chloride, Celery Powder, Taurine, Vitamin E Supplement, Zinc Oxide, Salt, Reduced Iron, Niacin Supplement (Vitamin B3), Thiamine Mononitrate (Vitamin B1), Vitamin A Supplement, Sodium Selenite, Vitamin B12 Supplement, Manganese Sulfate, Pyridoxine Hydrochloride (Vitamin B6), Copper Amino Acid Complex, Calcium Pantothenate, Riboflavin Supplement (Vitamin B2), Biotin, Vitamin D3 Supplement, Folic Acid, Potassium Iodide, Menadione Sodium Bisulfite Complex (Source Of Vitamin K)',ga=(7.0,4.0,1.0,85.0),kg=1034,url='https://www.weruva.com/collections/find-your-food/products/stewlander-cat-can',secondary='https://www.chewy.com/weruva-classic-cat-stewlander-duck/dp/204879'),
            'clues': dict(name="Stew's Clues",variant='Turkey, Chicken & Salmon Dinner in Gravy',recipe=['turkey','chicken','salmon'],ingredients='Turkey Broth, Turkey, Chicken, Salmon, Natural Flavor, Tapioca Starch, Guar Gum, Potassium Chloride, Tricalcium Phosphate, Choline Chloride, Celery Powder, Taurine, Zinc Oxide, Vitamin E Supplement, Reduced Iron, Salt, Niacin Supplement (Vitamin B3), Sodium Selenite, Thiamine Mononitrate (Vitamin B1), Vitamin A Supplement, Manganese Sulfate, Vitamin B12 Supplement, Copper Amino Acid Complex, Pyridoxine Hydrochloride (Vitamin B6), Calcium Pantothenate, Riboflavin Supplement (Vitamin B2), Biotin, Vitamin D3 Supplement, Folic Acid, Potassium Iodide, Menadione Sodium Bisulfite Complex (Source Of Vitamin K)',ga=(7.0,4.0,1.0,85.0),kg=1125,url='https://www.weruva.com/collections/find-your-food/products/stews-clues-cat-can',secondary='https://www.chewy.com/weruva-classic-cat-stews-clues-turkey/dp/204882'),
            'lewis': dict(name='Stewy Lewis',variant='Lamb, Chicken & Salmon Dinner in Gravy',recipe=['lamb','chicken','salmon'],ingredients='Lamb Broth, Lamb, Chicken, Salmon, Natural Flavor, Tapioca Starch, Guar Gum, Potassium Chloride, Choline Chloride, Celery Powder, Taurine, Zinc Oxide, Vitamin E Supplement, Reduced Iron, Salt, Niacin Supplement (Vitamin B3), Sodium Selenite, Thiamine Mononitrate (Vitamin B1), Vitamin A Supplement, Manganese Sulfate, Vitamin B12 Supplement, Copper Glycine Complex, Pyridoxine Hydrochloride (Vitamin B6), Calcium Pantothenate, Riboflavin Supplement (Vitamin B2), Biotin, Vitamin D3 Supplement, Folic Acid, Potassium Iodide, Menadione Sodium Bisulfite Complex (Source Of Vitamin K)',ga=(7.0,4.0,1.0,85.0),kg=996,url='https://www.weruva.com/products/stewy-lewis-cat-can',secondary='https://www.chewy.com/weruva-classic-cat-stewy-lewis-lamb/dp/204885'),
            'taco': dict(name='Taco Stewsday',variant='Beef, Chicken & Salmon Dinner in Gravy',recipe=['beef','chicken','salmon'],ingredients='Beef Broth, Beef, Chicken, Salmon, Natural Flavor, Tapioca Starch, Guar Gum, Potassium Chloride, Choline Chloride, Celery Powder, Taurine, Zinc Oxide, Vitamin E Supplement, Reduced Iron, Salt, Niacin Supplement (Vitamin B3), Thiamine Mononitrate (Vitamin B1), Sodium Selenite, Vitamin A Supplement, Manganese Sulfate, Vitamin B12 Supplement, Copper Amino Acid Complex, Pyridoxine Hydrochloride (Vitamin B6), Calcium Pantothenate, Riboflavin Supplement (Vitamin B2), Biotin, Vitamin D3 Supplement, Folic Acid, Potassium Iodide, Menadione Sodium Bisulfite Complex (Source Of Vitamin K)',ga=(6.5,4.0,1.0,85.0),kg=1097,url='https://www.weruva.com/products/taco-stewsday-cat-can',secondary='https://www.chewy.com/weruva-classic-cat-taco-stewsday-beef/dp/204888'),
            'kettle': dict(name='Kettle Call',variant='Beef, Chicken & Salmon Dinner in Gravy',recipe=['beef','chicken','salmon'],ingredients='Beef Broth, Beef, Chicken, Salmon, Natural Flavor, Tapioca Starch, Coconut Oil, Guar Gum, Potassium Chloride, Choline Chloride, Celery Powder, Taurine, Zinc Oxide, Vitamin E Supplement, Reduced Iron, Salt, Niacin Supplement (Vitamin B3), Thiamine Mononitrate (Vitamin B1), Sodium Selenite, Vitamin A Supplement, Manganese Sulfate, Vitamin B12 Supplement, Copper Amino Acid Complex, Pyridoxine Hydrochloride (Vitamin B6), d-Calcium Pantothenate, Riboflavin Supplement (Vitamin B2), Biotin, Vitamin D3 Supplement, Folic Acid, Potassium Iodide, Menadione Sodium Bisulfite Complex (Source Of Vitamin K)',ga=(6.0,4.0,1.0,85.0),kg=1118,url='https://www.weruva.com/products/kettle-call-cat-pouch'),
            'simmer': dict(name='Simmer Down',variant='Turkey, Chicken & Salmon Dinner in Gravy',recipe=['turkey','chicken','salmon'],ingredients='Turkey Broth, Turkey, Chicken, Salmon, Natural Flavor, Tapioca Starch, Coconut Oil, Guar Gum, Potassium Chloride, Tricalcium Phosphate, Choline Chloride, Celery Powder, Taurine, Zinc Oxide, Vitamin E Supplement, Reduced Iron, Salt, Niacin Supplement (Vitamin B3), Sodium Selenite, Thiamine Mononitrate (Vitamin B1), Vitamin A Supplement, Manganese Sulfate, Vitamin B12 Supplement, Copper Amino Acid Complex, Pyridoxine Hydrochloride (Vitamin B6), d-Calcium Pantothenate, Riboflavin Supplement (Vitamin B2), Biotin, Vitamin D3 Supplement, Folic Acid, Potassium Iodide, Menadione Sodium Bisulfite Complex (Source Of Vitamin K)',ga=(7.0,4.0,1.0,85.0),kg=1146,url='https://www.weruva.com/collections/all/products/simmer-down-cat-pouch'),
            'spork': dict(name='Stick a Spork in It',variant='Duck & Salmon Dinner in Gravy',recipe=['duck','salmon'],ingredients='Duck Broth, Duck, Salmon, Natural Flavor, Tapioca Starch, Coconut Oil, Guar Gum, Potassium Chloride, Choline Chloride, Celery Powder, Taurine, Vitamin E Supplement, Zinc Oxide, Salt, Reduced Iron, Niacin Supplement (Vitamin B3), Thiamine Mononitrate (Vitamin B1), Vitamin A Supplement, Sodium Selenite, Manganese Sulfate, Vitamin B12 Supplement, Pyridoxine Hydrochloride (Vitamin B6), Copper Amino Acid Complex, d-Calcium Pantothenate, Riboflavin Supplement (Vitamin B2), Biotin, Vitamin D3 Supplement, Folic Acid, Potassium Iodide, Menadione Sodium Bisulfite Complex (Source Of Vitamin K)',ga=(7.0,4.0,1.0,85.0),kg=1097,url='https://www.weruva.com/products/stick-a-spork-in-it-cat-pouch'),
            'stir': dict(name='Stir the Pot',variant='Lamb, Chicken & Salmon Dinner in Gravy',recipe=['lamb','chicken','salmon'],ingredients='Lamb Broth, Lamb, Chicken, Salmon, Natural Flavor, Tapioca Starch, Coconut Oil, Guar Gum, Potassium Chloride, Choline Chloride, Celery Powder, Taurine, Zinc Oxide, Vitamin E Supplement, Reduced Iron, Salt, Niacin Supplement (Vitamin B3), Sodium Selenite, Thiamine Mononitrate (Vitamin B1), Vitamin A Supplement, Manganese Sulfate, Vitamin B12 Supplement, Copper Amino Acid Complex, Pyridoxine Hydrochloride (Vitamin B6), d-Calcium Pantothenate, Riboflavin Supplement (Vitamin B2), Biotin, Vitamin D3 Supplement, Folic Acid, Potassium Iodide, Menadione Sodium Bisulfite Complex (Source Of Vitamin K)',ga=(7.0,4.0,1.0,85.0),kg=1017,url='https://www.weruva.com/products/stir-the-pot-cat-pouch'),
            'hot': dict(name='Too Hot to Handle',variant='Chicken, Duck & Salmon Dinner in Gravy',recipe=['chicken','duck','salmon'],ingredients='Chicken Broth, Chicken, Duck, Salmon, Natural Flavor, Tapioca Starch, Coconut Oil, Guar Gum, Potassium Chloride, Choline Chloride, Celery Powder, Taurine, Zinc Oxide, Vitamin E Supplement, Reduced Iron, Salt, Niacin Supplement (Vitamin B3), Thiamine Mononitrate (Vitamin B1), Sodium Selenite, Vitamin A Supplement, Manganese Sulfate, Vitamin B12 Supplement, Copper Amino Acid Complex, Pyridoxine Hydrochloride (Vitamin B6), Calcium d-Pantothenate, Riboflavin Supplement (Vitamin B2), Biotin, Vitamin D3 Supplement, Folic Acid, Potassium Iodide, Menadione Sodium Bisulfite Complex (Source Of Vitamin K)',ga=(7.0,4.0,1.0,85.0),kg=1153,url='https://www.weruva.com/products/too-hot-to-handle-cat-pouch'),
            'crock': dict(name='What a Crock',variant='Chicken & Salmon Dinner in Gravy',recipe=['chicken','salmon'],ingredients='Chicken Broth, Chicken, Salmon, Natural Flavor, Tapioca Starch, Coconut Oil, Guar Gum, Potassium Chloride, Tricalcium Phosphate, Choline Chloride, Celery Powder, Taurine, Zinc Oxide, Vitamin E Supplement, Reduced Iron, Salt, Niacin Supplement (Vitamin B3), Sodium Selenite, Thiamine Mononitrate (Vitamin B1), Vitamin A Supplement, Manganese Sulfate, Vitamin B12 Supplement, Copper Amino Acid Complex, Pyridoxine Hydrochloride (Vitamin B6), d-Calcium Pantothenate, Riboflavin Supplement (Vitamin B2), Biotin, Vitamin D3 Supplement, Folic Acid, Potassium Iodide, Menadione Sodium Bisulfite Complex (Source Of Vitamin K)',ga=(7.0,4.0,1.0,85.0),kg=1198,url='https://www.weruva.com/products/what-a-crock-cat-pouch'),
          }

          units=[
            ('813778018111','goody','2.8 oz','can',91),('813778017978','goody','5.5 oz','can',172),
            ('813778018104','stewbacca','2.8 oz','can',87),('813778017961','stewbacca','5.5 oz','can',170),
            ('813778018098','stewlander','2.8 oz','can',82),('813778017954','stewlander','5.5 oz','can',161),
            ('813778018081','clues','2.8 oz','can',90),('813778017947','clues','5.5 oz','can',175),
            ('813778018074','lewis','2.8 oz','can',79),('813778017930','lewis','5.5 oz','can',155),
            ('813778018067','taco','2.8 oz','can',87),('813778017923','taco','5.5 oz','can',171),
            ('813778017725','kettle','3 oz','pouch',95),('813778017749','simmer','3 oz','pouch',97),
            ('813778017756','spork','3 oz','pouch',93),('813778017732','stir','3 oz','pouch',86),
            ('813778017763','hot','3 oz','pouch',98),('813778017770','crock','3 oz','pouch',101),
          ]

          def valid_upca(code):
              if len(code)!=12 or not code.isdigit(): return False
              s=sum(int(code[i])*(3 if i%2==0 else 1) for i in range(11))
              return (10-s%10)%10==int(code[-1])
          def gtin14(code): return code.zfill(14)
          def split_ing(s): return [x.strip() for x in s.split(',')]
          def ounces(size): return float(size.split()[0])

          batch_upcs=[u[0] for u in units]
          assert len(batch_upcs)==18 and len(set(batch_upcs))==18
          assert all(valid_upca(u) for u in batch_upcs)

          # Mandatory exclusion gate: production, wrong-barcode/conflict docs, and every OTHER deep-research ledger.
          exclusion_files=[Path('data/known-products.ts'),Path('data/known-formulas.ts'),Path('data/wrong-barcodes.ts'),Path('docs/CATALOG-CONFLICTS.md')]
          exclusion_files += [p for p in Path('research').glob('deep-research-*.json') if p != TARGET]
          collisions=[]
          for p in exclusion_files:
              txt=p.read_text(encoding='utf-8')
              for upc in batch_upcs:
                  if upc in txt: collisions.append((upc,str(p)))
          if collisions:
              raise SystemExit('exclusion collisions: '+repr(collisions))

          ledger=json.loads(TARGET.read_text(encoding='utf-8'))
          if ledger.get('schema_version')!=2 or ledger.get('brand_scope')!=['Weruva']:
              raise SystemExit('unexpected Weruva ledger header')
          records=ledger['records']
          if len(records)!=50:
              raise SystemExit(f'expected 50 existing records, found {len(records)}')
          existing={r['upc'] for r in records}
          dup=existing.intersection(batch_upcs)
          if dup: raise SystemExit('already present in canonical ledger: '+repr(sorted(dup)))

          new=[]
          for upc,key,size,ptype,kcal in units:
              f=formulas[key]
              cp,cf,fib,moist=f['ga']
              kg=f['kg']
              kgcalc=kg*(ounces(size)*28.349523125/1000.0)
              sources=[f['url'],ADMC]
              if f.get('secondary'): sources.insert(1,f['secondary'])
              rec={
                'catalog_number':None,'upc':upc,'canonical_gtin14':gtin14(upc),'barcode_scope':'individual_unit',
                'brand':'Weruva','manufacturer':'Weruva','species':'cat','product_line':'Cat Stew',
                'product_name':f"Weruva Cat Stew {f['name']}",'variant':f['variant'],'recipe':f['recipe'],'life_stage':None,
                'food_form':'wet','texture':'minced' if ptype=='can' else None,'presentation':'in_gravy','package_type':ptype,'size':size,
                'ingredients_verbatim':f['ingredients'],'ingredients_ordered_normalized':split_ing(f['ingredients']),
                'guaranteed_analysis':{'crude_protein_min_percent':cp,'crude_fat_min_percent':cf,'crude_fiber_max_percent':fib,'moisture_max_percent':moist,'ash_max_percent':None,'taurine_min_percent':None,'other_printed_guarantees':[]},
                'calorie_content':{'kcal_per_kg':kg,'kcal_per_unit':kcal,'unit_name':ptype},'label_deck_code':None,
                'formula_source':'Current Weruva Cat Stew manufacturer product page for the current ingredient order, displayed guaranteed analysis, caloric basis and presentation; exact unit UPC/size corroborated by ADMC distributor mapping. For 5.5 oz cans, current exact-size retailer calorie text is included where the static Weruva page exposes only the 2.8 oz calorie line.',
                'source_urls':sources,'source_accessed_at':ACCESSED,
                'barcode_notes':f'ADMC maps UPC {upc} to this exact Cat Stew individual {size} {ptype} and lists case quantity separately; no case or multipack barcode was substituted. UPC-A is retained unchanged and zero-left-padded only for canonical GTIN-14.',
                'conflicts':[],
                'verification_notes':[f'UPC-A check digit verified for {upc}.',f'Canonical GTIN-14 is {gtin14(upc)}.',f'Published calorie cross-check at nominal package weight: {kg} kcal/kg × {size} = {kgcalc:.1f} kcal versus printed {kcal} kcal/{ptype}; both manufacturer-published bases are retained as printed even where nominal-weight arithmetic differs beyond simple rounding.','Current Weruva manufacturer evidence supplies the complete current ingredient order and the four guarantees displayed on its current panel. Ash and taurine remain null rather than being borrowed from retailer copy.','Fresh repository exclusion scan covered known-products, known-formulas, wrong-barcodes, CATALOG-CONFLICTS and every other deep-research ledger; no collision was found.','Current Weruva wording explicitly describes the canned Cat Stew recipes as finely minced in gravy; pouch texture is left null unless directly printed.'],
                'research_status':'source_verified'
              }
              required=['catalog_number','upc','canonical_gtin14','barcode_scope','brand','manufacturer','species','product_line','product_name','variant','recipe','life_stage','food_form','texture','presentation','package_type','size','ingredients_verbatim','ingredients_ordered_normalized','guaranteed_analysis','calorie_content','label_deck_code','formula_source','source_urls','source_accessed_at','barcode_notes','conflicts','verification_notes','research_status']
              missing=[k for k in required if k not in rec]
              if missing: raise SystemExit(f'{upc}: missing {missing}')
              if rec['ingredients_ordered_normalized'] != split_ing(rec['ingredients_verbatim']): raise SystemExit(f'{upc}: ingredient order mismatch')
              new.append(rec)

          records.extend(new)
          if len(records)!=68: raise SystemExit(f'expected 68 after append, got {len(records)}')
          if len({r['upc'] for r in records})!=68 or len({r['canonical_gtin14'] for r in records})!=68: raise SystemExit('Weruva canonical uniqueness failure')
          ledger['updated_at']=ACCESSED
          ledger['records']=records
          TARGET.write_text(json.dumps(ledger,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          # Re-read and validate the exact written payload.
          check=json.loads(TARGET.read_text(encoding='utf-8'))
          if len(check['records'])!=68 or [r['upc'] for r in check['records'][-18:]]!=batch_upcs: raise SystemExit('post-write ledger validation failed')

          # Consume Cat Stew rows from the working index and make the canonical count visible.
          idx=INDEX.read_text(encoding='utf-8')
          idx=idx.replace('Canonical strict ledger currently contains **50** complete schema-v2 records: the original 30 plus 20 promoted TruLuxe records.','Canonical strict ledger currently contains **68** complete schema-v2 records: the original 30, 20 promoted TruLuxe records, and 18 promoted Cat Stew records.')
          pattern=r'## Cat Stew — 18 verified candidates awaiting strict promotion\n.*?(?=\n## Senior / Freeze Dried / Puddy Pops / Wx treats)'
          repl="## Cat Stew — consumed\n\nAll 18 Cat Stew rows were promoted into `research/deep-research-weruva.json` as complete `source_verified` schema-v2 individual-unit records after a fresh repository exclusion pass. No Cat Stew index-only row remains.\n"
          idx2,n=re.subn(pattern,repl,idx,flags=re.S)
          if n!=1: raise SystemExit(f'Cat Stew index section replacement count {n}')
          INDEX.write_text(idx2,encoding='utf-8')

          # Update handoff headline/count and append an exact completed-batch note.
          h=HANDOFF.read_text(encoding='utf-8')
          h=h.replace('As of 2026-08-29 the strict ledger contains **50 complete schema-v2 records**:','As of 2026-08-29 the strict ledger contains **68 complete schema-v2 records**:')
          h=h.replace('- 20 TruLuxe records promoted from the post-30 index in commit `c76af91805f2f9be588bf6e2676cde4393fc6fe9`.','- 20 TruLuxe records promoted from the post-30 index in commit `c76af91805f2f9be588bf6e2676cde4393fc6fe9`.\n- 18 Cat Stew records promoted on 2026-08-29 after a fresh exclusion/check-digit/schema validation pass.')
          marker='## Cat Stew — 18 records fully re-researched, strict append still pending'
          h=h.replace(marker,'## Cat Stew — 18 records promoted to strict ledger')
          h += '\n\n## 2026-08-29 Cat Stew strict promotion\n\nPromoted 18 Cat Stew individual-unit UPCs to the canonical ledger: '+', '.join(f'`{u}`' for u in batch_upcs)+'. Fresh exclusion scan found zero collisions. Canonical Weruva strict count after this batch: **68**.\n'
          HANDOFF.write_text(h,encoding='utf-8')

          # One-shot runner: remove it from branch after a successful promotion commit.
          RUNNER.unlink()
          print('PROMOTED',len(new),'CAT STEW RECORDS; CANONICAL TOTAL',len(records))
          PY
      - name: Commit canonical Weruva promotion
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/deep-research-weruva.json research/WERUVA-POST-30-INDEX.md research/WERUVA-HANDOFF.md .github/workflows/weruva-promote-cat-stew.yml
          git commit -m "research: promote 18 Weruva Cat Stew records"
          git push origin HEAD:agent/deep-research-weruva
