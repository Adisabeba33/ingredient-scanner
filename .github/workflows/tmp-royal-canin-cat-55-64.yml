name: Temporary Royal Canin cat 55-64 inspect
on:
  push:
    paths:
      - '.github/workflows/tmp-royal-canin-cat-55-64.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
      - name: Inspect current cat ledger
        shell: python
        run: |
          import json, pathlib
          doc = json.loads(pathlib.Path('research/deep-research-royal-canin.json').read_text())
          batch = json.loads(pathlib.Path('research/.tmp-royal-canin-cat-batch-55-64.json').read_text())
          existing = {r['upc']: r for r in doc['records']}
          print('CURRENT_COUNT', len(doc['records']))
          print('LAST_15_BEGIN')
          for r in doc['records'][-15:]:
              print(r['upc'], '|', r['product_name'], '|', r['size'], '|', r['research_status'])
          print('LAST_15_END')
          print('BATCH_COLLISIONS_BEGIN')
          for r in batch:
              if r['upc'] in existing:
                  e = existing[r['upc']]
                  print(r['upc'], '| BATCH=', r['product_name'], r['size'], '| EXISTING=', e['product_name'], e['size'], e['research_status'])
          print('BATCH_COLLISIONS_END')
          print('BATCH_NEW', [r['upc'] for r in batch if r['upc'] not in existing])
