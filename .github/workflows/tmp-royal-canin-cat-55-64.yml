name: Temporary Royal Canin cat candidate check
on:
  push:
    paths:
      - '.github/workflows/tmp-royal-canin-cat-55-64.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
      - name: Check candidate UPCs against live cat ledger
        shell: python
        run: |
          import json, pathlib
          doc = json.loads(pathlib.Path('research/deep-research-royal-canin.json').read_text())
          existing = {r['upc']: r for r in doc['records']}
          candidates = [
            '030111444264','030111711557','030111701619','030111710314','030111710987',
            '030111716750','030111701350','030111710413','030111711083','030111701114',
            '030111715388','030111710215','030111710284','030111715180','030111549600','030111416759'
          ]
          print('CURRENT_COUNT', len(doc['records']))
          for u in candidates:
              if u in existing:
                  r = existing[u]
                  print('EXISTS', u, r['product_name'], r['size'], r['research_status'])
              else:
                  print('NEW', u)
