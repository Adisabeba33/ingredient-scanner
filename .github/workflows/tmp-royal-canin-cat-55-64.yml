name: Temporary Royal Canin cat next 10 verify
on:
  push:
    paths:
      - '.github/workflows/tmp-royal-canin-cat-55-64.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
      - name: Verify committed cat ledger
        shell: python
        run: |
          import json, pathlib
          doc=json.loads(pathlib.Path('research/deep-research-royal-canin.json').read_text())
          expected={
            '030111444264':('Royal Canin Digestive Care Dry Cat Food','14 lb'),
            '030111701619':('Royal Canin Digestive Care Thin Slices in Gravy Wet Cat Food','5.1 oz'),
            '030111710314':('Royal Canin Hair & Skin Care Loaf in Sauce Wet Cat Food','5.1 oz'),
            '030111710987':('Royal Canin Hair & Skin Care Loaf in Sauce Wet Cat Food','3 oz'),
            '030111716750':('Royal Canin Hairball Care Thin Slices in Gravy Wet Cat Food','3 oz'),
            '030111701350':('Royal Canin Urinary Care Thin Slices in Gravy Wet Cat Food','5.1 oz'),
            '030111710413':('Royal Canin Weight Care Loaf in Sauce Wet Cat Food','5.1 oz'),
            '030111711083':('Royal Canin Weight Care Loaf in Sauce Wet Cat Food','3 oz'),
            '030111701114':('Royal Canin Weight Care Thin Slices in Gravy Wet Cat Food','5.1 oz'),
            '030111715388':('Royal Canin Weight Care Thin Slices in Gravy Wet Cat Food','3 oz')
          }
          assert len(doc['records'])==79, len(doc['records'])
          assert len({r['upc'] for r in doc['records']})==79
          assert len({r['canonical_gtin14'] for r in doc['records']})==79
          def cd(u): return str((-sum(int(d)*(3 if i%2==0 else 1) for i,d in enumerate(u[:11])))%10)
          found={}
          for r in doc['records']:
              assert r['brand']=='Royal Canin' and r['species']=='cat'
              assert r['upc'][-1]==cd(r['upc'])
              assert r['canonical_gtin14']==r['upc'].zfill(14)
              if r['upc'] in expected:
                  assert r['research_status']=='source_verified'
                  assert r['barcode_scope']=='individual_unit'
                  assert (r['product_name'],r['size'])==expected[r['upc']]
                  assert r['ingredients_verbatim'] and r['ingredients_ordered_normalized']
                  found[r['upc']]=1
          assert set(found)==set(expected)
          print('VERIFIED_TOTAL',len(doc['records']))
          print('VERIFIED_BATCH',','.join(expected))
