name: Diagnose Royal Canin dog b7 collisions
on:
  push:
    branches: [agent/deep-research-barcode-ledger]
    paths: ['.github/workflows/append-royal-canin-dogs-b7.yml']
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
      - shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('.')
          ledger=json.loads((root/'research/deep-research-royal-canin-dogs.json').read_text())
          batch=json.loads((root/'research/.royal-canin-dogs-append-2026-08-26-b7.json').read_text())['records']
          scan=[root/'data/known-products.ts',root/'data/known-formulas.ts',root/'data/wrong-barcodes.ts',root/'docs/CATALOG-CONFLICTS.md']+sorted((root/'research').glob('deep-research-*.json'))
          texts={str(p):p.read_text(errors='ignore') for p in scan if p.exists()}
          ids={(r.get('product_name'),r.get('variant'),r.get('size')) for r in ledger['records']}
          print('LEDGER',len(ledger['records']))
          for r in batch:
            u=r['upc']; g=r['canonical_gtin14']; ident=(r.get('product_name'),r.get('variant'),r.get('size'))
            hits=[p for p,t in texts.items() if u in t or g in t]
            print(u,'IDENT_COLLISION',ident in ids,'UPC_HITS',','.join(hits) if hits else 'NONE')
          PY
