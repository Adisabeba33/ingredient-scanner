name: Guarded Royal Canin dog append b7 corrected
on:
  push:
    branches: [agent/deep-research-barcode-ledger]
    paths: ['.github/workflows/append-royal-canin-dogs-b7.yml']
permissions: {contents: write}
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/deep-research-barcode-ledger, fetch-depth: 0}
      - shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('.'); target=root/'research/deep-research-royal-canin-dogs.json'
          ledger=json.loads(target.read_text()); assert len(ledger['records'])==140
          batch=json.loads((root/'research/.royal-canin-dogs-append-2026-08-26-b7.json').read_text())['records']; assert len(batch)==10
          scan=[root/'data/known-products.ts',root/'data/known-formulas.ts',root/'data/wrong-barcodes.ts',root/'docs/CATALOG-CONFLICTS.md']+sorted((root/'research').glob('deep-research-*.json'))
          texts={str(p):p.read_text(errors='ignore') for p in scan if p.exists()}
          ids={(r.get('product_name'),r.get('variant'),r.get('size')) for r in ledger['records']}; su=set(); sg=set()
          def valid(u):
            s=sum((3 if i%2==0 else 1)*int(u[i]) for i in range(11)); return re.fullmatch(r'\d{12}',u) and (10-s%10)%10==int(u[-1])
          for r in batch:
            assert r['brand']=='Royal Canin' and r['species']=='dog' and r['research_status']=='source_verified' and r['barcode_scope']=='individual_unit'
            assert r['ingredients_verbatim'] and r['ingredients_ordered_normalized'] and r['source_urls']
            u=r['upc']; g=r['canonical_gtin14']; assert valid(u) and g==u.zfill(14) and u not in su and g not in sg; su.add(u); sg.add(g)
            ident=(r.get('product_name'),r.get('variant'),r.get('size')); assert ident not in ids,ident; ids.add(ident)
            hits=[p for p,t in texts.items() if u in t or g in t]; assert not hits,(u,hits)
          ledger['records'].extend(batch); ledger['updated_at']='2026-08-26'
          ups=[r['upc'] for r in ledger['records']]; gts=[r['canonical_gtin14'] for r in ledger['records']]
          assert len(ups)==150 and len(ups)==len(set(ups)) and len(gts)==len(set(gts))
          target.write_text(json.dumps(ledger,ensure_ascii=False,separators=(',',':'))+'\n')
          for p in sorted((root/'research').glob('deep-research-*.json')): json.loads(p.read_text())
          print('APPENDED 10 TOTAL',len(ledger['records'])); print('UPCS',','.join(r['upc'] for r in batch))
          PY
      - shell: bash
        run: |
          rm research/.royal-canin-dogs-append-2026-08-26-b7.json .github/workflows/append-royal-canin-dogs-b7.yml
          git config user.name ingredients-research-bot
          git config user.email actions@users.noreply.github.com
          git add -A && git commit -m 'research: add Royal Canin dogs records 141-150' && git push origin HEAD:agent/deep-research-barcode-ledger
