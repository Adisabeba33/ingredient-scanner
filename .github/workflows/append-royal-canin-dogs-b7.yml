name: Scan Royal Canin dog b7 replacements
on:
  push:
    branches: [agent/deep-research-barcode-ledger]
    paths: ['.github/workflows/append-royal-canin-dogs-b7.yml']
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/deep-research-barcode-ledger}
      - shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('.')
          ledger=json.loads((root/'research/deep-research-royal-canin-dogs.json').read_text())
          scan=[root/'data/known-products.ts',root/'data/known-formulas.ts',root/'data/wrong-barcodes.ts',root/'docs/CATALOG-CONFLICTS.md']+sorted((root/'research').glob('deep-research-*.json'))
          texts={str(p):p.read_text(errors='ignore') for p in scan if p.exists()}
          candidates=['030111427670','030111760586','030111760548','030111476470','030111476425','030111330918','030111312211','030111476883','030111760074','030111760012','030111760029','030111760272','030111760210','030111760227']
          for u in candidates:
            g=u.zfill(14); hits=[p for p,t in texts.items() if u in t or g in t]
            print(u,'HITS',','.join(hits) if hits else 'NONE')
          PY
