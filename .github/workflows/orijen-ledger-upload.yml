name: ORIJEN ledger upload

on:
  push:
    branches:
      - agent/deep-research-orijen
    paths:
      - .github/workflows/orijen-ledger-upload.yml

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore validated 40-record ledger
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/orijen.b64 <<'EOF'

EOF
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib
          raw = gzip.decompress(base64.b64decode(pathlib.Path('/tmp/orijen.b64').read_text()))
          assert hashlib.sha256(raw).hexdigest() == '89ba81afbdaf72bcd0699db1f326df901e59cf5cccbc5ff52a1d01933b36969f'
          d = json.loads(raw)
          assert d['brand_scope'] == ['Orijen']
          assert len(d['records']) == 40
          assert len({r['upc'] for r in d['records']}) == 40
          assert sum(r['research_status'] == 'source_verified' for r in d['records']) == 39
          assert sum(r['research_status'] == 'candidate' for r in d['records']) == 1
          pathlib.Path('/tmp/deep-research-orijen.json').write_bytes(raw)
          PY
          BASE='f24e32872efd23c764cf32ad3368ed5b2efbe554'
          git checkout --detach "$BASE"
          cp /tmp/deep-research-orijen.json research/deep-research-orijen.json
          git add research/deep-research-orijen.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: Orijen batch 2 — append 20 normalized cat records'
          git push --force-with-lease="refs/heads/agent/deep-research-orijen:${GITHUB_SHA}" origin HEAD:refs/heads/agent/deep-research-orijen
