name: Temporary Royal Canin dogs batch 05 cleanup

on:
  push:
    branches:
      - agent/deep-research-barcode-ledger

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Adisabeba33/ingredient-scanner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: Correct URL and prose typo then validate
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('research/deep-research-royal-canin-dogs.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          if len(d.get('records',[])) != 50:
              raise SystemExit(f"Expected 50 records, found {len(d.get('records',[]))}")
          by={r['upc']:r for r in d['records']}
          r=by['030111493880']
          bad='https://alsipnursery.com/products/royal-canin-medium-puppy-dog-food-17-lbb'
          good='https://alsipnursery.com/products/royal-canin-medium-puppy-dog-food-17-lb'
          if bad not in r['source_urls']:
              raise SystemExit('Unexpected Medium Puppy source URL state')
          r['source_urls']=[good if u==bad else u for u in r['source_urls']]
          r2=by['030111179302']
          if not any('USa formula' in s for s in r2.get('conflicts',[])):
              raise SystemExit('Unexpected Large Adult conflict-note state')
          r2['conflicts']=[s.replace('USa formula','USA formula') for s in r2['conflicts']]
          upcs=[r['upc'] for r in d['records']]; gtins=[r['canonical_gtin14'] for r in d['records']]
          if len(set(upcs)) != 50 or len(set(gtins)) != 50:
              raise SystemExit('Uniqueness check failed')
          if any('17-lbb' in json.dumps(r,ensure_ascii=False) for r in d['records']):
              raise SystemExit('Bad URL suffix remains')
          if any('USa formula' in json.dumps(r,ensure_ascii=False) for r in d['records']):
              raise SystemExit('Typo remains')
          p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          json.loads(p.read_text(encoding='utf-8'))
          print('validated cleanup on 50 records')
          PY
          rm .github/workflows/tmp-royal-canin-dogs-batch-05-cleanup.yml
          git config user.name "Adisabeba33"
          git config user.email "lezzgo2@gmail.com"
          git add research/deep-research-royal-canin-dogs.json .github/workflows/tmp-royal-canin-dogs-batch-05-cleanup.yml
          git commit -m "research: clean Royal Canin dogs batch 05 metadata"
          git push origin HEAD:agent/deep-research-barcode-ledger
