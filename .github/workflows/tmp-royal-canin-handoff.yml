name: Build Royal Canin research handoff
on:
  push:
permissions:
  contents: write
jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: Generate handoff from live ledgers
        run: |
          python - <<'PY'
          import json, pathlib, collections, datetime
          root = pathlib.Path('.')
          ledgers = [
              ('DOGS', 'research/deep-research-royal-canin-dogs.json', 'dog'),
              ('CATS', 'research/deep-research-royal-canin.json', 'cat'),
          ]
          def counts(records, key):
              c=collections.Counter((r.get(key) if r.get(key) is not None else 'null') for r in records)
              return c
          def fmt_counter(c):
              return ', '.join(f'`{k}` {v}' for k,v in sorted(c.items(), key=lambda kv:(-kv[1], str(kv[0])))) or 'none'
          lines=[]
          lines += ['# Royal Canin Deep Research — pause / handoff', '',
                    '> Snapshot generated from the live files on branch `agent/deep-research-barcode-ledger` on 2026-08-26.',
                    '> Royal Canin research is intentionally PAUSED for both species. Do not start new Royal Canin research until explicitly requested.', '',
                    '## Critical file ownership', '',
                    '- **Dogs only:** `research/deep-research-royal-canin-dogs.json`',
                    '- **Cats only:** `research/deep-research-royal-canin.json`',
                    '- Do **not** merge the two ledgers. This project intentionally split Royal Canin by species to permit safe parallel work; this is the explicit exception to the generic one-brand/one-ledger example in `research/AGENTS.md`.',
                    '- `research/AGENTS.md` remains binding for evidence, duplicate checks, status gates, validation, concurrency safety, and promotion rules.',
                    '- These are **staging research ledgers**, not production catalog data. A developer may independently re-check and promote records into production. Future research must re-fetch all production and research exclusions before finding anything new.', '']
          grand=0
          for label,path,species in ledgers:
              data=json.loads((root/path).read_text())
              recs=data.get('records',[]); grand += len(recs)
              assert all(r.get('species')==species for r in recs), f'{path}: species contamination'
              upcs=[r.get('upc') for r in recs]; gtins=[r.get('canonical_gtin14') for r in recs]
              uniq_upc=len(set(upcs)); uniq_gtin=len(set(gtins))
              lines += [f'## Royal Canin {label}', '', f'- Ledger: `{path}`', f'- Live record count: **{len(recs)}**', f'- Unique UPC count: **{uniq_upc}**', f'- Unique canonical GTIN-14 count: **{uniq_gtin}**', f'- `updated_at`: `{data.get("updated_at")}`', f'- Statuses: {fmt_counter(counts(recs,"research_status"))}', f'- Food forms: {fmt_counter(counts(recs,"food_form"))}', f'- Package types: {fmt_counter(counts(recs,"package_type"))}', f'- Life stages: {fmt_counter(counts(recs,"life_stage"))}', '']
              lines += ['### Product-line coverage', '']
              for k,v in sorted(counts(recs,'product_line').items(), key=lambda kv:(-kv[1], str(kv[0]))): lines.append(f'- {k}: **{v}**')
              conflicts=[r for r in recs if r.get('conflicts')]
              phys=[r for r in recs if r.get('research_status')=='needs_physical_label']
              rejected=[r for r in recs if r.get('research_status')=='rejected']
              lines += ['', '### Evidence / review state', '', f'- Records with non-empty `conflicts`: **{len(conflicts)}**', f'- `needs_physical_label`: **{len(phys)}**', f'- `rejected`: **{len(rejected)}**', '- For `source_verified`, the intended standard is: proven individual-unit UPC + exact size + valid check digit + canonical GTIN-14 + current formula evidence + repository-wide duplicate check.', '- Formula evidence and barcode evidence may come from different sources. Current Royal Canin USA is preferred as formula master when available; distributor/retailer evidence is used to prove exact UPC-to-unit-size identity.', '- Do not combine old retailer ingredient panels with a newer Royal Canin USA formula generation. Preserve the current formula and record the disagreement in `conflicts`.', '']
              if conflicts:
                  lines += ['#### Records carrying conflicts', '']
                  for r in conflicts[:30]:
                      lines.append(f'- `{r.get("upc")}` — {r.get("product_name")} — {r.get("size")}: ' + ' | '.join(map(str,r.get('conflicts',[]))))
                  if len(conflicts)>30: lines.append(f'- … plus {len(conflicts)-30} more; inspect the JSON directly before promotion/resume.')
                  lines.append('')
              lines += ['### Last 20 records currently in ledger', '']
              for i,r in enumerate(recs[-20:], start=max(1,len(recs)-19)):
                  lines.append(f'- **{i}** — `{r.get("upc")}` — {r.get("product_name")} — {r.get("size")} — `{r.get("research_status")}`')
              lines += ['', '### Resume point', '', f'- If this file has not changed, next ordinal would be **{len(recs)+1}**.', '- **Do not trust that ordinal later.** On resume, fetch the live ledger again and recompute count, blob SHA, last UPCs, status counts, and repository-wide exclusions.', '- Before every append, check UPC and canonical GTIN-14 against `data/known-products.ts`, `data/known-formulas.ts`, `data/wrong-barcodes.ts`, `docs/CATALOG-CONFLICTS.md`, and every `research/deep-research-*.json` file.', '- Do not rely only on GitHub code search: during this campaign it repeatedly missed UPCs that were present inside the large minified JSON. Read/parse the raw ledger itself or use a guard script.', '- Batch size target remains ~10 clean new `source_verified` SKU, but never pad a batch with weak UPCs.', '']
          lines += ['## Campaign lessons worth preserving', '',
                    '- Several plausible UPC candidate lists contained hidden duplicates. The repository guard, not GitHub Search, was the reliable final authority.',
                    '- A UPC printed in an old catalog is not automatically trustworthy; validate UPC-A check digit mathematically. Example encountered during this campaign: `030111425356` was invalid, while a newer catalog used `030111425256`.',
                    '- Distinguish individual retail unit UPC from case/shipping/multipack identifiers. A source showing `UNIT SIZE` plus `#/CS` can still prove the UPC belongs to one sellable unit if the mapping is explicit.',
                    '- For wet food, sanity-check printed kcal/can against kcal/kg × package kg; small label-rounding differences are acceptable and should be documented.',
                    '- For products serving both mother/gestation/lactation and puppy/kitten growth, do not invent a life-stage enum. Use the allowed `null`/controlled value and explain it.',
                    '- Do not invent texture/presentation synonyms such as treating “in gel” as gravy/sauce when the repository vocabulary does not support that mapping.',
                    '- Temporary guarded workflows used during research must not remain after a successful batch. At resume, inspect `.github/workflows/` and remove only clearly temporary Royal Canin research workflows if any were stranded by a failed run.', '',
                    '## Promotion / developer handoff', '',
                    '- The developer should independently re-check every record before production promotion. Research status `source_verified` means the research evidence gate passed; it is not a substitute for the developer’s own production validation.',
                    '- If records are promoted to `data/known-products.ts` / `data/known-formulas.ts`, future Royal Canin research must treat those promoted UPCs as occupied even if the research ledger still contains them.',
                    '- If the developer changes a research record during review, document the reason rather than silently rewriting history.',
                    '- Draft PR **#1** is the campaign review surface. Do not merge it without an explicit user request.', '',
                    f'## Combined snapshot', '', f'- Royal Canin records across the two staging ledgers at this snapshot: **{grand}**.', '- Pause state: **Royal Canin cats and dogs research paused by user on 2026-08-26.**', '- Resume instruction: start by re-reading this handoff, then `research/AGENTS.md`, then both live ledgers and the full repository exclusion set.', '']
          out=root/'research/ROYAL-CANIN-HANDOFF.md'
          out.write_text('\n'.join(lines)+'\n')
          # Basic integrity checks on both ledgers and generated handoff.
          for _,path,_ in ledgers:
              d=json.loads((root/path).read_text()); ups=[r.get('upc') for r in d['records']]; g=[r.get('canonical_gtin14') for r in d['records']]
              assert len(ups)==len(set(ups)), f'duplicate UPC in {path}'
              assert len(g)==len(set(g)), f'duplicate GTIN in {path}'
          print(out.read_text())
          PY
      - name: Commit handoff and remove temporary workflow
        run: |
          rm .github/workflows/tmp-royal-canin-handoff.yml
          git config user.name ingredients-research-bot
          git config user.email actions@users.noreply.github.com
          git add research/ROYAL-CANIN-HANDOFF.md .github/workflows/tmp-royal-canin-handoff.yml
          git commit -m "research: document Royal Canin cats and dogs handoff"
          git push origin HEAD:agent/deep-research-barcode-ledger
