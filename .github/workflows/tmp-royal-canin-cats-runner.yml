name: Blue Buffalo Remaining Audit

on:
  push:
    branches:
      - agent/deep-research-blue-buffalo
    paths:
      - .github/workflows/tmp-royal-canin-cats-runner.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blue-buffalo-remaining-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Blue Buffalo branch
        uses: actions/checkout@v4
        with:
          ref: agent/deep-research-blue-buffalo
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Print deterministic remaining ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          p=Path('research/deep-research-blue-buffalo.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          recs=data['records']
          c=Counter(r.get('research_status') for r in recs)
          print(f"AUDIT\tTOTAL={len(recs)}\tsource_verified={c.get('source_verified',0)}\tneeds_physical_label={c.get('needs_physical_label',0)}")
          for i,r in enumerate(recs):
              if r.get('research_status')!='needs_physical_label':
                  continue
              fields=[]
              for k in ('upc','brand','product_line','product_name','variant','species','life_stage','food_form','texture','presentation','package_type','size'):
                  v=r.get(k)
                  if v not in (None,'',[],{}):
                      fields.append(f"{k}={v}")
              missing=[]
              if not r.get('canonical_gtin14'): missing.append('canonical_gtin14')
              if not r.get('ingredients_verbatim'): missing.append('ingredients')
              ga=r.get('guaranteed_analysis') or {}
              if not ga or all(v in (None,'',[],{}) for v in ga.values()): missing.append('GA')
              cal=r.get('calorie_content') or {}
              if not cal or not cal.get('kcal_per_kg'): missing.append('calories')
              if not r.get('life_stage'): missing.append('life_stage')
              if not r.get('food_form'): missing.append('food_form')
              if not r.get('source_urls'): missing.append('sources')
              conflicts=r.get('conflicts') or []
              notes=r.get('verification_notes') or []
              print(f"ROW\t{i}\t"+'\t'.join(fields)+f"\tmissing={missing}\tconflicts={conflicts}\tnotes={notes}")
          PY

      - name: Restore shared runner from base branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/deep-research-barcode-ledger
          git show origin/agent/deep-research-barcode-ledger:.github/workflows/tmp-royal-canin-cats-runner.yml > .github/workflows/tmp-royal-canin-cats-runner.yml
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tmp-royal-canin-cats-runner.yml
          if git diff --cached --quiet; then
            echo "Runner already restored."
            exit 0
          fi
          git commit -m "chore: restore shared research runner"
          git push origin HEAD:agent/deep-research-blue-buffalo
