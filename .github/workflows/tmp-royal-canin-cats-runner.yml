name: Inspect Blue Buffalo near-complete records

on:
  push:
    branches:
      - agent/deep-research-blue-buffalo
    paths:
      - .github/workflows/tmp-royal-canin-cats-runner.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-blue-buffalo
          fetch-depth: 0
      - name: Print selected records
        run: |
          python - <<'PY'
          import json
          p='research/deep-research-blue-buffalo.json'
          d=json.load(open(p,encoding='utf-8'))
          wanted={'840243140558','840243140695','840243140626','840243140664','840243153848','840243101566','840243122424','840243103492','840243151172','840243151189','840243155781','840243155798','840243122509','859610006007','840243122486','859610006014','840243122479','859610000241','840243151448','859610000265','840243122417','840243122578','859610000791','840243101986','840243105786'}
          for r in d['records']:
              if r.get('upc') in wanted:
                  print('RECORD_JSON',json.dumps(r,ensure_ascii=False,separators=(',',':')))
          PY
      - name: Restore runner
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/deep-research-barcode-ledger
          git show origin/agent/deep-research-barcode-ledger:.github/workflows/tmp-royal-canin-cats-runner.yml > .github/workflows/tmp-royal-canin-cats-runner.yml
          git add .github/workflows/tmp-royal-canin-cats-runner.yml
          git commit -m "chore: restore research runner"
          git push origin HEAD:agent/deep-research-blue-buffalo
