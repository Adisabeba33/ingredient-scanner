name: Append Blue Buffalo True Solutions batch 20

on:
  push:
    branches:
      - agent/deep-research-blue-buffalo
    paths:
      - .github/workflows/tmp-royal-canin-cats-runner.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-blue-buffalo
          fetch-depth: 0
      - name: Append validated Blue Buffalo batch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          items=[
          ('840243135639','True Solutions','Weight Control Chicken Recipe','adult','wet','can','3 oz (85 g)',['chicken']),
          ('840243154111','True Solutions','Urinary Care Chicken Recipe','adult','wet','can','3 oz (85 g)',['chicken']),
          ('840243150564','True Solutions','Urinary Care Formula with Chicken','adult','dry','bag','3.5 lb (1.59 kg)',['chicken']),
          ('840243150571','True Solutions','Urinary Care Formula with Chicken','adult','dry','bag','11 lb (4.99 kg)',['chicken']),
          ('840243135615','True Solutions','Digestive Care Chicken Recipe','adult','wet','can','3 oz (85 g)',['chicken']),
          ('840243135691','True Solutions','Skin & Coat Care Whitefish Recipe','adult','wet','can','3 oz (85 g)',['whitefish']),
          ('840243135240','True Solutions','Skin & Coat Care Salmon & Brown Rice Recipe','adult','dry','bag','11 lb (4.99 kg)',['salmon']),
          ('840243135257','True Solutions','Skin & Coat Care Salmon & Brown Rice Recipe','adult','dry','bag','3.5 lb (1.59 kg)',['salmon']),
          ('840243135318','True Solutions','Weight Control Chicken, Barley & Brown Rice Recipe','adult','dry','bag','3.5 lb (1.59 kg)',['chicken']),
          ('840243135301','True Solutions','Weight Control Chicken, Barley & Brown Rice Recipe','adult','dry','bag','11 lb (4.99 kg)',['chicken']),
          ('840243142187','True Solutions','Hairball Control Chicken & Oatmeal Recipe','adult','dry','bag','3.5 lb (1.59 kg)',['chicken']),
          ('840243141326','True Solutions','Total Support Chicken & Oatmeal Recipe','adult','dry','bag','11 lb (4.99 kg)',['chicken']),
          ('840243135219','True Solutions','Digestive Care Chicken & Barley Recipe','adult','dry','bag','11 lb (4.99 kg)',['chicken']),
          ('840243101542','Basics','Mature Indoor Turkey & Potato Recipe','senior','dry','bag','5 lb (2.27 kg)',['turkey']),
          ('840243101559','Basics','Mature Indoor Turkey & Potato Recipe','senior','dry','bag','11 lb (4.99 kg)',['turkey']),
          ('840243102044','Basics','Skin & Stomach Care Indoor Duck & Potato Recipe','adult','dry','bag','5 lb (2.27 kg)',['duck']),
          ('840243102051','Basics','Skin & Stomach Care Indoor Duck & Potato Recipe','adult','dry','bag','11 lb (4.99 kg)',['duck']),
          ('840243109548','Basics','Skin & Stomach Care Turkey Recipe','adult','wet','can','5.5 oz (156 g)',['turkey']),
          ('859610007745','Basics','Skin & Stomach Care Turkey Recipe','adult','wet','can','3 oz (85 g)',['turkey']),
          ('859610007301','Basics','Skin & Stomach Care Fish Recipe','adult','wet','can','3 oz (85 g)',['fish'])]
          def valid(u):
              if len(u)!=12 or not u.isdigit(): return False
              s=sum((3 if i%2==0 else 1)*int(d) for i,d in enumerate(u[:11])); return (10-s%10)%10==int(u[-1])
          assert len(items)==20 and len({x[0] for x in items})==20 and all(valid(x[0]) for x in items)
          target=Path('research/deep-research-blue-buffalo.json'); ledger=json.loads(target.read_text())
          upcs=[x[0] for x in items]
          paths=[Path('data/known-products.ts'),Path('data/known-formulas.ts'),Path('data/wrong-barcodes.ts'),Path('docs/CATALOG-CONFLICTS.md')]
          paths += [p for p in Path('research').glob('deep-research-*.json') if p!=target]
          for p in paths:
              if p.exists():
                  txt=p.read_text(encoding='utf-8',errors='ignore'); hits=[u for u in upcs if u in txt]; assert not hits, f'duplicates in {p}: {hits}'
          existing={r['upc'] for r in ledger['records']}; assert not existing.intersection(upcs), sorted(existing.intersection(upcs))
          official='https://www.bluebuffalo.com/incentive-requests/qualifying-products/'
          sources=[official,'https://www.bluebuffalo.com/natural-cat-food/true-solutions/','https://www.admc.us/wp-content/uploads/2022/02/2024-North-Complete-Price-List_5.12.25.pdf']
          batch=[]
          for upc,line,var,life,form,pkg,size,recipe in items:
              batch.append({'catalog_number':None,'upc':upc,'canonical_gtin14':upc.zfill(14),'barcode_scope':'individual_unit','brand':'Blue Buffalo','manufacturer':'Blue Buffalo Company, Ltd.','species':'cat','product_line':line,'product_name':f'BLUE {line} {var}','variant':var,'recipe':recipe,'life_stage':life,'food_form':form,'texture':None,'presentation':None,'package_type':pkg,'size':size,'ingredients_verbatim':'','ingredients_ordered_normalized':[],'guaranteed_analysis':{'crude_protein_min_percent':None,'crude_fat_min_percent':None,'crude_fiber_max_percent':None,'moisture_max_percent':None,'ash_max_percent':None,'taurine_min_percent':None,'other_printed_guarantees':[]},'calorie_content':{'kcal_per_kg':None,'kcal_per_unit':None,'unit_name':None},'label_deck_code':None,'formula_source':'Current manufacturer and retail evidence establishes this cat-food product and exact UPC/size identity, but the complete current label deck (full ingredient statement + all printed guarantees + calories) was not resolved as one coherent generation strongly enough for source_verified status.','source_urls':sources,'source_accessed_at':'2026-08-29','barcode_notes':f'UPC {upc} is cataloged for this exact individual Blue Buffalo cat-food unit/size; UPC-A check digit validated.','conflicts':['Complete current formula-generation evidence remains incomplete; no historical ingredient/GA/calorie deck was silently substituted.'],'verification_notes':[f'UPC-A check digit validated for {upc}; canonical GTIN-14 is {upc.zfill(14)}.','Repository-wide exclusion scan completed before append.','Current manufacturer/retailer evidence establishes product and package identity.','Formula fields intentionally remain unresolved until one coherent current label deck including calories can be proven.'],'research_status':'needs_physical_label'})
          before=len(ledger['records']); ledger['records'].extend(batch); ledger['updated_at']='2026-08-29'
          assert len(ledger['records'])==before+20 and len({r['upc'] for r in ledger['records']})==len(ledger['records'])
          target.write_text(json.dumps(ledger,separators=(',',':'),ensure_ascii=False)+'\n',encoding='utf-8')
          print(f'APPEND_OK before={before} added=20 after={len(ledger["records"])} verified=0 needs=20')
          print('UPCS='+','.join(upcs))
          PY
      - name: Restore runner and commit ledger
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show origin/agent/deep-research-barcode-ledger:.github/workflows/tmp-royal-canin-cats-runner.yml > .github/workflows/tmp-royal-canin-cats-runner.yml
          git add research/deep-research-blue-buffalo.json .github/workflows/tmp-royal-canin-cats-runner.yml
          git diff --cached --quiet && { echo "No target changes"; exit 1; }
          git commit -m "research: add 20 Blue Buffalo True Solutions and Basics records"
          git push origin HEAD:agent/deep-research-blue-buffalo
