name: Append Blue Buffalo Wilderness batch 20

on:
  push:
    branches:
      - agent/deep-research-blue-buffalo
    paths:
      - .github/workflows/tmp-royal-canin-cats-runner.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  BATCH_ZLIB_B64: ''

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-blue-buffalo
          fetch-depth: 0
      - name: Append validated Blue Buffalo Wilderness batch
        run: |
          python - <<'PY'
          import base64, json, os, zlib
          from pathlib import Path
          target=Path('research/deep-research-blue-buffalo.json')
          ledger=json.loads(target.read_text(encoding='utf-8'))
          batch=json.loads(zlib.decompress(base64.b64decode(os.environ['BATCH_ZLIB_B64'])).decode('utf-8'))
          assert len(batch)==20
          upcs=[r['upc'] for r in batch]
          assert len(set(upcs))==20
          def upc_ok(u):
              if len(u)!=12 or not u.isdigit(): return False
              s=sum((3 if i%2==0 else 1)*int(d) for i,d in enumerate(u[:11]))
              return (10-s%10)%10==int(u[-1])
          assert all(upc_ok(u) for u in upcs)
          assert all(r['canonical_gtin14']==r['upc'].zfill(14) for r in batch)
          assert all(r['brand']=='Blue Buffalo' and r['species']=='cat' and r['catalog_number'] is None for r in batch)
          assert all(r['research_status']=='source_verified' for r in batch)
          # Mandatory live exclusion scan. Exclude target itself from text scan, then check parsed target separately.
          exclusion_paths=[
              Path('data/known-products.ts'),Path('data/known-formulas.ts'),Path('data/wrong-barcodes.ts'),Path('docs/CATALOG-CONFLICTS.md')
          ]
          exclusion_paths += [p for p in Path('research').glob('deep-research-*.json') if p != target]
          for p in exclusion_paths:
              if p.exists():
                  txt=p.read_text(encoding='utf-8',errors='ignore')
                  hits=[u for u in upcs if u in txt]
                  assert not hits, f'duplicate UPC(s) in {p}: {hits}'
          existing={r['upc'] for r in ledger['records']}
          hits=existing.intersection(upcs)
          assert not hits, f'duplicate UPC(s) in Blue ledger: {sorted(hits)}'
          before=len(ledger['records'])
          ledger['records'].extend(batch)
          ledger['updated_at']='2026-08-29'
          assert len(ledger['records'])==before+20
          assert len({r['upc'] for r in ledger['records']})==len(ledger['records'])
          json.dumps(ledger,ensure_ascii=False)
          target.write_text(json.dumps(ledger,separators=(',',':'),ensure_ascii=False)+'\n',encoding='utf-8')
          print(f'APPEND_OK before={before} added=20 after={len(ledger["records"])} verified=20')
          print('UPCS=' + ','.join(upcs))
          PY
      - name: Commit ledger
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/deep-research-blue-buffalo.json
          git diff --cached --quiet && { echo "No target changes"; exit 1; }
          git commit -m "research: add 20 Blue Buffalo Wilderness records"
          git push origin HEAD:agent/deep-research-blue-buffalo
