name: Inspect Blue Buffalo Wild Cuts records

on:
  push:
    branches:
      - agent/deep-research-blue-buffalo
    paths:
      - .github/workflows/tmp-royal-canin-cats-runner.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-blue-buffalo
          fetch-depth: 0
      - name: Inspect records
        run: |
          python - <<'PY'
          import json
          d=json.load(open('research/deep-research-blue-buffalo.json',encoding='utf-8'))
          for u in ['840243110056','840243110063','840243110070']:
            r=next(x for x in d['records'] if x.get('upc')==u)
            print('RECORD',u,json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - name: Restore runner
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/deep-research-barcode-ledger
          git show origin/agent/deep-research-barcode-ledger:.github/workflows/tmp-royal-canin-cats-runner.yml > .github/workflows/tmp-royal-canin-cats-runner.yml
          git add .github/workflows/tmp-royal-canin-cats-runner.yml
          git commit -m "chore: restore research runner"
          git push origin HEAD:agent/deep-research-blue-buffalo