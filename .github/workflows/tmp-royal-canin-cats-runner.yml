name: Append current Blue Buffalo North America individual-unit batch 20
on:
  push:
    branches: [agent/deep-research-blue-buffalo]
    paths: [.github/workflows/tmp-royal-canin-cats-runner.yml]
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-blue-buffalo
          fetch-depth: 0
      - name: Append validated current Blue Buffalo batch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          items=[
          ('859610007684','Wilderness','Adult Turkey Recipe','adult','wet','can','5.5 oz (156 g)',['turkey'],'individual_unit'),
          ('859610007660','Wilderness','Adult Salmon Recipe','adult','wet','can','5.5 oz (156 g)',['salmon'],'individual_unit'),
          ('840243104994','Wilderness','Adult Salmon Recipe','adult','wet','can','3 oz (85 g)',['salmon'],'individual_unit'),
          ('840243105625','Wilderness','Adult Duck Recipe','adult','wet','can','3 oz (85 g)',['duck'],'individual_unit'),
          ('859610007646','Wilderness','Adult Chicken Recipe','adult','wet','can','5.5 oz (156 g)',['chicken'],'individual_unit'),
          ('840243104987','Wilderness','Adult Chicken Recipe','adult','wet','can','3 oz (85 g)',['chicken'],'individual_unit'),
          ('840243104970','Wilderness','Adult Turkey Recipe','adult','wet','can','3 oz (85 g)',['turkey'],'individual_unit'),
          ('859610006205','Wilderness','Kitten Chicken Recipe','kitten','wet','can','3 oz (85 g)',['chicken'],'individual_unit'),
          ('840243121267','Wilderness','Adult Duck Salmon Chicken Variety Pack','adult','wet','box','3 oz cans 12 ct',['duck','salmon','chicken'],'multipack'),
          ('840243139330','Wilderness','Adult Chicken Salmon Turkey Duck Pate Variety Pack','adult','wet','box','3 oz cans variety pack',['chicken','salmon','turkey','duck'],'multipack'),
          ('840243140084','Wilderness','Adult Duck Salmon Chicken Variety Pack','adult','wet','box','3 oz cans 24 ct',['duck','salmon','chicken'],'multipack'),
          ('859610008988','Wilderness Wild Delights','Adult Chicken & Trout Flaked','adult','wet','can','3 oz (85 g)',['chicken','trout'],'individual_unit'),
          ('859610009008','Wilderness Wild Delights','Adult Chicken & Turkey Flaked','adult','wet','can','3 oz (85 g)',['chicken','turkey'],'individual_unit'),
          ('840243121274','Wilderness','Kitten Chicken Salmon Variety Pack','kitten','wet','box','3 oz cans 6 ct',['chicken','salmon'],'multipack'),
          ('840243137008','BLUE Bursts','Liver & Beef Crunchy & Creamy Cat Treats','adult','treat','bag','2 oz (56.7 g)',['liver','beef'],'individual_unit'),
          ('840243135196','Baby BLUE','Kitten Grain-Free High Protein Chicken Salmon Variety Pack','kitten','wet','box','3 oz cans 6 ct',['chicken','salmon'],'multipack'),
          ('840243135172','Baby BLUE','Kitten Chicken Pate Multipack','kitten','wet','box','3 oz cans 6 ct',['chicken'],'multipack'),
          ('840243158515','Blue Buffalo','Adult Turkey & Chicken Pate 4-Pack','adult','wet','box','3 oz cans 4 ct',['turkey','chicken'],'multipack'),
          ('840243158522','Blue Buffalo','Adult Tuna in Gravy Morsels 4-Pack','adult','wet','box','3 oz cans 4 ct',['tuna'],'multipack'),
          ('840243158539','Blue Buffalo','Adult Chicken in Gravy Morsels 4-Pack','adult','wet','box','3 oz cans 4 ct',['chicken'],'multipack')]
          def valid(u):
              if len(u)!=12 or not u.isdigit(): return False
              s=sum((3 if i%2==0 else 1)*int(d) for i,d in enumerate(u[:11])); return (10-s%10)%10==int(u[-1])
          assert len(items)==20 and len({x[0] for x in items})==20 and all(valid(x[0]) for x in items)
          target=Path('research/deep-research-blue-buffalo.json'); ledger=json.loads(target.read_text()); upcs=[x[0] for x in items]
          paths=[Path('data/known-products.ts'),Path('data/known-formulas.ts'),Path('data/wrong-barcodes.ts'),Path('docs/CATALOG-CONFLICTS.md')]
          paths += [p for p in Path('research').glob('deep-research-*.json') if p!=target]
          for p in paths:
              if p.exists():
                  txt=p.read_text(encoding='utf-8',errors='ignore'); hits=[u for u in upcs if u in txt]; assert not hits, f'duplicates in {p}: {hits}'
          existing={r['upc'] for r in ledger['records']}; assert not existing.intersection(upcs), sorted(existing.intersection(upcs))
          us='https://www.bluebuffalo.com/incentive-requests/qualifying-products/'
          ca_w='https://www.bluebuffalo.com/en-ca/natural-cat-food/wilderness/'
          ca_t='https://www.bluebuffalo.com/en-ca/product-finder/cat/treats/'
          ca_all='https://www.bluebuffalo.com/en-ca/product-finder/cat/'
          batch=[]
          for upc,line,var,life,form,pkg,size,recipe,scope in items:
              src2=ca_t if form=='treat' else (ca_w if line.startswith('Wilderness') else ca_all)
              batch.append({'catalog_number':None,'upc':upc,'canonical_gtin14':upc.zfill(14),'barcode_scope':scope,'brand':'Blue Buffalo','manufacturer':'Blue Buffalo Company, Ltd.','species':'cat','product_line':line,'product_name':f'BLUE {line} {var}','variant':var,'recipe':recipe,'life_stage':life,'food_form':form,'texture':None,'presentation':None,'package_type':pkg,'size':size,'ingredients_verbatim':'','ingredients_ordered_normalized':[],'guaranteed_analysis':{'crude_protein_min_percent':None,'crude_fat_min_percent':None,'crude_fiber_max_percent':None,'moisture_max_percent':None,'ash_max_percent':None,'taurine_min_percent':None,'other_printed_guarantees':[]},'calorie_content':{'kcal_per_kg':None,'kcal_per_unit':None,'unit_name':None},'label_deck_code':None,'formula_source':'Current U.S. Blue Buffalo qualifying-products list establishes exact UPC and sellable package identity. Canadian Blue Buffalo current catalog independently corroborates active North American product families where applicable. Exact current complete ingredients/GA/calorie label deck for this sellable UPC was not established as one coherent generation.','source_urls':[us,src2],'source_accessed_at':'2026-08-29','barcode_notes':f'Current U.S. manufacturer qualifying-products list maps UPC {upc} to this exact cat SKU/package; UPC-A check digit validated.','conflicts':['Mexico-specific official UPC distribution not independently established. Complete current exact-package ingredient/GA/calorie deck remains unresolved for source_verified status.'],'verification_notes':[f'UPC-A check digit validated; canonical GTIN-14 {upc.zfill(14)}.','Live repository-wide mandatory exclusion scan passed before append.','U.S. official Blue Buffalo qualifying-products list establishes current exact UPC/product package identity.','Canadian official Blue Buffalo catalog used only as North American market corroboration; no Canadian UPC was fabricated.','Formula fields deliberately remain unresolved rather than mixing component or package generations.'],'research_status':'needs_physical_label'})
          before=len(ledger['records']); ledger['records'].extend(batch); ledger['updated_at']='2026-08-29'
          assert len(ledger['records'])==before+20 and len({r['upc'] for r in ledger['records']})==len(ledger['records'])
          target.write_text(json.dumps(ledger,separators=(',',':'),ensure_ascii=False)+'\n',encoding='utf-8')
          print(f'APPEND_OK before={before} added=20 after={len(ledger["records"])} verified=0 needs=20'); print('UPCS='+','.join(upcs))
          PY
      - name: Restore runner and commit ledger
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show origin/agent/deep-research-barcode-ledger:.github/workflows/tmp-royal-canin-cats-runner.yml > .github/workflows/tmp-royal-canin-cats-runner.yml
          git add research/deep-research-blue-buffalo.json .github/workflows/tmp-royal-canin-cats-runner.yml
          git diff --cached --quiet && { echo "No target changes"; exit 1; }
          git commit -m "research: add 20 current North America Blue Buffalo cat records"
          git push origin HEAD:agent/deep-research-blue-buffalo
