name: Inventory Blue Buffalo second-pass backlog
on:
  push:
    branches: [agent/deep-research-blue-buffalo]
    paths: [.github/workflows/tmp-royal-canin-cats-runner.yml]
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-blue-buffalo
          fetch-depth: 0
      - name: Print deep backlog
        run: |
          python - <<'PY'
          import json
          d=json.load(open('research/deep-research-blue-buffalo.json',encoding='utf-8'))
          def missing(r):
            m=[]
            if not r.get('ingredients_verbatim'): m.append('ingredients')
            ga=r.get('guaranteed_analysis') or {}
            for k in ['crude_protein_min_percent','crude_fat_min_percent','crude_fiber_max_percent','moisture_max_percent']:
              if ga.get(k) is None: m.append('ga')
            cc=r.get('calorie_content') or {}
            if cc.get('kcal_per_kg') is None or cc.get('kcal_per_unit') is None: m.append('calories')
            if not r.get('life_stage'): m.append('life_stage')
            if not r.get('source_urls'): m.append('sources')
            return sorted(set(m))
          rows=[]
          for r in d['records']:
            if r.get('research_status')!='needs_physical_label': continue
            m=missing(r)
            if len(m)>=3:
              rows.append((r['upc'],r.get('product_line'),r.get('product_name'),r.get('size'),','.join(m)))
          print('DEEP_BACKLOG_COUNT',len(rows))
          for x in rows: print('|'.join('' if v is None else str(v) for v in x))
          PY
      - name: Restore runner
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/deep-research-barcode-ledger
          git show origin/agent/deep-research-barcode-ledger:.github/workflows/tmp-royal-canin-cats-runner.yml > .github/workflows/tmp-royal-canin-cats-runner.yml
          git add .github/workflows/tmp-royal-canin-cats-runner.yml
          git commit -m "chore: restore research runner"
          git push origin HEAD:agent/deep-research-blue-buffalo
