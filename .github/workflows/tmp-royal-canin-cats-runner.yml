name: Append current Blue Buffalo North America cat treats batch 20

on:
  push:
    branches:
      - agent/deep-research-blue-buffalo
    paths:
      - .github/workflows/tmp-royal-canin-cats-runner.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-blue-buffalo
          fetch-depth: 0
      - name: Append validated Blue Buffalo North America batch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          items=[
          ('859610007943','Wilderness','Chicken & Salmon Soft-Moist Cat Treats','adult','treat','bag','2 oz (56.7 g)',['chicken','salmon']),
          ('859610008315','Wilderness','Chicken & Duck Soft-Moist Cat Treats','adult','treat','bag','2 oz (56.7 g)',['chicken','duck']),
          ('840243120338','Wilderness','Crunchy Trout Flavor Cat Treats','adult','treat','bag','2 oz (56.7 g)',['trout']),
          ('840243120314','Wilderness','Crunchy Salmon Flavor Cat Treats','adult','treat','bag','2 oz (56.7 g)',['salmon']),
          ('840243120291','Wilderness','Crunchy Chicken Flavor Cat Treats','adult','treat','bag','2 oz (56.7 g)',['chicken']),
          ('840243125333','Wilderness','Crunchy Salmon Flavor Cat Treats','adult','treat','bag','12 oz (340 g)',['salmon']),
          ('840243125319','Wilderness','Crunchy Chicken Flavor Cat Treats','adult','treat','bag','12 oz (340 g)',['chicken']),
          ('859610007967','Wilderness','Chicken & Trout Soft-Moist Cat Treats','adult','treat','bag','2 oz (56.7 g)',['chicken','trout']),
          ('840243125357','Wilderness','Chicken & Salmon Cat Treats','adult','treat','bag','8 oz (227 g)',['chicken','salmon']),
          ('859610007905','Wilderness','Chicken & Turkey Soft-Moist Cat Treats','adult','treat','bag','2 oz (56.7 g)',['chicken','turkey']),
          ('840243149438','True Chews','Chicken Sticks Cat Treats','adult','treat','bag','3 oz (85 g)',['chicken']),
          ('840243149247','True Chews','Duck Recipe Chewy Cat Treats','adult','treat','bag','3 oz (85 g)',['duck']),
          ('840243149230','True Chews','Chicken Recipe Chewy Cat Treats','adult','treat','bag','3 oz (85 g)',['chicken']),
          ('840243149254','True Chews','Alaska Pollock Recipe Chewy Cat Treats','adult','treat','bag','3 oz (85 g)',['pollock']),
          ('840243137039','BLUE Bursts','Savory Seafood Crunchy & Creamy Cat Treats','adult','treat','bag','5 oz (141 g)',['salmon','cod','shrimp']),
          ('840243137077','BLUE Bursts','Savory Seafood Crunchy & Creamy Cat Treats','adult','treat','bag','12 oz (340 g)',['salmon','cod','shrimp']),
          ('840243137046','BLUE Bursts','Liver & Beef Crunchy & Creamy Cat Treats','adult','treat','bag','5 oz (141 g)',['liver','beef']),
          ('840243137084','BLUE Bursts','Liver & Beef Crunchy & Creamy Cat Treats','adult','treat','bag','12 oz (340 g)',['liver','beef']),
          ('840243137015','BLUE Bursts','Chicken Crunchy & Creamy Cat Treats','adult','treat','bag','5 oz (141 g)',['chicken']),
          ('840243137053','BLUE Bursts','Chicken Crunchy & Creamy Cat Treats','adult','treat','bag','12 oz (340 g)',['chicken'])]
          def valid(u):
              if len(u)!=12 or not u.isdigit(): return False
              s=sum((3 if i%2==0 else 1)*int(d) for i,d in enumerate(u[:11])); return (10-s%10)%10==int(u[-1])
          assert len(items)==20 and len({x[0] for x in items})==20 and all(valid(x[0]) for x in items)
          target=Path('research/deep-research-blue-buffalo.json'); ledger=json.loads(target.read_text()); upcs=[x[0] for x in items]
          paths=[Path('data/known-products.ts'),Path('data/known-formulas.ts'),Path('data/wrong-barcodes.ts'),Path('docs/CATALOG-CONFLICTS.md')]
          paths += [p for p in Path('research').glob('deep-research-*.json') if p!=target]
          for p in paths:
              if p.exists():
                  txt=p.read_text(encoding='utf-8',errors='ignore'); hits=[u for u in upcs if u in txt]; assert not hits, f'duplicates in {p}: {hits}'
          existing={r['upc'] for r in ledger['records']}; assert not existing.intersection(upcs), sorted(existing.intersection(upcs))
          us='https://www.bluebuffalo.com/incentive-requests/qualifying-products/'
          ca='https://www.bluebuffalo.com/en-ca/product-finder/cat/treats/'
          batch=[]
          for upc,line,var,life,form,pkg,size,recipe in items:
              batch.append({'catalog_number':None,'upc':upc,'canonical_gtin14':upc.zfill(14),'barcode_scope':'individual_unit','brand':'Blue Buffalo','manufacturer':'Blue Buffalo Company, Ltd.','species':'cat','product_line':line,'product_name':f'BLUE {line} {var}','variant':var,'recipe':recipe,'life_stage':life,'food_form':form,'texture':None,'presentation':None,'package_type':pkg,'size':size,'ingredients_verbatim':'','ingredients_ordered_normalized':[],'guaranteed_analysis':{'crude_protein_min_percent':None,'crude_fat_min_percent':None,'crude_fiber_max_percent':None,'moisture_max_percent':None,'ash_max_percent':None,'taurine_min_percent':None,'other_printed_guarantees':[]},'calorie_content':{'kcal_per_kg':None,'kcal_per_unit':None,'unit_name':None},'label_deck_code':None,'formula_source':'Current U.S. Blue Buffalo qualifying-products list establishes exact UPC and sellable package identity. Canadian Blue Buffalo product-finder/current product pages independently confirm the same treat families and many matching recipes are actively marketed in Canada. Complete current package label deck was not resolved for every exact UPC/size, so no formula generation was inferred.','source_urls':[us,ca],'source_accessed_at':'2026-08-29','barcode_notes':f'U.S. Blue Buffalo current qualifying-products list explicitly maps UPC {upc} to this cat-treat SKU/package; UPC-A check digit validated.','conflicts':['Mexico-specific official UPC distribution was not independently proven for this exact unit. Complete current ingredients/guaranteed-analysis/calorie deck for the exact UPC remains incomplete.'],'verification_notes':[f'UPC-A check digit validated for {upc}; canonical GTIN-14 is {upc.zfill(14)}.','Repository-wide mandatory exclusion scan completed before append.','U.S. manufacturer qualifying-products list proves current exact UPC/product identity.','Blue Buffalo Canada currently markets the same Wilderness/True Chews/BLUE Bursts cat-treat families; Canada coverage is corroborative, not used to fabricate a Canadian UPC.','Formula fields intentionally remain unresolved until one coherent current exact-package label deck is proven.'],'research_status':'needs_physical_label'})
          before=len(ledger['records']); ledger['records'].extend(batch); ledger['updated_at']='2026-08-29'
          assert len(ledger['records'])==before+20 and len({r['upc'] for r in ledger['records']})==len(ledger['records'])
          target.write_text(json.dumps(ledger,separators=(',',':'),ensure_ascii=False)+'\n',encoding='utf-8')
          print(f'APPEND_OK before={before} added=20 after={len(ledger["records"])} verified=0 needs=20'); print('UPCS='+','.join(upcs))
          PY
      - name: Restore runner and commit ledger
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show origin/agent/deep-research-barcode-ledger:.github/workflows/tmp-royal-canin-cats-runner.yml > .github/workflows/tmp-royal-canin-cats-runner.yml
          git add research/deep-research-blue-buffalo.json .github/workflows/tmp-royal-canin-cats-runner.yml
          git diff --cached --quiet && { echo "No target changes"; exit 1; }
          git commit -m "research: add 20 current North America Blue Buffalo cat treats"
          git push origin HEAD:agent/deep-research-blue-buffalo
