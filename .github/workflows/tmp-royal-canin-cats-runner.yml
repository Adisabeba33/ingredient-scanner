name: Append Blue Buffalo Tastefuls batch 20

on:
  push:
    branches:
      - agent/deep-research-blue-buffalo
    paths:
      - .github/workflows/tmp-royal-canin-cats-runner.yml

permissions:
  contents: write

env:
  BATCH_ZLIB_B64: ''

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-blue-buffalo
          fetch-depth: 0
      - name: Append validated Tastefuls batch
        run: |
          python - <<'PY'
          import base64,json,os,zlib
          from pathlib import Path
          data=json.loads(zlib.decompress(base64.b64decode(os.environ['BATCH_ZLIB_B64'])).decode())
          formulas=data['formulas']; items=data['items']
          def split_top(s):
              out=[]; cur=''; depth=0
              for ch in s:
                  if ch=='(': depth+=1
                  elif ch==')': depth=max(0,depth-1)
                  if ch==',' and depth==0:
                      out.append(cur.strip().rstrip('.')); cur=''
                  else: cur+=ch
              if cur.strip(): out.append(cur.strip().rstrip('.'))
              return out
          def upc_sum(u): return sum((3 if i%2==0 else 1)*int(d) for i,d in enumerate(u[:11]))
          batch=[]
          for upc,size,key,status,note in items:
              F=formulas[key]; g=F['ga']; s=upc_sum(upc)
              assert len(upc)==12 and upc.isdigit() and (10-s%10)%10==int(upc[-1]), upc
              others=[{'nutrient':x[0],'basis':x[1],'value':x[2],'unit':x[3]} for x in g[6]]
              batch.append({'catalog_number':None,'upc':upc,'canonical_gtin14':upc.zfill(14),'barcode_scope':'individual_unit','brand':'Blue Buffalo','manufacturer':'Blue Buffalo Company, Ltd.','species':'cat','product_line':'Tastefuls','product_name':'BLUE '+F['variant']+' Dry Cat Food','variant':F['variant'],'recipe':F['recipe'],'life_stage':F['life'],'food_form':F['form'],'texture':F['texture'],'presentation':F['presentation'],'package_type':F['package'],'size':size,'ingredients_verbatim':F['ingredients'],'ingredients_ordered_normalized':split_top(F['ingredients']),'guaranteed_analysis':{'crude_protein_min_percent':g[0],'crude_fat_min_percent':g[1],'crude_fiber_max_percent':g[2],'moisture_max_percent':g[3],'ash_max_percent':g[4],'taurine_min_percent':g[5],'other_printed_guarantees':others},'calorie_content':{'kcal_per_kg':F['cal'][0],'kcal_per_unit':F['cal'][1],'unit_name':F['cal'][2]},'label_deck_code':None,'formula_source':'Blue Buffalo current qualifying-products list establishes exact UPC and package size. Current Chewy exact-size page is used where available; otherwise the current recipe-family page is retained only as a candidate formula pending physical-label confirmation.','source_urls':['https://www.bluebuffalo.com/incentive-requests/qualifying-products/',F['url']],'source_accessed_at':'2026-08-29','barcode_notes':f'Blue Buffalo current official qualifying-products list maps UPC {upc} to this exact individual {size} cat-food bag; not a case or multipack code.','conflicts':[] if status=='source_verified' else ['Current exact UPC/size is verified, but a complete exact-size current formula page was not independently resolved; physical label is required before catalog promotion.'],'verification_notes':[f'UPC-A check digit validated for {upc}; canonical GTIN-14 is {upc.zfill(14)}.',note,'Formula generations were not silently merged. The current 10-lb Active Adult formula is stored separately from the current 3/7/15-lb generation.','No ash guarantee or label/deck code was inferred.'],'research_status':status})
          assert len(batch)==20 and len({r['upc'] for r in batch})==20
          target=Path('research/deep-research-blue-buffalo.json')
          ledger=json.loads(target.read_text(encoding='utf-8'))
          upcs=[r['upc'] for r in batch]
          paths=[Path('data/known-products.ts'),Path('data/known-formulas.ts'),Path('data/wrong-barcodes.ts'),Path('docs/CATALOG-CONFLICTS.md')]
          paths += [p for p in Path('research').glob('deep-research-*.json') if p!=target]
          for p in paths:
              if p.exists():
                  txt=p.read_text(encoding='utf-8',errors='ignore')
                  hits=[u for u in upcs if u in txt]
                  assert not hits, f'duplicates in {p}: {hits}'
          existing={r['upc'] for r in ledger['records']}
          assert not existing.intersection(upcs), sorted(existing.intersection(upcs))
          before=len(ledger['records'])
          ledger['records'].extend(batch)
          ledger['updated_at']='2026-08-29'
          assert len(ledger['records'])==before+20
          assert len({r['upc'] for r in ledger['records']})==len(ledger['records'])
          target.write_text(json.dumps(ledger,separators=(',',':'),ensure_ascii=False)+'\n',encoding='utf-8')
          print(f'APPEND_OK before={before} added=20 after={len(ledger["records"])} verified={sum(r["research_status"]=="source_verified" for r in batch)} needs={sum(r["research_status"]=="needs_physical_label" for r in batch)}')
          print('UPCS='+','.join(upcs))
          PY
      - name: Restore runner and commit ledger
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show origin/agent/deep-research-barcode-ledger:.github/workflows/tmp-royal-canin-cats-runner.yml > .github/workflows/tmp-royal-canin-cats-runner.yml
          git add research/deep-research-blue-buffalo.json .github/workflows/tmp-royal-canin-cats-runner.yml
          git diff --cached --quiet && { echo "No target changes"; exit 1; }
          git commit -m "research: add 20 more Blue Buffalo Tastefuls records"
          git push origin HEAD:agent/deep-research-blue-buffalo
