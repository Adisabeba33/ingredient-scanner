name: Triage Blue Buffalo incomplete records

on:
  push:
    branches:
      - agent/deep-research-blue-buffalo
    paths:
      - .github/workflows/tmp-royal-canin-cats-runner.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-blue-buffalo
          fetch-depth: 0
      - name: Rank incomplete records
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          p='research/deep-research-blue-buffalo.json'
          d=json.load(open(p,encoding='utf-8'))
          rows=[]
          for i,r in enumerate(d['records'],1):
              if r.get('research_status')!='needs_physical_label':
                  continue
              ga=r.get('guaranteed_analysis') or {}
              cal=r.get('calorie_content') or {}
              missing=[]
              if not (r.get('ingredients_verbatim') or '').strip(): missing.append('ingredients')
              if ga.get('crude_protein_min_percent') is None: missing.append('protein')
              if ga.get('crude_fat_min_percent') is None: missing.append('fat')
              if ga.get('crude_fiber_max_percent') is None: missing.append('fiber')
              if ga.get('moisture_max_percent') is None: missing.append('moisture')
              if cal.get('kcal_per_kg') is None and cal.get('kcal_per_unit') is None: missing.append('calories')
              if r.get('life_stage') is None: missing.append('life_stage')
              if not r.get('source_urls'): missing.append('sources')
              rows.append((len(missing),i,r.get('upc'),r.get('product_line'),r.get('product_name'),r.get('size'),r.get('barcode_scope'),','.join(missing)))
          c=Counter(x[0] for x in rows)
          print('TRIAGE_TOTAL',len(rows),'MISSING_BUCKETS',dict(sorted(c.items())))
          for x in sorted(rows)[:80]:
              print('CANDIDATE','|'.join(map(lambda v:'' if v is None else str(v),x)))
          PY
      - name: Restore runner
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/deep-research-barcode-ledger
          git show origin/agent/deep-research-barcode-ledger:.github/workflows/tmp-royal-canin-cats-runner.yml > .github/workflows/tmp-royal-canin-cats-runner.yml
          git add .github/workflows/tmp-royal-canin-cats-runner.yml
          git commit -m "chore: restore research runner"
          git push origin HEAD:agent/deep-research-blue-buffalo
