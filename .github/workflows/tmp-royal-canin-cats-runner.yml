name: Second-pass verify Blue Buffalo Basics wet cat records

on:
  push:
    branches:
      - agent/deep-research-blue-buffalo
    paths:
      - .github/workflows/tmp-royal-canin-cats-runner.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-blue-buffalo
          fetch-depth: 0
      - name: Promote verified Basics wet records
        run: |
          python - <<'PY'
          import json
          p='research/deep-research-blue-buffalo.json'
          d=json.load(open(p,encoding='utf-8'))
          updates={
            '840243109548': {
              'ingredients':'Turkey, Turkey Broth, Turkey Liver, Potatoes, Pea Protein, Natural Flavor, Flaxseed, Guar Gum, Potassium Chloride, Cassia Gum, Carrageenan, Salt, Choline Chloride, Taurine, Iron Amino Acid Chelate, Zinc Amino Acid Chelate, Thiamine Mononitrate (Vitamin B1), Copper Amino Acid Chelate, Manganese Amino Acid Chelate, Sodium Selenite, Niacin Supplement (Vitamin B3), Calcium Pantothenate (Vitamin B5), Pyridoxine Hydrochloride (Vitamin B6), Riboflavin Supplement (Vitamin B2), Vitamin A Supplement, Biotin (Vitamin B7), Potassium Iodide, Vitamin D3 Supplement, Vitamin B12 Supplement, Folic Acid (Vitamin B9).',
              'ga':(9,7,1.5,78),'kcalkg':1208,'kcalunit':188,
              'sources':['https://www.bluebuffalo.com/incentive-requests/qualifying-products/','https://www.chewy.com/blue-buffalo-basics-limited/dp/288558','https://www.petco.com/shop/en/petcostore/product/blue-buffalo-basics-limited-ingredient-grain-free-indoor-turkey-and-potato-entree-adult-wet-cat-food','https://www.petsmart.com/cat/food-and-treats/wet-food/blue-buffalo-basics-limited-ingredient-diet-adult-wet-cat-food---natural-grain-free-turkey-and-potato-5.5-oz-5073203.html'],
              'note':'Current Blue Buffalo qualifying list maps UPC 840243109548 to Basics Limited Ingredient Diet Indoor Turkey & Potato 5.5 oz. Current major U.S. retailer label data agree on the complete formula and 9/7/1.5/78 guaranteed analysis; calorie statement is 1,208 kcal/kg and 188 kcal/can. Adult maintenance / complete-and-balanced scope is supported for this wet formula.'},
            '859610007745': {
              'ingredients':'Turkey, Turkey Broth, Turkey Liver, Potatoes, Pea Protein, Natural Flavor, Flaxseed, Guar Gum, Potassium Chloride, Cassia Gum, Carrageenan, Salt, Choline Chloride, Taurine, Iron Amino Acid Chelate, Zinc Amino Acid Chelate, Thiamine Mononitrate (Vitamin B1), Copper Amino Acid Chelate, Manganese Amino Acid Chelate, Sodium Selenite, Niacin Supplement (Vitamin B3), Calcium Pantothenate (Vitamin B5), Pyridoxine Hydrochloride (Vitamin B6), Riboflavin Supplement (Vitamin B2), Vitamin A Supplement, Biotin (Vitamin B7), Potassium Iodide, Vitamin D3 Supplement, Vitamin B12 Supplement, Folic Acid (Vitamin B9).',
              'ga':(9,7,1.5,78),'kcalkg':1208,'kcalunit':103,
              'sources':['https://www.bluebuffalo.com/incentive-requests/qualifying-products/','https://www.chewy.com/blue-buffalo-basics-limited/dp/288557','https://www.petco.com/shop/en/petcostore/product/blue-buffalo-basics-limited-ingredient-grain-free-indoor-turkey-and-potato-entree-adult-wet-cat-food'],
              'note':'Current Blue Buffalo qualifying list maps UPC 859610007745 to Basics Limited Ingredient Diet Indoor Turkey & Potato 3 oz. Current U.S. retailer label data agree on the complete formula and 9/7/1.5/78 guaranteed analysis; calorie statement is 1,208 kcal/kg and 103 kcal/can. Adult maintenance / complete-and-balanced scope is supported for this wet formula.'},
            '859610007301': {
              'ingredients':'Whitefish, Fish Broth, Potatoes, Pea Protein, Canola Oil (source of Omega 6 Fatty Acids), Flaxseed (source of Omega 3 and 6 Fatty Acids), Natural Flavor, Guar Gum, Potassium Chloride, Cassia Gum, Carrageenan, Salt, Choline Chloride, Taurine, Iron Amino Acid Chelate, Zinc Amino Acid Chelate, Thiamine Mononitrate (Vitamin B1), Copper Amino Acid Chelate, Manganese Amino Acid Chelate, Sodium Selenite, Niacin Supplement (Vitamin B3), Calcium Pantothenate (Vitamin B5), Pyridoxine Hydrochloride (Vitamin B6), Riboflavin Supplement (Vitamin B2), Vitamin A Supplement, Biotin (Vitamin B7), Potassium Iodide, Vitamin D3 Supplement, Vitamin B12 Supplement, Folic Acid (Vitamin B9).',
              'ga':(8,6,1.5,78),'kcalkg':1147,'kcalunit':98,
              'sources':['https://www.bluebuffalo.com/incentive-requests/qualifying-products/','https://www.chewy.com/blue-buffalo-basics-limited/dp/288554','https://www.petco.com/shop/en/petcostore/product/blue-buffalo-basics-limited-ingredient-grain-free-indoor-fish-and-potato-entree-adult-wet-cat-food'],
              'note':'Current Blue Buffalo qualifying list maps UPC 859610007301 to Basics Limited Ingredient Diet Indoor Fish & Potato 3 oz. Current U.S. retailer label data agree on complete ingredient order and 8/6/1.5/78 guaranteed analysis; calorie statement is 1,147 kcal/kg and 98 kcal/can. Adult maintenance / complete-and-balanced scope is supported.'}
          }
          promoted=[]
          for r in d['records']:
            u=r.get('upc')
            if u not in updates: continue
            assert r.get('research_status')=='needs_physical_label', (u,r.get('research_status'))
            q=updates[u]
            r['ingredients_verbatim']=q['ingredients']
            r['ingredients_ordered_normalized']=[x.strip().rstrip('.') for x in q['ingredients'].split(',')]
            pr,fa,fi,mo=q['ga']
            r['guaranteed_analysis']={'crude_protein_min_percent':pr,'crude_fat_min_percent':fa,'crude_fiber_max_percent':fi,'moisture_max_percent':mo,'ash_max_percent':None,'taurine_min_percent':0.1,'other_printed_guarantees':[]}
            r['calorie_content']={'kcal_per_kg':q['kcalkg'],'kcal_per_unit':q['kcalunit'],'unit_name':'can'}
            r['formula_source']='Second-pass current-source verification using exact UPC identity from Blue Buffalo and current U.S. retail label data.'
            r['source_urls']=q['sources']
            r['source_accessed_at']='2026-08-29'
            r['conflicts']=[]
            r['verification_notes']=[q['note'],'UPC-A identity remains individually validated; no case or multipack UPC substitution was used.']
            r['research_status']='source_verified'
            promoted.append(u)
          assert len(promoted)==3, promoted
          d['updated_at']='2026-08-29'
          json.dump(d,open(p,'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          open(p,'a',encoding='utf-8').write('\n')
          print('PROMOTED',len(promoted),','.join(promoted))
          PY
      - name: Restore runner and commit
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/deep-research-barcode-ledger
          git show origin/agent/deep-research-barcode-ledger:.github/workflows/tmp-royal-canin-cats-runner.yml > .github/workflows/tmp-royal-canin-cats-runner.yml
          git add research/deep-research-blue-buffalo.json .github/workflows/tmp-royal-canin-cats-runner.yml
          git commit -m "research: verify three Blue Buffalo Basics wet cat records"
          git push origin HEAD:agent/deep-research-blue-buffalo
