name: Audit Blue Buffalo ledger completeness

on:
  push:
    branches:
      - agent/deep-research-blue-buffalo
    paths:
      - .github/workflows/tmp-royal-canin-cats-runner.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-blue-buffalo
          fetch-depth: 0
      - name: Count completeness fields
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          p='research/deep-research-blue-buffalo.json'
          d=json.load(open(p,encoding='utf-8'))
          r=d['records']
          status=Counter(x.get('research_status') for x in r)
          miss_ing=sum(not (x.get('ingredients_verbatim') or '').strip() for x in r)
          miss_protein=sum(x.get('guaranteed_analysis',{}).get('crude_protein_min_percent') is None for x in r)
          miss_cal=sum(x.get('calorie_content',{}).get('kcal_per_kg') is None and x.get('calorie_content',{}).get('kcal_per_unit') is None for x in r)
          print('AUDIT total=',len(r),'status=',dict(status),'missing_ingredients=',miss_ing,'missing_protein=',miss_protein,'missing_calories=',miss_cal)
          PY
      - name: Restore runner
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/deep-research-barcode-ledger
          git show origin/agent/deep-research-barcode-ledger:.github/workflows/tmp-royal-canin-cats-runner.yml > .github/workflows/tmp-royal-canin-cats-runner.yml
          git add .github/workflows/tmp-royal-canin-cats-runner.yml
          git commit -m "chore: restore research runner"
          git push origin HEAD:agent/deep-research-blue-buffalo
