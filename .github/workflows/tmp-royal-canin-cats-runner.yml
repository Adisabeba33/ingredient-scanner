name: Blue Buffalo Remaining Export

on:
  push:
    branches:
      - agent/deep-research-blue-buffalo
    paths:
      - .github/workflows/tmp-royal-canin-cats-runner.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-blue-buffalo
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Export remaining records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('research/deep-research-blue-buffalo.json').read_text(encoding='utf-8'))
          out={
            'source_head':'${{ github.sha }}',
            'records':[r for r in data['records'] if r.get('research_status')=='needs_physical_label']
          }
          Path('/tmp/blue-buffalo-remaining.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('remaining',len(out['records']))
          PY
      - name: Upload remaining artifact
        uses: actions/upload-artifact@v4
        with:
          name: blue-buffalo-remaining
          path: /tmp/blue-buffalo-remaining.json
          retention-days: 1
      - name: Restore shared runner
        run: |
          set -euo pipefail
          git fetch origin agent/deep-research-barcode-ledger
          git show origin/agent/deep-research-barcode-ledger:.github/workflows/tmp-royal-canin-cats-runner.yml > .github/workflows/tmp-royal-canin-cats-runner.yml
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tmp-royal-canin-cats-runner.yml
          git commit -m "chore: restore shared research runner"
          git push origin HEAD:agent/deep-research-blue-buffalo
