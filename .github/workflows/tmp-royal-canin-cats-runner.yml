name: Second-pass verify Baby BLUE kitten treats

on:
  push:
    branches:
      - agent/deep-research-blue-buffalo
    paths:
      - .github/workflows/tmp-royal-canin-cats-runner.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-blue-buffalo
          fetch-depth: 0
      - name: Promote Baby BLUE treat records
        run: |
          python - <<'PY'
          import json
          p='research/deep-research-blue-buffalo.json'
          d=json.load(open(p,encoding='utf-8'))
          updates={
            '840243134748': {
              'ingredients':'Deboned Chicken, Chicken Meal, Brown Rice, Barley, Oatmeal, Peas, Chicken Fat, Natural Flavor, Glucono-Delta-Lactone, Potassium Chloride, preserved with Citric Acid and Mixed Tocopherols, Oil of Rosemary.',
              'ga':(23,11,3,10),'kcalkg':3800,'kcalunit':1.3,
              'sources':['https://www.bluebuffalo.com/incentive-requests/qualifying-products/','https://www.petco.com/product/blue-buffalo-baby-blue-crunchies-natural-savory-chicken-kitten-treats','https://www.chewy.com/blue-buffalo-baby-blue-savory-chicken/dp/380402','https://bluebuffalo.com/cat-treats/baby-blue/kitten-crunchies-chicken/'],
              'note':'Current Blue Buffalo qualifying list maps UPC 840243134748 to Baby BLUE Kitten Crunchy Treat Chicken 2 oz. Current Petco and Chewy agree on complete ingredient order and 23/11/3/10 GA; Chewy supplies 3,800 kcal/kg and 1.3 kcal/treat. Blue Buffalo current product page corroborates the Savory Chicken formula identity.'},
            '840243137091': {
              'ingredients':'Salmon, Chicken Meal, Potato Starch, Peas, Brewers Dried Yeast, Chicken Fat, Natural Flavor, Citric Acid, Potassium Chloride, preserved with Mixed Tocopherols, Oil of Rosemary.',
              'ga':(28,12,4,10),'kcalkg':3750,'kcalunit':1.3,
              'sources':['https://www.bluebuffalo.com/incentive-requests/qualifying-products/','https://www.petco.com/product/blue-buffalo-baby-blue-crunchies-natural-grain-free-savory-salmon-kitten-treats','https://www.chewy.com/blue-buffalo-baby-blue-savory-salmon/dp/380404','https://www.bluebuffalo.com/cat-treats/baby-blue/kitten-crunchies-salmon/'],
              'note':'Current Blue Buffalo qualifying list maps UPC 840243137091 to Baby BLUE Kitten Crunchy Grain-Free Salmon Recipe 2 oz. Current Petco and Chewy agree on complete ingredient order and 28/12/4/10 GA; Chewy supplies 3,750 kcal/kg and 1.3 kcal/treat. Blue Buffalo current product page corroborates the Savory Salmon formula identity.'}
          }
          promoted=[]
          for r in d['records']:
            u=r.get('upc')
            if u not in updates: continue
            assert r.get('research_status')=='needs_physical_label', (u,r.get('research_status'))
            q=updates[u]
            r['ingredients_verbatim']=q['ingredients']
            r['ingredients_ordered_normalized']=[x.strip().rstrip('.') for x in q['ingredients'].split(',')]
            pr,fa,fi,mo=q['ga']
            r['guaranteed_analysis']={'crude_protein_min_percent':pr,'crude_fat_min_percent':fa,'crude_fiber_max_percent':fi,'moisture_max_percent':mo,'ash_max_percent':None,'taurine_min_percent':None,'other_printed_guarantees':[]}
            r['calorie_content']={'kcal_per_kg':q['kcalkg'],'kcal_per_unit':q['kcalunit'],'unit_name':'treat'}
            r['formula_source']='Second-pass current-source verification using exact UPC identity from Blue Buffalo and current U.S. retail label data.'
            r['source_urls']=q['sources']
            r['source_accessed_at']='2026-08-29'
            r['conflicts']=[]
            r['verification_notes']=[q['note'],'UPC-A identity remains individually validated; no case or multipack UPC substitution was used.','Product is intended for intermittent or supplemental feeding only, not represented as a complete-and-balanced diet.']
            r['research_status']='source_verified'
            promoted.append(u)
          assert len(promoted)==2, promoted
          d['updated_at']='2026-08-29'
          json.dump(d,open(p,'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          open(p,'a',encoding='utf-8').write('\n')
          print('PROMOTED',len(promoted),','.join(promoted))
          PY
      - name: Restore runner and commit
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/deep-research-barcode-ledger
          git show origin/agent/deep-research-barcode-ledger:.github/workflows/tmp-royal-canin-cats-runner.yml > .github/workflows/tmp-royal-canin-cats-runner.yml
          git add research/deep-research-blue-buffalo.json .github/workflows/tmp-royal-canin-cats-runner.yml
          git commit -m "research: verify two Baby BLUE kitten treats"
          git push origin HEAD:agent/deep-research-blue-buffalo
