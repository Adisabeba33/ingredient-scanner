name: Append current Blue Buffalo North America cat batch 20
on:
  push:
    branches: [agent/deep-research-blue-buffalo]
    paths: [.github/workflows/tmp-royal-canin-cats-runner.yml]
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-blue-buffalo
          fetch-depth: 0
      - name: Append validated current Blue Buffalo batch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          items=[
          ('840243159260','Wilderness','Kitten Salmon','kitten','dry','bag','4 lb',['salmon'],'individual_unit'),
          ('840243151622','Wilderness','Adult Cat Chicken Salmon Turkey Variety Pack','adult','wet','box','5.5 oz cans variety pack',['chicken','salmon','turkey'],'multipack'),
          ('840243151639','Wilderness','Adult Cat Chicken Salmon Turkey Variety Pack 24ct','adult','wet','box','5.5 oz cans 24 ct',['chicken','salmon','turkey'],'multipack'),
          ('840243159284','Wilderness','Adult 7+ Salmon','senior','dry','bag','4 lb',['salmon'],'individual_unit'),
          ('840243143788','Tastefuls Savory Singles','Chicken and Turkey Entrée Cuts Variety Pack','adult','wet','box','1.3 oz twin-cups variety pack',['chicken','turkey'],'multipack'),
          ('840243140763','Tastefuls','Kitten Chicken Entrée Pate Multi Pack','kitten','wet','box','3 oz cans 6 ct',['chicken'],'multipack'),
          ('840243157471','Tastefuls','Adult Cat Chicken Tuna Salmon Beef Puree Variety Pack','adult','wet','box','3 oz spouted pouches 12 ct',['chicken','tuna','salmon','beef'],'multipack'),
          ('840243157464','Tastefuls','Adult Cat Beef Puree Multipack','adult','wet','box','3 oz spouted pouches 12 ct',['beef'],'multipack'),
          ('840243151042','Tastefuls','Tuna Chicken Fish and Shrimp in Gravy Flaked Variety Pack','adult','wet','box','3 oz cans 24 ct',['tuna','chicken','fish','shrimp'],'multipack'),
          ('840243140756','Tastefuls','Tuna Chicken Fish and Shrimp in Gravy Flaked Variety Pack','adult','wet','box','5.5 oz cans 12 ct',['tuna','chicken','fish','shrimp'],'multipack'),
          ('840243145706','Tastefuls','Tuna Chicken Fish and Shrimp in Gravy Flaked Variety Pack','adult','wet','box','5.5 oz cans variety pack',['tuna','chicken','fish','shrimp'],'multipack'),
          ('840243140749','Tastefuls','Tuna Chicken Fish and Shrimp in Gravy Flaked Variety Pack','adult','wet','box','3 oz cans 12 ct',['tuna','chicken','fish','shrimp'],'multipack'),
          ('840243151219','Tastefuls','Adult Cat Tuna Puree Multipack','adult','wet','box','3 oz spouted pouches 12 ct',['tuna'],'multipack'),
          ('840243153985','Tastefuls','Adult Cat Tuna Entrée in Gravy Flaked Multi-Pack','adult','wet','box','3 oz cans 4 ct',['tuna'],'multipack'),
          ('840243140725','Tastefuls','Salmon Chicken Ocean Fish and Tuna Pate Variety Pack','adult','wet','box','3 oz cans variety pack',['salmon','chicken','ocean fish','tuna'],'multipack'),
          ('840243151226','Tastefuls','Adult Cat Salmon Puree Multipack','adult','wet','box','3 oz spouted pouches 12 ct',['salmon'],'multipack'),
          ('840243151202','Tastefuls','Adult Cat Chicken Puree Multipack','adult','wet','box','3 oz spouted pouches 12 ct',['chicken'],'multipack'),
          ('840243153947','Tastefuls','Adult Cat Chicken Entrée Pate Multi-Pack','adult','wet','box','3 oz cans 4 ct',['chicken'],'multipack'),
          ('840243153978','Tastefuls','Adult Cat Chicken Entrée in Gravy Flaked Multi-Pack','adult','wet','box','3 oz cans 4 ct',['chicken'],'multipack'),
          ('840243151233','Tastefuls','Adult Cat Chicken and Tuna Puree Variety Pack','adult','wet','box','3 oz spouted pouches 12 ct',['chicken','tuna'],'multipack')]
          def valid(u):
              if len(u)!=12 or not u.isdigit(): return False
              s=sum((3 if i%2==0 else 1)*int(d) for i,d in enumerate(u[:11])); return (10-s%10)%10==int(u[-1])
          assert len(items)==20 and len({x[0] for x in items})==20 and all(valid(x[0]) for x in items)
          target=Path('research/deep-research-blue-buffalo.json'); ledger=json.loads(target.read_text()); upcs=[x[0] for x in items]
          paths=[Path('data/known-products.ts'),Path('data/known-formulas.ts'),Path('data/wrong-barcodes.ts'),Path('docs/CATALOG-CONFLICTS.md')]
          paths += [p for p in Path('research').glob('deep-research-*.json') if p!=target]
          for p in paths:
              if p.exists():
                  txt=p.read_text(encoding='utf-8',errors='ignore'); hits=[u for u in upcs if u in txt]; assert not hits, f'duplicates in {p}: {hits}'
          existing={r['upc'] for r in ledger['records']}; assert not existing.intersection(upcs), sorted(existing.intersection(upcs))
          us='https://www.bluebuffalo.com/incentive-requests/qualifying-products/'
          ca='https://www.bluebuffalo.com/en-ca/natural-cat-food/tastefuls/'
          ca_w='https://www.bluebuffalo.com/en-ca/natural-cat-food/wilderness/'
          batch=[]
          for upc,line,var,life,form,pkg,size,recipe,scope in items:
              batch.append({'catalog_number':None,'upc':upc,'canonical_gtin14':upc.zfill(14),'barcode_scope':scope,'brand':'Blue Buffalo','manufacturer':'Blue Buffalo Company, Ltd.','species':'cat','product_line':line,'product_name':f'BLUE {line} {var}','variant':var,'recipe':recipe,'life_stage':life,'food_form':form,'texture':None,'presentation':None,'package_type':pkg,'size':size,'ingredients_verbatim':'','ingredients_ordered_normalized':[],'guaranteed_analysis':{'crude_protein_min_percent':None,'crude_fat_min_percent':None,'crude_fiber_max_percent':None,'moisture_max_percent':None,'ash_max_percent':None,'taurine_min_percent':None,'other_printed_guarantees':[]},'calorie_content':{'kcal_per_kg':None,'kcal_per_unit':None,'unit_name':None},'label_deck_code':None,'formula_source':'Current U.S. Blue Buffalo qualifying-products list establishes the exact UPC and sellable package identity. Blue Buffalo Canada independently confirms the corresponding Wilderness/Tastefuls families remain actively marketed in Canada. Exact current complete formula/GA/calorie deck for this sellable UPC was not established as one coherent label generation.','source_urls':[us, ca_w if line=='Wilderness' else ca],'source_accessed_at':'2026-08-29','barcode_notes':f'Current U.S. manufacturer qualifying-products list maps UPC {upc} to this exact package; UPC-A check digit validated.','conflicts':['Mexico-specific official UPC distribution not independently established. Complete current exact-package ingredient/GA/calorie label deck remains unresolved.'],'verification_notes':[f'UPC-A check digit validated; canonical GTIN-14 {upc.zfill(14)}.','Live repository-wide mandatory exclusion scan passed before append.','U.S. official Blue Buffalo list establishes current package identity and barcode scope.','Canadian official Blue Buffalo catalog corroborates current product-family availability where applicable.','Formula fields deliberately not inferred from individual component SKUs or another package generation.'],'research_status':'needs_physical_label'})
          before=len(ledger['records']); ledger['records'].extend(batch); ledger['updated_at']='2026-08-29'
          assert len(ledger['records'])==before+20 and len({r['upc'] for r in ledger['records']})==len(ledger['records'])
          target.write_text(json.dumps(ledger,separators=(',',':'),ensure_ascii=False)+'\n',encoding='utf-8')
          print(f'APPEND_OK before={before} added=20 after={len(ledger["records"])} verified=0 needs=20'); print('UPCS='+','.join(upcs))
          PY
      - name: Restore runner and commit ledger
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show origin/agent/deep-research-barcode-ledger:.github/workflows/tmp-royal-canin-cats-runner.yml > .github/workflows/tmp-royal-canin-cats-runner.yml
          git add research/deep-research-blue-buffalo.json .github/workflows/tmp-royal-canin-cats-runner.yml
          git diff --cached --quiet && { echo "No target changes"; exit 1; }
          git commit -m "research: add 20 current North America Blue Buffalo cat SKUs"
          git push origin HEAD:agent/deep-research-blue-buffalo
