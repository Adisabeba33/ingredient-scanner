name: Append Blue Buffalo dry batch 20

on:
  push:
    branches:
      - agent/deep-research-blue-buffalo
    paths:
      - .github/workflows/tmp-royal-canin-cats-runner.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-blue-buffalo
          fetch-depth: 0
      - name: Append validated Blue Buffalo batch
        env:
          BATCH_ZLIB_B64: ""
        run: |
          python - <<'PY'
          import base64, json, os, zlib
          from pathlib import Path

          path = Path('research/deep-research-blue-buffalo.json')
          ledger = json.loads(path.read_text(encoding='utf-8'))
          batch = json.loads(zlib.decompress(base64.b64decode(os.environ['BATCH_ZLIB_B64'])).decode('utf-8'))

          assert ledger.get('brand_scope') == ['Blue Buffalo']
          assert len(batch) == 20
          existing = {r['upc'] for r in ledger['records']}
          batch_upcs = [r['upc'] for r in batch]
          assert len(set(batch_upcs)) == 20
          assert not (existing & set(batch_upcs)), f'duplicate UPCs: {existing & set(batch_upcs)}'

          def upc_ok(code):
              assert len(code) == 12 and code.isdigit()
              body = [int(x) for x in code[:11]]
              total = sum(body[0::2]) * 3 + sum(body[1::2])
              return (10 - total % 10) % 10 == int(code[-1])

          for rec in batch:
              assert rec['brand'] == 'Blue Buffalo'
              assert rec['catalog_number'] is None
              assert rec['barcode_scope'] == 'individual_unit'
              assert rec['canonical_gtin14'] == rec['upc'].zfill(14)
              assert upc_ok(rec['upc']), rec['upc']
              assert rec['research_status'] in {'source_verified','needs_physical_label'}

          ledger['records'].extend(batch)
          ledger['updated_at'] = '2026-08-29'
          assert len(ledger['records']) == 31
          assert len({r['upc'] for r in ledger['records']}) == 31
          path.write_text(json.dumps(ledger, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY
      - name: Restore inherited runner and commit ledger only
        run: |
          git fetch origin agent/deep-research-barcode-ledger
          git checkout origin/agent/deep-research-barcode-ledger -- .github/workflows/tmp-royal-canin-cats-runner.yml
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/deep-research-blue-buffalo.json .github/workflows/tmp-royal-canin-cats-runner.yml
          git commit -m "research: add 20 Blue Buffalo dry records"
          git push origin HEAD:agent/deep-research-blue-buffalo
