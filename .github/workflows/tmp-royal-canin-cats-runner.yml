name: Append Blue Buffalo Freedom Basics batch 20

on:
  push:
    branches:
      - agent/deep-research-blue-buffalo
    paths:
      - .github/workflows/tmp-royal-canin-cats-runner.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  BATCH_ZLIB_B64: ''

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-blue-buffalo
          fetch-depth: 0
      - name: Append validated Blue Buffalo Freedom and Basics batch
        run: |
          python - <<'PY'
          import base64,json,os,zlib
          from pathlib import Path
          data=json.loads(zlib.decompress(base64.b64decode(os.environ['BATCH_ZLIB_B64'])).decode())
          formulas=data['formulas']; items=data['items']
          def split_top(s):
              out=[]; cur=''; depth=0
              for ch in s:
                  if ch=='(': depth+=1
                  elif ch==')': depth=max(0,depth-1)
                  if ch==',' and depth==0:
                      out.append(cur.strip().rstrip('.')); cur=''
                  else: cur+=ch
              if cur.strip(): out.append(cur.strip().rstrip('.'))
              return out
          def upc_sum(u): return sum((3 if i%2==0 else 1)*int(d) for i,d in enumerate(u[:11]))
          batch=[]
          for upc,size,key,kcal_override in items:
              F=formulas[key]; g=F['ga']; s=upc_sum(upc)
              assert (10-s%10)%10==int(upc[-1]), upc
              others=[{'nutrient':x[0],'basis':x[1],'value':x[2],'unit':x[3]} for x in g[6]]
              unit_kcal=kcal_override if kcal_override is not None else F['cal'][1]
              batch.append({'catalog_number':None,'upc':upc,'canonical_gtin14':upc.zfill(14),'barcode_scope':'individual_unit','brand':'Blue Buffalo','manufacturer':'Blue Buffalo Company, Ltd.','species':'cat','product_line':F['line'],'product_name':'BLUE '+F['line']+' '+F['variant']+' '+('Dry' if F['form']=='dry' else 'Wet')+' Cat Food','variant':F['variant'],'recipe':F['recipe'],'life_stage':F['life'],'food_form':F['form'],'texture':F['texture'],'presentation':F['presentation'],'package_type':F['package'],'size':size,'ingredients_verbatim':F['ingredients'],'ingredients_ordered_normalized':split_top(F['ingredients']),'guaranteed_analysis':{'crude_protein_min_percent':g[0],'crude_fat_min_percent':g[1],'crude_fiber_max_percent':g[2],'moisture_max_percent':g[3],'ash_max_percent':g[4],'taurine_min_percent':g[5],'other_printed_guarantees':others},'calorie_content':{'kcal_per_kg':F['cal'][0],'kcal_per_unit':unit_kcal,'unit_name':F['cal'][2]},'label_deck_code':None,'formula_source':'Current Blue Buffalo product page establishes recipe, life stage and package-size family; current Chewy or Petco single-product data supplies the complete ingredient statement, Guaranteed Analysis and calorie content for the same recipe.','source_urls':['https://www.bluebuffalo.com/incentive-requests/qualifying-products/',F['official'],F['formula_url']],'source_accessed_at':'2026-08-29','barcode_notes':f"Blue Buffalo current official qualifying-products list maps UPC {upc} to the exact individual {size} cat-food unit; not a case or multipack code.",'conflicts':[],'verification_notes':[f'UPC-A check digit validated: weighted sum for body {upc[:11]} is {s}; check digit {upc[-1]} matches. Canonical GTIN-14 is {upc.zfill(14)}.',f'Current Blue Buffalo qualifying-products data identifies UPC {upc} as this exact individual {size} product.','Formula fields were kept together from one current retailer label transcription and were not mixed across formula generations.','For Basics Turkey, Petco independently resolves the current Omega-6 guarantee as 2.5% min; the 25% value exposed by a Chewy page is treated as a retailer transcription error and was not used.','No ash guarantee or label/deck code is exposed in the current online label data used here, so those fields are null rather than inferred.'],'research_status':'source_verified'})
          assert len(batch)==20 and len({r['upc'] for r in batch})==20
          target=Path('research/deep-research-blue-buffalo.json')
          ledger=json.loads(target.read_text(encoding='utf-8'))
          upcs=[r['upc'] for r in batch]
          paths=[Path('data/known-products.ts'),Path('data/known-formulas.ts'),Path('data/wrong-barcodes.ts'),Path('docs/CATALOG-CONFLICTS.md')]
          paths += [p for p in Path('research').glob('deep-research-*.json') if p!=target]
          for p in paths:
              if p.exists():
                  txt=p.read_text(encoding='utf-8',errors='ignore')
                  hits=[u for u in upcs if u in txt]
                  assert not hits, f'duplicates in {p}: {hits}'
          existing={r['upc'] for r in ledger['records']}
          assert not existing.intersection(upcs), sorted(existing.intersection(upcs))
          before=len(ledger['records'])
          ledger['records'].extend(batch)
          ledger['updated_at']='2026-08-29'
          assert len(ledger['records'])==before+20
          assert len({r['upc'] for r in ledger['records']})==len(ledger['records'])
          json.dumps(ledger,ensure_ascii=False)
          target.write_text(json.dumps(ledger,separators=(',',':'),ensure_ascii=False)+'\n',encoding='utf-8')
          print(f'APPEND_OK before={before} added=20 after={len(ledger["records"])} verified=20')
          print('UPCS='+','.join(upcs))
          PY
      - name: Commit ledger
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/deep-research-blue-buffalo.json
          git diff --cached --quiet && { echo "No target changes"; exit 1; }
          git commit -m "research: add 20 Blue Buffalo Freedom and Basics records"
          git push origin HEAD:agent/deep-research-blue-buffalo
