name: Append current Blue Buffalo North America cat batch 20
on:
  push:
    branches: [agent/deep-research-blue-buffalo]
    paths: [.github/workflows/tmp-royal-canin-cats-runner.yml]
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-blue-buffalo
          fetch-depth: 0
      - name: Append validated current Blue Buffalo batch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          items=[
          ('840243105632','Wilderness','Adult Salmon with LifeSource Bits','adult','dry','bag','5 lb (2.27 kg)',['salmon'],'individual_unit'),
          ('840243105649','Wilderness','Adult Salmon with LifeSource Bits','adult','dry','bag','11 lb (4.99 kg)',['salmon'],'individual_unit'),
          ('840243105175','Wilderness','Adult Duck with LifeSource Bits','adult','dry','bag','5 lb (2.27 kg)',['duck'],'individual_unit'),
          ('840243105182','Wilderness','Adult Duck with LifeSource Bits','adult','dry','bag','11 lb (4.99 kg)',['duck'],'individual_unit'),
          ('859610006113','Wilderness','Adult Weight Control Chicken with LifeSource Bits','adult','dry','bag',None,['chicken'],'individual_unit'),
          ('859610006137','Wilderness','Adult Weight Control Chicken with LifeSource Bits','adult','dry','bag',None,['chicken'],'individual_unit'),
          ('840243105823','Wilderness','Indoor Adult Chicken with LifeSource Bits','adult','dry','bag','5 lb (2.27 kg)',['chicken'],'individual_unit'),
          ('840243105830','Wilderness','Indoor Adult Chicken with LifeSource Bits','adult','dry','bag','11 lb (4.99 kg)',['chicken'],'individual_unit'),
          ('840243104901','Wilderness','Adult Chicken with LifeSource Bits','adult','dry','bag','6 lb (2.72 kg)',['chicken'],'individual_unit'),
          ('840243104918','Wilderness','Adult Chicken with LifeSource Bits','adult','dry','bag','12 lb (5.44 kg)',['chicken'],'individual_unit'),
          ('840243130665','Wilderness','Indoor Hairball & Weight Control Adult Chicken','adult','dry','bag',None,['chicken'],'individual_unit'),
          ('840243103713','Wilderness','Indoor Hairball & Weight Control Adult Chicken','adult','dry','bag',None,['chicken'],'individual_unit'),
          ('840243103706','Wilderness','Indoor Hairball & Weight Control Adult Chicken','adult','dry','bag',None,['chicken'],'individual_unit'),
          ('840243130672','Wilderness','Indoor Hairball & Weight Control Adult Chicken','adult','dry','bag',None,['chicken'],'individual_unit'),
          ('840243142194','True Solutions','Hairball Control Adult Cat Chicken','adult','dry','bag','11 lb (4.99 kg)',['chicken'],'individual_unit'),
          ('840243135226','True Solutions','Digestive Care Adult Cat Chicken','adult','dry','bag','3.5 lb (1.59 kg)',['chicken'],'individual_unit'),
          ('840243134748','Baby BLUE','Kitten Crunchy Treat Chicken','kitten','treat','bag','2 oz (56.7 g)',['chicken'],'individual_unit'),
          ('840243137091','Baby BLUE','Kitten Crunchy Grain-Free Salmon Recipe','kitten','treat','bag','2 oz (56.7 g)',['salmon'],'individual_unit'),
          ('840243158553','Blue Buffalo','Adult Cat Duck Pate 4-Pack','adult','wet','box','3 oz cans 4 ct',['duck'],'multipack'),
          ('840243158546','Blue Buffalo','Adult Cat Chicken Pate 4-Pack','adult','wet','box','3 oz cans 4 ct',['chicken'],'multipack')]
          def valid(u):
              if len(u)!=12 or not u.isdigit(): return False
              s=sum((3 if i%2==0 else 1)*int(d) for i,d in enumerate(u[:11])); return (10-s%10)%10==int(u[-1])
          assert len(items)==20 and len({x[0] for x in items})==20 and all(valid(x[0]) for x in items)
          target=Path('research/deep-research-blue-buffalo.json'); ledger=json.loads(target.read_text()); upcs=[x[0] for x in items]
          paths=[Path('data/known-products.ts'),Path('data/known-formulas.ts'),Path('data/wrong-barcodes.ts'),Path('docs/CATALOG-CONFLICTS.md')]
          paths += [p for p in Path('research').glob('deep-research-*.json') if p!=target]
          for p in paths:
              if p.exists():
                  txt=p.read_text(encoding='utf-8',errors='ignore'); hits=[u for u in upcs if u in txt]; assert not hits, f'duplicates in {p}: {hits}'
          existing={r['upc'] for r in ledger['records']}; assert not existing.intersection(upcs), sorted(existing.intersection(upcs))
          us='https://www.bluebuffalo.com/incentive-requests/qualifying-products/'
          ca_w='https://www.bluebuffalo.com/en-ca/natural-cat-food/wilderness/'
          ca_all='https://www.bluebuffalo.com/en-ca/product-finder/cat/'
          ca_t='https://www.bluebuffalo.com/en-ca/product-finder/cat/treats/'
          batch=[]
          for upc,line,var,life,form,pkg,size,recipe,scope in items:
              src2=ca_t if form=='treat' else (ca_w if line=='Wilderness' else ca_all)
              batch.append({'catalog_number':None,'upc':upc,'canonical_gtin14':upc.zfill(14),'barcode_scope':scope,'brand':'Blue Buffalo','manufacturer':'Blue Buffalo Company, Ltd.','species':'cat','product_line':line,'product_name':f'BLUE {line} {var}','variant':var,'recipe':recipe,'life_stage':life,'food_form':form,'texture':None,'presentation':None,'package_type':pkg,'size':size,'ingredients_verbatim':'','ingredients_ordered_normalized':[],'guaranteed_analysis':{'crude_protein_min_percent':None,'crude_fat_min_percent':None,'crude_fiber_max_percent':None,'moisture_max_percent':None,'ash_max_percent':None,'taurine_min_percent':None,'other_printed_guarantees':[]},'calorie_content':{'kcal_per_kg':None,'kcal_per_unit':None,'unit_name':None},'label_deck_code':None,'formula_source':'Current U.S. Blue Buffalo qualifying-products list establishes exact UPC and sellable package identity. Canadian Blue Buffalo catalog is used as North American market corroboration where the family is currently represented. Exact complete current ingredients/GA/calorie label deck for this UPC was not established as one coherent generation.','source_urls':[us,src2],'source_accessed_at':'2026-08-29','barcode_notes':f'Current U.S. Blue Buffalo qualifying-products list explicitly maps UPC {upc} to this cat SKU/package; UPC-A check digit validated.','conflicts':['Mexico-specific official UPC distribution not independently established. Exact current complete label deck remains unresolved for source_verified status.'],'verification_notes':[f'UPC-A check digit validated; canonical GTIN-14 {upc.zfill(14)}.','Live repository-wide mandatory exclusion scan passed before append.','Current U.S. manufacturer list establishes exact UPC/product package identity.','Canadian catalog used only as market corroboration; no Canadian UPC inferred.','Unknown exact printed size fields remain null instead of being guessed.','Formula fields deliberately remain unresolved rather than mixing generations.'],'research_status':'needs_physical_label'})
          before=len(ledger['records']); ledger['records'].extend(batch); ledger['updated_at']='2026-08-29'
          assert len(ledger['records'])==before+20 and len({r['upc'] for r in ledger['records']})==len(ledger['records'])
          target.write_text(json.dumps(ledger,separators=(',',':'),ensure_ascii=False)+'\n',encoding='utf-8')
          print(f'APPEND_OK before={before} added=20 after={len(ledger["records"])} verified=0 needs=20'); print('UPCS='+','.join(upcs))
          PY
      - name: Restore runner and commit ledger
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show origin/agent/deep-research-barcode-ledger:.github/workflows/tmp-royal-canin-cats-runner.yml > .github/workflows/tmp-royal-canin-cats-runner.yml
          git add research/deep-research-blue-buffalo.json .github/workflows/tmp-royal-canin-cats-runner.yml
          git diff --cached --quiet && { echo "No target changes"; exit 1; }
          git commit -m "research: add 20 more current Blue Buffalo cat records"
          git push origin HEAD:agent/deep-research-blue-buffalo
