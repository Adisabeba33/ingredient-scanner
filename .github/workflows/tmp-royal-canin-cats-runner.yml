name: Append current Blue Buffalo cat batch 20
on:
  push:
    branches: [agent/deep-research-blue-buffalo]
    paths: [.github/workflows/tmp-royal-canin-cats-runner.yml]
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-blue-buffalo
          fetch-depth: 0
      - name: Append validated current Blue Buffalo batch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          items=[
          ('840243105809','Wilderness','Mature Chicken Recipe','senior','dry','bag','5 lb (2.27 kg)',['chicken']),
          ('840243159277','Wilderness','Kitten Salmon Recipe','kitten','dry','bag','5 lb (2.27 kg)',['salmon']),
          ('840243159260','Wilderness','Kitten Salmon Recipe','kitten','dry','bag','4 lb (1.81 kg)',['salmon']),
          ('840243159291','Wilderness','Adult 7+ Salmon Recipe','senior','dry','bag','5 lb (2.27 kg)',['salmon']),
          ('840243159284','Wilderness','Adult 7+ Salmon Recipe','senior','dry','bag','4 lb (1.81 kg)',['salmon']),
          ('840243134403','Baby BLUE','Kitten Grain-Free High Protein Salmon Recipe','kitten','wet','can','3 oz (85 g)',['salmon']),
          ('840243134427','Baby BLUE','Kitten Grain-Free High Protein Chicken Recipe','kitten','wet','can','3 oz (85 g)',['chicken']),
          ('840243134649','Baby BLUE','Kitten Chicken & Brown Rice Recipe','kitten','dry','bag','5 lb (2.27 kg)',['chicken']),
          ('840243134380','Baby BLUE','Kitten Chicken Recipe','kitten','wet','can','3 oz (85 g)',['chicken']),
          ('840243134625','Baby BLUE','Kitten Chicken & Brown Rice Recipe','kitten','dry','bag','2 lb (0.91 kg)',['chicken']),
          ('840243134687','Baby BLUE','Grain-Free High Protein Kitten Chicken Recipe','kitten','dry','bag','4.5 lb (2.04 kg)',['chicken']),
          ('840243135141','Baby BLUE','Grain-Free High Protein Kitten Chicken Recipe','kitten','dry','bag','2 lb (0.91 kg)',['chicken']),
          ('859610000852','Tastefuls','Indoor Adult Chicken & Brown Rice Recipe','adult','dry','bag','3 lb (1.36 kg)',['chicken']),
          ('840243122455','Tastefuls','Indoor Adult Chicken & Brown Rice Recipe','adult','dry','bag','5 lb (2.27 kg)',['chicken']),
          ('859610000869','Tastefuls','Indoor Adult Chicken & Brown Rice Recipe','adult','dry','bag','7 lb (3.18 kg)',['chicken']),
          ('840243122431','Tastefuls','Indoor Adult Chicken & Brown Rice Recipe','adult','dry','bag','10 lb (4.54 kg)',['chicken']),
          ('859610000876','Tastefuls','Indoor Adult Chicken & Brown Rice Recipe','adult','dry','bag','15 lb (6.80 kg)',['chicken']),
          ('840243151103','Tastefuls','Indoor Adult Chicken & Brown Rice Recipe','adult','dry','bag','22 lb (9.98 kg)',['chicken']),
          ('840243122523','Tastefuls','Weight Control Chicken & Brown Rice Recipe','adult','dry','bag','5 lb (2.27 kg)',['chicken']),
          ('859610000258','Tastefuls','Weight Control Chicken & Brown Rice Recipe','adult','dry','bag','7 lb (3.18 kg)',['chicken'])]
          def valid(u):
              s=sum((3 if i%2==0 else 1)*int(d) for i,d in enumerate(u[:11])); return len(u)==12 and u.isdigit() and (10-s%10)%10==int(u[-1])
          assert len(items)==20 and len({x[0] for x in items})==20 and all(valid(x[0]) for x in items)
          target=Path('research/deep-research-blue-buffalo.json'); ledger=json.loads(target.read_text())
          upcs=[x[0] for x in items]
          paths=[Path('data/known-products.ts'),Path('data/known-formulas.ts'),Path('data/wrong-barcodes.ts'),Path('docs/CATALOG-CONFLICTS.md')]
          paths += [p for p in Path('research').glob('deep-research-*.json') if p!=target]
          for p in paths:
              if p.exists():
                  txt=p.read_text(encoding='utf-8',errors='ignore'); hits=[u for u in upcs if u in txt]; assert not hits, f'duplicates in {p}: {hits}'
          existing={r['upc'] for r in ledger['records']}; assert not existing.intersection(upcs), sorted(existing.intersection(upcs))
          official='https://www.bluebuffalo.com/incentive-requests/qualifying-products/'
          batch=[]
          for upc,line,var,life,form,pkg,size,recipe in items:
              batch.append({'catalog_number':None,'upc':upc,'canonical_gtin14':upc.zfill(14),'barcode_scope':'individual_unit','brand':'Blue Buffalo','manufacturer':'Blue Buffalo Company, Ltd.','species':'cat','product_line':line,'product_name':f'BLUE {line} {var}','variant':var,'recipe':recipe,'life_stage':life,'food_form':form,'texture':None,'presentation':None,'package_type':pkg,'size':size,'ingredients_verbatim':'','ingredients_ordered_normalized':[],'guaranteed_analysis':{'crude_protein_min_percent':None,'crude_fat_min_percent':None,'crude_fiber_max_percent':None,'moisture_max_percent':None,'ash_max_percent':None,'taurine_min_percent':None,'other_printed_guarantees':[]},'calorie_content':{'kcal_per_kg':None,'kcal_per_unit':None,'unit_name':None},'label_deck_code':None,'formula_source':'Blue Buffalo current qualifying-products list establishes current product and exact UPC/package identity. Complete current formula deck was not combined from potentially different generations; label fields remain unresolved pending one coherent current deck.','source_urls':[official],'source_accessed_at':'2026-08-29','barcode_notes':f'Current Blue Buffalo qualifying-products list identifies UPC {upc} as this cat-food SKU/package; UPC-A check digit validated.','conflicts':['Complete current formula-generation evidence remains incomplete; no historical ingredient/GA/calorie deck was silently substituted.'],'verification_notes':[f'UPC-A check digit validated for {upc}; canonical GTIN-14 is {upc.zfill(14)}.','Repository-wide mandatory exclusion scan completed before append.','Blue Buffalo current qualifying-products list confirms this SKU is current/qualifying as of 2026-08-29.','Formula fields intentionally remain unresolved until one coherent current label deck including ingredients, guarantees and calories can be proven.'],'research_status':'needs_physical_label'})
          before=len(ledger['records']); ledger['records'].extend(batch); ledger['updated_at']='2026-08-29'
          assert len(ledger['records'])==before+20 and len({r['upc'] for r in ledger['records']})==len(ledger['records'])
          target.write_text(json.dumps(ledger,separators=(',',':'),ensure_ascii=False)+'\n',encoding='utf-8')
          print(f'APPEND_OK before={before} added=20 after={len(ledger["records"])} verified=0 needs=20')
          print('UPCS='+','.join(upcs))
          PY
      - name: Restore runner and commit ledger
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show origin/agent/deep-research-barcode-ledger:.github/workflows/tmp-royal-canin-cats-runner.yml > .github/workflows/tmp-royal-canin-cats-runner.yml
          git add research/deep-research-blue-buffalo.json .github/workflows/tmp-royal-canin-cats-runner.yml
          git diff --cached --quiet && { echo "No target changes"; exit 1; }
          git commit -m "research: add 20 current Blue Buffalo cat records"
          git push origin HEAD:agent/deep-research-blue-buffalo
