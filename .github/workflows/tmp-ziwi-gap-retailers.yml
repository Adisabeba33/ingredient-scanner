name: Inspect ZIWI gap retailer variants
on:
  push:
    branches: [agent/deep-research-ziwi-peak]
    paths: [.github/workflows/tmp-ziwi-gap-retailers.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-ziwi-peak
      - name: Fetch selected retailer product JSON endpoints
        run: |
          python - <<'PY'
          import json,urllib.request
          urls=[
            'https://petsupply.co.nz/products/ziwi-peak-chicken-hip-joint-dog-food-topper-320g-114g.js',
            'https://www.allpetspantry.com.au/products/ziwi-peak-raw-super-boost-venison.js',
            'https://www.allpetspantry.com.au/products/ziwi-peak-raw-superboost-venison.js',
            'https://www.luxpets.com.au/products/ziwi-peak-air-dried-provenance-dog-food-hauraki-plains-140-gm.js',
            'https://www.torontopets.ca/products/ziwi-peak-wet-cat-food-new-zealand-hoki-recipe-canned.js',
          ]
          for url in urls:
            print('\nURL',url)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                data=json.load(r)
              print('TITLE',data.get('title'))
              for v in data.get('variants',[]):
                print(json.dumps({k:v.get(k) for k in ('title','sku','barcode','available','grams','weight')},ensure_ascii=False))
            except Exception as e:
              print('ERROR',type(e).__name__,str(e))
          PY
