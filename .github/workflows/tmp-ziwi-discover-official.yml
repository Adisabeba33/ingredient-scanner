name: Inspect remaining official ZIWI variant barcodes

on:
  push:
    branches: [agent/deep-research-ziwi-peak]
    paths: [.github/workflows/tmp-ziwi-discover-official.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-ziwi-peak
          fetch-depth: 0
      - name: Enumerate official Shopify variants and subtract repository exclusions
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from pathlib import Path

          def get_json(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          exclusion_paths=[Path('data/known-products.ts'),Path('data/known-formulas.ts'),Path('data/wrong-barcodes.ts'),Path('docs/CATALOG-CONFLICTS.md')]
          exclusion_paths += list(Path('research').glob('deep-research-*.json'))
          exclusion_text='\n'.join(p.read_text(encoding='utf-8',errors='replace') for p in exclusion_paths if p.exists())
          existing=set(re.findall(r'(?<!\d)(?:\d{8}|\d{12,14})(?!\d)', exclusion_text))
          # include canonical zero-padded equivalence
          canon={x.zfill(14) for x in existing}

          all_products=[]
          # Shopify products.json supports pagination by page; use generous bounded sweep.
          for page in range(1,11):
              url=f'https://us.ziwipets.com/products.json?limit=250&page={page}'
              data=get_json(url)
              products=data.get('products',[])
              if not products: break
              all_products.extend(products)
              if len(products)<250: break

          print('OFFICIAL_PRODUCTS',len(all_products))
          candidates=[]
          for p in all_products:
              handle=p.get('handle')
              title=p.get('title')
              ptype=p.get('product_type')
              tags=p.get('tags')
              for v in p.get('variants',[]):
                  bc=(v.get('barcode') or '').strip()
                  if not bc or not bc.isdigit(): continue
                  if bc in existing or bc.zfill(14) in canon: continue
                  candidates.append({
                      'barcode':bc,'product':title,'handle':handle,'product_type':ptype,
                      'variant':v.get('title'),'sku':v.get('sku'),'grams':v.get('grams'),
                      'available':v.get('available'),'tags':tags,
                      'url':f'https://us.ziwipets.com/products/{handle}',
                      'js':f'https://us.ziwipets.com/products/{handle}.js'
                  })
          # dedupe barcode, preserving first exact official mapping
          seen=set(); uniq=[]
          for c in candidates:
              if c['barcode'] in seen: continue
              seen.add(c['barcode']); uniq.append(c)
          print('NEW_OFFICIAL_VARIANTS',len(uniq))
          for c in sorted(uniq,key=lambda x:(x['product'],x['variant'] or '',x['barcode'])):
              print(json.dumps(c,ensure_ascii=False,sort_keys=True))
          PY
