name: Temporary Royal Canin batch 44 remote verify
on:
  push:
    paths:
      - '.github/workflows/tmp-royal-canin-batch-44.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: Re-fetch and compare committed Royal Canin batch
        env:
          BATCH_GZIP_B64: 
        run: |
          git fetch origin agent/deep-research-barcode-ledger
          git show origin/agent/deep-research-barcode-ledger:research/deep-research-royal-canin.json > /tmp/remote-royal.json
          python - <<'PY'
          import base64, gzip, json, os
          with open('/tmp/remote-royal.json', encoding='utf-8') as f:
              doc = json.load(f)
          batch = json.loads(gzip.decompress(base64.b64decode(os.environ['BATCH_GZIP_B64'])).decode('utf-8'))
          assert doc['brand_scope'] == ['Royal Canin']
          assert len(doc['records']) == 44
          assert doc['records'][-10:] == batch
          assert len({r['upc'] for r in doc['records']}) == 44
          assert len({r['canonical_gtin14'] for r in doc['records']}) == 44
          assert all(r['research_status'] == 'source_verified' for r in doc['records'])
          assert all(r.get('ingredients_ordered_normalized') for r in doc['records'])
          print('Remote Royal Canin ledger parsed and exact intended batch matched; total=44')
          PY
