name: Temporary Royal Canin batch 44 apply
on:
  push:
    paths:
      - '.github/workflows/tmp-royal-canin-batch-44.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: Validate and append Royal Canin records
        env:
          BATCH_GZIP_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, json, os, pathlib, sys

          ledger_path = pathlib.Path('research/deep-research-royal-canin.json')
          raw_before = ledger_path.read_text(encoding='utf-8')
          doc = json.loads(raw_before)
          before_records = json.loads(json.dumps(doc['records']))
          assert doc['brand_scope'] == ['Royal Canin']
          assert len(before_records) == 34, f"Expected 34 existing Royal Canin records, found {len(before_records)}"

          batch = json.loads(gzip.decompress(base64.b64decode(os.environ['BATCH_GZIP_B64'])).decode('utf-8'))
          assert len(batch) == 10
          candidate_upcs = [r['upc'] for r in batch]
          candidate_gtins = [r['canonical_gtin14'] for r in batch]
          assert len(set(candidate_upcs)) == 10
          assert len(set(candidate_gtins)) == 10

          exclusion_paths = [
              pathlib.Path('data/known-products.ts'),
              pathlib.Path('data/known-formulas.ts'),
              pathlib.Path('data/wrong-barcodes.ts'),
              pathlib.Path('docs/CATALOG-CONFLICTS.md'),
          ] + sorted(pathlib.Path('research').glob('deep-research-*.json'))
          for path in exclusion_paths:
              text = path.read_text(encoding='utf-8')
              for code in candidate_upcs + candidate_gtins:
                  if code in text:
                      raise AssertionError(f'Duplicate/excluded barcode {code} already appears in {path}')

          def check_upca(code):
              assert len(code) == 12 and code.isdigit()
              body = code[:-1]
              total = sum((3 if i % 2 == 0 else 1) * int(d) for i, d in enumerate(body))
              expected = (10 - total % 10) % 10
              return expected == int(code[-1])

          allowed_texture = {'pate','loaf','mousse','minced','ground','chopped_ground','flaked','shredded','morsels','chunks','cuts','choice_cuts','slices','filets','bits','stew','medley','kibble','biscuit','freeze_dried','air_dried','dehydrated','fresh','raw','unknown'}
          allowed_presentation = {'in_gravy','extra_gravy','in_sauce','in_broth','in_jelly','in_water','gravy_center','gravy_halo','plain','unknown'}
          for r in batch:
              assert r['brand'] == 'Royal Canin'
              assert r['species'] == 'cat'
              assert r['barcode_scope'] == 'individual_unit'
              assert r['food_form'] == 'dry'
              assert r['package_type'] == 'bag'
              assert r['catalog_number'] is None
              assert r['research_status'] == 'source_verified'
              assert check_upca(r['upc'])
              assert r['canonical_gtin14'] == r['upc'].zfill(14)
              assert r['texture'] in allowed_texture
              assert r['presentation'] in allowed_presentation
              assert r['ingredients_verbatim']
              assert r['ingredients_ordered_normalized']
              assert r['source_urls'] and isinstance(r['source_urls'], list)
              assert isinstance(r['conflicts'], list)
              assert isinstance(r['verification_notes'], list)

          doc['records'].extend(batch)
          doc['updated_at'] = '2026-08-25'

          assert doc['records'][:34] == before_records, 'Existing reviewed Royal Canin records changed unexpectedly'
          assert len(doc['records']) == 44
          assert len({r['upc'] for r in doc['records']}) == 44
          assert len({r['canonical_gtin14'] for r in doc['records']}) == 44
          assert all(r['brand'] == 'Royal Canin' for r in doc['records'])
          assert all(r['research_status'] == 'source_verified' for r in doc['records'])
          assert all(r.get('ingredients_ordered_normalized') for r in doc['records'])

          target = json.dumps(doc, ensure_ascii=False, separators=(',', ':')) + '\n'
          ledger_path.write_text(target, encoding='utf-8')
          reparsed = json.loads(ledger_path.read_text(encoding='utf-8'))
          assert reparsed['records'][:34] == before_records
          assert reparsed['records'][34:] == batch
          assert len(reparsed['records']) == 44
          print('Validated Royal Canin ledger:', len(reparsed['records']), 'records')
          print('New UPCs:', ', '.join(candidate_upcs))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/deep-research-royal-canin.json
          git diff --cached --exit-code && { echo "No ledger changes to commit"; exit 1; } || true
          git commit -m "research: add 10 verified Royal Canin cat dry SKUs"
          git push origin HEAD:agent/deep-research-barcode-ledger
