name: Temporary Royal Canin dogs 101-110 final
on:
  push:
    branches: [agent/deep-research-barcode-ledger]
    paths: [.github/workflows/tmp-royal-canin-dogs-101-110-final.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: Validate and append Royal Canin dogs 101-110
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Adisabeba33"
          git config user.email "lezzgo2@gmail.com"
          git pull --rebase origin agent/deep-research-barcode-ledger
          START_BLOB="239da885af7dbee5254764a7b32f960330f9ffbb"
          test "$(git hash-object research/deep-research-royal-canin-dogs.json)" = "$START_BLOB"
          python3 - <<'PY'
          import copy, json, pathlib
          T=pathlib.Path('research/deep-research-royal-canin-dogs.json')
          PAN='https://www.pacificpet.net/Home/ProductListing?FoodAccSpec=FOOD&Itembrand=Royal+Canin&Itemgroup=Dog&Itemtype=Dry'
          doc=json.loads(T.read_text(encoding='utf-8'))
          assert len(doc['records'])==100
          assert len({r['upc'] for r in doc['records']})==100
          assert len({r['canonical_gtin14'] for r in doc['records']})==100
          by={r['upc']:r for r in doc['records']}
          def split_top(s):
              s=s.strip()
              if s.endswith('.'): s=s[:-1]
              out=[]; cur=[]; sq=par=0
              for ch in s:
                  if ch=='[': sq+=1
                  elif ch==']': sq-=1
                  elif ch=='(': par+=1
                  elif ch==')': par-=1
                  if ch==',' and sq==0 and par==0:
                      out.append(''.join(cur).strip()); cur=[]
                  else: cur.append(ch)
              if cur: out.append(''.join(cur).strip())
              assert sq==0 and par==0
              return out
          def check_upc(u):
              assert len(u)==12 and u.isdigit()
              total=sum(int(u[i])*(3 if i%2==0 else 1) for i in range(11))
              cd=(10-total%10)%10
              assert cd==int(u[-1]),(u,total,cd)
              return total,cd
          def clone(src,new,size,barcode_url=PAN,conflicts=None):
              r=copy.deepcopy(by[src]); total,cd=check_upc(new)
              official=r['source_urls'][0]
              r['catalog_number']=None; r['upc']=new; r['canonical_gtin14']='00'+new; r['size']=size
              r['source_urls']=[official,barcode_url]
              r['source_accessed_at']='2026-08-26'
              r['formula_source']='Current Royal Canin USA English product page is the formula master; exact individual-unit UPC and package size are independently verified by the cited retail/distributor source.'
              r['barcode_notes']=f'Exact barcode source maps UPC {new} to {r["variant"]}, {size}, as one retail bag; current Royal Canin USA confirms the package size.'
              r['conflicts']=conflicts or []
              r['verification_notes']=[f'UPC-A check digit verified: weighted body sum {total} gives check digit {cd}.',f'Canonical GTIN-14 is zero-left-padded UPC-A 00{new}.','No repository-wide UPC or GTIN match found before append.',f'This package size uses the same current Royal Canin USA formula deck as already source-verified UPC {src}; formula fields were cloned without modification.','Calories are printed per kilogram and per cup; no whole-package calorie value is printed, so package-weight calorie arithmetic does not apply.']
              r['research_status']='source_verified'
              return r
          def direct(upc,line,name,variant,recipe,life,size,url,barcode_url,ingredients,ga,cal,conflicts=None,extra_urls=None,adequacy='AAFCO maintenance.'):
              total,cd=check_upc(upc)
              return {'catalog_number':None,'upc':upc,'canonical_gtin14':'00'+upc,'barcode_scope':'individual_unit','brand':'Royal Canin','manufacturer':'Royal Canin USA, Inc.','species':'dog','product_line':line,'product_name':name,'variant':variant,'recipe':recipe,'life_stage':life,'food_form':'dry','texture':'kibble','presentation':'plain','package_type':'bag','size':size,'ingredients_verbatim':ingredients,'ingredients_ordered_normalized':split_top(ingredients),'guaranteed_analysis':ga,'calorie_content':{'kcal_per_kg':cal[0],'kcal_per_unit':cal[1],'unit_name':'cup'},'label_deck_code':None,'formula_source':'Current Royal Canin USA English product page is the formula master; exact individual-unit UPC and package size are independently verified by the cited retail/distributor source.','source_urls':[url,barcode_url]+(extra_urls or []),'source_accessed_at':'2026-08-26','barcode_notes':f'Exact barcode source maps UPC {upc} to {variant}, {size}, as one retail bag; current Royal Canin USA confirms the package size.','conflicts':conflicts or [],'verification_notes':[f'UPC-A check digit verified: weighted body sum {total} gives check digit {cd}.',f'Canonical GTIN-14 is zero-left-padded UPC-A 00{upc}.','No repository-wide UPC or GTIN match found before append.','Current Royal Canin USA English product page is the formula master for ingredient order, guaranteed analysis, calories and nutritional adequacy.','Calories are printed per kilogram and per cup; no whole-package calorie value is printed, so package-weight calorie arithmetic does not apply.',adequacy],'research_status':'source_verified'}
          batch=[]
          batch.append(clone('030111179302','030111517944','40 lb'))
          batch.append(clone('030111517470','030111174550','4 lb'))
          batch.append(clone('030111517470','030111517449','40 lb'))
          batch.append(clone('030111493880','030111448552','4 lb'))
          batch.append(clone('030111449283','030111449177','17 lb'))
          batch.append(clone('030111460257','030111460271','17 lb','https://www.pongomarket.com/products/royal-canin-adult-medium-sensitive-skin-care-dry-dog-food'))
          batch.append(clone('030111512727','030111512710','12 lb','https://www.ubuy.ec/en/product/8KUIL2DBC-royal-canin-small-aging-12-dry-dog-food-2-5-lb-bag'))
          med7='Brewers rice, chicken by-product meal, wheat, corn protein meal, chicken fat, natural flavors (ONLY FOR MEXICO: including poultry, cow milk, pork), oat groats, dried plain beet pulp, wheat gluten, fish oil, calcium carbonate, potassium chloride, powdered psyllium seed husk, vegetable oil, fructooligosaccharides, sodium tripolyphosphate, monocalcium phosphate, choline chloride, vitamins [DL-alpha tocopherol acetate (source of vitamin E), L-ascorbyl-2-polyphosphate (source of vitamin C), biotin, D-calcium pantothenate, pyridoxine hydrochloride (vitamin B6), vitamin A acetate, riboflavin supplement, niacin supplement, folic acid, vitamin B12 supplement, thiamine mononitrate (vitamin B1), vitamin D3 supplement], L-lysine, salt, rosemary extract, preserved with mixed tocopherols and citric acid, hydrolyzed yeast, taurine, trace minerals [zinc proteinate, zinc oxide, manganese proteinate, ferrous sulfate, manganous oxide, copper sulfate, sodium selenite, calcium iodate, copper proteinate], L-tyrosine, GLA safflower oil, magnesium oxide, L-carnitine, green tea extract, marigold extract (Tagetes erecta L.).'
          batch.append(direct('030111177315','Size Health Nutrition','Medium Adult 7+ Dry Dog Food','Medium Adult 7+',['chicken'],'senior','30 lb','https://www.royalcanin.com/us/dogs/products/retail-products/medium-adult-7-3005',PAN,med7,{'crude_protein_min_percent':23,'crude_fat_min_percent':12,'crude_fiber_max_percent':3.7,'moisture_max_percent':10.5,'ash_max_percent':None,'taurine_min_percent':None,'other_printed_guarantees':[{'nutrient':'Vitamin E','basis':'min','value':350,'unit':'IU/kg'},{'nutrient':'Ascorbic acid (mg/kg)','basis':'min','value':240,'unit':'other'}]},(3658,315),['The Spanish-localized Royal Canin USA page exposes an older/different Medium Adult 7+ formula generation. The current English Royal Canin USA page is the stored formula master; generations were not combined.'],['https://www.royalcanin.com/us/es-us/dogs/products/retail-products/medium-adult-7-3005']))
          cocker='Brewers rice, brown rice, oat groats, chicken by-product meal, wheat gluten, chicken fat, corn gluten meal, natural flavors, dried plain beet pulp, fish oil, potassium chloride, calcium sulfate, vegetable oil, psyllium seed husk, salt, fructooligosaccharides, sodium tripolyphosphate, vitamins [DL-alpha tocopherol acetate (source of vitamin E), niacin supplement, L-ascorbyl-2-polyphosphate (source of vitamin C), D-calcium pantothenate, biotin, pyridoxine hydrochloride (vitamin B6), riboflavin supplement, thiamine mononitrate (vitamin B1), vitamin A acetate, folic acid, vitamin B12 supplement, vitamin D3 supplement], taurine, monocalcium phosphate, calcium carbonate, hydrolyzed yeast, L-lysine, choline chloride, magnesium oxide, glucosamine hydrochloride, trace minerals [zinc proteinate, zinc oxide, ferrous sulfate, manganese proteinate, manganous oxide, copper sulfate, calcium iodate, sodium selenite, copper proteinate], marigold extract (Tagetes erecta L.), L-carnitine, GLA safflower oil, green tea extract, L-tyrosine, chondroitin sulfate, rosemary extract, preserved with mixed tocopherols and citric acid.'
          batch.append(direct('030111181305','Breed Health Nutrition','Cocker Spaniel Adult Dry Dog Food','Cocker Spaniel Adult',['chicken'],'adult','25 lb','https://www.royalcanin.com/us/dogs/products/retail-products/cocker-spaniel-adult-3969','https://www.petloverscenter.com/shop/dogs/dog-food-treats/royal-canin-medium-cocker-spaniel-dry-dog-food-25-pound-bag/',cocker,{'crude_protein_min_percent':23,'crude_fat_min_percent':12,'crude_fiber_max_percent':3.3,'moisture_max_percent':10,'ash_max_percent':None,'taurine_min_percent':0.25,'other_printed_guarantees':[{'nutrient':'Eicosapentaenoic Acid (EPA)','basis':'min','value':0.17,'unit':'percent'},{'nutrient':'Docosahexaenoic Acid (DHA)','basis':'min','value':0.07,'unit':'percent'},{'nutrient':'Vitamin A','basis':'min','value':18900,'unit':'IU/kg'},{'nutrient':'Glucosamine (mg/kg)','basis':'min','value':371,'unit':'other'},{'nutrient':'Chondroitin sulfate (mg/kg)','basis':'min','value':4,'unit':'other'}]},(3661,304)))
          indoor='Corn, brewers rice, chicken by-product meal, wheat gluten, chicken fat, dried plain beet pulp, corn gluten meal, natural flavors, pea fiber, fish oil, vegetable oil, fructooligosaccharides, calcium carbonate, potassium chloride, hydrolyzed yeast, sodium tripolyphosphate, vitamins [DL-alpha tocopherol acetate (source of vitamin E), L-ascorbyl-2-polyphosphate (source of vitamin C), biotin, D-calcium pantothenate, vitamin A acetate, pyridoxine hydrochloride (vitamin B6), folic acid, niacin supplement, vitamin B12 supplement, thiamine mononitrate (vitamin B1), vitamin D3 supplement, riboflavin supplement], taurine, monosodium phosphate, trace minerals [zinc proteinate, zinc oxide, manganese proteinate, ferrous sulfate, manganous oxide, copper sulfate, calcium iodate, sodium selenite, copper proteinate], marigold extract (Tagetes erecta L.), L-carnitine, L-lysine, magnesium oxide, rosemary extract, preserved with mixed tocopherols and citric acid.'
          batch.append(direct('030111512949','Size Health Nutrition','Small Indoor Adult Dry Dog Food','Small Indoor Adult',['chicken'],'adult','2.5 lb','https://www.royalcanin.com/us/dogs/products/retail-products/mini-indoor-adult-2434','https://www.desertcart.hk/products/31057093-size-health-nutrition-small-indoor-adult-dry-dog-food-2',indoor,{'crude_protein_min_percent':19,'crude_fat_min_percent':12,'crude_fiber_max_percent':3.7,'moisture_max_percent':10,'ash_max_percent':None,'taurine_min_percent':None,'other_printed_guarantees':[{'nutrient':'Eicosapentaenoic Acid (EPA)','basis':'min','value':0.11,'unit':'percent'},{'nutrient':'Docosahexaenoic Acid (DHA)','basis':'min','value':0.05,'unit':'percent'},{'nutrient':'L-Carnitine (mg/kg)','basis':'min','value':70,'unit':'other'}]},(3609,354)))
          expected={'030111517944','030111174550','030111517449','030111448552','030111449177','030111177315','030111181305','030111460271','030111512710','030111512949'}
          assert len(batch)==10 and {r['upc'] for r in batch}==expected
          existing={r['upc'] for r in doc['records']}; assert not expected & existing,(expected & existing)
          new_gtins={r['canonical_gtin14'] for r in batch}
          paths=[pathlib.Path('data/known-products.ts'),pathlib.Path('data/known-formulas.ts'),pathlib.Path('data/wrong-barcodes.ts'),pathlib.Path('docs/CATALOG-CONFLICTS.md')]+sorted(pathlib.Path('research').glob('deep-research-*.json'))
          for p in paths:
              if p==T: continue
              body=p.read_text(encoding='utf-8')
              for code in expected|new_gtins:
                  assert code not in body,f'global collision {code} in {p}'
          for r in batch:
              check_upc(r['upc']); assert r['canonical_gtin14']=='00'+r['upc']
              assert r['catalog_number'] is None and r['barcode_scope']=='individual_unit'
              assert r['brand']=='Royal Canin' and r['manufacturer']=='Royal Canin USA, Inc.' and r['species']=='dog'
              assert r['life_stage'] in {'adult','puppy','senior'} and r['food_form']=='dry' and r['texture']=='kibble' and r['presentation']=='plain' and r['package_type']=='bag'
              assert r['research_status']=='source_verified' and r['ingredients_verbatim']
              assert r['ingredients_ordered_normalized']==split_top(r['ingredients_verbatim'])
              ga=r['guaranteed_analysis']; assert all(ga[k] is not None for k in ('crude_protein_min_percent','crude_fat_min_percent','crude_fiber_max_percent','moisture_max_percent'))
              cal=r['calorie_content']; assert cal['kcal_per_kg'] is not None and cal['kcal_per_unit'] is not None and cal['unit_name']=='cup'
              assert len(r['source_urls'])>=2 and all(x.startswith('http') for x in r['source_urls'])
              assert isinstance(r['conflicts'],list) and isinstance(r['verification_notes'],list) and r['verification_notes']
              assert '�' not in json.dumps(r,ensure_ascii=False)
          doc['records'].extend(batch); doc['updated_at']='2026-08-26'
          assert len(doc['records'])==110
          assert len({r['upc'] for r in doc['records']})==110
          assert len({r['canonical_gtin14'] for r in doc['records']})==110
          T.write_text(json.dumps(doc,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          chk=json.loads(T.read_text(encoding='utf-8'))
          assert len(chk['records'])==110
          assert all(sum(1 for r in chk['records'] if r['upc']==u)==1 for u in expected)
          print('validated 100->110',sorted(expected))
          PY
          git rm -f --ignore-unmatch .github/workflows/tmp-royal-canin-dogs-101-110.yml .github/workflows/tmp-royal-canin-dogs-101-110-retry.yml .github/workflows/tmp-royal-canin-dogs-101-110-final.yml
          git add research/deep-research-royal-canin-dogs.json
          git diff --cached --check
          git commit -m "research: add Royal Canin dogs records 101-110"
          git fetch origin agent/deep-research-barcode-ledger
          REMOTE_BLOB="$(git ls-tree origin/agent/deep-research-barcode-ledger research/deep-research-royal-canin-dogs.json | awk '{print $3}')"
          test "$REMOTE_BLOB" = "$START_BLOB"
          git pull --rebase origin agent/deep-research-barcode-ledger
          git push origin HEAD:agent/deep-research-barcode-ledger
