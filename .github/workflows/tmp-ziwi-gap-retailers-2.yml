name: Inspect additional ZIWI gap variants
on:
  push:
    branches: [agent/deep-research-ziwi-peak]
    paths: [.github/workflows/tmp-ziwi-gap-retailers-2.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-ziwi-peak
      - name: Fetch retailer product JSON endpoints
        run: |
          python - <<'PY'
          import json,urllib.request
          urls=[
            'https://herospets.com/products/ziwi-peak-cat-dehydrated-raw.js',
            'https://petdirect.co.nz/products/air-dried-venison-cat-food.js',
            'https://www.yourpetpa.co.nz/products/ziwi-peak-provenance-hauraki-plains-air-dried-dog-food.js',
            'https://www.yourpetpa.co.nz/products/ziwi-peak-provenance-east-cape-air-dried-dog-food.js',
            'https://www.yourpetpa.co.nz/products/ziwi-peak-provenance-otago-valley-air-dried-dog-food.js',
          ]
          for url in urls:
            print('\nURL',url)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as r:data=json.load(r)
              print('TITLE',data.get('title'))
              for v in data.get('variants',[]):
                print(json.dumps({k:v.get(k) for k in ('title','sku','barcode','available','grams','weight')},ensure_ascii=False))
            except Exception as e: print('ERROR',type(e).__name__,str(e))
          PY
