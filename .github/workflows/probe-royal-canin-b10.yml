name: Probe Royal Canin b10
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/deep-research-barcode-ledger}
      - run: |
          python - <<'PY'
          import pathlib
          t='\n'.join(p.read_text(errors='ignore') for p in [pathlib.Path('data/known-products.ts'),pathlib.Path('data/known-formulas.ts'),pathlib.Path('data/wrong-barcodes.ts'),pathlib.Path('docs/CATALOG-CONFLICTS.md'),*pathlib.Path('research').glob('deep-research-*.json')])
          for u in '030111565129 030111565112 030111584205 030111584212 030111427618 030111420756 030111470621 030111760272 030111760241 030111760210 030111477828 030111477811'.split(): print(u,'EXISTS' if u in t else 'NEW')
          PY