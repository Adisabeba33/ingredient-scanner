name: Inspect Merrick current product metadata
on:
  push:
    branches: [agent/deep-research-merrick]
    paths: [.github/workflows/tmp-merrick-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Merrick site
        run: |
          python - <<'PY'
          import urllib.request,re,json,html
          urls=[
            'https://www.merrickpetcare.com/cat-food',
            'https://www.merrickpetcare.com/cat-food/wet',
            'https://www.merrickpetcare.com/cat-food/dry',
            'https://www.merrickpetcare.com/shop/purrfect-bistro-grain-free-beef-wet-cat-food',
            'https://www.merrickpetcare.com/shop/purrfect-bistro-grain-free-tuna-wet-cat-food',
          ]
          h={'User-Agent':'Mozilla/5.0'}
          for u in urls:
            print('\nURL',u)
            try:
              req=urllib.request.Request(u,headers=h)
              with urllib.request.urlopen(req,timeout=30) as r: t=r.read().decode('utf-8','replace'); print('STATUS',r.status,'LEN',len(t))
              for pat in ['gtin','upc','barcode','sku','productID','Available Sizes']:
                hits=list(re.finditer(pat,t,re.I)); print(pat,len(hits))
                for m in hits[:6]: print(html.unescape(re.sub(r'\s+',' ',t[max(0,m.start()-220):m.start()+380]))[:650])
              hrefs=re.findall(r'href=["\']([^"\']+)["\']',t,re.I)
              links=[]
              for href in hrefs:
                if '/shop/' in href:
                  if href.startswith('/'): href='https://www.merrickpetcare.com'+href
                  links.append(href.split('?')[0].split('#')[0])
              print('SHOP_LINKS',len(set(links)))
              for x in sorted(set(links))[:120]: print(x)
            except Exception as e: print('ERR',repr(e))
          PY
