name: Validate Merrick active batch
on:
  push:
    branches: [agent/deep-research-merrick]
    paths: [.github/workflows/tmp-merrick-inspect.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact UPCs against live exclusions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          batch = [
            '022808000839','022808000754','022808000891','022808000778','022808000853','022808000792',
            '022808382539','022808382614','022808382577','022808382638','022808382591','022808383277','022808382553','022808385103',
            '022808001317','022808001355','022808001393','022808001454','022808383109','022808383123'
          ]
          paths=[Path('data/known-products.ts'),Path('data/known-formulas.ts'),Path('data/wrong-barcodes.ts'),Path('docs/CATALOG-CONFLICTS.md')]+list(Path('research').glob('deep-research-*.json'))
          print('EXCLUSION_FILES', len(paths))
          collisions=[]
          for p in paths:
            if not p.exists(): continue
            text=p.read_text(encoding='utf-8',errors='replace')
            for code in batch:
              if re.search(r'(?<!\d)'+re.escape(code)+r'(?!\d)', text) or re.search(r'(?<!\d)'+re.escape(code.zfill(14))+r'(?!\d)', text):
                collisions.append((code,str(p)))
          def valid_upca(s):
            total=sum(int(s[i])*(3 if i%2==0 else 1) for i in range(11))
            return (10-total%10)%10 == int(s[-1])
          print('BATCH_COUNT',len(batch),'UNIQUE',len(set(batch)))
          for code in batch:
            print(code, 'CHECKDIGIT', valid_upca(code), 'GTIN14', code.zfill(14))
          print('COLLISIONS', collisions)
          assert len(batch)==20 and len(set(batch))==20
          assert all(valid_upca(x) for x in batch)
          assert not collisions
          print('VALIDATION_OK')
          PY
