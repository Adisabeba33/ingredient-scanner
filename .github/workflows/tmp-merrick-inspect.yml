name: Validate committed Merrick ledger
on:
  push:
    branches: [agent/deep-research-merrick]
    paths: [.github/workflows/tmp-merrick-inspect.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-merrick
      - name: Validate committed ledger
        run: |
          python - <<'PY'
          import json,re
          from collections import Counter
          from pathlib import Path
          target=Path('research/deep-research-merrick.json')
          data=json.loads(target.read_text(encoding='utf-8'))
          recs=data['records']
          assert len(recs)==20
          upcs=[r['upc'] for r in recs]
          assert len(set(upcs))==20
          def valid_upca(s):
            assert len(s)==12 and s.isdigit()
            total=sum(int(s[i])*(3 if i%2==0 else 1) for i in range(11))
            return (10-total%10)%10 == int(s[-1])
          assert all(valid_upca(x) for x in upcs)
          assert all(r['canonical_gtin14']==r['upc'].zfill(14) for r in recs)
          assert all(r['barcode_scope']=='individual_unit' for r in recs)
          assert all(r['research_status']=='source_verified' for r in recs)
          assert all(r['species']=='cat' for r in recs)
          required=['product_name','size','ingredients_verbatim','ingredients_ordered_normalized','guaranteed_analysis','calorie_content','formula_source','source_urls','source_accessed_at']
          for r in recs:
            for k in required: assert r.get(k), (r['upc'],k)
            assert r['guaranteed_analysis'].get('crude_protein_min_percent') is not None
            assert r['guaranteed_analysis'].get('crude_fat_min_percent') is not None
            assert r['guaranteed_analysis'].get('crude_fiber_max_percent') is not None
            assert r['guaranteed_analysis'].get('moisture_max_percent') is not None
            assert r['calorie_content'].get('kcal_per_kg') is not None
            assert r['calorie_content'].get('kcal_per_unit') is not None
          # Rebuild global exclusions, deliberately excluding target itself.
          paths=[Path('data/known-products.ts'),Path('data/known-formulas.ts'),Path('data/wrong-barcodes.ts'),Path('docs/CATALOG-CONFLICTS.md')]+[p for p in Path('research').glob('deep-research-*.json') if p != target]
          collisions=[]
          for p in paths:
            if not p.exists(): continue
            txt=p.read_text(encoding='utf-8',errors='replace')
            for code in upcs:
              if re.search(r'(?<!\d)'+re.escape(code)+r'(?!\d)',txt) or re.search(r'(?<!\d)'+re.escape(code.zfill(14))+r'(?!\d)',txt):
                collisions.append((code,str(p)))
          assert not collisions, collisions
          print('REMOTE_LEDGER_OK')
          print('TOTAL',len(recs))
          print('STATUS',dict(Counter(r['research_status'] for r in recs)))
          print('SCOPE',dict(Counter(r['barcode_scope'] for r in recs)))
          print('FORM',dict(Counter(r['food_form'] for r in recs)))
          print('SIZE',dict(Counter(r['size'] for r in recs)))
          print('COLLISIONS',collisions)
          print('UPCS',','.join(upcs))
          PY
