name: Temporary Royal Canin cat finishing batch
on:
  push:
    paths:
      - '.github/workflows/tmp-royal-canin-cat-finish.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: Apply verified Royal Canin cat records
        shell: python
        run: |
          import json, pathlib, subprocess
          path=pathlib.Path('research/deep-research-royal-canin.json')
          doc=json.loads(path.read_text())
          before=len(doc['records'])

          def split_top(s):
              out=[]; start=0; depth=0
              for i,ch in enumerate(s):
                  if ch in '[(': depth+=1
                  elif ch in '])': depth=max(0,depth-1)
                  elif ch==',' and depth==0:
                      out.append(s[start:i].strip()); start=i+1
              tail=s[start:].strip().rstrip('.')
              if tail: out.append(tail)
              return out

          def check(upc):
              if len(upc)!=12 or not upc.isdigit(): return False
              total=sum(int(d)*(3 if i%2==0 else 1) for i,d in enumerate(upc[:11]))
              return str((-total)%10)==upc[-1]

          def make(upc,line,name,variant,recipe,life,form,texture,presentation,size,ingredients,ga,kcal_kg,kcal_unit,sources,notes,conflicts=None):
              return {
                'catalog_number':None,'upc':upc,'canonical_gtin14':upc.zfill(14),'barcode_scope':'individual_unit','brand':'Royal Canin','manufacturer':'Royal Canin USA, Inc.','species':'cat','product_line':line,'product_name':name,'variant':variant,'recipe':recipe,'life_stage':life,'food_form':form,'texture':texture,'presentation':presentation,'package_type':'can' if form=='wet' else 'bag','size':size,'ingredients_verbatim':ingredients,'ingredients_ordered_normalized':split_top(ingredients),'guaranteed_analysis':ga,'calorie_content':{'kcal_per_kg':kcal_kg,'kcal_per_unit':kcal_unit,'unit_name':'can' if form=='wet' else 'cup'},'label_deck_code':None,'formula_source':'Current Royal Canin USA product page for formula, guaranteed analysis and calories; exact individual-unit UPC and size corroborated by current U.S. distributor or exact-unit retailer evidence.','source_urls':sources,'source_accessed_at':'2026-08-25','barcode_notes':notes,'conflicts':conflicts or [],'verification_notes':['UPC-A check digit validated.','Canonical GTIN-14 is the UPC-A left-padded to 14 digits.','Exact individual-unit identity and current manufacturer formula were checked before publication.'],'research_status':'source_verified'
              }

          ADMC='https://www.admc.us/wp-content/uploads/2022/02/2024-North-Complete-Price-List_5.12.25.pdf'
          candidates=[]

          ing='Water sufficient for processing, pork by-products, chicken, chicken liver, salmon, corn flour, wheat gluten, pork plasma, hydrolyzed chicken liver, powdered cellulose, carrageenan, natural flavors, sodium aluminosilicate, calcium sulfate, guar gum, potassium chloride, sodium tripolyphosphate, taurine, rice flour, glycine, choline chloride, vitamins [DL-alpha tocopherol acetate (source of vitamin E), thiamine mononitrate (vitamin B1), niacin supplement, biotin, D-calcium pantothenate, riboflavin supplement, pyridoxine hydrochloride (vitamin B6), vitamin B12 supplement, folic acid, vitamin D3 supplement], trace minerals [zinc proteinate, zinc oxide, ferrous sulfate, copper sulfate, manganous oxide, sodium selenite, calcium iodate].'
          candidates.append(make('030111411556','Feline Care Nutrition','Royal Canin Digestive Care Loaf in Sauce Wet Cat Food','Digestive Care Loaf in Sauce',['pork','chicken','salmon'],'adult','wet','pate','in_sauce','3 oz',ing,{'crude_protein_min_percent':7.3,'crude_fat_min_percent':1.8,'crude_fiber_max_percent':2.7,'moisture_max_percent':82.0,'ash_max_percent':None,'taurine_min_percent':None,'other_printed_guarantees':[]},806,69,['https://www.royalcanin.com/us/cats/products/retail-products/digestive-care-loaf-in-sauce-4180',ADMC],'ADMC maps UPC 030111411556 to the individual 3 oz Digest Sensitive Loaf can; current Royal Canin USA now uses Digestive Care naming.',['Distributor nomenclature is Digest Sensitive Loaf; current manufacturer nomenclature is Digestive Care Loaf in Sauce.']))

          ing='Water sufficient for processing, pork by-products, chicken, chicken liver, salmon, wheat flour, pork plasma, modified corn starch, powdered cellulose, glycine, gelatin, wheat gluten, natural flavors, vegetable oil, sodium aluminosilicate, potassium chloride, carob bean gum, calcium sulfate, rice flour, taurine, choline chloride, sodium tripolyphosphate, vitamins [DL-alpha tocopherol acetate (source of vitamin E), thiamine mononitrate (vitamin B1), niacin supplement, biotin, D-calcium pantothenate, riboflavin supplement, pyridoxine hydrochloride (vitamin B6), vitamin B12 supplement, folic acid, vitamin D3 supplement], trace minerals [zinc proteinate, zinc oxide, ferrous sulfate, copper sulfate, manganous oxide, sodium selenite, calcium iodate].'
          candidates.append(make('030111471550','Feline Care Nutrition','Royal Canin Digestive Care Thin Slices in Gravy Wet Cat Food','Digestive Care Thin Slices in Gravy',['pork','chicken','salmon'],'adult','wet','slices','in_gravy','3 oz',ing,{'crude_protein_min_percent':7.2,'crude_fat_min_percent':1.6,'crude_fiber_max_percent':2.5,'moisture_max_percent':82.5,'ash_max_percent':None,'taurine_min_percent':None,'other_printed_guarantees':[]},789,67,['https://www.royalcanin.com/us/cats/products/retail-products/digestive-care-thin-slices-in-gravy-1430/1',ADMC],'ADMC maps UPC 030111471550 to the individual 3 oz Digest Sensitive Thin Slices in Gravy can; current Royal Canin USA now uses Digestive Care naming.',['Distributor nomenclature is Digest Sensitive; current manufacturer nomenclature is Digestive Care.']))

          ing='Water sufficient for processing, chicken, pork by-products, chicken liver, pork liver, wheat gluten, wheat flour, pork plasma, gelatin, powdered cellulose, glycine, fish oil, modified corn starch, calcium sulfate, natural flavors, rice flour, potassium chloride, guar gum, sodium tripolyphosphate, choline chloride, taurine, citric acid, vitamins [niacin supplement, DL-alpha tocopherol acetate (source of vitamin E), thiamine mononitrate (vitamin B1), D-calcium pantothenate, biotin, riboflavin supplement, pyridoxine hydrochloride (vitamin B6), vitamin B12 supplement, folic acid, vitamin D3 supplement], carrageenan, magnesium oxide, trace minerals [zinc proteinate, zinc oxide, ferrous sulfate, copper sulfate, manganous oxide, sodium selenite, calcium iodate].'
          candidates.append(make('030111604422','Feline Care Nutrition','Royal Canin Hair & Skin Care Thin Slices in Gravy Wet Cat Food','Hair & Skin Care Thin Slices in Gravy',['chicken','pork'],'adult','wet','slices','in_gravy','3 oz',ing,{'crude_protein_min_percent':10.0,'crude_fat_min_percent':2.2,'crude_fiber_max_percent':2.7,'moisture_max_percent':80.0,'ash_max_percent':None,'taurine_min_percent':None,'other_printed_guarantees':[]},900,77,['https://www.royalcanin.com/us/cats/products/retail-products/hair%26skin-care-thin-slices-in-gravy-1475','https://www.kanupets.com/products/royal-canin-hair-skin-care-cat-wet-food','https://www.thatpetplace.com/royal-canin-feline-intense-beauty-slices-3-oz_2',ADMC],'Current exact-unit retail evidence maps UPC 030111604422 to Hair & Skin Care 3 oz; distributor metadata retains the former Intense Beauty name.',['Former name Intense Beauty remains in distributor/legacy retailer metadata; current Royal Canin branding is Hair & Skin Care.']))

          ing='Water sufficient for processing, pork by-products, chicken, chicken liver, pork liver, wheat gluten, gelatin, powdered cellulose, wheat flour, pork plasma, glycine, modified corn starch, natural flavors, calcium sulfate, potassium chloride, sodium tripolyphosphate, rice flour, guar gum, taurine, choline chloride, citric acid, carrageenan, vitamins [DL-alpha tocopherol acetate (source of vitamin E), thiamine mononitrate (vitamin B1), niacin supplement, biotin, D-calcium pantothenate, riboflavin supplement, pyridoxine hydrochloride (vitamin B6), vitamin B12 supplement, folic acid, vitamin D3 supplement], magnesium oxide, L-carnitine, trace minerals [zinc proteinate, zinc oxide, ferrous sulfate, copper sulfate, manganous oxide, sodium selenite, calcium iodate].'
          candidates.append(make('030111604446','Feline Care Nutrition','Royal Canin Weight Care Thin Slices in Gravy Wet Cat Food','Weight Care Thin Slices in Gravy',['pork','chicken'],'adult','wet','slices','in_gravy','3 oz',ing,{'crude_protein_min_percent':8.4,'crude_fat_min_percent':1.41,'crude_fiber_max_percent':3.0,'moisture_max_percent':84.4,'ash_max_percent':None,'taurine_min_percent':None,'other_printed_guarantees':[{'nutrient':'L-Carnitine','basis':'min','value':25,'unit':'other'}]},644,55,['https://www.royalcanin.com/us/cats/products/retail-products/weight-care-thin-slices-in-gravy-1433/1','https://www.thatpetplace.com/Royal-Canin-Adult-Ultralight-Cat-Food-3-oz',ADMC],'Exact-unit retail evidence maps UPC 030111604446 to the 3 oz current Weight Care product; distributor metadata retains former Ultra Light naming.',['Former product name Ultra Light appears in distributor metadata; current Royal Canin USA branding is Weight Care.']))

          ing='Water sufficient for processing, chicken by-products, chicken liver, pork by-products, pork liver, wheat flour, salmon, gelatin, powdered cellulose, pork plasma, natural flavors, wheat gluten, modified corn starch, vegetable oil, guar gum, calcium sulfate, potassium chloride, sodium tripolyphosphate, taurine, fish oil, salt, carrageenan, sodium silico aluminate, magnesium oxide, trace minerals [zinc proteinate, zinc oxide, ferrous sulfate, copper sulfate, manganous oxide, sodium selenite, calcium iodate], L-carnitine, vitamins [DL-alpha tocopherol acetate (source of vitamin E), thiamine mononitrate (vitamin B1), biotin, niacin supplement, D-calcium pantothenate, folic acid, pyridoxine hydrochloride (vitamin B6), riboflavin supplement, vitamin B12 supplement, vitamin D3 supplement].'
          candidates.append(make('030111471574','Feline Health Nutrition','Royal Canin Spayed/Neutered Thin Slices in Gravy Wet Cat Food','Spayed/Neutered Thin Slices in Gravy',['chicken','pork','salmon'],'adult','wet','slices','in_gravy','3 oz',ing,{'crude_protein_min_percent':8.5,'crude_fat_min_percent':1.8,'crude_fiber_max_percent':2.2,'moisture_max_percent':83.0,'ash_max_percent':None,'taurine_min_percent':None,'other_printed_guarantees':[]},692,59,['https://www.royalcanin.com/us/cats/products/retail-products/spayed--neutered-thin-slices-in-gravy-4095','https://www.petsakes.com/products/ROYAL-CANIN-SPAYED%26NEUTERED-THIN-SLICES-IN-GRAVY-3OZ-p761067146',ADMC],'Current exact-unit retailer and distributor evidence map UPC 030111471574 to the individual 3 oz Spayed/Neutered Thin Slices in Gravy can.'))

          # Regional correction: U.S. Persian Adult 7 lb uses 030111843579.
          old=[r for r in doc['records'] if r.get('upc')=='030111543578']
          new=[r for r in doc['records'] if r.get('upc')=='030111843579']
          if old and new:
              raise AssertionError('Both Canadian and U.S. Persian UPCs already present; manual collision review required')
          if old:
              assert len(old)==1 and old[0]['product_name']=='Royal Canin Persian Adult Dry Cat Food' and old[0]['size']=='7 lb'
              p=old[0]
              p['upc']='030111843579'; p['canonical_gtin14']='00030111843579'
              p['source_urls']=['https://www.royalcanin.com/us/cats/products/retail-products/persian-adult-2552','https://www.admc.us/wp-content/uploads/2022/02/2025-South-Complete-Price-List_4.9.25-compressed.pdf','https://www.countrymax.com/royal-canin-persian-dry-cat-food-7lb-bag/']
              p['barcode_notes']='Corrected 2026-08-25 for U.S. scope: current U.S. distributor and U.S. retailer map Persian Adult 7 lb to UPC 030111843579. Prior UPC 030111543578 appears in Canadian retail listings.'
              p['conflicts']=list(dict.fromkeys((p.get('conflicts') or [])+['Regional barcode difference: Canadian retailers expose 030111543578 for Persian Adult 7 lb; current U.S. distributor and U.S. retailers use 030111843579. U.S. UPC retained.']))
              p['verification_notes']=list(dict.fromkeys((p.get('verification_notes') or [])+['UPC corrected from Canadian-market 030111543578 to U.S. UPC 030111843579 after current U.S. distributor cross-check; formula fields were not changed.','Corrected U.S. UPC-A check digit validated.']))
          elif new:
              assert len(new)==1 and new[0]['product_name']=='Royal Canin Persian Adult Dry Cat Food' and new[0]['size']=='7 lb'

          existing={r['upc']:r for r in doc['records']}
          added=[]
          for r in candidates:
              assert check(r['upc']), r['upc']
              if r['upc'] in existing:
                  e=existing[r['upc']]
                  assert e['product_name']==r['product_name'] and e['size']==r['size'], f"collision {r['upc']}"
                  continue
              doc['records'].append(r); existing[r['upc']]=r; added.append(r['upc'])

          doc['updated_at']='2026-08-25'
          assert check('030111843579')
          assert len({r['upc'] for r in doc['records']})==len(doc['records'])
          assert len({r['canonical_gtin14'] for r in doc['records']})==len(doc['records'])
          assert all(r['brand']=='Royal Canin' and r['species']=='cat' for r in doc['records'])
          assert all(check(r['upc']) for r in doc['records'] if len(r['upc'])==12)
          assert len(doc['records'])==before+len(added)
          print('BEFORE',before,'ADDED',len(added),added,'AFTER',len(doc['records']))
          path.write_text(json.dumps(doc,ensure_ascii=False,separators=(',',':'))+'\n')
          json.loads(path.read_text())
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',str(path)],check=True)
          subprocess.run(['git','commit','-m','research: finish Royal Canin cat retail coverage'],check=True)
          subprocess.run(['git','push','origin','HEAD:agent/deep-research-barcode-ledger'],check=True)
