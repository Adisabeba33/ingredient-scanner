name: Temporary Royal Canin cat finishing batch
on:
  push:
    paths:
      - '.github/workflows/tmp-royal-canin-cat-finish.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
      - name: Verify committed Royal Canin cat ledger
        shell: python
        run: |
          import json
          d=json.load(open('research/deep-research-royal-canin.json'))
          rs=d['records']
          assert len(rs)==69, len(rs)
          assert len({r['upc'] for r in rs})==69
          assert len({r['canonical_gtin14'] for r in rs})==69
          assert all(r['brand']=='Royal Canin' and r['species']=='cat' for r in rs)
          def check(u):
              return len(u)==12 and u.isdigit() and str((-sum(int(x)*(3 if i%2==0 else 1) for i,x in enumerate(u[:11])))%10)==u[-1]
          assert all(check(r['upc']) for r in rs)
          wanted={
            '030111411556':('Royal Canin Digestive Care Loaf in Sauce Wet Cat Food','3 oz'),
            '030111471550':('Royal Canin Digestive Care Thin Slices in Gravy Wet Cat Food','3 oz'),
            '030111604422':('Royal Canin Hair & Skin Care Thin Slices in Gravy Wet Cat Food','3 oz'),
            '030111604446':('Royal Canin Weight Care Thin Slices in Gravy Wet Cat Food','3 oz'),
            '030111471574':('Royal Canin Spayed/Neutered Thin Slices in Gravy Wet Cat Food','3 oz'),
            '030111843579':('Royal Canin Persian Adult Dry Cat Food','7 lb')
          }
          by={r['upc']:r for r in rs}
          for u,(n,s) in wanted.items():
              assert u in by and by[u]['product_name']==n and by[u]['size']==s and by[u]['research_status']=='source_verified'
              assert by[u]['ingredients_verbatim'] and by[u]['ingredients_ordered_normalized']
              assert by[u]['source_urls'] and isinstance(by[u]['source_urls'],list)
          assert '030111543578' not in by
          print('VERIFY_OK records=69 wanted=6 old_canadian_persian_absent=true')
