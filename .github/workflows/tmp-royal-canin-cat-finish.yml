name: Temporary Royal Canin cat finishing batch
on:
  push:
    paths:
      - '.github/workflows/tmp-royal-canin-cat-finish.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
      - name: Inspect current Royal Canin cat ledger
        shell: python
        run: |
          import json
          d=json.load(open('research/deep-research-royal-canin.json'))
          print('COUNT',len(d['records']))
          print('LAST15')
          for r in d['records'][-15:]: print(r['upc'],'|',r['product_name'],'|',r['size'],'|',r['research_status'])
          wanted=['030111411556','030111471550','030111604422','030111604446','030111471574','030111541420','030111443342','030111543578','030111843579']
          print('WANTED')
          for u in wanted:
              hits=[(r['product_name'],r['size'],r['research_status']) for r in d['records'] if r['upc']==u]
              print(u,hits)
