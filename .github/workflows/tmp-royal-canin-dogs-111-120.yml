name: Temporary Royal Canin dogs 111-120
on:
  push:
    branches: [agent/deep-research-barcode-ledger]
    paths: [.github/workflows/tmp-royal-canin-dogs-111-120.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: Validate and append Royal Canin dogs 111-120
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Adisabeba33"
          git config user.email "lezzgo2@gmail.com"
          git pull --rebase origin agent/deep-research-barcode-ledger
          START_BLOB="6266aea8b1a62cf55dca39ceec6182c4ee3a684e"
          test "$(git hash-object research/deep-research-royal-canin-dogs.json)" = "$START_BLOB"
          python3 - <<'PY'
          import json, pathlib
          T=pathlib.Path('research/deep-research-royal-canin-dogs.json')
          ADMC='https://www.admc.us/wp-content/uploads/2022/02/2025-South-Complete-Price-List_4.9.25-compressed.pdf'
          doc=json.loads(T.read_text(encoding='utf-8'))
          assert len(doc['records'])==110, len(doc['records'])
          assert len({r['upc'] for r in doc['records']})==110
          assert len({r['canonical_gtin14'] for r in doc['records']})==110

          def split_top(s):
              s=s.strip()
              if s.endswith('.'): s=s[:-1]
              out=[]; cur=[]; sq=par=0
              for ch in s:
                  if ch=='[': sq+=1
                  elif ch==']': sq-=1
                  elif ch=='(': par+=1
                  elif ch==')': par-=1
                  if ch==',' and sq==0 and par==0:
                      out.append(''.join(cur).strip()); cur=[]
                  else: cur.append(ch)
              if cur: out.append(''.join(cur).strip())
              assert sq==0 and par==0
              assert all(out)
              return out

          def check_upc(u):
              assert isinstance(u,str) and len(u)==12 and u.isdigit(),u
              total=sum(int(u[i])*(3 if i%2==0 else 1) for i in range(11))
              cd=(10-total%10)%10
              assert cd==int(u[-1]),(u,total,cd)
              return total,cd

          def og(nutrient,basis,value,unit):
              return {'nutrient':nutrient,'basis':basis,'value':value,'unit':unit}

          def mk(upc,variant,size,url,ingredients,protein,fat,fiber,moisture,kkg,kcup,other,conflicts=None,extra_urls=None):
              total,cd=check_upc(upc)
              return {
                'catalog_number':None,
                'upc':upc,
                'canonical_gtin14':'00'+upc,
                'barcode_scope':'individual_unit',
                'brand':'Royal Canin',
                'manufacturer':'Royal Canin USA, Inc.',
                'species':'dog',
                'product_line':'Breed Health Nutrition',
                'product_name':f'{variant} Dry Dog Food',
                'variant':variant,
                'recipe':['chicken'],
                'life_stage':'puppy',
                'food_form':'dry',
                'texture':'kibble',
                'presentation':'plain',
                'package_type':'bag',
                'size':size,
                'ingredients_verbatim':ingredients,
                'ingredients_ordered_normalized':split_top(ingredients),
                'guaranteed_analysis':{
                  'crude_protein_min_percent':protein,
                  'crude_fat_min_percent':fat,
                  'crude_fiber_max_percent':fiber,
                  'moisture_max_percent':moisture,
                  'ash_max_percent':None,
                  'taurine_min_percent':None,
                  'other_printed_guarantees':other,
                },
                'calorie_content':{'kcal_per_kg':kkg,'kcal_per_unit':kcup,'unit_name':'cup'},
                'label_deck_code':None,
                'formula_source':'Current Royal Canin USA English product page is the formula master; ADMC 2025 South price list independently verifies exact individual-unit UPC and package size.',
                'source_urls':[url,ADMC]+(extra_urls or []),
                'source_accessed_at':'2026-08-26',
                'barcode_notes':f'ADMC 2025 South price list maps UPC {upc} to {variant}, {size}, under UNIT SIZE; the separate #/CS column is logistics case quantity and does not replace the unit UPC.',
                'conflicts':conflicts or [],
                'verification_notes':[
                  f'UPC-A check digit verified: weighted body sum {total} gives check digit {cd}.',
                  f'Canonical GTIN-14 is zero-left-padded UPC-A 00{upc}.',
                  'No repository-wide UPC or GTIN collision found in the guarded checkout before append.',
                  'Current Royal Canin USA English product page is the formula master for complete ingredient order, printed guaranteed analysis, calories and AAFCO growth adequacy; formula generations were not combined.',
                  'Royal Canin USA states this formula is complete and balanced for growth, including growth of large size dogs (70 lb or more as an adult).',
                  'Calories are printed per kilogram and per cup; package-weight calorie arithmetic does not apply to a per-cup dry-food statement.'
