            [og('Calcium','min',1.08,'percent'),og('Phosphorus','min',0.9,'percent'),og('Vitamin E','min',420,'IU/kg'),og('Ascorbic acid (mg/kg)','min',320,'other'),og('Glucosamine (mg/kg)','min',788,'other'),og('Chondroitin sulfate (mg/kg)','min',8,'other')]
          ))
          batch.append(mk(
