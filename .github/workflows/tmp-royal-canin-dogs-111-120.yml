            '030111510457','Miniature Schnauzer Puppy','2.5 lb',
            'https://www.royalcanin.com/us/dogs/products/retail-products/schnauzer-puppy-4131',
            'Chicken by-product meal, brewers rice, brown rice, wheat, wheat gluten, chicken fat, corn, dried plain beet pulp, natural flavors, corn protein meal, fish oil, monocalcium phosphate, vegetable oil, sodium aluminosilicate, calcium carbonate, pea fiber, powdered psyllium seed husk, potassium chloride, vitamins[DL-alpha tocopherol acetate (source of vitamin E), L-ascorbyl-2-polyphosphate (source of vitamin C), niacin supplement, D-calcium pantothenate, biotin, pyridoxine hydrochloride (vitamin B6), riboflavin supplement, thiamine mononitrate (vitamin B1), vitamin A acetate, vitamin B12 supplement, folic acid, vitamin D3 supplement], fructooligosaccharides, sodium tripolyphosphate, yeast extract, salt, L-lysine, DL-methionine, rosemary extract, preserved with mixed tocopherols and citric acid, choline chloride, L-tyrosine, taurine, trace minerals[zinc proteinate, manganese proteinate, zinc oxide, ferrous sulfate, manganous oxide, copper sulfate, sodium selenite, calcium iodate, copper proteinate], marigold extract (Tagetes erecta L.), Yucca schidigera extract, L-carnitine, carotene.',
