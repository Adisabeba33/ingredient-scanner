name: Merge Royal Canin Cats research

on:
  push:
    branches:
      - agent/deep-research-barcode-ledger
    paths:
      - .github/workflows/merge-royal-canin-cats.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0

      - name: Validate and merge 30 researched records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          target_path = Path('research/deep-research-royal-canin.json')
          append_path = Path('research/.royal-canin-cats-append-2026-08-26.json')

          target = json.loads(target_path.read_text(encoding='utf-8'))
          payload = json.loads(append_path.read_text(encoding='utf-8'))
          old = target['records']
          researched = payload['records']

          assert len(researched) == 30, f'Expected 30 researched records, found {len(researched)}'
          old_upcs = [r['upc'] for r in old]
          researched_upcs = [r['upc'] for r in researched]
          assert len(old_upcs) == len(set(old_upcs)), 'Existing ledger has duplicate UPCs; refusing merge'
          assert len(researched_upcs) == len(set(researched_upcs)), 'Research payload has duplicate UPCs'

          def valid_upca(code: str) -> bool:
              if len(code) != 12 or not code.isdigit():
                  return False
              digits = [int(x) for x in code]
              body_sum = sum(d * (3 if i % 2 == 0 else 1) for i, d in enumerate(digits[:11]))
              return (10 - body_sum % 10) % 10 == digits[-1]

          required = [
              'upc','canonical_gtin14','barcode_scope','brand','species','product_name',
              'size','ingredients_verbatim','ingredients_ordered_normalized',
              'guaranteed_analysis','calorie_content','source_urls','research_status'
          ]
          for i, row in enumerate(researched, 1):
              missing_fields = [k for k in required if k not in row]
              assert not missing_fields, f'Researched record {i} missing fields: {missing_fields}'
              assert row['brand'] == 'Royal Canin', f'Unexpected brand: {row["upc"]}'
              assert row['species'] == 'cat', f'Non-cat record: {row["upc"]}'
              assert row['barcode_scope'] == 'individual_unit', f'Non-unit barcode: {row["upc"]}'
              assert valid_upca(row['upc']), f'Invalid UPC-A check digit: {row["upc"]}'
              assert row['canonical_gtin14'] == row['upc'].zfill(14), f'GTIN-14 mismatch: {row["upc"]}'
              assert row['research_status'] in {'source_verified','needs_physical_label'}, f'Bad status: {row["upc"]}'
              assert row['ingredients_verbatim'].strip(), f'Empty ingredients: {row["upc"]}'
              assert isinstance(row['ingredients_ordered_normalized'], list) and row['ingredients_ordered_normalized'], f'Empty normalized ingredients: {row["upc"]}'
              assert row['source_urls'], f'No sources: {row["upc"]}'

          old_set = set(old_upcs)
          overlap = sorted(old_set & set(researched_upcs))
          to_add = [row for row in researched if row['upc'] not in old_set]

          initial_count = len(old)
          target['records'].extend(to_add)
          target['updated_at'] = '2026-08-26'
          final_upcs = [r['upc'] for r in target['records']]
          assert len(final_upcs) == len(set(final_upcs)), 'Final ledger contains duplicate UPCs'
          assert len(target['records']) == initial_count + len(to_add)

          target_path.write_text(json.dumps(target, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          print(f'Existing records: {initial_count}')
          print(f'Researched payload: {len(researched)}')
          print(f'Already present: {len(overlap)}')
          print('Overlap UPCs: ' + (', '.join(overlap) if overlap else 'none'))
          print(f'New records appended: {len(to_add)}')
          print(f'Final records: {len(target["records"])}')
          PY

      - name: Commit merged Royal Canin Cats ledger
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/deep-research-royal-canin.json
          if git diff --cached --quiet; then
            echo "No target changes needed."
            exit 0
          fi
          git commit -m "research: merge 30 Royal Canin cat research records"
          git push origin HEAD:agent/deep-research-barcode-ledger
