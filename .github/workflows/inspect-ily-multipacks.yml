name: Inspect ILY multipacks
on:
  push:
    branches: [agent/deep-research-i-and-love-and-you]
    paths: [.github/workflows/inspect-ily-multipacks.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-i-and-love-and-you
      - run: python .github/scripts/inspect-ily-multipacks.py
