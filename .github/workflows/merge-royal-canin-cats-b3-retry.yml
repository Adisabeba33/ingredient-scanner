name: Merge Royal Canin Cats batch 3 retry

on:
  push:
    branches:
      - agent/deep-research-barcode-ledger
    paths:
      - .github/workflows/merge-royal-canin-cats-b3-retry.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-research-barcode-ledger
          fetch-depth: 0
      - name: Execute validated Royal Canin cats renal GI merge
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/tmp-royal-canin-cats-120-140.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          PY\n",start)
          block=src[start:end]
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())+'\n'
          compiled=compile(code,'royal-canin-cats-renal-gi','exec')
          exec(compiled,{'__name__':'__main__'})
          PY
      - name: Commit merged ledger
        run: |
          git config user.name "ingredients-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/deep-research-royal-canin.json
          if git diff --cached --quiet; then
            echo "No target changes needed."
            exit 0
          fi
          git commit -m "research: add Royal Canin feline renal and GI records"
          git push origin HEAD:agent/deep-research-barcode-ledger
