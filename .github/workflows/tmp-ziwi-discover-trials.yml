name: Inspect official ZIWI trial variants
on:
  push:
    branches: [agent/deep-research-ziwi-peak]
    paths: [.github/workflows/tmp-ziwi-discover-trials.yml]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official Shopify product JSON
        run: |
          python - <<'PY'
          import json, urllib.request
          urls = [
            'https://us.ziwipets.com/products/air-dried-beef-dog-food.js',
            'https://us.ziwipets.com/products/air-dried-chicken-recipe-for-dogs.js',
            'https://us.ziwipets.com/products/air-dried-lamb-recipe-for-dogs.js',
          ]
          for url in urls:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  data=json.load(r)
              print('\nURL', url)
              print('TITLE', data.get('title'))
              for v in data.get('variants',[]):
                  print(json.dumps({k:v.get(k) for k in ('id','title','sku','barcode','available','weight','weight_unit')}, ensure_ascii=False))
          PY
